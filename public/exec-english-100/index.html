t":"royalty-free license","ko":"무상 라이선스"},{"t":"freedom to operate","ko":"자유로운 실시권(사업 권리)"},{"t":"field of use","ko":"사용 분야 제한"},{"t":"perpetual license","ko":"영구 라이선스"},{"t":"license back","ko":"역(逆) 라이선스, 다시 허락하기"}],"drill":[{"ko":"각 당사자는 프로젝트에 가져온 배경 IP의 소유권을 유지합니다.","en":"Each party retains ownership of its background IP brought into the project."},{"ko":"본 계약에 따라 개발된 개발 IP는 공동 소유됩니다.","en":"Foreground IP developed under this agreement shall be jointly owned."},{"ko":"결과물을 저희 제품에 사용할 영구적·무상 라이선스가 필요합니다.","en":"We need a perpetual, royalty-free license to use the results in our products."},{"ko":"공급사가 만든 개선 사항은 저희에게 다시 라이선스되어야 합니다.","en":"Any improvements made by the supplier shall be licensed back to us."},{"ko":"향후 로열티 요구 없이 자유롭게 사업할 권리를 원합니다.","en":"We want freedom to operate without future royalty demands."}],"tip":"IP 조항에서 소유권보다 중요한 것이 라이선스 범위입니다. 소유를 양보하더라도 영구·무상·계열사 확장 라이선스와 freedom to operate를 확보하면 실질적 사업 자유는 지켜집니다."},{"n":87,"title":"품질·보증(Warranty) 조항","scene":"IP(인스트루먼트 패널) 부품의 품질 보증 기간과 결함 책임을 협상하시는 상황입니다.","goal":"보증 범위, 기간, 결함 구제 방법을 영어로 협상하실 수 있습니다.","expressions":[{"en":"The supplier warrants that the parts conform to the agreed specifications and drawings.","ko":"공급사는 부품이 합의된 사양과 도면에 부합함을 보증합니다."},{"en":"The warranty period runs for the longer of the vehicle warranty or thirty-six months.","ko":"보증 기간은 차량 보증 기간과 36개월 중 더 긴 쪽으로 적용됩니다."},{"en":"Defective parts shall be repaired, replaced, or refunded at the buyer's option.","ko":"결함 부품은 매수인의 선택에 따라 수리, 교체, 또는 환불됩니다."},{"en":"The supplier bears warranty costs only for defects attributable to its workmanship.","ko":"공급사는 자사의 제조 결함에 기인한 보증 비용만 부담합니다."},{"en":"We need an epidemic-failure clause for systemic defects exceeding a threshold.","ko":"임계치를 초과하는 체계적 결함에 대한 집단 불량 조항이 필요합니다."},{"en":"Field-failure data will be shared monthly to support root-cause analysis.","ko":"근본 원인 분석을 위해 필드 불량 데이터를 매월 공유합니다."},{"en":"The warranty excludes damage from misuse, modification, or normal wear.","ko":"보증은 오용, 개조, 정상 마모로 인한 손상을 제외합니다."},{"en":"Cost recovery should be net of any contribution from sub-tier suppliers.","ko":"비용 회수는 하위 공급사의 분담분을 차감한 순액이어야 합니다."}],"dialogue":[{"sp":"A","en":"Our warranty terms have to match the vehicle warranty we offer end customers.","ko":"저희 보증 조건은 최종 고객에게 제공하는 차량 보증과 일치해야 합니다."},{"sp":"B","en":"We typically offer a twenty-four month parts warranty.","ko":"저희는 보통 24개월 부품 보증을 제공합니다."},{"sp":"A","en":"That leaves us exposed. It should be the longer of vehicle warranty or thirty-six months.","ko":"그러면 저희가 노출됩니다. 차량 보증과 36개월 중 더 긴 쪽이어야 합니다."},{"sp":"B","en":"Extending warranty raises our reserve. We'd need accurate failure data.","ko":"보증 연장은 저희 충당금을 높입니다. 정확한 불량 데이터가 필요합니다."},{"sp":"A","en":"Agreed. We'll share field-failure data monthly for joint root-cause analysis.","ko":"동의합니다. 공동 근본 원인 분석을 위해 필드 불량 데이터를 매월 공유하겠습니다."},{"sp":"B","en":"And the warranty covers only defects in our workmanship, not misuse?","ko":"그리고 보증은 오용이 아닌 저희 제조 결함만 다루는 거죠?"},{"sp":"A","en":"Correct. But we also want an epidemic-failure clause above a defined rate.","ko":"맞습니다. 다만 정해진 비율을 넘는 집단 불량 조항도 원합니다."},{"sp":"B","en":"That's reasonable, provided the threshold is set against industry norms.","ko":"임계치를 업계 기준에 맞춰 설정한다면 합리적입니다."}],"vocab":[{"t":"warrant / warranty","ko":"보증하다 / 보증"},{"t":"conform to specifications","ko":"사양에 부합하다"},{"t":"repair, replace, or refund","ko":"수리, 교체, 또는 환불"},{"t":"workmanship","ko":"제조 품질, 기능공의 솜씨"},{"t":"epidemic failure","ko":"집단 불량 (체계적 대량 결함)"},{"t":"field-failure data","ko":"필드 불량 데이터"},{"t":"warranty reserve","ko":"보증 충당금"}],"drill":[{"ko":"공급사는 부품이 합의된 사양과 도면에 부합함을 보증합니다.","en":"The supplier warrants that the parts conform to the agreed specifications and drawings."},{"ko":"보증 기간은 차량 보증 기간과 36개월 중 더 긴 쪽으로 적용됩니다.","en":"The warranty period runs for the longer of the vehicle warranty or thirty-six months."},{"ko":"결함 부품은 매수인의 선택에 따라 수리, 교체, 또는 환불됩니다.","en":"Defective parts shall be repaired, replaced, or refunded at the buyer's option."},{"ko":"임계치를 초과하는 체계적 결함에 대한 집단 불량 조항이 필요합니다.","en":"We need an epidemic-failure clause for systemic defects exceeding a threshold."},{"ko":"보증은 오용, 개조, 정상 마모로 인한 손상을 제외합니다.","en":"The warranty excludes damage from misuse, modification, or normal wear."}],"tip":"보증 조항은 기간·범위·구제 세 축으로 봅니다. 기간은 차량 보증과 정렬하고, 집단 불량(epidemic failure) 조항으로 대형 리스크를 분리하며, 결함 귀속을 근본 원인 데이터로 객관화해야 비용 다툼을 줄일 수 있습니다."},{"n":88,"title":"해지·분쟁해결 조항","scene":"장기 공급계약의 해지 사유와 분쟁 발생 시 해결 절차를 확정하시는 상황입니다.","goal":"해지 조건, 시정 기간, 분쟁 해결 메커니즘을 영어로 협상하실 수 있습니다.","expressions":[{"en":"Either party may terminate for material breach if it remains uncured after thirty days' notice.","ko":"중대한 위반이 30일 통지 후에도 시정되지 않으면 양 당사자는 해지할 수 있습니다."},{"en":"Termination for convenience requires ninety days' written notice.","ko":"편의에 의한 해지는 90일 전 서면 통지를 요합니다."},{"en":"Upon termination, the supplier shall ensure an orderly transition of supply.","ko":"해지 시 공급사는 공급의 질서 있는 이관을 보장해야 합니다."},{"en":"Disputes shall first be escalated to senior executives before any formal proceeding.","ko":"분쟁은 공식 절차에 앞서 먼저 고위 임원에게 에스컬레이션됩니다."},{"en":"If unresolved, the dispute shall be settled by binding arbitration under ICC rules.","ko":"해결되지 않으면 분쟁은 ICC 규칙에 따른 구속력 있는 중재로 해결됩니다."},{"en":"The governing law shall be the laws of England and Wales.","ko":"준거법은 영국(잉글랜드 및 웨일스) 법으로 합니다."},{"en":"We need a step-in right to secure continuity of critical parts.","ko":"핵심 부품의 공급 연속성을 확보하기 위한 개입권이 필요합니다."},{"en":"The seat of arbitration should be neutral to both parties.","ko":"중재지는 양 당사자에게 중립적이어야 합니다."}],"dialogue":[{"sp":"A","en":"On termination, we need protection for supply continuity, not just an exit clause.","ko":"해지에 관해, 단순 종료 조항이 아니라 공급 연속성 보호가 필요합니다."},{"sp":"B","en":"We propose standard termination for material breach with a cure period.","ko":"저희는 시정 기간이 있는 표준 중대 위반 해지를 제안합니다."},{"sp":"A","en":"Fine, but add an orderly-transition obligation and a step-in right for critical parts.","ko":"좋습니다, 다만 질서 있는 이관 의무와 핵심 부품에 대한 개입권을 추가합시다."},{"sp":"B","en":"Step-in rights are sensitive. What scope do you envisage?","ko":"개입권은 민감합니다. 어느 범위를 생각하고 계신가요?"},{"sp":"A","en":"Limited to insolvency or repeated supply failure—just enough to keep lines running.","ko":"파산이나 반복적 공급 실패에 한정해서, 라인을 돌릴 만큼만입니다."},{"sp":"B","en":"Acceptable. For disputes, we prefer arbitration over litigation.","ko":"수용 가능합니다. 분쟁은 소송보다 중재를 선호합니다."},{"sp":"A","en":"Agreed—ICC arbitration, with executive escalation first and a neutral seat.","ko":"동의합니다. ICC 중재로 하되, 먼저 임원 에스컬레이션을 거치고 중립적 중재지로 합시다."},{"sp":"B","en":"Singapore as a neutral seat works for both of us.","ko":"중립적 중재지로 싱가포르가 양측 모두에게 적합합니다."}],"vocab":[{"t":"material breach","ko":"중대한 위반"},{"t":"cure period","ko":"시정 기간"},{"t":"termination for convenience","ko":"편의에 의한 해지"},{"t":"orderly transition","ko":"질서 있는 이관"},{"t":"step-in right","ko":"개입권"},{"t":"binding arbitration","ko":"구속력 있는 중재"},{"t":"seat of arbitration","ko":"중재지"}],"drill":[{"ko":"중대한 위반이 30일 통지 후에도 시정되지 않으면 양 당사자는 해지할 수 있습니다.","en":"Either party may terminate for material breach if it remains uncured after thirty days' notice."},{"ko":"해지 시 공급사는 공급의 질서 있는 이관을 보장해야 합니다.","en":"Upon termination, the supplier shall ensure an orderly transition of supply."},{"ko":"분쟁은 공식 절차에 앞서 먼저 고위 임원에게 에스컬레이션됩니다.","en":"Disputes shall first be escalated to senior executives before any formal proceeding."},{"ko":"해결되지 않으면 분쟁은 ICC 규칙에 따른 구속력 있는 중재로 해결됩니다.","en":"If unresolved, the dispute shall be settled by binding arbitration under ICC rules."},{"ko":"중재지는 양 당사자에게 중립적이어야 합니다.","en":"The seat of arbitration should be neutral to both parties."}],"tip":"해지 조항의 진짜 관심사는 '나가는 법'이 아니라 '나간 뒤 라인이 멈추지 않는 법'입니다. 질서 있는 이관 의무와 제한적 step-in right를 확보하고, 분쟁은 임원 에스컬레이션 → 중립지 중재 순으로 단계화하십시오."},{"n":89,"title":"계약 협상과 수정(Redline)","scene":"법무팀과 상대방 변호사가 주고받은 레드라인 초안을 검토하며 수정 의견을 조율하시는 상황입니다.","goal":"레드라인 수정 의견을 영어로 제안하고 협상하실 수 있습니다.","expressions":[{"en":"I've marked up the draft—my redlines are in track changes with comments.","ko":"초안을 수정했습니다. 제 레드라인은 변경 내용 추적과 코멘트로 표시되어 있습니다."},{"en":"We can't accept this clause as drafted; here's our proposed language.","ko":"이 조항은 작성된 대로는 수용할 수 없습니다. 저희 제안 문구는 다음과 같습니다."},{"en":"This is a deal-breaker for us, so let's prioritize resolving it.","ko":"이건 저희에게 협상 결렬 사유이니, 먼저 해결하는 데 집중합시다."},{"en":"I can live with your edit if we tighten the definition in return.","ko":"정의를 대신 더 좁힐 수 있다면 귀사의 수정안을 받아들일 수 있습니다."},{"en":"Let's bracket this and come back to it once the commercials are settled.","ko":"이건 일단 보류 표시하고 상업 조건이 정리된 후 다시 다룹시다."},{"en":"Your comment is fair—I'll soften the obligation to commercially reasonable efforts.","ko":"지적이 타당합니다. 의무를 상업적으로 합리적인 노력 수준으로 완화하겠습니다."},{"en":"We're aligned on intent; this is just a drafting issue.","ko":"의도에는 합의했습니다. 이건 단지 문구 작성의 문제입니다."},{"en":"Could you accept the change in principle and refine the wording offline?","ko":"원칙적으로 변경을 수용하시고 문구는 별도로 다듬어 주실 수 있을까요?"}],"dialogue":[{"sp":"A","en":"I've gone through your redlines. Most are fine, but two need discussion.","ko":"귀사의 레드라인을 모두 검토했습니다. 대부분 괜찮지만 두 가지는 논의가 필요합니다."},{"sp":"B","en":"Let's start with whichever is most critical for you.","ko":"귀사에게 가장 중요한 것부터 시작합시다."},{"sp":"A","en":"The liability cap. Striking the IP carve-out is a deal-breaker for us.","ko":"책임 한도입니다. IP 예외를 삭제한 것은 저희에게 결렬 사유입니다."},{"sp":"B","en":"Our client wanted a cleaner cap. What if we narrow the carve-out instead?","ko":"저희 측은 더 깔끔한 한도를 원했습니다. 대신 예외를 좁히면 어떨까요?"},{"sp":"A","en":"I can work with a narrower carve-out limited to third-party IP claims.","ko":"제3자 IP 청구에 한정한 더 좁은 예외라면 가능합니다."},{"sp":"B","en":"Good. I'll restore it with that limit. What's the second point?","ko":"좋습니다. 그 제한으로 복원하겠습니다. 두 번째 쟁점은요?"},{"sp":"A","en":"The change-control clause. We're aligned on intent—it's just drafting.","ko":"변경 관리 조항입니다. 의도에는 합의했고, 단지 문구 문제입니다."},{"sp":"B","en":"Then let's accept it in principle and our paralegals can polish the wording.","ko":"그럼 원칙적으로 수용하고, 문구는 보조 인력이 다듬도록 합시다."}],"vocab":[{"t":"redline / mark up","ko":"수정 표시(하다)"},{"t":"track changes","ko":"변경 내용 추적"},{"t":"deal-breaker","ko":"협상 결렬 사유"},{"t":"bracket","ko":"보류 표시하다 (대괄호로 묶다)"},{"t":"commercially reasonable efforts","ko":"상업적으로 합리적인 노력"},{"t":"in principle","ko":"원칙적으로"},{"t":"drafting issue","ko":"문구 작성의 문제"}],"drill":[{"ko":"이 조항은 작성된 대로는 수용할 수 없습니다.","en":"We can't accept this clause as drafted."},{"ko":"이건 저희에게 협상 결렬 사유입니다.","en":"This is a deal-breaker for us."},{"ko":"이건 일단 보류 표시하고 상업 조건이 정리된 후 다시 다룹시다.","en":"Let's bracket this and come back to it once the commercials are settled."},{"ko":"의도에는 합의했습니다. 이건 단지 문구 작성의 문제입니다.","en":"We're aligned on intent; this is just a drafting issue."},{"ko":"원칙적으로 변경을 수용하시고 문구는 별도로 다듬어 주실 수 있을까요?","en":"Could you accept the change in principle and refine the wording offline?"}],"tip":"레드라인 협상의 핵심은 우선순위입니다. deal-breaker와 drafting issue를 분리해, 진짜 결렬 사유에만 정치적 자본을 쓰고 나머지는 'in principle' 합의로 빠르게 넘기십시오. 모든 조항에서 이기려 들면 거래 자체가 느려집니다."},{"n":90,"title":"계약 검토 체크리스트","scene":"서명 직전 계약서를 최종 점검하며 팀에 검토 포인트를 지시하시는 상황입니다.","goal":"계약 검토의 핵심 체크포인트를 영어로 지시하고 점검하실 수 있습니다.","expressions":[{"en":"Before we sign, let's run through the review checklist one more time.","ko":"서명하기 전에 검토 체크리스트를 한 번 더 점검합시다."},{"en":"Confirm that every defined term is used consistently throughout.","ko":"정의된 모든 용어가 전반에 걸쳐 일관되게 사용되는지 확인하십시오."},{"en":"Check that the liability cap and indemnity carve-outs are mutually consistent.","ko":"책임 한도와 면책 예외가 서로 일관되는지 확인하십시오."},{"en":"Make sure all schedules and exhibits are attached and cross-referenced.","ko":"모든 부속서와 별첨이 첨부되고 상호 참조되었는지 확인하십시오."},{"en":"Verify the governing law, jurisdiction, and dispute mechanism align.","ko":"준거법, 관할, 분쟁 메커니즘이 정합한지 검증하십시오."},{"en":"Flag any open brackets or unresolved comments before circulation.","ko":"회람 전에 미해결 대괄호나 코멘트를 모두 표시하십시오."},{"en":"Confirm signatories have proper authority and the right titles.","ko":"서명자가 적절한 권한과 올바른 직함을 갖췄는지 확인하십시오."},{"en":"Do a final commercial sanity check against the term sheet.","ko":"텀시트와 대조해 마지막 상업적 타당성 점검을 하십시오."}],"dialogue":[{"sp":"A","en":"We're close to signing. Walk me through your final review before it goes up.","ko":"서명이 임박했습니다. 상신 전 최종 검토를 짚어 주세요."},{"sp":"B","en":"All defined terms are consistent, and the schedules are attached.","ko":"정의된 용어는 모두 일관되고, 부속서는 첨부되어 있습니다."},{"sp":"A","en":"Good. Did you confirm the liability cap matches the indemnity carve-outs?","ko":"좋습니다. 책임 한도가 면책 예외와 일치하는지 확인했나요?"},{"sp":"B","en":"Yes—the IP and gross-negligence carve-outs sit outside the cap as agreed.","ko":"네, IP와 중과실 예외는 합의대로 한도 밖에 있습니다."},{"sp":"A","en":"And the dispute clause—governing law and seat align?","ko":"분쟁 조항은요. 준거법과 중재지가 정합한가요?"},{"sp":"B","en":"English law, ICC arbitration, Singapore seat—all consistent.","ko":"영국법, ICC 중재, 싱가포르 중재지로 모두 일관됩니다."},{"sp":"A","en":"Last thing—confirm both signatories have proper signing authority.","ko":"마지막으로, 양측 서명자가 적절한 서명 권한을 가졌는지 확인하세요."},{"sp":"B","en":"Confirmed. Authority verified and titles are correct on both sides.","ko":"확인했습니다. 권한이 검증되었고 양측 직함도 정확합니다."}],"vocab":[{"t":"review checklist","ko":"검토 체크리스트"},{"t":"defined term","ko":"정의된 용어"},{"t":"cross-reference","ko":"상호 참조"},{"t":"governing law","ko":"준거법"},{"t":"jurisdiction","ko":"관할"},{"t":"signing authority","ko":"서명 권한"},{"t":"term sheet","ko":"텀시트, 주요 조건 합의서"}],"drill":[{"ko":"정의된 모든 용어가 전반에 걸쳐 일관되게 사용되는지 확인하십시오.","en":"Confirm that every defined term is used consistently throughout."},{"ko":"책임 한도와 면책 예외가 서로 일관되는지 확인하십시오.","en":"Check that the liability cap and indemnity carve-outs are mutually consistent."},{"ko":"준거법, 관할, 분쟁 메커니즘이 정합한지 검증하십시오.","en":"Verify the governing law, jurisdiction, and dispute mechanism align."},{"ko":"서명자가 적절한 권한과 올바른 직함을 갖췄는지 확인하십시오.","en":"Confirm signatories have proper authority and the right titles."},{"ko":"텀시트와 대조해 마지막 상업적 타당성 점검을 하십시오.","en":"Do a final commercial sanity check against the term sheet."}],"tip":"계약 검토는 내부 정합성(consistency)과 외부 정합성(텀시트 대조) 두 층으로 봅니다. 임원은 모든 조항을 다시 읽지 않고, 한도-면책-분쟁-권한 같은 고위험 교차점만 집중 점검해 빠르게 서명 가부를 판단합니다."},{"n":91,"title":"전략 회의 영어","scene":"글로벌 사업부 전략 회의에서 내장 사업의 중기 방향을 임원진에게 제시하시는 상황입니다.","goal":"전략적 우선순위와 트레이드오프를 영어로 명료하게 제시하실 수 있습니다.","expressions":[{"en":"Let me frame the strategic question we actually need to answer today.","ko":"오늘 저희가 실제로 답해야 할 전략적 질문부터 짚겠습니다."},{"en":"Our right to win in interiors rests on integration, not on individual components.","ko":"내장 사업에서의 우위는 개별 부품이 아니라 통합 역량에 있습니다."},{"en":"We're facing a classic trade-off between margin today and share tomorrow.","ko":"지금의 마진과 미래의 점유율 사이에서 전형적인 트레이드오프에 직면해 있습니다."},{"en":"I'd rather we make a deliberate bet than spread resources too thin.","ko":"자원을 너무 분산시키기보다, 의도적인 승부수를 두고 싶습니다."},{"en":"Let's pressure-test this assumption before we commit capital.","ko":"자본을 투입하기 전에 이 가정을 철저히 검증해 봅시다."},{"en":"The strategic intent is clear; the question is sequencing and pace.","ko":"전략적 의도는 분명합니다. 문제는 순서와 속도입니다."},{"en":"If we win the cockpit-integration battle, the rest follows.","ko":"콕핏 통합 경쟁에서 이기면 나머지는 따라옵니다."},{"en":"I want us aligned on the destination before we debate the route.","ko":"경로를 논쟁하기 전에 목적지부터 합의하고 싶습니다."}],"dialogue":[{"sp":"A","en":"Before we dive into numbers, let me frame the real strategic question.","ko":"숫자로 들어가기 전에, 진짜 전략적 질문부터 짚겠습니다."},{"sp":"B","en":"Please—we've been circling the details without naming the choice.","ko":"그렇게 해 주세요. 선택을 명명하지 못한 채 세부사항만 맴돌고 있었습니다."},{"sp":"A","en":"It's whether we stay a component supplier or move up to integrated cockpit systems.","ko":"부품 공급사로 남을지, 통합 콕핏 시스템으로 올라설지의 문제입니다."},{"sp":"B","en":"Moving up means heavier investment and a different competitive set.","ko":"올라간다는 건 더 무거운 투자와 다른 경쟁 구도를 의미합니다."},{"sp":"A","en":"It does. But that's where the margin and the customer relevance are heading.","ko":"맞습니다. 하지만 마진과 고객 관련성은 바로 그쪽으로 가고 있습니다."},{"sp":"B","en":"How do we de-risk the bet?","ko":"그 승부수의 리스크를 어떻게 낮추나요?"},{"sp":"A","en":"We sequence it—win one lead program first, then scale on proven economics.","ko":"순서를 두는 겁니다. 먼저 선도 프로그램 하나를 이기고, 검증된 경제성으로 확장합니다."},{"sp":"B","en":"Agreed. Let's align on the destination today and detail the route next week.","ko":"동의합니다. 오늘은 목적지에 합의하고, 경로는 다음 주에 구체화합시다."}],"vocab":[{"t":"frame the question","ko":"질문의 틀을 잡다"},{"t":"right to win","ko":"이길 권리(승리 근거)"},{"t":"trade-off","ko":"트레이드오프, 상충 관계"},{"t":"pressure-test","ko":"철저히 검증하다"},{"t":"strategic intent","ko":"전략적 의도"},{"t":"de-risk","ko":"리스크를 낮추다"},{"t":"sequencing","ko":"순서 정하기, 단계화"}],"drill":[{"ko":"오늘 저희가 실제로 답해야 할 전략적 질문부터 짚겠습니다.","en":"Let me frame the strategic question we actually need to answer today."},{"ko":"지금의 마진과 미래의 점유율 사이에서 전형적인 트레이드오프에 직면해 있습니다.","en":"We're facing a classic trade-off between margin today and share tomorrow."},{"ko":"자본을 투입하기 전에 이 가정을 철저히 검증해 봅시다.","en":"Let's pressure-test this assumption before we commit capital."},{"ko":"전략적 의도는 분명합니다. 문제는 순서와 속도입니다.","en":"The strategic intent is clear; the question is sequencing and pace."},{"ko":"경로를 논쟁하기 전에 목적지부터 합의하고 싶습니다.","en":"I want us aligned on the destination before we debate the route."}],"tip":"전략 회의에서 임원의 첫 임무는 답이 아니라 질문을 정의하는 것입니다. 'frame the question'으로 논의의 틀을 잡고, 목적지 합의를 경로 논쟁보다 앞세우면 회의가 디테일에 빠지지 않습니다."},{"n":92,"title":"사업계획(Business Plan) 발표","scene":"신규 콕핏 통합 사업의 3개년 사업계획을 경영진에게 발표하시는 상황입니다.","goal":"시장 기회, 전략, 재무 전망을 설득력 있게 영어로 발표하실 수 있습니다.","expressions":[{"en":"Let me start with the opportunity, then the plan, then the numbers.","ko":"먼저 기회, 다음 계획, 그리고 숫자 순으로 시작하겠습니다."},{"en":"The addressable market for integrated cockpits is growing double digits.","ko":"통합 콕핏의 유효 시장은 두 자릿수로 성장하고 있습니다."},{"en":"Our plan targets break-even in year two and double-digit margins by year three.","ko":"저희 계획은 2년 차 손익분기, 3년 차 두 자릿수 마진을 목표로 합니다."},{"en":"These projections rest on three assumptions, and here's how we de-risk each.","ko":"이 전망은 세 가지 가정에 기반하며, 각각의 리스크를 낮추는 방법은 다음과 같습니다."},{"en":"The investment ask is forty million over three years, front-loaded in tooling.","ko":"투자 요청 규모는 3년간 4천만이며, 금형에 초기 집중됩니다."},{"en":"Even in the downside case, we remain cash-flow positive by year three.","ko":"비관 시나리오에서도 3년 차에는 현금흐름이 흑자를 유지합니다."},{"en":"The key risk is customer concentration, which we mitigate by year two.","ko":"핵심 리스크는 고객 집중도이며, 2년 차까지 완화합니다."},{"en":"What I'm asking the board to approve today is the phase-one funding.","ko":"오늘 이사회에 승인을 요청드리는 것은 1단계 자금입니다."}],"dialogue":[{"sp":"A","en":"I'll keep this tight—opportunity, plan, numbers, and the ask.","ko":"간결히 하겠습니다. 기회, 계획, 숫자, 그리고 요청입니다."},{"sp":"B","en":"Good. Start with why this market, why now.","ko":"좋습니다. 왜 이 시장이고 왜 지금인지부터 시작하세요."},{"sp":"A","en":"Cockpit integration is shifting value from parts to systems, and we're positioned for it.","ko":"콕핏 통합이 가치를 부품에서 시스템으로 옮기고 있고, 저희는 거기에 위치해 있습니다."},{"sp":"B","en":"What does the financial trajectory look like?","ko":"재무 궤적은 어떻게 됩니까?"},{"sp":"A","en":"Break-even in year two, double-digit margin by year three, on a forty-million ask.","ko":"4천만 투자로 2년 차 손익분기, 3년 차 두 자릿수 마진입니다."},{"sp":"B","en":"That's aggressive. How robust is it to a downturn?","ko":"공격적이군요. 경기 둔화에 얼마나 견고합니까?"},{"sp":"A","en":"Even in the downside case, we stay cash-flow positive by year three.","ko":"비관 시나리오에서도 3년 차에는 현금흐름이 흑자를 유지합니다."},{"sp":"B","en":"Then walk us through the phase-one milestones you want funded.","ko":"그럼 자금을 받고자 하는 1단계 마일스톤을 설명해 보세요."}],"vocab":[{"t":"addressable market","ko":"유효 시장"},{"t":"break-even","ko":"손익분기점"},{"t":"projections","ko":"전망, 추정치"},{"t":"front-loaded","ko":"초기에 집중된"},{"t":"downside case","ko":"비관 시나리오"},{"t":"cash-flow positive","ko":"현금흐름 흑자"},{"t":"the ask","ko":"요청 사항 (특히 투자 요청)"}],"drill":[{"ko":"먼저 기회, 다음 계획, 그리고 숫자 순으로 시작하겠습니다.","en":"Let me start with the opportunity, then the plan, then the numbers."},{"ko":"저희 계획은 2년 차 손익분기, 3년 차 두 자릿수 마진을 목표로 합니다.","en":"Our plan targets break-even in year two and double-digit margins by year three."},{"ko":"이 전망은 세 가지 가정에 기반하며, 각각의 리스크를 낮추는 방법은 다음과 같습니다.","en":"These projections rest on three assumptions, and here's how we de-risk each."},{"ko":"비관 시나리오에서도 3년 차에는 현금흐름이 흑자를 유지합니다.","en":"Even in the downside case, we remain cash-flow positive by year three."},{"ko":"오늘 이사회에 승인을 요청드리는 것은 1단계 자금입니다.","en":"What I'm asking the board to approve today is the phase-one funding."}],"tip":"사업계획 발표는 '기회→계획→숫자→요청(the ask)' 구조로 압축하십시오. 경영진은 장밋빛 전망보다 downside case에서도 살아남는지를 봅니다. 비관 시나리오를 먼저 제시하면 신뢰가 올라갑니다."},{"n":93,"title":"손익·재무 논의(P&L)","scene":"분기 실적 검토에서 내장 사업부의 P&L과 마진 악화 원인을 CFO와 논의하시는 상황입니다.","goal":"매출, 마진, 비용 변동을 영어로 분석하고 설명하실 수 있습니다.","expressions":[{"en":"Revenue is up four percent, but gross margin compressed by two points.","ko":"매출은 4% 늘었지만 매출총이익률은 2%p 압축되었습니다."},{"en":"The margin erosion is driven mainly by resin cost and unfavorable mix.","ko":"마진 잠식은 주로 수지 비용과 불리한 제품 믹스가 원인입니다."},{"en":"On a like-for-like basis, operating profit is flat year over year.","ko":"동일 기준으로 보면, 영업이익은 전년 대비 보합입니다."},{"en":"We're seeing a one-time charge from the warranty reserve top-up.","ko":"보증 충당금 추가 적립에서 일회성 비용이 발생하고 있습니다."},{"en":"Fixed-cost absorption improved as volumes ramped in the second half.","ko":"하반기 물량 증가로 고정비 흡수가 개선되었습니다."},{"en":"Free cash flow is below plan due to higher working capital.","ko":"운전자본 증가로 잉여현금흐름이 계획을 밑돌고 있습니다."},{"en":"If we pass through the index adjustment, margin recovers by Q3.","ko":"지수 연동 조정을 전가하면 마진은 3분기에 회복됩니다."},{"en":"Let me bridge the variance from prior year so it's transparent.","ko":"전년 대비 차이를 투명하게 보여드리기 위해 변동 요인을 분해하겠습니다."}],"dialogue":[{"sp":"A","en":"Revenue grew, but I want to be candid—gross margin compressed two points.","ko":"매출은 성장했지만 솔직히 말씀드리면, 매출총이익률이 2%p 압축되었습니다."},{"sp":"B","en":"What's driving the compression?","ko":"무엇이 그 압축을 유발하고 있습니까?"},{"sp":"A","en":"Two things: resin cost inflation and an unfavorable product mix.","ko":"두 가지입니다. 수지 원가 상승과 불리한 제품 믹스입니다."},{"sp":"B","en":"Is any of this structural, or is it timing?","ko":"이 중 구조적인 게 있습니까, 아니면 시점 문제입니까?"},{"sp":"A","en":"Mostly timing. Once the index pass-through kicks in, margin recovers by Q3.","ko":"대부분 시점 문제입니다. 지수 연동 전가가 발동되면 3분기에 마진이 회복됩니다."},{"sp":"B","en":"And the warranty reserve top-up—how should I read that?","ko":"보증 충당금 추가 적립은 어떻게 봐야 합니까?"},{"sp":"A","en":"Treat it as one-time. On a like-for-like basis, operating profit is flat.","ko":"일회성으로 보시면 됩니다. 동일 기준으로 영업이익은 보합입니다."},{"sp":"B","en":"Good. Bridge the full variance for the board so there are no surprises.","ko":"좋습니다. 이사회용으로 전체 차이를 분해해서 놀랄 일이 없게 하세요."}],"vocab":[{"t":"gross margin","ko":"매출총이익률"},{"t":"margin compression / erosion","ko":"마진 압축 / 잠식"},{"t":"like-for-like","ko":"동일 기준 비교"},{"t":"one-time charge","ko":"일회성 비용"},{"t":"fixed-cost absorption","ko":"고정비 흡수"},{"t":"free cash flow","ko":"잉여현금흐름"},{"t":"variance bridge","ko":"변동 요인 분해(브리지)"}],"drill":[{"ko":"매출은 4% 늘었지만 매출총이익률은 2%p 압축되었습니다.","en":"Revenue is up four percent, but gross margin compressed by two points."},{"ko":"마진 잠식은 주로 수지 비용과 불리한 제품 믹스가 원인입니다.","en":"The margin erosion is driven mainly by resin cost and unfavorable mix."},{"ko":"동일 기준으로 보면, 영업이익은 전년 대비 보합입니다.","en":"On a like-for-like basis, operating profit is flat year over year."},{"ko":"운전자본 증가로 잉여현금흐름이 계획을 밑돌고 있습니다.","en":"Free cash flow is below plan due to higher working capital."},{"ko":"전년 대비 차이를 투명하게 보여드리기 위해 변동 요인을 분해하겠습니다.","en":"Let me bridge the variance from prior year so it's transparent."}],"tip":"P&L 논의에서 임원의 신뢰는 '구조적 vs 일시적'을 정직하게 구분하는 데서 나옵니다. variance bridge로 변동을 분해하고, 일회성 비용을 명확히 격리하면 나쁜 숫자도 통제 가능한 이야기로 전환됩니다."},{"n":94,"title":"조직·인사 리더십 커뮤니케이션","scene":"조직 개편 후 팀의 동요를 가라앉히고 핵심 인재를 붙잡기 위해 전사 메시지를 전하시는 상황입니다.","goal":"조직 변화와 인사 결정을 신뢰감 있게 영어로 소통하실 수 있습니다.","expressions":[{"en":"I want to be straight with you about what's changing and why.","ko":"무엇이 바뀌고 왜 바뀌는지 여러분께 솔직히 말씀드리고 싶습니다."},{"en":"These changes are about sharpening focus, not about reducing our commitment to people.","ko":"이번 변화는 초점을 날카롭게 하기 위함이지, 인재에 대한 헌신을 줄이는 것이 아닙니다."},{"en":"Your work matters, and I want to make sure that's recognized.","ko":"여러분의 일은 중요하며, 그것이 인정받도록 하겠습니다."},{"en":"I'd rather over-communicate now than leave room for speculation.","ko":"지금 추측의 여지를 남기기보다, 차라리 과하게 소통하겠습니다."},{"en":"Leadership owns this decision, and I'm accountable for making it work.","ko":"이 결정은 경영진의 책임이며, 이를 작동시키는 것은 제 책임입니다."},{"en":"Let's turn uncertainty into clarity—here's what stays the same.","ko":"불확실성을 명확함으로 바꿉시다. 변하지 않는 것은 다음과 같습니다."},{"en":"I'm committed to developing the next generation of leaders here.","ko":"저는 이곳에서 차세대 리더를 키우는 데 전념하고 있습니다."},{"en":"My door is open—I'd rather hear your concerns directly.","ko":"제 문은 열려 있습니다. 여러분의 우려를 직접 듣고 싶습니다."}],"dialogue":[{"sp":"A","en":"I called this together because I owe you a straight explanation of the reorg.","ko":"이 자리를 마련한 것은 조직 개편을 솔직히 설명드릴 의무가 있어서입니다."},{"sp":"B","en":"People are anxious. There's a lot of speculation on the floor.","ko":"구성원들이 불안해합니다. 현장에 추측이 많습니다."},{"sp":"A","en":"I understand. So let me be clear: this is about focus, not headcount cuts.","ko":"이해합니다. 그래서 분명히 말씀드립니다. 이건 초점에 관한 것이지 인원 감축이 아닙니다."},{"sp":"B","en":"That will reassure a lot of the team.","ko":"그 말씀이 팀의 많은 사람들을 안심시킬 겁니다."},{"sp":"A","en":"I'd rather over-communicate now than let rumors fill the gap.","ko":"소문이 빈자리를 채우게 두기보다, 지금 과하게 소통하겠습니다."},{"sp":"B","en":"What's your message to the high performers who feel unsettled?","ko":"동요하는 핵심 인재들에게 전하실 메시지는 무엇입니까?"},{"sp":"A","en":"That their growth here matters to me, and I'm accountable for their path.","ko":"그들의 이곳에서의 성장이 제게 중요하며, 그들의 경로에 제가 책임진다는 것입니다."},{"sp":"B","en":"I'll set up small-group sessions so they can hear that directly.","ko":"그들이 직접 들을 수 있도록 소그룹 세션을 마련하겠습니다."}],"vocab":[{"t":"be straight with you","ko":"솔직히 말하다"},{"t":"sharpen focus","ko":"초점을 날카롭게 하다"},{"t":"over-communicate","ko":"과하게(충분히) 소통하다"},{"t":"accountable","ko":"책임지는"},{"t":"high performer","ko":"핵심 인재, 고성과자"},{"t":"headcount","ko":"인원수"},{"t":"reorg","ko":"조직 개편"}],"drill":[{"ko":"무엇이 바뀌고 왜 바뀌는지 여러분께 솔직히 말씀드리고 싶습니다.","en":"I want to be straight with you about what's changing and why."},{"ko":"이번 변화는 초점을 날카롭게 하기 위함이지, 인원 감축이 아닙니다.","en":"These changes are about sharpening focus, not about cutting headcount."},{"ko":"지금 추측의 여지를 남기기보다, 차라리 과하게 소통하겠습니다.","en":"I'd rather over-communicate now than leave room for speculation."},{"ko":"이 결정은 경영진의 책임이며, 이를 작동시키는 것은 제 책임입니다.","en":"Leadership owns this decision, and I'm accountable for making it work."},{"ko":"불확실성을 명확함으로 바꿉시다. 변하지 않는 것은 다음과 같습니다.","en":"Let's turn uncertainty into clarity—here's what stays the same."}],"tip":"조직 변화 소통의 핵심은 빈자리를 소문이 채우기 전에 리더가 먼저 채우는 것입니다. '무엇이 바뀌는가'만큼 '무엇이 변하지 않는가'를 말하고, 결정의 책임을 본인이 진다고 명시하면 신뢰가 유지됩니다."},{"n":95,"title":"변화 관리(Change Management)","scene":"신규 디지털 설계 프로세스(PLM 전환) 도입에 대한 현장의 저항을 관리하시는 상황입니다.","goal":"변화의 필요성과 실행 로드맵을 영어로 설득하고 저항을 관리하실 수 있습니다.","expressions":[{"en":"Change fails when people don't understand the why before the how.","ko":"변화는 사람들이 '어떻게'보다 '왜'를 이해하지 못할 때 실패합니다."},{"en":"We're not changing for change's sake; we're changing to stay competitive.","ko":"변화를 위한 변화가 아니라, 경쟁력을 유지하기 위한 변화입니다."},{"en":"Let's identify the early adopters and let them carry the momentum.","ko":"얼리어답터를 찾아내어 그들이 추진력을 이끌게 합시다."},{"en":"Resistance is information—it tells us where the friction really is.","ko":"저항은 정보입니다. 진짜 마찰이 어디 있는지 알려 줍니다."},{"en":"We'll roll this out in phases, with quick wins to build belief.","ko":"단계적으로 도입하되, 작은 성공으로 신뢰를 쌓겠습니다."},{"en":"I need the line managers to be visible champions of this transition.","ko":"라인 매니저들이 이 전환의 가시적인 옹호자가 되어 주셔야 합니다."},{"en":"We'll measure adoption, not just rollout, and adjust as we learn.","ko":"도입률만이 아니라 정착률을 측정하고, 배우면서 조정하겠습니다."},{"en":"No one gets left behind—we'll invest in training before we expect results.","ko":"누구도 뒤처지지 않습니다. 성과를 기대하기 전에 교육에 투자하겠습니다."}],"dialogue":[{"sp":"A","en":"I know the PLM transition is meeting resistance. Let's talk about it openly.","ko":"PLM 전환이 저항에 부딪히고 있는 걸 압니다. 솔직히 이야기해 봅시다."},{"sp":"B","en":"Honestly, the teams feel it's change for its own sake.","ko":"솔직히 팀들은 이것이 변화를 위한 변화라고 느낍니다."},{"sp":"A","en":"Then we've failed to explain the why. Our old process can't scale to new programs.","ko":"그렇다면 저희가 '왜'를 설명하지 못한 겁니다. 기존 프로세스로는 신규 프로그램을 감당할 수 없습니다."},{"sp":"B","en":"People worry the learning curve will hurt their deliverables.","ko":"구성원들은 학습 곡선이 자신의 산출물을 해칠까 걱정합니다."},{"sp":"A","en":"Fair. We'll invest in training first and roll out in phases with quick wins.","ko":"타당합니다. 교육에 먼저 투자하고, 작은 성공과 함께 단계적으로 도입하겠습니다."},{"sp":"B","en":"Who leads it on the floor? Top-down alone won't land.","ko":"현장에서는 누가 이끄나요? 하향식만으로는 정착되지 않습니다."},{"sp":"A","en":"The line managers—I need them as visible champions, not passive followers.","ko":"라인 매니저들입니다. 수동적 추종자가 아니라 가시적 옹호자가 되어야 합니다."},{"sp":"B","en":"Then let's equip them first, before we ask them to lead.","ko":"그렇다면 그들에게 이끌라고 요청하기 전에 먼저 준비시킵시다."}],"vocab":[{"t":"change management","ko":"변화 관리"},{"t":"early adopter","ko":"얼리어답터, 초기 수용자"},{"t":"quick win","ko":"빠른 성공, 작은 성과"},{"t":"champion","ko":"옹호자, 추진자"},{"t":"adoption (rate)","ko":"정착(률), 실제 사용률"},{"t":"learning curve","ko":"학습 곡선"},{"t":"roll out","ko":"단계적으로 도입하다"}],"drill":[{"ko":"변화는 사람들이 '어떻게'보다 '왜'를 이해하지 못할 때 실패합니다.","en":"Change fails when people don't understand the why before the how."},{"ko":"얼리어답터를 찾아내어 그들이 추진력을 이끌게 합시다.","en":"Let's identify the early adopters and let them carry the momentum."},{"ko":"저항은 정보입니다. 진짜 마찰이 어디 있는지 알려 줍니다.","en":"Resistance is information—it tells us where the friction really is."},{"ko":"도입률만이 아니라 정착률을 측정하고, 배우면서 조정하겠습니다.","en":"We'll measure adoption, not just rollout, and adjust as we learn."},{"ko":"성과를 기대하기 전에 교육에 투자하겠습니다.","en":"We'll invest in training before we expect results."}],"tip":"변화 관리는 명령이 아니라 신뢰 구축입니다. '왜'를 먼저 팔고, 라인 매니저를 champion으로 만들며, 도입(rollout)이 아닌 정착(adoption)을 측정하십시오. 저항을 적이 아닌 정보로 다루는 리더가 변화를 정착시킵니다."},{"n":96,"title":"합작·제휴(JV·Partnership) 협상","scene":"전동화 콕핏 합작법인 설립을 위해 글로벌 파트너와 지분·지배구조를 협상하시는 상황입니다.","goal":"합작 구조, 지분, 지배구조, 출구 전략을 영어로 협상하실 수 있습니다.","expressions":[{"en":"Let's align on the strategic rationale before we discuss the structure.","ko":"구조를 논의하기 전에 전략적 명분부터 합의합시다."},{"en":"Each partner brings complementary strengths—your scale, our integration know-how.","ko":"각 파트너는 상호 보완적 강점을 가져옵니다. 귀사의 규모와 저희의 통합 노하우입니다."},{"en":"We're proposing a fifty-fifty equity split with balanced board representation.","ko":"저희는 50대 50 지분과 균형 잡힌 이사회 구성을 제안합니다."},{"en":"Reserved matters should require unanimous consent to protect both parties.","ko":"유보 사항은 양측 보호를 위해 만장일치 동의를 요해야 합니다."},{"en":"We need a clear deadlock-resolution mechanism from day one.","ko":"처음부터 명확한 교착 해소 메커니즘이 필요합니다."},{"en":"Let's define the exit terms now, while the relationship is healthy.","ko":"관계가 건강할 때 지금 출구 조건을 정의합시다."},{"en":"A buy-sell clause gives either party a fair way out if priorities diverge.","ko":"매수매도 조항은 우선순위가 갈릴 때 양측에 공정한 출구를 줍니다."},{"en":"Governance has to balance control with operational agility.","ko":"지배구조는 통제와 운영 민첩성의 균형을 잡아야 합니다."}],"dialogue":[{"sp":"A","en":"Before structure, let's be clear on why this JV makes strategic sense.","ko":"구조에 앞서, 이 합작이 전략적으로 왜 타당한지 분명히 합시다."},{"sp":"B","en":"For us, it's access to your cockpit-integration capability.","ko":"저희에게는 귀사의 콕핏 통합 역량에 대한 접근입니다."},{"sp":"A","en":"And for us, your manufacturing scale. That's a genuine complementary fit.","ko":"저희에게는 귀사의 제조 규모입니다. 진정한 상호 보완입니다."},{"sp":"B","en":"On equity, we'd expect a controlling stake given our capital.","ko":"지분에 관해, 저희 자본을 고려하면 지배 지분을 기대합니다."},{"sp":"A","en":"Control imbalance kills JVs. We propose fifty-fifty with reserved matters.","ko":"통제 불균형은 합작을 망칩니다. 유보 사항을 둔 50대 50을 제안합니다."},{"sp":"B","en":"How do we avoid deadlock under a balanced structure?","ko":"균형 구조에서 교착은 어떻게 피합니까?"},{"sp":"A","en":"A defined escalation ladder, and a buy-sell clause as the last resort.","ko":"정의된 에스컬레이션 단계와, 최후 수단으로 매수매도 조항입니다."},{"sp":"B","en":"Sensible. Let's also fix the exit terms now, before any tension arises.","ko":"합리적입니다. 긴장이 생기기 전에 지금 출구 조건도 확정합시다."}],"vocab":[{"t":"joint venture (JV)","ko":"합작법인"},{"t":"strategic rationale","ko":"전략적 명분"},{"t":"equity split","ko":"지분 배분"},{"t":"reserved matters","ko":"유보 사항 (만장일치 필요 안건)"},{"t":"deadlock","ko":"교착 상태"},{"t":"buy-sell clause","ko":"매수매도 조항"},{"t":"governance","ko":"지배구조"}],"drill":[{"ko":"구조를 논의하기 전에 전략적 명분부터 합의합시다.","en":"Let's align on the strategic rationale before we discuss the structure."},{"ko":"유보 사항은 양측 보호를 위해 만장일치 동의를 요해야 합니다.","en":"Reserved matters should require unanimous consent to protect both parties."},{"ko":"처음부터 명확한 교착 해소 메커니즘이 필요합니다.","en":"We need a clear deadlock-resolution mechanism from day one."},{"ko":"관계가 건강할 때 지금 출구 조건을 정의합시다.","en":"Let's define the exit terms now, while the relationship is healthy."},{"ko":"지배구조는 통제와 운영 민첩성의 균형을 잡아야 합니다.","en":"Governance has to balance control with operational agility."}],"tip":"JV 협상의 역설은 가장 평화로울 때 이혼 조건(출구·교착·매수매도)을 정해야 한다는 것입니다. 전략적 명분에 합의한 뒤 지배구조와 deadlock 해소를 먼저 설계하면, 관계가 틀어져도 사업이 무너지지 않습니다."},{"n":97,"title":"인수합병(M&A) 논의","scene":"내장 전장 역량을 보강하기 위한 소규모 기술기업 인수를 경영진과 검토하시는 상황입니다.","goal":"인수 논거, 밸류에이션, 시너지, 실사를 영어로 논의하실 수 있습니다.","expressions":[{"en":"This is a capability acquisition, not a financial one.","ko":"이것은 재무적 인수가 아니라 역량 확보를 위한 인수입니다."},{"en":"The strategic fit is strong, but the valuation looks stretched.","ko":"전략적 적합성은 강하지만, 밸류에이션은 과해 보입니다."},{"en":"We're paying a premium, so the synergy case has to be credible.","ko":"프리미엄을 지불하는 만큼 시너지 논거가 신뢰할 만해야 합니다."},{"en":"Most of the value is in the team, so retention is the key risk.","ko":"가치의 대부분이 인력에 있으니, 인재 유지가 핵심 리스크입니다."},{"en":"Let's structure an earn-out to bridge the valuation gap.","ko":"밸류에이션 격차를 메우기 위해 언아웃 구조를 설계합시다."},{"en":"Due diligence needs to cover IP ownership and customer contracts closely.","ko":"실사는 IP 소유권과 고객 계약을 면밀히 점검해야 합니다."},{"en":"Integration risk is where most deals quietly destroy value.","ko":"통합 리스크야말로 대부분의 거래가 조용히 가치를 파괴하는 지점입니다."},{"en":"I'd want a clear hundred-day integration plan before we sign.","ko":"서명 전에 명확한 100일 통합 계획을 갖추고 싶습니다."}],"dialogue":[{"sp":"A","en":"Let me be clear up front—this is a capability play, not a cost play.","ko":"먼저 분명히 하겠습니다. 이건 비용이 아니라 역량 확보를 위한 거래입니다."},{"sp":"B","en":"The asking price is high. Can you justify the premium?","ko":"요구 가격이 높습니다. 그 프리미엄을 정당화할 수 있습니까?"},{"sp":"A","en":"Only through synergies—their software talent would accelerate us by two years.","ko":"오직 시너지로입니다. 그들의 소프트웨어 인재가 저희를 2년 앞당깁니다."},{"sp":"B","en":"And what protects that talent from walking after close?","ko":"그 인재가 거래 종결 후 떠나지 않도록 무엇이 보호합니까?"},{"sp":"A","en":"Retention packages and an earn-out tied to milestones.","ko":"인재 유지 패키지와 마일스톤에 연동된 언아웃입니다."},{"sp":"B","en":"What worries me most is integration. Many deals die there.","ko":"제가 가장 우려하는 건 통합입니다. 많은 거래가 거기서 무너집니다."},{"sp":"A","en":"Agreed. I won't recommend signing without a hundred-day integration plan.","ko":"동의합니다. 100일 통합 계획 없이는 서명을 권하지 않겠습니다."},{"sp":"B","en":"Then make integration a condition, not an afterthought.","ko":"그렇다면 통합을 사후 고려가 아니라 조건으로 삼으세요."}],"vocab":[{"t":"capability acquisition","ko":"역량 확보형 인수"},{"t":"strategic fit","ko":"전략적 적합성"},{"t":"valuation","ko":"밸류에이션, 기업가치 평가"},{"t":"synergy case","ko":"시너지 논거"},{"t":"earn-out","ko":"언아웃 (성과 연동 후불 대가)"},{"t":"due diligence","ko":"실사"},{"t":"integration risk","ko":"통합 리스크"}],"drill":[{"ko":"이것은 재무적 인수가 아니라 역량 확보를 위한 인수입니다.","en":"This is a capability acquisition, not a financial one."},{"ko":"프리미엄을 지불하는 만큼 시너지 논거가 신뢰할 만해야 합니다.","en":"We're paying a premium, so the synergy case has to be credible."},{"ko":"가치의 대부분이 인력에 있으니, 인재 유지가 핵심 리스크입니다.","en":"Most of the value is in the team, so retention is the key risk."},{"ko":"밸류에이션 격차를 메우기 위해 언아웃 구조를 설계합시다.","en":"Let's structure an earn-out to bridge the valuation gap."},{"ko":"통합 리스크야말로 대부분의 거래가 조용히 가치를 파괴하는 지점입니다.","en":"Integration risk is where most deals quietly destroy value."}],"tip":"M&A에서 가격은 협상 가능하지만 통합은 그렇지 않습니다. 역량 인수의 가치는 인재 유지에 달려 있으니 earn-out·retention을 거래 구조에 넣고, 100일 통합 계획을 서명의 전제 조건으로 만드십시오."},{"n":98,"title":"이사회(Board) 보고","scene":"이사회에서 내장 사업부의 연간 성과와 차년도 투자 승인 안건을 보고하시는 상황입니다.","goal":"이사회 수준의 간결하고 권위 있는 보고를 영어로 하실 수 있습니다.","expressions":[{"en":"I'll keep this to the headline, the evidence, and the decision we're seeking.","ko":"핵심 메시지, 근거, 그리고 구하고자 하는 의사결정으로 압축하겠습니다."},{"en":"The headline is that we delivered on plan despite material headwinds.","ko":"핵심은 중대한 역풍에도 계획대로 성과를 달성했다는 것입니다."},{"en":"Let me be candid about the one area where we fell short.","ko":"한 가지 미달한 영역에 대해 솔직히 말씀드리겠습니다."},{"en":"The board's decision today is whether to approve phase-two capital.","ko":"오늘 이사회의 의사결정은 2단계 자본 승인 여부입니다."},{"en":"I'm bringing you a recommendation, not just options.","ko":"선택지가 아니라 권고안을 가지고 왔습니다."},{"en":"The principal risks are concentration and execution, and here's our mitigation.","ko":"주요 리스크는 집중도와 실행이며, 완화 방안은 다음과 같습니다."},{"en":"I'd welcome the board's challenge on the underlying assumptions.","ko":"기저 가정에 대한 이사회의 비판적 검토를 환영합니다."},{"en":"To summarize: on track, well-governed, and ready to scale.","ko":"요약하면, 궤도에 있고, 잘 통제되며, 확장할 준비가 되어 있습니다."}],"dialogue":[{"sp":"A","en":"I'll keep this to three things: the headline, the evidence, and the decision.","ko":"세 가지로 압축하겠습니다. 핵심 메시지, 근거, 그리고 의사결정입니다."},{"sp":"B","en":"Good. Start with where we landed against plan.","ko":"좋습니다. 계획 대비 어디에 도달했는지부터 시작하세요."},{"sp":"A","en":"We hit revenue and margin targets despite resin headwinds. One miss: launch timing.","ko":"수지 역풍에도 매출과 마진 목표를 달성했습니다. 한 가지 미달은 출시 시점입니다."},{"sp":"B","en":"I appreciate the candor. What's the ask today?","ko":"솔직함에 감사합니다. 오늘의 요청은 무엇입니까?"},{"sp":"A","en":"Approval of phase-two capital to scale the cockpit program.","ko":"콕핏 프로그램 확장을 위한 2단계 자본 승인입니다."},{"sp":"B","en":"What are the principal risks, and how are they governed?","ko":"주요 리스크는 무엇이고, 어떻게 통제됩니까?"},{"sp":"A","en":"Concentration and execution—both mitigated, with monthly board-level KPIs.","ko":"집중도와 실행입니다. 둘 다 완화되었고, 월별 이사회 KPI로 관리됩니다."},{"sp":"B","en":"Clear and well-prepared. The board is comfortable approving phase two.","ko":"명확하고 준비가 잘 되었습니다. 이사회는 2단계 승인에 동의합니다."}],"vocab":[{"t":"headline","ko":"핵심 메시지, 결론"},{"t":"headwinds","ko":"역풍, 어려운 외부 환경"},{"t":"fall short","ko":"미달하다, 못 미치다"},{"t":"recommendation","ko":"권고안"},{"t":"principal risks","ko":"주요 리스크"},{"t":"mitigation","ko":"완화 방안"},{"t":"well-governed","ko":"잘 통제되는, 거버넌스가 갖춰진"}],"drill":[{"ko":"핵심 메시지, 근거, 그리고 구하고자 하는 의사결정으로 압축하겠습니다.","en":"I'll keep this to the headline, the evidence, and the decision we're seeking."},{"ko":"핵심은 중대한 역풍에도 계획대로 성과를 달성했다는 것입니다.","en":"The headline is that we delivered on plan despite material headwinds."},{"ko":"선택지가 아니라 권고안을 가지고 왔습니다.","en":"I'm bringing you a recommendation, not just options."},{"ko":"기저 가정에 대한 이사회의 비판적 검토를 환영합니다.","en":"I'd welcome the board's challenge on the underlying assumptions."},{"ko":"요약하면, 궤도에 있고, 잘 통제되며, 확장할 준비가 되어 있습니다.","en":"To summarize: on track, well-governed, and ready to scale."}],"tip":"이사회 보고의 황금률은 'headline first, then evidence, then the ask'입니다. 미달한 부분을 먼저 솔직히 말하면 신뢰가 올라가고, 선택지가 아닌 권고안을 가져가야 의사결정 리더로 인식됩니다."},{"n":99,"title":"글로벌 리더십과 비전 제시","scene":"전 세계 사업장 리더 1,000명 앞 타운홀에서 향후 5년의 비전을 제시하시는 상황입니다.","goal":"영감을 주는 비전과 방향성을 영어로 설득력 있게 제시하실 수 있습니다.","expressions":[{"en":"I want to talk less about where we are and more about where we're going.","ko":"현재 위치보다 우리가 가고 있는 곳에 대해 더 이야기하고 싶습니다."},{"en":"Our ambition is to define the interior experience, not just supply parts for it.","ko":"우리의 야망은 부품을 공급하는 것이 아니라 실내 경험을 정의하는 것입니다."},{"en":"The cars of the next decade will be living spaces, and we will shape them.","ko":"향후 10년의 자동차는 생활 공간이 될 것이며, 우리가 그것을 만들어 갑니다."},{"en":"Vision without execution is just a slogan, so let me be concrete.","ko":"실행 없는 비전은 구호에 불과하니, 구체적으로 말씀드리겠습니다."},{"en":"What unites us across every plant and every market is a single standard of excellence.","ko":"모든 공장과 모든 시장에서 우리를 하나로 묶는 것은 단 하나의 탁월함의 기준입니다."},{"en":"I'm asking each of you to lead the change in your own corner.","ko":"여러분 각자가 자신의 영역에서 변화를 이끌어 주시길 부탁드립니다."},{"en":"We don't follow where the industry goes; we help decide where it goes.","ko":"우리는 산업이 가는 곳을 따라가지 않습니다. 산업이 갈 곳을 함께 정합니다."},{"en":"Five years from now, I want us to look back and say we were bold enough.","ko":"5년 후, 우리가 충분히 대담했다고 돌아볼 수 있기를 바랍니다."}],"dialogue":[{"sp":"A","en":"Today I want to talk less about results and more about where we're going.","ko":"오늘은 실적보다, 우리가 어디로 가고 있는지를 더 이야기하고 싶습니다."},{"sp":"B","en":"Many here are proud of what we build but unsure what comes next.","ko":"여기 많은 분들이 우리가 만드는 것에 자부심을 느끼지만, 다음이 무엇일지 확신하지 못합니다."},{"sp":"A","en":"Then let me be clear: our ambition is to define the interior, not just supply it.","ko":"그럼 분명히 하겠습니다. 우리의 야망은 실내를 공급하는 것이 아니라 정의하는 것입니다."},{"sp":"B","en":"That's inspiring, but people will ask how it's real.","ko":"영감을 주지만, 사람들은 그것이 어떻게 현실이 되는지 물을 겁니다."},{"sp":"A","en":"Fair—vision without execution is a slogan. So I'll name three concrete bets.","ko":"맞습니다. 실행 없는 비전은 구호입니다. 그래서 세 가지 구체적 승부수를 말하겠습니다."},{"sp":"B","en":"And how do you want a thousand leaders to carry it?","ko":"그리고 1,000명의 리더가 그것을 어떻게 짊어지길 원하십니까?"},{"sp":"A","en":"I'm asking each of them to lead the change in their own corner.","ko":"각자가 자신의 영역에서 변화를 이끌어 주길 부탁하는 겁니다."},{"sp":"B","en":"That's a message they'll carry home. Make the closing personal.","ko":"그건 그들이 집까지 가져갈 메시지입니다. 마무리를 개인적으로 하세요."}],"vocab":[{"t":"ambition","ko":"야망, 큰 포부"},{"t":"vision","ko":"비전, 미래상"},{"t":"execution","ko":"실행"},{"t":"standard of excellence","ko":"탁월함의 기준"},{"t":"bold","ko":"대담한"},{"t":"concrete bet","ko":"구체적 승부수"},{"t":"townhall","ko":"타운홀, 전사 소통 미팅"}],"drill":[{"ko":"현재 위치보다 우리가 가고 있는 곳에 대해 더 이야기하고 싶습니다.","en":"I want to talk less about where we are and more about where we're going."},{"ko":"우리의 야망은 부품을 공급하는 것이 아니라 실내 경험을 정의하는 것입니다.","en":"Our ambition is to define the interior experience, not just supply parts for it."},{"ko":"실행 없는 비전은 구호에 불과하니, 구체적으로 말씀드리겠습니다.","en":"Vision without execution is just a slogan, so let me be concrete."},{"ko":"우리는 산업이 가는 곳을 따라가지 않습니다. 산업이 갈 곳을 함께 정합니다.","en":"We don't follow where the industry goes; we help decide where it goes."},{"ko":"5년 후, 우리가 충분히 대담했다고 돌아볼 수 있기를 바랍니다.","en":"Five years from now, I want us to look back and say we were bold enough."}],"tip":"비전 연설은 추상(야망)과 구체(승부수)를 번갈아 짜야 설득력이 생깁니다. 'vision without execution is a slogan'을 의식해 큰 그림 뒤에 반드시 구체적 행동을 붙이고, 마무리는 청중 개인의 역할로 끝내십시오."},{"n":100,"title":"CEO처럼 말하기 (Executive Presence)","scene":"예상치 못한 위기(주요 고객 리콜)에 대해 CEO로서 임직원·언론 앞에 서서 입장을 밝히시는 상황입니다.","goal":"압박 상황에서도 침착함, 책임감, 권위를 갖춘 임원의 화법을 구사하실 수 있습니다.","expressions":[{"en":"Let me address this directly, because you deserve straight answers.","ko":"여러분은 솔직한 답을 받을 자격이 있기에, 이 문제를 정면으로 다루겠습니다."},{"en":"I'll tell you what we know, what we don't yet know, and what we're doing about it.","ko":"우리가 아는 것, 아직 모르는 것, 그리고 우리가 취하는 조치를 말씀드리겠습니다."},{"en":"The buck stops with me, and I take full responsibility.","ko":"최종 책임은 제게 있으며, 전적으로 책임지겠습니다."},{"en":"We will not let short-term pressure compromise our standards.","ko":"단기적 압박이 우리의 기준을 훼손하도록 두지 않겠습니다."},{"en":"I'd rather we be transparent and trusted than quiet and doubted.","ko":"침묵해서 의심받기보다, 투명해서 신뢰받는 편을 택하겠습니다."},{"en":"This is a moment that will define who we are, and we will rise to it.","ko":"이 순간이 우리가 누구인지 규정할 것이며, 우리는 그에 부응할 것입니다."},{"en":"Hold me accountable for the commitments I'm making today.","ko":"오늘 제가 드리는 약속에 대해 저에게 책임을 물어 주십시오."},{"en":"Calm under pressure is not the absence of urgency—it's discipline.","ko":"압박 속의 침착함은 절박함의 부재가 아니라 절제입니다."}],"dialogue":[{"sp":"A","en":"I know you're anxious about the recall, so let me address it head-on.","ko":"리콜에 대해 불안하실 줄 압니다. 그래서 정면으로 다루겠습니다."},{"sp":"B","en":"The press is already framing this as a quality failure.","ko":"언론은 이미 이것을 품질 실패로 규정하고 있습니다."},{"sp":"A","en":"Then we lead the story with the truth. I'll say what we know and what we don't.","ko":"그렇다면 우리가 진실로 이야기를 주도합니다. 아는 것과 모르는 것을 말하겠습니다."},{"sp":"B","en":"And accountability? People want to know who owns this.","ko":"책임은요? 사람들은 누가 이것을 책임지는지 알고 싶어 합니다."},{"sp":"A","en":"The buck stops with me. I won't deflect, and I won't hide behind the team.","ko":"최종 책임은 제게 있습니다. 회피하지 않고, 팀 뒤에 숨지 않겠습니다."},{"sp":"B","en":"There's pressure to cut corners to recover fast.","ko":"빠른 회복을 위해 절차를 생략하라는 압박이 있습니다."},{"sp":"A","en":"We won't. Short-term pressure will never compromise our standards.","ko":"그러지 않겠습니다. 단기 압박이 우리의 기준을 훼손하는 일은 없을 겁니다."},{"sp":"B","en":"That's the message. Steady, honest, and in command.","ko":"그게 바로 그 메시지입니다. 흔들림 없고, 정직하며, 장악력 있는."}],"vocab":[{"t":"executive presence","ko":"임원다운 존재감"},{"t":"address head-on","ko":"정면으로 다루다"},{"t":"the buck stops with me","ko":"최종 책임은 내게 있다"},{"t":"take full responsibility","ko":"전적으로 책임지다"},{"t":"compromise standards","ko":"기준을 훼손하다"},{"t":"transparent","ko":"투명한"},{"t":"calm under pressure","ko":"압박 속의 침착함"}],"drill":[{"ko":"우리가 아는 것, 아직 모르는 것, 그리고 우리가 취하는 조치를 말씀드리겠습니다.","en":"I'll tell you what we know, what we don't yet know, and what we're doing about it."},{"ko":"최종 책임은 제게 있으며, 전적으로 책임지겠습니다.","en":"The buck stops with me, and I take full responsibility."},{"ko":"단기적 압박이 우리의 기준을 훼손하도록 두지 않겠습니다.","en":"We will not let short-term pressure compromise our standards."},{"ko":"침묵해서 의심받기보다, 투명해서 신뢰받는 편을 택하겠습니다.","en":"I'd rather we be transparent and trusted than quiet and doubted."},{"ko":"오늘 제가 드리는 약속에 대해 저에게 책임을 물어 주십시오.","en":"Hold me accountable for the commitments I'm making today."}],"tip":"Executive presence는 위기에서 드러납니다. 핵심 3요소는 정직(아는 것/모르는 것 구분), 책임(the buck stops with me), 절제(calm under pressure)입니다. 회피하지 않고 책임을 자처하는 리더만이 신뢰를 장악합니다. 이것이 CEO처럼 말하는 법의 정점입니다."}];

/* ── 상태 (localStorage) ─────────────────────── */
const DONE_KEY = "eng100_done_v1";
let done = new Set();
try{ done = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]")); }catch(e){}
function saveDone(){ localStorage.setItem(DONE_KEY, JSON.stringify([...done])); }

const byN = {};
LESSONS.forEach(l => byN[l.n] = l);
function stageOf(n){ return STAGES.find(s => n >= s.a && n <= s.b); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ── 발음 (Web Speech) ──────────────────────── */
function speak(t){
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US"; u.rate = 0.95;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ── 사이드바 ───────────────────────────────── */
let current = 1;
const sidebar = document.getElementById("sidebar");

function buildSidebar(){
  sidebar.innerHTML = "";
  STAGES.forEach(s => {
    const det = document.createElement("details");
    det.className = "stage"; det.dataset.stage = s.id;
    const lv = LESSONS.filter(l => l.n >= s.a && l.n <= s.b);
    const dn = lv.filter(l => done.has(l.n)).length;
    det.innerHTML = `
      <summary>
        <span class="st-no">${String(s.id).padStart(2,"0")}</span>
        <span class="st-meta"><span class="st-ko">${esc(s.ko)}</span><br><span class="st-en">Lv ${s.a}–${s.b} · ${esc(s.en)}</span></span>
        <span class="st-ring" data-ring="${s.id}">${dn}/${lv.length}</span>
      </summary>`;
    const box = document.createElement("div"); box.className = "levels";
    lv.forEach(l => {
      const btn = document.createElement("button");
      btn.className = "lv" + (done.has(l.n) ? " done":"");
      btn.dataset.n = l.n;
      btn.innerHTML = `<span class="num">L${l.n}</span><span class="tt">${esc(l.title)}</span><span class="dot"></span>`;
      btn.addEventListener("click", () => { go(l.n); if(window.innerWidth<=960) document.body.classList.remove("nav-open"); });
      box.appendChild(btn);
    });
    det.appendChild(box);
    sidebar.appendChild(det);
  });
}
function refreshSidebarState(){
  document.querySelectorAll(".lv").forEach(b => {
    const n = +b.dataset.n;
    b.classList.toggle("done", done.has(n));
    b.classList.toggle("active", n === current);
  });
  STAGES.forEach(s => {
    const lv = LESSONS.filter(l => l.n>=s.a && l.n<=s.b);
    const dn = lv.filter(l => done.has(l.n)).length;
    const r = sidebar.querySelector(`[data-ring="${s.id}"]`);
    if(r) r.textContent = `${dn}/${lv.length}`;
  });
  const total = LESSONS.length || 1;
  const pct = Math.round(done.size / total * 100);
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("progPct").textContent = pct + "%";
}
function openStageOf(n){
  const s = stageOf(n); if(!s) return;
  document.querySelectorAll(".stage").forEach(d => { d.open = (+d.dataset.stage === s.id); });
}

/* ── 렌더 ───────────────────────────────────── */
const root = document.getElementById("lesson");
function go(n){
  const l = byN[n]; if(!l) return;
  current = n;
  location.hash = "L" + n;
  render(l);
  openStageOf(n);
  refreshSidebarState();
  const a = sidebar.querySelector(".lv.active"); if(a) a.scrollIntoView({ block:"nearest" });
  root.scrollIntoView({ block:"start" });
  window.scrollTo({ top:0 });
}

function render(l){
  const s = stageOf(l.n);
  const exprs = (l.expressions||[]).map(e => `
    <div class="row">
      <button class="play" title="발음 듣기" data-say="${esc(e.en)}">▶</button>
      <div class="txt"><div class="en">${esc(e.en)}</div><div class="ko">${esc(e.ko)}</div></div>
    </div>`).join("");

  const dlg = (l.dialogue||[]).map(d => {
    const who = (d.sp||"A").toUpperCase()==="B" ? "B":"A";
    return `<div class="turn ${who}">
      <div class="who">${who==="A"?"나":"상대"}</div>
      <div class="bub"><div class="en" data-say="${esc(d.en)}" title="발음 듣기">${esc(d.en)}</div><div class="ko">${esc(d.ko)}</div></div>
    </div>`;
  }).join("");

  const vocab = (l.vocab||[]).map(v => `<div class="vc"><div class="t">${esc(v.t)}</div><div class="ko">${esc(v.ko)}</div></div>`).join("");

  const drill = (l.drill||[]).map((d,i) => `
    <div class="dr">
      <div class="q"><span class="qn">Q${i+1}</span><span>${esc(d.ko)}</span></div>
      <button class="reveal">영어로 말해보고 → 정답 보기</button>
      <div class="ans"><div class="en">${esc(d.en)}</div><button class="play" data-say="${esc(d.en)}" title="발음">▶</button></div>
    </div>`).join("");

  const isDone = done.has(l.n);
  const prev = byN[l.n-1], next = byN[l.n+1];

  root.innerHTML = `
    <div class="l-kicker"><span class="lvlno">LEVEL ${l.n}</span><span>STAGE ${s.id} · ${esc(s.ko)}</span></div>
    <h1 class="l-title">${esc(l.title)}</h1>
    <dl class="l-brief">
      <dt>상황</dt><dd>${esc(l.scene)}</dd>
      <dt>목표</dt><dd>${esc(l.goal)}</dd>
    </dl>

    <section class="sec"><div class="sec-h"><span class="ko">핵심 표현</span><span class="en">Key Expressions</span><span class="ct">${(l.expressions||[]).length}</span></div><div class="expr">${exprs}</div></section>

    <section class="sec"><div class="sec-h"><span class="ko">실전 대화</span><span class="en">In Action</span></div><div class="dlg">${dlg}</div></section>

    <section class="sec"><div class="sec-h"><span class="ko">어휘</span><span class="en">Vocabulary</span><span class="ct">${(l.vocab||[]).length}</span></div><div class="vocab">${vocab}</div></section>

    <section class="sec"><div class="drill-top sec-h"><span class="ko">작문 드릴</span><span class="en">Recall · KR→EN</span><button class="toggle-all">전체 정답</button></div><div class="drill">${drill}</div></section>

    <section class="sec"><div class="tip"><div class="lab">현업 · 임원 관점 팁</div><div class="body">${esc(l.tip)}</div></div></section>

    <div class="l-foot">
      <button class="nav-btn prev" ${prev?"":"disabled"}><span class="dir">← 이전</span><span class="nt">${prev?esc("L"+prev.n+" "+prev.title):"처음"}</span></button>
      <button class="done-btn ${isDone?"is-done":""}">${isDone?"✓ 완료한 단계":"이 단계 완료 표시"}</button>
      <button class="nav-btn next" ${next?"":"disabled"}><span class="dir">다음 →</span><span class="nt">${next?esc("L"+next.n+" "+next.title):"끝"}</span></button>
    </div>`;

  root.querySelectorAll("[data-say]").forEach(el => el.addEventListener("click", () => speak(el.dataset.say)));
  root.querySelectorAll(".dr .reveal").forEach(b => b.addEventListener("click", () => b.closest(".dr").classList.add("open")));
  root.querySelector(".toggle-all").addEventListener("click", () => {
    const drs = root.querySelectorAll(".dr"); const anyClosed = [...drs].some(d => !d.classList.contains("open"));
    drs.forEach(d => d.classList.toggle("open", anyClosed));
  });
  root.querySelector(".done-btn").addEventListener("click", () => {
    if(done.has(l.n)) done.delete(l.n); else done.add(l.n);
    saveDone(); refreshSidebarState(); render(l);
  });
  if(prev) root.querySelector(".prev").addEventListener("click", () => go(prev.n));
  if(next) root.querySelector(".next").addEventListener("click", () => go(next.n));
}

/* ── 검색 ───────────────────────────────────── */
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".stage").forEach(det => {
    let any = false;
    det.querySelectorAll(".lv").forEach(b => {
      const l = byN[+b.dataset.n];
      const hay = (l.title + " " + l.scene + " " + stageOf(l.n).ko).toLowerCase();
      const hit = !q || hay.includes(q);
      b.style.display = hit ? "" : "none"; if(hit) any = true;
    });
    det.style.display = any ? "" : "none";
    if(q && any) det.open = true;
  });
});

/* ── 기타 ───────────────────────────────────── */
document.getElementById("printBtn").addEventListener("click", () => window.print());
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.key === "ArrowLeft" && byN[current-1]) go(current-1);
  if(e.key === "ArrowRight" && byN[current+1]) go(current+1);
});

/* ── 시작 ───────────────────────────────────── */
buildSidebar();
const fromHash = parseInt((location.hash.match(/L(\d+)/)||[])[1], 10);
go(fromHash && byN[fromHash] ? fromHash : 1);
</script>
</body>
</html>
