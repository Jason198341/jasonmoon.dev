<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EXEC ENGLISH 100 — 설계자에서 경영층으로</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#f5f3ee; --panel:#fffdf9; --panel2:#faf7f0;
  --ink:#1b1a18; --muted:#6c675e; --faint:#a59f93; --line:#e5dfd3;
  --accent:#6e1d2b;        /* 버건디 — executive */
  --accent-soft:#f3e3e0;
  --brass:#9c6b3f;         /* 황동 — 강조 */
  --ok:#2f6b4f;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Noto Sans KR", system-ui, sans-serif;
  --mono:"Space Mono", ui-monospace, monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --sb:300px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
::selection{ background:var(--accent); color:#fff; }
button{ font-family:inherit; cursor:pointer; }

/* ── Topbar ─────────────────────────────────── */
.topbar{
  position:fixed; top:0; left:0; right:0; height:60px; z-index:40;
  display:flex; align-items:center; gap:20px; padding:0 22px;
  background:rgba(255,253,249,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brand{ display:flex; align-items:baseline; gap:10px; flex-shrink:0; }
.brand .mark{ font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:.18em; color:var(--accent); }
.brand .sub{ font-size:11px; color:var(--muted); letter-spacing:.02em; }
.brand .sub b{ color:var(--ink); font-weight:500; }
.menu-btn{ display:none; background:none; border:1px solid var(--line); border-radius:4px; padding:7px 9px; font-size:14px; }

.search{ flex:1; max-width:340px; position:relative; }
.search input{
  width:100%; padding:8px 12px 8px 32px; border:1px solid var(--line); border-radius:6px;
  background:var(--panel2); font-family:var(--sans); font-size:13px; color:var(--ink); outline:none;
  transition:border-color .2s;
}
.search input:focus{ border-color:var(--brass); }
.search::before{ content:"⌕"; position:absolute; left:11px; top:7px; color:var(--faint); font-size:15px; }

.prog-wrap{ display:flex; align-items:center; gap:10px; margin-left:auto; flex-shrink:0; }
.prog-wrap .pct{ font-family:var(--mono); font-size:12px; color:var(--accent); font-weight:700; min-width:38px; text-align:right; }
.prog-bar{ width:120px; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
.prog-bar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--brass)); transition:width .5s var(--ease); }
.icon-btn{ background:none; border:1px solid var(--line); border-radius:5px; padding:7px 10px; font-size:12px; color:var(--muted); }
.icon-btn:hover{ border-color:var(--brass); color:var(--ink); }

/* ── Sidebar ────────────────────────────────── */
.sidebar{
  position:fixed; top:60px; bottom:0; left:0; width:var(--sb); z-index:30;
  background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:14px 0 60px;
}
.sidebar::-webkit-scrollbar{ width:8px; } .sidebar::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
.stage{ border-bottom:1px solid var(--line); }
.stage > summary{
  list-style:none; cursor:pointer; padding:13px 18px; display:flex; align-items:center; gap:10px;
  transition:background .2s;
}
.stage > summary::-webkit-details-marker{ display:none; }
.stage > summary:hover{ background:var(--panel2); }
.stage .st-no{ font-family:var(--mono); font-size:10px; color:var(--faint); width:18px; }
.stage .st-meta{ flex:1; min-width:0; }
.stage .st-ko{ font-size:13.5px; font-weight:500; color:var(--ink); }
.stage .st-en{ font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; color:var(--faint); text-transform:uppercase; }
.stage .st-ring{ font-family:var(--mono); font-size:10px; color:var(--muted); }
.stage[open] > summary{ background:var(--accent-soft); }
.stage[open] .st-ko{ color:var(--accent); }
.levels{ padding:4px 0 10px; }
.lv{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:7px 18px 7px 30px; background:none; border:none; font-family:var(--sans);
  font-size:12.5px; color:var(--muted); transition:background .15s, color .15s; border-left:2px solid transparent;
}
.lv:hover{ background:var(--panel2); color:var(--ink); }
.lv.active{ color:var(--accent); background:var(--accent-soft); border-left-color:var(--accent); font-weight:500; }
.lv .num{ font-family:var(--mono); font-size:10px; color:var(--faint); width:24px; flex-shrink:0; }
.lv.active .num{ color:var(--accent); }
.lv .tt{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lv .dot{ width:7px; height:7px; border-radius:50%; border:1.5px solid var(--faint); flex-shrink:0; }
.lv.done .dot{ background:var(--ok); border-color:var(--ok); }

/* ── Main ───────────────────────────────────── */
.main{ margin-left:var(--sb); padding:60px 0 0; }
.lesson{ max-width:780px; margin:0 auto; padding:46px 40px 120px; }

.l-kicker{ font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin-bottom:14px; display:flex; gap:12px; align-items:center; }
.l-kicker .lvlno{ background:var(--accent); color:#fff; padding:2px 9px; border-radius:3px; font-weight:700; letter-spacing:.05em; }
.l-title{ font-family:var(--serif); font-weight:700; font-size:38px; line-height:1.15; letter-spacing:-.01em; margin-bottom:22px; word-break:keep-all; }
.l-brief{ display:grid; grid-template-columns:auto 1fr; gap:8px 16px; padding:18px 22px; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--brass); border-radius:6px; margin-bottom:42px; }
.l-brief dt{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--brass); padding-top:3px; }
.l-brief dd{ font-size:14.5px; color:var(--ink); word-break:keep-all; }

.sec{ margin-bottom:46px; }
.sec-h{ display:flex; align-items:baseline; gap:12px; margin-bottom:20px; padding-bottom:9px; border-bottom:1px solid var(--line); }
.sec-h .ko{ font-size:17px; font-weight:700; color:var(--ink); }
.sec-h .en{ font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
.sec-h .ct{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint); }

/* expressions */
.expr{ display:flex; flex-direction:column; gap:2px; }
.expr .row{ padding:13px 0; border-bottom:1px dashed var(--line); display:flex; gap:14px; align-items:flex-start; }
.expr .row:last-child{ border-bottom:none; }
.expr .play{ flex-shrink:0; margin-top:3px; width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--accent); font-size:10px; display:grid; place-items:center; transition:.2s; }
.expr .play:hover{ background:var(--accent); color:#fff; border-color:var(--accent); }
.expr .txt{ flex:1; }
.expr .en{ font-family:var(--serif); font-size:18px; line-height:1.4; color:var(--ink); }
.expr .ko{ font-size:13px; color:var(--muted); margin-top:3px; }

/* dialogue */
.dlg{ display:flex; flex-direction:column; gap:14px; }
.turn{ display:flex; gap:12px; max-width:92%; }
.turn.B{ align-self:flex-end; flex-direction:row-reverse; }
.turn .who{ flex-shrink:0; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-size:11px; font-weight:700; }
.turn.A .who{ background:var(--accent-soft); color:var(--accent); }
.turn.B .who{ background:#e9eee9; color:var(--ok); }
.turn .bub{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 15px; }
.turn.A .bub{ border-top-left-radius:2px; }
.turn.B .bub{ border-top-right-radius:2px; background:var(--panel2); }
.turn .en{ font-family:var(--serif); font-size:16px; line-height:1.45; color:var(--ink); cursor:pointer; }
.turn .en:hover{ color:var(--accent); }
.turn .ko{ font-size:12.5px; color:var(--muted); margin-top:5px; }

/* vocab */
.vocab{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
.vc{ padding:11px 14px; background:var(--panel); border:1px solid var(--line); border-radius:6px; }
.vc .t{ font-family:var(--serif); font-size:15.5px; font-weight:600; color:var(--ink); }
.vc .ko{ font-size:12.5px; color:var(--muted); margin-top:2px; }

/* drill */
.drill-top{ display:flex; align-items:center; gap:10px; }
.drill-top .toggle-all{ margin-left:auto; font-family:var(--mono); font-size:10px; letter-spacing:.06em; padding:6px 12px; border:1px solid var(--line); border-radius:5px; background:var(--panel); color:var(--muted); }
.drill-top .toggle-all:hover{ border-color:var(--accent); color:var(--accent); }
.drill{ display:flex; flex-direction:column; gap:11px; }
.dr{ padding:14px 16px; background:var(--panel); border:1px solid var(--line); border-radius:7px; }
.dr .q{ font-size:14.5px; color:var(--ink); display:flex; gap:10px; align-items:flex-start; }
.dr .q .qn{ font-family:var(--mono); font-size:11px; color:var(--brass); flex-shrink:0; }
.dr .reveal{ margin-top:10px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:5px 11px; border:1px dashed var(--accent); border-radius:5px; background:none; color:var(--accent); }
.dr .ans{ display:none; margin-top:11px; padding-top:11px; border-top:1px dashed var(--line); }
.dr.open .ans{ display:flex; gap:10px; align-items:flex-start; }
.dr.open .reveal{ display:none; }
.dr .ans .en{ font-family:var(--serif); font-size:16px; color:var(--ok); flex:1; }
.dr .ans .play{ flex-shrink:0; width:24px; height:24px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--ok); font-size:9px; }

/* tip */
.tip{ padding:18px 22px; background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:6px; }
.tip .lab{ font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
.tip .body{ font-size:14.5px; line-height:1.7; color:var(--ink); word-break:keep-all; }

/* footer nav */
.l-foot{ display:flex; align-items:center; gap:14px; margin-top:54px; padding-top:26px; border-top:1px solid var(--line); }
.nav-btn{ display:flex; flex-direction:column; gap:2px; padding:11px 16px; border:1px solid var(--line); border-radius:7px; background:var(--panel); color:var(--ink); min-width:0; max-width:38%; text-align:left; transition:.2s; }
.nav-btn.next{ text-align:right; }
.nav-btn:hover{ border-color:var(--brass); }
.nav-btn:disabled{ opacity:.35; cursor:default; }
.nav-btn .dir{ font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--faint); text-transform:uppercase; }
.nav-btn .nt{ font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.done-btn{ flex:1; padding:14px; border:1px solid var(--accent); border-radius:7px; background:var(--accent); color:#fff; font-size:13.5px; font-weight:500; letter-spacing:.02em; transition:.2s; }
.done-btn:hover{ background:#5a1622; }
.done-btn.is-done{ background:var(--ok); border-color:var(--ok); }

.scrim{ display:none; }

@media print{
  .topbar,.sidebar,.l-foot,.expr .play,.dr .reveal,.drill-top .toggle-all{ display:none !important; }
  .main{ margin:0; } .lesson{ max-width:none; padding:0; }
  .dr .ans{ display:flex !important; } body{ background:#fff; }
}

@media(max-width:960px){
  :root{ --sb:280px; }
  .menu-btn{ display:block; }
  .sidebar{ transform:translateX(-100%); transition:transform .35s var(--ease); box-shadow:0 0 40px rgba(0,0,0,.15); }
  body.nav-open .sidebar{ transform:none; }
  body.nav-open .scrim{ display:block; position:fixed; inset:60px 0 0; background:rgba(0,0,0,.3); z-index:25; }
  .main{ margin-left:0; }
  .brand .sub{ display:none; }
}
@media(max-width:560px){
  .lesson{ padding:30px 20px 100px; } .l-title{ font-size:28px; }
  .prog-bar{ width:70px; } .search{ display:none; }
}
</style>
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
    <div class="brand">
      <span class="mark">EXEC ENGLISH 100</span>
      <span class="sub">설계자에서 <b>경영층</b>으로 · 비즈니스 영어 100단계</span>
    </div>
    <div class="search"><input id="search" type="text" placeholder="단계·주제 검색 (예: 협상, 계약, 설계검토)" /></div>
    <div class="prog-wrap">
      <div class="prog-bar"><i id="progFill"></i></div>
      <span class="pct" id="progPct">0%</span>
      <button class="icon-btn" id="printBtn" title="현재 단계 인쇄/하드카피">인쇄</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main"><div class="lesson" id="lesson"></div></main>

<script>
"use strict";

const STAGES = [
  { id:1,  a:1,  b:10,  ko:"생존 비즈니스 영어",   en:"Survival" },
  { id:2,  a:11, b:20,  ko:"사내 협업",            en:"Collaboration" },
  { id:3,  a:21, b:30,  ko:"설계 실무 영어",        en:"Engineering" },
  { id:4,  a:31, b:40,  ko:"미팅 주도",            en:"Leading Meetings" },
  { id:5,  a:41, b:50,  ko:"협력사·구매",          en:"Suppliers" },
  { id:6,  a:51, b:60,  ko:"협상 영어",            en:"Negotiation" },
  { id:7,  a:61, b:70,  ko:"프로젝트 관리",         en:"Program Mgmt" },
  { id:8,  a:71, b:80,  ko:"임원 보고·설득",        en:"Executive Comms" },
  { id:9,  a:81, b:90,  ko:"계약·법무 영어",        en:"Contracts & Legal" },
  { id:10, a:91, b:100, ko:"경영 리더십 영어",      en:"Leadership" },

const LESSONS = [{"n":1,"title":"자기소개와 직책 말하기","scene":"글로벌 OEM 협력사 미팅 자리에서 처음 만난 상대에게 본인과 직책을 소개하는 상황입니다.","goal":"이름, 소속, 직책, 담당 업무를 짧고 명확한 영어로 소개할 수 있습니다.","expressions":[{"en":"Hi, I'm Jihoon Park from the interior design team.","ko":"안녕하세요, 내장설계팀의 박지훈입니다."},{"en":"I work as an interior design engineer.","ko":"저는 내장설계 엔지니어로 일하고 있습니다."},{"en":"I'm in charge of instrument panel design.","ko":"저는 인스트루먼트 패널 설계를 담당하고 있습니다."},{"en":"I've been with the company for five years.","ko":"저는 이 회사에서 5년째 근무하고 있습니다."},{"en":"Nice to meet you. Here's my card.","ko":"만나서 반갑습니다. 제 명함입니다."},{"en":"I mainly handle center console and door trim.","ko":"저는 주로 센터 콘솔과 도어 트림을 담당합니다."},{"en":"Please call me Jihoon.","ko":"지훈이라고 불러 주세요."},{"en":"I look forward to working with you.","ko":"함께 일하게 되어 기대됩니다."}],"dialogue":[{"sp":"A","en":"Hi, I'm Jihoon Park. Nice to meet you.","ko":"안녕하세요, 박지훈입니다. 만나서 반갑습니다."},{"sp":"B","en":"Nice to meet you too. I'm Sarah from the supplier side.","ko":"저도 반갑습니다. 협력사 쪽의 사라입니다."},{"sp":"A","en":"I'm an interior design engineer here.","ko":"저는 이곳의 내장설계 엔지니어입니다."},{"sp":"B","en":"Oh, what do you work on exactly?","ko":"아, 정확히 어떤 일을 하시나요?"},{"sp":"A","en":"I'm in charge of instrument panel design.","ko":"저는 인스트루먼트 패널 설계를 담당합니다."},{"sp":"B","en":"Great. How long have you been here?","ko":"좋네요. 여기서 얼마나 근무하셨어요?"},{"sp":"A","en":"I've been with the company for five years.","ko":"이 회사에서 5년째 일하고 있습니다."},{"sp":"B","en":"Wonderful. I look forward to working with you.","ko":"멋지네요. 함께 일하게 되어 기대됩니다."}],"vocab":[{"t":"in charge of","ko":"~을 담당하는"},{"t":"interior design","ko":"내장설계"},{"t":"instrument panel","ko":"인스트루먼트 패널, 계기판"},{"t":"team","ko":"팀"},{"t":"engineer","ko":"엔지니어, 기술자"},{"t":"supplier","ko":"협력사, 공급업체"},{"t":"look forward to","ko":"~을 기대하다"}],"drill":[{"ko":"저는 내장설계 엔지니어입니다.","en":"I'm an interior design engineer."},{"ko":"저는 인스트루먼트 패널을 담당합니다.","en":"I'm in charge of the instrument panel."},{"ko":"만나서 반갑습니다.","en":"Nice to meet you."},{"ko":"저는 이 회사에서 5년째 근무하고 ime."}],"tip":"명함은 두 손으로 건네고 받은 명함은 바로 넣지 말고 잠시 보며 이름을 확인하세요. 글로벌 미팅에서도 상대 이름을 정확히 발음하려는 태도가 좋은 인상을 줍니다."},{"n":4,"title":"전화 받기와 걸기 기초","scene":"해외 협력사에서 걸려온 전화를 받거나, 담당자에게 전화를 거는 상황입니다.","goal":"전화를 받고 걸 때 쓰는 기본 문장으로 용건을 주고받을 수 있습니다.","expressions":[{"en":"Hello, this is Jihoon speaking.","ko":"여보세요, 지훈입니다."},{"en":"May I ask who's calling?","ko":"전화 주신 분이 누구신지 여쭤봐도 될까요?"},{"en":"Could you hold on for a moment?","ko":"잠시만 기다려 주시겠어요?"},{"en":"I'm calling about the design review.","ko":"설계 검토 건으로 전화드렸습니다."},{"en":"Can I leave a message?","ko":"메시지를 남겨도 될까요?"},{"en":"Sorry, the line is bad. Could you repeat that?","ko":"죄송합니다, 연결이 안 좋네요. 다시 말씀해 주시겠어요?"},{"en":"I'll call you back later.","ko":"나중에 다시 전화드리겠습니다."},{"en":"Thank you for calling.","ko":"전화 주셔서 감사합니다."}],"dialogue":[{"sp":"A","en":"Hello, this is Jihoon speaking.","ko":"여보세요, 지훈입니다."},{"sp":"B","en":"Hi Jihoon, this is Mark from the supplier.","ko":"안녕하세요 지훈 씨, 협력사의 마크입니다."},{"sp":"A","en":"Hi Mark. How can I help you?","ko":"안녕하세요 마크 씨. 무엇을 도와드릴까요?"},{"sp":"B","en":"I'm calling about the design review.","ko":"설계 검토 건으로 전화드렸습니다."},{"sp":"A","en":"Sure. Could you hold on for a moment?","ko":"네. 잠시만 기다려 주시겠어요?"},{"sp":"B","en":"No problem.","ko":"괜찮습니다."},{"sp":"A","en":"Sorry, the line is bad. Could you repeat that?","ko":"죄송합니다, 연결이 안 좋네요. 다시 말씀해 주시겠어요?"},{"sp":"B","en":"Of course. Let me call you back later.","ko":"물론이죠. 나중에 다시 전화드리겠습니다."}],"vocab":[{"t":"speaking","ko":"(전화에서) 말하는 사람"},{"t":"hold on","ko":"기다리다, 끊지 않고 대기하다"},{"t":"message","ko":"메시지, 전언"},{"t":"line","ko":"전화선, 연결 상태"},{"t":"repeat","ko":"다시 말하다, 반복하다"},{"t":"call back","ko":"다시 전화하다"},{"t":"design review","ko":"설계 검토"}],"drill":[{"ko":"여보세요, 지훈입니다.","en":"Hello, this is Jihoon speaking."},{"ko":"잠시만 기다려 주시겠어요?","en":"Could you hold on for a moment?"},{"ko":"설계 검토 건으로 전화드렸습니다.","en":"I'm calling about the design review."},{"ko":"다시 말씀해 주시겠어요?","en":"Could you repeat that?"},{"ko":"나중에 다시 전화드리겠습니다.","en":"I'll call you back later."}],"tip":"전화에서 못 알아들었을 때 얼버무리지 말고 'Could you repeat that?'로 정확히 확인하세요. 설계 수치나 일정은 잘못 들으면 큰 손실로 이어지므로 되묻는 것이 프로의 태도입니다."},{"n":5,"title":"약속 잡기와 일정 조율","scene":"해외 OEM 담당자와 화상 회의 일정을 잡고 시간을 조율하는 상황입니다.","goal":"회의 날짜와 시간을 제안하고 조율하는 표현을 쓸 수 있습니다.","expressions":[{"en":"Are you available next Tuesday?","ko":"다음 주 화요일에 시간 되세요?"},{"en":"Does 3 p.m. work for you?","ko":"오후 3시 괜찮으세요?"},{"en":"I'm afraid I'm busy that day.","ko":"죄송하지만 그날은 바쁩니다."},{"en":"Could we move it to Thursday?","ko":"목요일로 옮길 수 있을까요?"},{"en":"Let's set up a call.","ko":"전화 회의를 잡읍시다."},{"en":"What time zone are you in?","ko":"어느 시간대에 계세요?"},{"en":"I'll send you a calendar invite.","ko":"캘린더 초대를 보내드리겠습니다."},{"en":"That works for me.","ko":"저는 그 시간 괜찮습니다."}],"dialogue":[{"sp":"A","en":"Hi, are you available next Tuesday?","ko":"안녕하세요, 다음 주 화요일에 시간 되세요?"},{"sp":"B","en":"Let me check. What time were you thinking?","ko":"확인해 볼게요. 몇 시 생각하셨어요?"},{"sp":"A","en":"Does 3 p.m. work for you?","ko":"오후 3시 괜찮으세요?"},{"sp":"B","en":"I'm afraid I'm busy that day.","ko":"죄송하지만 그날은 바쁩니다."},{"sp":"A","en":"No problem. Could we move it to Thursday?","ko":"괜찮습니다. 목요일로 옮길 수 있을까요?"},{"sp":"B","en":"Thursday at 3 works for me. What time zone are you in?","ko":"목요일 3시 괜찮습니다. 어느 시간대에 계세요?"},{"sp":"A","en":"I'm in Korea time. I'll send you a calendar invite.","ko":"저는 한국 시간입니다. 캘린더 초대를 보내드리겠습니다."},{"sp":"B","en":"Perfect, thank you.","ko":"좋습니다, 감사합니다."}],"vocab":[{"t":"available","ko":"시간이 되는, 가능한"},{"t":"work for you","ko":"당신에게 괜찮은"},{"t":"move it","ko":"일정을 옮기다"},{"t":"set up a call","ko":"전화 회의를 잡다"},{"t":"time zone","ko":"시간대"},{"t":"calendar invite","ko":"캘린더 초대"},{"t":"That works","ko":"그게 괜찮다"}],"drill":[{"ko":"다음 주 화요일에 시간 되세요?","en":"Are you available next Tuesday?"},{"ko":"오후 3시 괜찮으세요?","en":"Does 3 p.m. work for you?"},{"ko":"죄송하지만 그날은 바쁩니다.","en":"I'm afraid I'm busy that day."},{"ko":"목요일로 옮길 수 있을까요?","en":"Could we move it to Thursday?"},{"ko":"캘린더 초대를 보내드리겠습니다.","en":"I'll send you a calendar invite."}],"tip":"글로벌 협업에서는 항상 시간대를 명시하세요. '3 p.m. KST'처럼 시간대를 붙이면 혼선을 막고, 일정 관리가 정확한 사람이라는 신뢰를 줍니다."},{"n":6,"title":"비즈니스 이메일 기본 구조","scene":"협력사에 도면 관련 문의 이메일을 처음 작성하는 상황입니다.","goal":"인사, 본문, 마무리로 이어지는 기본 이메일 구조를 영어로 쓸 수 있습니다.","expressions":[{"en":"Dear Mr. Smith,","ko":"스미스 씨께,"},{"en":"I hope this email finds you well.","ko":"잘 지내고 계시기를 바랍니다."},{"en":"I'm writing to ask about the latest drawing.","ko":"최신 도면에 대해 문의드리고자 메일 드립니다."},{"en":"Could you please send it by Friday?","ko":"금요일까지 보내 주실 수 있을까요?"},{"en":"Please let me know if you have any questions.","ko":"궁금한 점이 있으면 알려 주세요."},{"en":"Thank you for your time.","ko":"시간 내 주셔서 감사합니다."},{"en":"Best regards,","ko":"감사합니다, (맺음말)"},{"en":"Looking forward to your reply.","ko":"답변 기다리겠습니다."}],"dialogue":[{"sp":"A","en":"Dear Mr. Smith, I hope this email finds you well.","ko":"스미스 씨께, 잘 지내고 계시기를 바랍니다."},{"sp":"B","en":"Hello Jihoon, thank you for reaching out.","ko":"안녕하세요 지훈 씨, 연락 주셔서 감사합니다."},{"sp":"A","en":"I'm writing to ask about the latest drawing.","ko":"최신 도면에 대해 문의드리고자 메일 드립니다."},{"sp":"B","en":"Sure, which version do you need?","ko":"물론이죠, 어느 버전이 필요하세요?"},{"sp":"A","en":"The latest one. Could you please send it by Friday?","ko":"가장 최신 버전이요. 금요일까지 보내 주실 수 있을까요?"},{"sp":"B","en":"No problem. I'll send it tomorrow.","ko":"문제없습니다. 내일 보내드릴게요."},{"sp":"A","en":"Thank you for your time. Looking forward to your reply.","ko":"시간 내 주셔서 감사합니다. 답변 기다리겠습니다."},{"sp":"B","en":"You're welcome. Best regards.","ko":"천만에요. 감사합니다."}],"vocab":[{"t":"Dear","ko":"~께 (이메일 첫인사)"},{"t":"writing to","ko":"~하고자 메일을 쓰다"},{"t":"drawing","ko":"도면"},{"t":"by Friday","ko":"금요일까지"},{"t":"reply","ko":"답장, 회신"},{"t":"Best regards","ko":"감사합니다 (맺음말)"},{"t":"reach out","ko":"연락하다"}],"drill":[{"ko":"잘 지내고 계시기를 바랍니다.","en":"I hope this email finds you well."},{"ko":"최신 도면에 대해 문의드리고자 메일 드립니다.","en":"I'm writing to ask about the latest drawing."},{"ko":"금요일까지 보내 주실 수 있을까요?","en":"Could you please send it by Friday?"},{"ko":"시간 내 주셔서 감사합니다.","en":"Thank you for your time."},{"ko":"답변 기다리겠습니다.","en":"Looking forward to your reply."}],"tip":"비즈니스 이메일은 첫 문장에서 용건을 분명히 밝히세요. 'I'm writing to...'로 시작하면 바쁜 상대가 메일 목적을 즉시 파악할 수 있습니다."},{"n":7,"title":"부탁과 요청의 정중한 표현","scene":"협력사에 자료나 도움을 요청하면서 무례하지 않게 부탁하는 상황입니다.","goal":"정중하고 부드러운 요청 표현을 상황에 맞게 쓸 수 있습니다.","expressions":[{"en":"Could you help me with this?","ko":"이것 좀 도와주실 수 있을까요?"},{"en":"Would you mind sending the file again?","ko":"파일을 다시 보내 주실 수 있을까요?"},{"en":"I was wondering if you could check the spec.","ko":"사양을 확인해 주실 수 있을지 궁금합니다."},{"en":"If it's not too much trouble,","ko":"너무 번거롭지 않으시다면,"},{"en":"When you have a moment, please review this.","ko":"시간 나실 때 이것 좀 검토해 주세요."},{"en":"I'd really appreciate your help.","ko":"도와주시면 정말 감사하겠습니다."},{"en":"Could I ask you a favor?","ko":"부탁 하나 드려도 될까요?"},{"en":"Please feel free to say no.","ko":"어려우시면 거절하셔도 괜찮습니다."}],"dialogue":[{"sp":"A","en":"Hi Anna, could I ask you a favor?","ko":"안녕하세요 안나 씨, 부탁 하나 드려도 될까요?"},{"sp":"B","en":"Of course. What do you need?","ko":"물론이죠. 무엇이 필요하세요?"},{"sp":"A","en":"Would you mind sending the spec sheet again?","ko":"사양서를 다시 보내 주실 수 있을까요?"},{"sp":"B","en":"Not at all. Which one?","ko":"전혀요. 어느 것이요?"},{"sp":"A","en":"The console one. When you have a moment, please review it too.","ko":"콘솔 관련된 거요. 시간 나실 때 함께 검토도 부탁드려요."},{"sp":"B","en":"Sure, I'll look at it this afternoon.","ko":"네, 오늘 오후에 보겠습니다."},{"sp":"A","en":"I'd really appreciate your help.","ko":"도와주시면 정말 감사하겠습니다."},{"sp":"B","en":"Happy to help.","ko":"기꺼이 도와드릴게요."}],"vocab":[{"t":"Would you mind","ko":"~해 주실 수 있을까요 (정중한 요청)"},{"t":"I was wondering if","ko":"~할 수 있을지 궁금합니다"},{"t":"favor","ko":"부탁, 호의"},{"t":"spec sheet","ko":"사양서"},{"t":"review","ko":"검토하다"},{"t":"appreciate","ko":"감사하다, 고맙게 여기다"},{"t":"trouble","ko":"번거로움, 수고"}],"drill":[{"ko":"이것 좀 도와주실 수 있을까요?","en":"Could you help me with this?"},{"ko":"파일을 다시 보내 주실 수 있을까요?","en":"Would you mind sending the file again?"},{"ko":"시간 나실 때 이것 좀 검토해 주세요.","en":"When you have a moment, please review this."},{"ko":"도와주시면 정말 감사하겠습니다.","en":"I'd really appreciate your help."},{"ko":"부탁 하나 드려도 될까요?","en":"Could I ask you a favor?"}],"tip":"영어 요청은 'Could you' 'Would you mind'처럼 한 단계 부드럽게 표현할수록 정중해집니다. 명령조 'Send me...'는 피하고, 상대에게 선택권을 주는 문장이 협업을 매끄럽게 합니다."},{"n":8,"title":"감사와 사과 표현","scene":"협력사의 도움에 감사를 표하거나, 실수나 지연에 대해 사과하는 상황입니다.","goal":"상황에 맞는 감사와 사과 표현을 자연스럽게 쓸 수 있습니다.","expressions":[{"en":"Thank you so much for your help.","ko":"도와주셔서 정말 감사합니다."},{"en":"I really appreciate it.","ko":"정말 감사드립니다."},{"en":"I'm sorry for the delay.","ko":"지연되어 죄송합니다."},{"en":"I apologize for the confusion.","ko":"혼선을 드려 사과드립니다."},{"en":"That was my mistake.","ko":"제 실수였습니다."},{"en":"It won't happen again.","ko":"다시는 이런 일이 없도록 하겠습니다."},{"en":"Thank you for your patience.","ko":"기다려 주셔서 감사합니다."},{"en":"I owe you one.","ko":"신세 졌습니다."}],"dialogue":[{"sp":"A","en":"Thank you so much for your help yesterday.","ko":"어제 도와주셔서 정말 감사합니다."},{"sp":"B","en":"No problem at all. Did it work out?","ko":"전혀 문제없어요. 잘 해결됐나요?"},{"sp":"A","en":"Yes, but I'm sorry for the delay in my reply.","ko":"네, 그런데 답장이 늦어 죄송합니다."},{"sp":"B","en":"Don't worry about it.","ko":"신경 쓰지 마세요."},{"sp":"A","en":"I apologize for the confusion about the version.","ko":"버전에 대해 혼선을 드려 사과드립니다."},{"sp":"B","en":"It's fine, we sorted it out.","ko":"괜찮아요, 정리됐어요."},{"sp":"A","en":"Thank you for your patience. I owe you one.","ko":"기다려 주셔서 감사합니다. 신세 졌습니다."},{"sp":"B","en":"Anytime.","ko":"언제든지요."}],"vocab":[{"t":"appreciate","ko":"감사하다"},{"t":"delay","ko":"지연, 늦어짐"},{"t":"apologize","ko":"사과하다"},{"t":"confusion","ko":"혼선, 혼란"},{"t":"mistake","ko":"실수"},{"t":"patience","ko":"인내, 기다려 줌"},{"t":"owe you one","ko":"신세 지다"}],"drill":[{"ko":"도와주셔서 정말 감사합니다.","en":"Thank you so much for your help."},{"ko":"지연되어 죄송합니다.","en":"I'm sorry for the delay."},{"ko":"혼선을 드려 사과드립니다.","en":"I apologize for the confusion."},{"ko":"제 실수였습니다.","en":"That was my mistake."},{"ko":"기다려 주셔서 감사합니다.","en":"Thank you for your patience."}],"tip":"사과할 때는 변명보다 'That was my mistake'처럼 책임을 인정하고 'It won't happen again'으로 마무리하세요. 깔끔한 사과는 오히려 신뢰를 높이며, 임원은 책임지는 태도를 높이 평가합니다."},{"n":9,"title":"출장·이동과 길 안내 영어","scene":"해외 출장 중 공항, 호텔, 협력사 사옥을 오가며 이동하고 길을 묻는 상황입니다.","goal":"이동, 교통, 길 안내 관련 기본 표현으로 출장 상황에 대처할 수 있습니다.","expressions":[{"en":"Where can I get a taxi?","ko":"택시는 어디서 탈 수 있나요?"},{"en":"How do I get to the hotel?","ko":"호텔에는 어떻게 가나요?"},{"en":"Is it far from here?","ko":"여기서 먼가요?"},{"en":"I have a reservation under Park.","ko":"박 이름으로 예약이 되어 있습니다."},{"en":"Could you write down the address?","ko":"주소를 적어 주시겠어요?"},{"en":"What time is check-out?","ko":"체크아웃은 몇 시인가요?"},{"en":"I'm here for a business meeting.","ko":"비즈니스 미팅 때문에 왔습니다."},{"en":"Can you call a taxi for me?","ko":"택시를 불러 주실 수 있나요?"}],"dialogue":[{"sp":"A","en":"Excuse me, where can I get a taxi?","ko":"실례합니다, 택시는 어디서 탈 수 있나요?"},{"sp":"B","en":"Right outside, near exit two.","ko":"바로 밖, 2번 출구 근처입니다."},{"sp":"A","en":"Thank you. How do I get to the Grand Hotel?","ko":"감사합니다. 그랜드 호텔에는 어떻게 가나요?"},{"sp":"B","en":"It's about twenty minutes by taxi.","ko":"택시로 약 20분 거리입니다."},{"sp":"A","en":"Is it far from the supplier's office?","ko":"협력사 사무실에서 먼가요?"},{"sp":"B","en":"No, just ten minutes away.","ko":"아니요, 10분 거리입니다."},{"sp":"A","en":"Great. Could you write down the address?","ko":"좋네요. 주소를 적어 주시겠어요?"},{"sp":"B","en":"Of course. Here you go.","ko":"물론이죠. 여기 있습니다."}],"vocab":[{"t":"taxi","ko":"택시"},{"t":"reservation","ko":"예약"},{"t":"far","ko":"먼"},{"t":"address","ko":"주소"},{"t":"check-out","ko":"체크아웃, 퇴실"},{"t":"exit","ko":"출구"},{"t":"business meeting","ko":"비즈니스 미팅"}],"drill":[{"ko":"택시는 어디서 탈 수 있나요?","en":"Where can I get a taxi?"},{"ko":"호텔에는 어떻게 가나요?","en":"How do I get to the hotel?"},{"ko":"여기서 먼가요?","en":"Is it far from here?"},{"ko":"박 이름으로 예약이 되어 있습니다.","en":"I have a reservation under Park."},{"ko":"주소를 적어 주시겠어요?","en":"Could you write down the address?"}],"tip":"출장 중 길을 물을 때는 주소나 호텔명을 미리 종이나 휴대폰에 적어 보여주면 발음 문제로 인한 혼선을 줄일 수 있습니다. 작은 준비가 출장의 피로를 크게 줄여 줍니다."},{"n":10,"title":"회식·식사 자리 영어","scene":"해외 협력사 담당자들과 저녁 식사 자리에서 음식을 주문하고 가벼운 대화를 나누는 상황입니다.","goal":"식사 자리에서 주문하고 권하며 대화를 이어가는 표현을 쓸 수 있습니다.","expressions":[{"en":"What would you recommend?","ko":"무엇을 추천하시겠어요?"},{"en":"I'll have the same.","ko":"저도 같은 걸로 하겠습니다."},{"en":"Please help yourself.","ko":"편하게 드세요."},{"en":"Would you like some more?","ko":"조금 더 드시겠어요?"},{"en":"This is delicious.","ko":"정말 맛있네요."},{"en":"Shall we order some drinks?","ko":"음료 좀 주문할까요?"},{"en":"Let me get this. It's on me.","ko":"제가 낼게요. 제가 사겠습니다."},{"en":"Thank you for the lovely dinner.","ko":"멋진 저녁 식사 감사합니다."}],"dialogue":[{"sp":"A","en":"What would you recommend here?","ko":"여기 무엇을 추천하시겠어요?"},{"sp":"B","en":"The grilled fish is excellent.","ko":"구운 생선이 훌륭합니다."},{"sp":"A","en":"Sounds good. I'll have the same.","ko":"좋네요. 저도 같은 걸로 하겠습니다."},{"sp":"B","en":"Great. Shall we order some drinks?","ko":"좋아요. 음료 좀 주문할까요?"},{"sp":"A","en":"Sure. Please help yourself.","ko":"물론이죠. 편하게 드세요."},{"sp":"B","en":"Thank you. This is delicious.","ko":"감사합니다. 정말 맛있네요."},{"sp":"A","en":"I'm glad you like it. Let me get this. It's on me.","ko":"마음에 드신다니 기쁘네요. 제가 낼게요. 제가 사겠습니다."},{"sp":"B","en":"That's very kind. Thank you for the lovely dinner.","ko":"정말 감사합니다. 멋진 저녁 식사 감사합니다."}],"vocab":[{"t":"recommend","ko":"추천하다"},{"t":"help yourself","ko":"편하게 드세요"},{"t":"delicious","ko":"맛있는"},{"t":"order","ko":"주문하다"},{"t":"It's on me","ko":"제가 낼게요"},{"t":"grilled","ko":"구운"},{"t":"lovely","ko":"멋진, 사랑스러운"}],"drill":[{"ko":"무엇을 추천하시겠어요?","en":"What would you recommend?"},{"ko":"저도 같은 걸로 하겠습니다.","en":"I'll have the same."},{"ko":"편하게 드세요.","en":"Please help yourself."},{"ko":"정말 맛있네요.","en":"This is delicious."},{"ko":"제가 낼게요. 제가 사겠습니다.","en":"Let me get this. It's on me."}],"tip":"식사 자리는 비즈니스 관계를 깊게 만드는 기회입니다. 음식이나 상대 나라 문화에 대해 가벼운 관심을 보이면 호감을 얻고, 계산 의사를 자연스럽게 밝히는 것도 좋은 매너입니다."},{"n":11,"title":"회의 참석과 기본 발언","scene":"글로벌 설계 검토 회의에 참석해 발언 기회를 얻고 기본적인 의견을 말하는 상황입니다.","goal":"회의에서 발언을 시작하고 끼어드는 기본 표현을 적절히 쓸 수 있습니다.","expressions":[{"en":"May I add something here?","ko":"여기서 한 가지 덧붙여도 될까요?"},{"en":"If I could just jump in,","ko":"잠깐 끼어들어도 될까요,"},{"en":"From the design side, I'd say this.","ko":"설계 측면에서는 이렇게 말씀드리고 싶습니다."},{"en":"Let me share my view on this.","ko":"이 점에 대한 제 의견을 말씀드리겠습니다."},{"en":"Could you clarify that point?","ko":"그 부분을 좀 더 설명해 주시겠어요?"},{"en":"I'd like to come back to the earlier topic.","ko":"앞서 나온 주제로 돌아가고 싶습니다."},{"en":"That's a good point.","ko":"좋은 지적이십니다."},{"en":"Let me make sure I understand.","ko":"제가 제대로 이해했는지 확인하겠습니다."}],"dialogue":[{"sp":"A","en":"If I could just jump in, may I add something here?","ko":"잠깐 끼어들어도 될까요, 여기서 한 가지 덧붙여도 될까요?"},{"sp":"B","en":"Of course, go ahead.","ko":"물론이죠, 말씀하세요."},{"sp":"A","en":"From the design side, the IP gap is too tight.","ko":"설계 측면에서, 인스트루먼트 패널 간극이 너무 좁습니다."},{"sp":"B","en":"Could you clarify that point?","ko":"그 부분을 좀 더 설명해 주시겠어요?"},{"sp":"A","en":"Sure. The current gap risks rattling noise.","ko":"네. 현재 간극은 잡소리 위험이 있습니다."},{"sp":"B","en":"That's a good point. We should review it.","ko":"좋은 지적이십니다. 검토해야겠네요."},{"sp":"A","en":"Let me make sure I understand the next step.","ko":"다음 단계를 제대로 이해했는지 확인하겠습니다."},{"sp":"B","en":"We'll update the drawing and circulate it.","ko":"도면을 수정해서 공유하겠습니다."}],"vocab":[{"t":"jump in","ko":"(대화에) 끼어들다"},{"t":"add","ko":"덧붙이다, 추가하다"},{"t":"clarify","ko":"명확히 설명하다"},{"t":"gap","ko":"간극, 틈"},{"t":"rattling noise","ko":"잡소리, 덜컥거리는 소음"},{"t":"circulate","ko":"공유하다, 회람하다"},{"t":"come back to","ko":"~로 돌아가다"}],"drill":[{"ko":"여기서 한 가지 덧붙여도 될까요?","en":"May I add something here?"},{"ko":"잠깐 끼어들어도 될까요?","en":"If I could just jump in?"},{"ko":"그 부분을 좀 더 설명해 주시겠어요?","en":"Could you clarify that point?"},{"ko":"좋은 지적이십니다.","en":"That's a good point."},{"ko":"제가 제대로 이해했는지 확인하겠습니다.","en":"Let me make sure I understand."}],"tip":"회의에서 발언 전 'May I add...'로 한 박자 양해를 구하면 자연스럽게 발언권을 얻습니다. 침묵보다 짧은 한마디라도 기여하는 것이 임원 후보로서의 존재감을 키웁니다."},{"n":12,"title":"의견 제시하기","scene":"내장 설계 방향에 대해 회의에서 본인의 의견과 근거를 제시하는 상황입니다.","goal":"근거를 들어 자신의 의견을 논리적으로 제시할 수 있습니다.","expressions":[{"en":"In my opinion, we should go with option B.","ko":"제 생각에는 B안으로 가야 합니다."},{"en":"The main reason is cost and durability.","ko":"주된 이유는 비용과 내구성입니다."},{"en":"From a design standpoint, this works better.","ko":"설계 관점에서 이것이 더 낫습니다."},{"en":"I believe this approach reduces risk.","ko":"이 방식이 위험을 줄인다고 생각합니다."},{"en":"Based on our test data,","ko":"저희 시험 데이터를 근거로 하면,"},{"en":"I'd suggest we revisit the material choice.","ko":"소재 선택을 다시 검토할 것을 제안합니다."},{"en":"There are a couple of points to consider.","ko":"고려할 점이 몇 가지 있습니다."},{"en":"My recommendation would be to test first.","ko":"제 권고는 먼저 시험해 보는 것입니다."}],"dialogue":[{"sp":"A","en":"In my opinion, we should go with option B.","ko":"제 생각에는 B안으로 가야 합니다."},{"sp":"B","en":"Why is that?","ko":"이유가 무엇인가요?"},{"sp":"A","en":"The main reason is cost and durability.","ko":"주된 이유는 비용과 내구성입니다."},{"sp":"B","en":"But option A looks better, doesn't it?","ko":"하지만 A안이 더 보기 좋지 않나요?"},{"sp":"A","en":"From a design standpoint, B works better for the door trim.","ko":"설계 관점에서, B가 도어 트림에 더 적합합니다."},{"sp":"B","en":"Do you have data to support that?","ko":"그걸 뒷받침할 데이터가 있나요?"},{"sp":"A","en":"Yes. Based on our test data, B passed the wear test.","ko":"네. 저희 시험 데이터에 따르면 B가 마모 시험을 통과했습니다."},{"sp":"B","en":"Understood. Let's move forward with B then.","ko":"알겠습니다. 그럼 B안으로 진행합시다."}],"vocab":[{"t":"in my opinion","ko":"제 생각에는"},{"t":"durability","ko":"내구성"},{"t":"standpoint","ko":"관점, 입장"},{"t":"approach","ko":"방식, 접근법"},{"t":"test data","ko":"시험 데이터"},{"t":"wear test","ko":"마모 시험"},{"t":"recommendation","ko":"권고, 추천"}],"drill":[{"ko":"제 생각에는 B안으로 가야 합니다.","en":"In my opinion, we should go with option B."},{"ko":"주된 이유는 비용과 내구성입니다.","en":"The main reason is cost and durability."},{"ko":"설계 관점에서 이것이 더 낫습니다.","en":"From a design standpoint, this works better."},{"ko":"저희 시험 데이터를 근거로 하면,","en":"Based on our test data,"},{"ko":"고려할 점이 몇 가지 있습니다.","en":"There are a couple of points to consider."}],"tip":"의견은 '주장 + 근거' 한 묶음으로 말하세요. 'In my opinion... because...' 구조는 영어가 완벽하지 않아도 논리적인 사람으로 보이게 하며, 임원 회의에서 가장 강력한 무기입니다."},{"n":13,"title":"동의와 반대 표현","scene":"회의에서 동료나 협력사 제안에 동의하거나, 정중하게 반대 의견을 내는 상황입니다.","goal":"부드럽게 동의하고 무례하지 않게 반대하는 표현을 구사할 수 있습니다.","expressions":[{"en":"I completely agree.","ko":"전적으로 동의합니다."},{"en":"That makes sense to me.","ko":"그 말씀 일리가 있습니다."},{"en":"I see your point, but I have a concern.","ko":"말씀은 이해하지만, 우려되는 점이 있습니다."},{"en":"I'm afraid I disagree.","ko":"죄송하지만 저는 다르게 생각합니다."},{"en":"I partly agree, however,","ko":"부분적으로는 동의하지만, 그러나"},{"en":"Could we consider another option?","ko":"다른 방안을 검토해 볼 수 있을까요?"},{"en":"That's true, but we should also think about cost.","ko":"맞는 말씀이지만, 비용도 함께 고려해야 합니다."},{"en":"I'm not sure that's the best approach.","ko":"그것이 최선의 방법인지 확신이 서지 않습니다."}],"dialogue":[{"sp":"A","en":"I think we should use the premium material.","ko":"고급 소재를 써야 한다고 생각합니다."},{"sp":"B","en":"I completely agree on quality.","ko":"품질 면에서는 전적으로 동의합니다."},{"sp":"A","en":"Good. So let's go with it.","ko":"좋네요. 그럼 그걸로 가시죠."},{"sp":"B","en":"I see your point, but I have a concern about cost.","ko":"말씀은 이해하지만, 비용이 우려됩니다."},{"sp":"A","en":"That's true, but durability matters too.","ko":"맞는 말씀이지만, 내구성도 중요합니다."},{"sp":"B","en":"Could we consider another option in between?","ko":"그 중간의 다른 방안을 검토해 볼 수 있을까요?"},{"sp":"A","en":"That makes sense to me. Let's compare both.","ko":"일리가 있습니다. 둘 다 비교해 봅시다."},{"sp":"B","en":"Great, I'll prepare the numbers.","ko":"좋습니다, 제가 수치를 준비하겠습니다."}],"vocab":[{"t":"agree","ko":"동의하다"},{"t":"make sense","ko":"일리가 있다, 말이 되다"},{"t":"concern","ko":"우려, 걱정"},{"t":"disagree","ko":"동의하지 않다"},{"t":"partly","ko":"부분적으로"},{"t":"option","ko":"선택지, 방안"},{"t":"in between","ko":"그 중간의"}],"drill":[{"ko":"전적으로 동의합니다.","en":"I completely agree."},{"ko":"말씀은 이해하지만, 우려되는 점이 있습니다.","en":"I see your point, but I have a concern."},{"ko":"죄송하지만 저는 다르게 생각합니다.","en":"I'm afraid I disagree."},{"ko":"다른 방안을 검토해 볼 수 있을까요?","en":"Could we consider another option?"},{"ko":"그것이 최선의 방법인지 확신이 서지 않습니다.","en":"I'm not sure that's the best approach."}],"tip":"영어로 반대할 때는 'I see your point, but...'처럼 먼저 상대를 인정하고 반론을 펴세요. 직설적인 'No, you're wrong'은 관계를 해치며, 외교적 반대가 더 설득력 있습니다."},{"n":14,"title":"진행 상황 보고하기","scene":"프로젝트 정기 회의에서 본인이 맡은 설계 업무의 진행 상황을 보고하는 상황입니다.","goal":"현재 상태, 완료 사항, 남은 일정을 구조적으로 보고할 수 있습니다.","expressions":[{"en":"Let me give you a quick update.","ko":"간단히 진행 상황을 보고드리겠습니다."},{"en":"We're on track to finish by next week.","ko":"다음 주까지 완료할 수 있는 일정입니다."},{"en":"The design phase is now complete.","ko":"설계 단계는 현재 완료되었습니다."},{"en":"We're slightly behind schedule.","ko":"일정이 조금 지연되고 있습니다."},{"en":"The next step is the prototype review.","ko":"다음 단계는 시제품 검토입니다."},{"en":"There's one issue I need to flag.","ko":"한 가지 짚고 넘어가야 할 문제가 있습니다."},{"en":"So far, everything is going smoothly.","ko":"지금까지는 모든 것이 순조롭습니다."},{"en":"I'll keep you posted.","ko":"계속 업데이트해 드리겠습니다."}],"dialogue":[{"sp":"A","en":"Let me give you a quick update on the console.","ko":"콘솔 건 간단히 진행 상황을 보고드리겠습니다."},{"sp":"B","en":"Sure, where do we stand?","ko":"네, 현재 어디까지 됐나요?"},{"sp":"A","en":"The design phase is now complete.","ko":"설계 단계는 현재 완료되었습니다."},{"sp":"B","en":"Good. Are we on schedule?","ko":"좋네요. 일정대로 가고 있나요?"},{"sp":"A","en":"We're slightly behind, but we'll catch up.","ko":"조금 지연되고 있지만, 따라잡을 것입니다."},{"sp":"B","en":"Any issues I should know about?","ko":"제가 알아야 할 문제가 있나요?"},{"sp":"A","en":"There's one issue I need to flag about the supplier.","ko":"협력사 관련해 한 가지 짚고 넘어가야 할 문제가 있습니다."},{"sp":"B","en":"Let's discuss it. Keep me posted.","ko":"논의해 봅시다. 계속 보고해 주세요."}],"vocab":[{"t":"update","ko":"진행 상황 보고"},{"t":"on track","ko":"계획대로 진행 중인"},{"t":"phase","ko":"단계"},{"t":"behind schedule","ko":"일정보다 지연된"},{"t":"prototype","ko":"시제품"},{"t":"flag","ko":"(문제를) 짚다, 제기하다"},{"t":"keep you posted","ko":"계속 알려 주다"}],"drill":[{"ko":"간단히 진행 상황을 보고드리겠습니다.","en":"Let me give you a quick update."},{"ko":"다음 주까지 완료할 수 있는 일정입니다.","en":"We're on track to finish by next week."},{"ko":"일정이 조금 지연되고 있습니다.","en":"We're slightly behind schedule."},{"ko":"다음 단계는 시제품 검토입니다.","en":"The next step is the prototype review."},{"ko":"계속 업데이트해 드리겠습니다.","en":"I'll keep you posted."}],"tip":"보고는 '완료 → 진행 중 → 이슈 → 다음 단계' 순서로 구조화하세요. 나쁜 소식일수록 먼저, 명확히 'flag'하는 사람이 임원의 신뢰를 얻습니다. 문제를 숨기면 더 큰 문제가 됩니다."},{"n":15,"title":"업무 지시 이해하고 확인하기","scene":"상사나 OEM 담당자로부터 업무 지시를 받고 내용을 정확히 확인하는 상황입니다.","goal":"지시 내용을 되짚어 확인하고 모호한 부분을 명확히 질문할 수 있습니다.","expressions":[{"en":"Just to confirm, you'd like me to revise the drawing.","ko":"확인차 여쭙는데, 도면을 수정하라는 말씀이시죠."},{"en":"So the deadline is this Friday, correct?","ko":"그러니까 마감은 이번 주 금요일, 맞나요?"},{"en":"Could you clarify what you mean by that?","ko":"그게 무슨 뜻인지 명확히 해 주시겠어요?"},{"en":"Let me repeat it back to make sure.","ko":"확실히 하기 위해 제가 다시 말해 보겠습니다."},{"en":"Should I prioritize this over the other task?","ko":"이것을 다른 업무보다 우선해야 하나요?"},{"en":"Who should I coordinate with?","ko":"누구와 협의해야 하나요?"},{"en":"I'll get started right away.","ko":"바로 시작하겠습니다."},{"en":"I'll send a draft for your review first.","ko":"먼저 초안을 검토용으로 보내드리겠습니다."}],"dialogue":[{"sp":"A","en":"Just to confirm, you'd like me to revise the IP drawing.","ko":"확인차 여쭙는데, 인스트루먼트 패널 도면을 수정하라는 말씀이시죠."},{"sp":"B","en":"Yes, the upper section mainly.","ko":"네, 주로 윗부분입니다."},{"sp":"A","en":"Could you clarify what you mean by the upper section?","ko":"윗부분이 무슨 뜻인지 명확히 해 주시겠어요?"},{"sp":"B","en":"The area around the display.","ko":"디스플레이 주변 영역입니다."},{"sp":"A","en":"Understood. So the deadline is this Friday, correct?","ko":"알겠습니다. 그러니까 마감은 이번 주 금요일, 맞나요?"},{"sp":"B","en":"Correct. And coordinate with the supplier.","ko":"맞습니다. 그리고 협력사와 협의하세요."},{"sp":"A","en":"Will do. I'll send a draft for your review first.","ko":"그러겠습니다. 먼저 초안을 검토용으로 보내드리겠습니다."},{"sp":"B","en":"Perfect, thank you.","ko":"좋습니다, 감사합니다."}],"vocab":[{"t":"confirm","ko":"확인하다"},{"t":"revise","ko":"수정하다"},{"t":"deadline","ko":"마감 기한"},{"t":"clarify","ko":"명확히 하다"},{"t":"prioritize","ko":"우선시하다"},{"t":"coordinate with","ko":"~와 협의하다, 조율하다"},{"t":"draft","ko":"초안"}],"drill":[{"ko":"확인차 여쭙는데, 도면을 수정하라는 말씀이시죠.","en":"Just to confirm, you'd like me to revise the drawing."},{"ko":"그러니까 마감은 이번 주 금요일, 맞나요?","en":"So the deadline is this Friday, correct?"},{"ko":"그게 무슨 뜻인지 명확히 해 주시겠어요?","en":"Could you clarify what you mean by that?"},{"ko":"이것을 다른 업무보다 우선해야 하나요?","en":"Should I prioritize this over the other task?"},{"ko":"바로 시작하겠습니다.","en":"I'll get started right away."}],"tip":"지시를 받으면 'Just to confirm...'으로 핵심을 되짚으세요. 5초의 확인이 며칠의 재작업을 막습니다. 외국어 환경에서 이 습관은 실수 방지와 신뢰 확보의 핵심입니다."},{"n":16,"title":"이메일로 업무 요청하기","scene":"협력사에 설계 변경 검토를 이메일로 정식 요청하는 상황입니다.","goal":"요청 목적, 구체적 내용, 기한을 갖춘 업무 요청 이메일을 쓸 수 있습니다.","expressions":[{"en":"I'm reaching out to request a design review.","ko":"설계 검토를 요청드리고자 연락드립니다."},{"en":"Could you please update the drawing accordingly?","ko":"그에 맞춰 도면을 수정해 주실 수 있을까요?"},{"en":"We'd need this by end of next week.","ko":"다음 주말까지 필요합니다."},{"en":"Please find the details below.","ko":"자세한 내용은 아래를 참고해 주세요."},{"en":"Let me know if anything is unclear.","ko":"불분명한 점이 있으면 알려 주세요."},{"en":"I've attached the revised spec.","ko":"수정된 사양서를 첨부했습니다."},{"en":"Would it be possible to expedite this?","ko":"이것을 빠르게 처리해 주실 수 있을까요?"},{"en":"Thank you in advance for your support.","ko":"지원해 주셔서 미리 감사드립니다."}],"dialogue":[{"sp":"A","en":"Hi Tom, I'm reaching out to request a design review.","ko":"안녕하세요 톰 씨, 설계 검토를 요청드리고자 연락드립니다."},{"sp":"B","en":"Sure, what needs reviewing?","ko":"네, 무엇을 검토하면 될까요?"},{"sp":"A","en":"The door trim clip. I've attached the revised spec.","ko":"도어 트림 클립입니다. 수정된 사양서를 첨부했습니다."},{"sp":"B","en":"Got it. When do you need it?","ko":"확인했습니다. 언제까지 필요하세요?"},{"sp":"A","en":"We'd need this by end of next week.","ko":"다음 주말까지 필요합니다."},{"sp":"B","en":"That should be fine.","ko":"그 정도면 괜찮을 것 같습니다."},{"sp":"A","en":"Would it be possible to expedite this if needed?","ko":"필요시 빠르게 처리해 주실 수 있을까요?"},{"sp":"B","en":"We'll do our best. Thanks for the details.","ko":"최선을 다하겠습니다. 상세 내용 감사합니다."}],"vocab":[{"t":"reach out","ko":"연락하다"},{"t":"accordingly","ko":"그에 맞춰"},{"t":"by end of next week","ko":"다음 주말까지"},{"t":"details","ko":"세부 사항"},{"t":"attach","ko":"첨부하다"},{"t":"expedite","ko":"신속히 처리하다"},{"t":"in advance","ko":"미리"}],"drill":[{"ko":"설계 검토를 요청드리고자 연락드립니다.","en":"I'm reaching out to request a design review."},{"ko":"그에 맞춰 도면을 수정해 주실 수 있을까요?","en":"Could you please update the drawing accordingly?"},{"ko":"다음 주말까지 필요합니다.","en":"We'd need this by end of next week."},{"ko":"수정된 사양서를 첨부했습니다.","en":"I've attached the revised spec."},{"ko":"지원해 주셔서 미리 감사드립니다.","en":"Thank you in advance for your support."}],"tip":"업무 요청 메일은 '무엇을, 왜, 언제까지'를 한눈에 보이게 쓰세요. 기한을 명확히 못 박되 'if possible'로 여지를 두면, 협력사가 부담 없이 협조하게 됩니다."},{"n":17,"title":"회의록 작성과 공유","scene":"글로벌 설계 회의 후 결정 사항과 후속 조치를 정리해 참석자들에게 공유하는 상황입니다.","goal":"회의록의 결정 사항, 담당자, 기한을 명확한 영어로 정리하고 공유할 수 있습니다.","expressions":[{"en":"Here are the meeting minutes.","ko":"회의록을 공유드립니다."},{"en":"To summarize today's discussion,","ko":"오늘 논의를 요약하자면,"},{"en":"We agreed on the following points.","ko":"다음 사항에 합의했습니다."},{"en":"The action items are listed below.","ko":"후속 조치 사항은 아래에 정리되어 있습니다."},{"en":"Jihoon will revise the drawing by Friday.","ko":"지훈이 금요일까지 도면을 수정하기로 했습니다."},{"en":"Please review and let me know if anything is missing.","ko":"검토하시고 빠진 내용이 있으면 알려 주세요."},{"en":"The next meeting is scheduled for next Monday.","ko":"다음 회의는 다음 주 월요일로 예정되어 있습니다."},{"en":"Please reply to confirm your action items.","ko":"본인의 조치 사항을 확인해 회신해 주세요."}],"dialogue":[{"sp":"A","en":"Here are the meeting minutes from today.","ko":"오늘 회의록을 공유드립니다."},{"sp":"B","en":"Thanks. Could you summarize the key points?","ko":"감사합니다. 핵심 사항을 요약해 주시겠어요?"},{"sp":"A","en":"We agreed on the following points about the IP gap.","ko":"인스트루먼트 패널 간극에 대해 다음 사항에 합의했습니다."},{"sp":"B","en":"Good. And the action items?","ko":"좋네요. 후속 조치 사항은요?"},{"sp":"A","en":"I'll revise the drawing by Friday, the supplier will retest.","ko":"제가 금요일까지 도면을 수정하고, 협력사가 재시험합니다."},{"sp":"B","en":"Clear. When is the next meeting?","ko":"명확하네요. 다음 회의는 언제인가요?"},{"sp":"A","en":"It's scheduled for next Monday.","ko":"다음 주 월요일로 예정되어 있습니다."},{"sp":"B","en":"Great. Please reply to confirm your action items, everyone.","ko":"좋습니다. 모두 본인 조치 사항을 확인해 회신해 주세요."}],"vocab":[{"t":"meeting minutes","ko":"회의록"},{"t":"summarize","ko":"요약하다"},{"t":"agree on","ko":"~에 합의하다"},{"t":"action item","ko":"후속 조치 사항"},{"t":"revise","ko":"수정하다"},{"t":"scheduled for","ko":"~로 예정된"},{"t":"confirm","ko":"확인하다"}],"drill":[{"ko":"회의록을 공유드립니다.","en":"Here are the meeting minutes."},{"ko":"오늘 논의를 요약하자면,","en":"To summarize today's discussion,"},{"ko":"다음 사항에 합의했습니다.","en":"We agreed on the following points."},{"ko":"후속 조치 사항은 아래에 정리되어 있습니다.","en":"The action items are listed below."},{"ko":"다음 회의는 다음 주 월요일로 예정되어 있습니다.","en":"The next meeting is scheduled for next Monday."}],"tip":"회의록의 핵심은 '결정 사항 + 담당자 + 기한'입니다. 누가 언제까지 무엇을 하는지 명시하면 회의가 행동으로 이어집니다. 회의록을 잘 쓰는 사람이 프로젝트를 장악합니다."},{"n":18,"title":"일정·마감 협의","scene":"협력사와 설계 납기를 두고 일정이 빠듯해 마감을 협의하고 조율하는 상황입니다.","goal":"마감 조정을 요청하거나 협상하고 대안을 제시할 수 있습니다.","expressions":[{"en":"The timeline is quite tight.","ko":"일정이 상당히 빠듯합니다."},{"en":"Would it be possible to extend the deadline?","ko":"마감을 연장할 수 있을까요?"},{"en":"Can we push it back by a few days?","ko":"며칠 정도 늦출 수 있을까요?"},{"en":"We can deliver part of it first.","ko":"우선 일부를 먼저 납품할 수 있습니다."},{"en":"What's the latest you can accept?","ko":"받으실 수 있는 가장 늦은 기한은 언제인가요?"},{"en":"Let's find a realistic timeline.","ko":"현실적인 일정을 찾아봅시다."},{"en":"I understand it's urgent on your end.","ko":"그쪽에서 급한 사정인 것 이해합니다."},{"en":"Let's agree on a firm deadline.","ko":"확정 마감일을 정합시다."}],"dialogue":[{"sp":"A","en":"Honestly, the timeline is quite tight for us.","ko":"솔직히 저희에게 일정이 상당히 빠듯합니다."},{"sp":"B","en":"I understand. What are you suggesting?","ko":"이해합니다. 어떻게 제안하시나요?"},{"sp":"A","en":"Would it be possible to extend the deadline by a few days?","ko":"마감을 며칠 연장할 수 있을까요?"},{"sp":"B","en":"It's urgent on our end, though.","ko":"그런데 저희 쪽은 급합니다."},{"sp":"A","en":"I understand. We can deliver part of it first.","ko":"이해합니다. 우선 일부를 먼저 납품할 수 있습니다."},{"sp":"B","en":"That could work. What's realistic for full delivery?","ko":"그건 괜찮겠네요. 전체 납품은 언제가 현실적인가요?"},{"sp":"A","en":"Let's agree on next Wednesday as a firm deadline.","ko":"다음 주 수요일을 확정 마감일로 정합시다."},{"sp":"B","en":"Agreed. Let's lock that in.","ko":"동의합니다. 그렇게 확정하죠."}],"vocab":[{"t":"timeline","ko":"일정, 시간 계획"},{"t":"tight","ko":"빠듯한, 촉박한"},{"t":"extend","ko":"연장하다"},{"t":"push back","ko":"(일정을) 미루다"},{"t":"urgent","ko":"급한, 긴급한"},{"t":"firm deadline","ko":"확정 마감일"},{"t":"lock in","ko":"확정하다, 고정하다"}],"drill":[{"ko":"일정이 상당히 빠듯합니다.","en":"The timeline is quite tight."},{"ko":"마감을 연장할 수 있을까요?","en":"Would it be possible to extend the deadline?"},{"ko":"우선 일부를 먼저 납품할 수 있습니다.","en":"We can deliver part of it first."},{"ko":"현실적인 일정을 찾아봅시다.","en":"Let's find a realistic timeline."},{"ko":"확정 마감일을 정합시다.","en":"Let's agree on a firm deadline."}],"tip":"마감 협상에서는 무조건 거절하기보다 '부분 납품' 같은 대안을 제시하세요. 상대 사정을 인정하면서 현실적 안을 내놓는 사람이 협상에서 신뢰와 주도권을 모두 얻습니다."},{"n":19,"title":"사내 메신저·짧은 소통","scene":"사내 메신저로 동료에게 빠르게 질문하거나 상태를 공유하는 짧은 소통 상황입니다.","goal":"메신저에 어울리는 간결하고 자연스러운 영어 메시지를 주고받을 수 있습니다.","expressions":[{"en":"Quick question — do you have the latest file?","ko":"간단한 질문인데, 최신 파일 가지고 계세요?"},{"en":"Got it, thanks!","ko":"확인했어요, 감사해요!"},{"en":"Can you take a look when you're free?","ko":"시간 날 때 한번 봐 주실 수 있어요?"},{"en":"I'm on it.","ko":"지금 하고 있어요."},{"en":"Will do, give me 10 minutes.","ko":"할게요, 10분만 주세요."},{"en":"Heads up — the meeting moved to 4.","ko":"참고로, 회의가 4시로 옮겨졌어요."},{"en":"No rush, whenever you can.","ko":"급하지 않아요, 편하실 때요."},{"en":"Let me check and get back to you.","ko":"확인하고 다시 알려드릴게요."}],"dialogue":[{"sp":"A","en":"Quick question — do you have the latest IP file?","ko":"간단한 질문인데, 최신 인스트루먼트 패널 파일 가지고 계세요?"},{"sp":"B","en":"Let me check and get back to you.","ko":"확인하고 다시 알려드릴게요."},{"sp":"A","en":"No rush, whenever you can.","ko":"급하지 않아요, 편하실 때요."},{"sp":"B","en":"Found it. Sending now.","ko":"찾았어요. 지금 보낼게요."},{"sp":"A","en":"Got it, thanks! Can you take a look at page 3?","ko":"확인했어요, 감사해요! 3페이지 한번 봐 주실 수 있어요?"},{"sp":"B","en":"Will do, give me 10 minutes.","ko":"할게요, 10분만 주세요."},{"sp":"A","en":"Heads up — the meeting moved to 4.","ko":"참고로, 회의가 4시로 옮겨졌어요."},{"sp":"B","en":"Thanks for the heads up.","ko":"알려줘서 고마워요."}],"vocab":[{"t":"quick question","ko":"간단한 질문"},{"t":"take a look","ko":"한번 보다"},{"t":"I'm on it","ko":"지금 하고 있어요"},{"t":"heads up","ko":"사전 알림, 참고로"},{"t":"no rush","ko":"급하지 않아요"},{"t":"get back to you","ko":"다시 알려주다"},{"t":"will do","ko":"그렇게 할게요"}],"drill":[{"ko":"간단한 질문인데, 최신 파일 가지고 계세요?","en":"Quick question — do you have the latest file?"},{"ko":"시간 날 때 한번 봐 주실 수 있어요?","en":"Can you take a look when you're free?"},{"ko":"지금 하고 있어요.","en":"I'm on it."},{"ko":"참고로, 회의가 4시로 옮겨졌어요.","en":"Heads up — the meeting moved to 4."},{"ko":"확인하고 다시 알려드릴게요.","en":"Let me check and get back to you."}],"tip":"메신저는 이메일보다 짧고 캐주얼해도 됩니다. 'Will do' 'On it' 'Heads up' 같은 짧은 표현을 익히면 빠른 소통이 가능하고, 글로벌 팀과의 거리감도 줄어듭니다."},{"n":20,"title":"부서 간 협조 요청","scene":"내장설계팀에서 설비나 품질 등 타 부서에 협조를 요청하고 조율하는 상황입니다.","goal":"타 부서에 협조를 정중히 요청하고 역할과 일정을 조율할 수 있습니다.","expressions":[{"en":"We'd like to ask for your team's support.","ko":"귀 팀의 협조를 요청드리고자 합니다."},{"en":"This involves both our departments.","ko":"이 건은 두 부서 모두와 관련됩니다."},{"en":"Could your team handle the testing side?","ko":"시험 부분을 귀 팀에서 맡아 주실 수 있을까요?"},{"en":"We need to align on the timeline.","ko":"일정을 맞출 필요가 있습니다."},{"en":"Let's clarify who owns what.","ko":"누가 무엇을 담당할지 명확히 합시다."},{"en":"I'll loop in the quality team.","ko":"품질팀도 함께 참여시키겠습니다."},{"en":"Your input would be really helpful.","ko":"귀 팀의 의견이 큰 도움이 될 것입니다."},{"en":"Let's set up a joint meeting.","ko":"합동 회의를 잡읍시다."}],"dialogue":[{"sp":"A","en":"Hi, we'd like to ask for your team's support on the IP project.","ko":"안녕하세요, 인스트루먼트 패널 프로젝트에 귀 팀의 협조를 요청드리고자 합니다."},{"sp":"B","en":"Sure, what do you need from us?","ko":"네, 저희에게 무엇이 필요하세요?"},{"sp":"A","en":"Could your team handle the testing side?","ko":"시험 부분을 귀 팀에서 맡아 주실 수 있을까요?"},{"sp":"B","en":"We can, but we need to align on the timeline.","ko":"가능합니다만, 일정을 맞춰야 합니다."},{"sp":"A","en":"Agreed. Let's clarify who owns what.","ko":"동의합니다. 누가 무엇을 담당할지 명확히 합시다."},{"sp":"B","en":"Good idea. Should we involve quality too?","ko":"좋은 생각입니다. 품질팀도 참여시킬까요?"},{"sp":"A","en":"Yes, I'll loop in the quality team. Let's set up a joint meeting.","ko":"네, 품질팀도 함께 참여시키겠습니다. 합동 회의를 잡읍시다."},{"sp":"B","en":"Perfect. Send me a few time slots.","ko":"좋습니다. 가능한 시간대 몇 개 보내 주세요."}],"vocab":[{"t":"support","ko":"협조, 지원"},{"t":"department","ko":"부서"},{"t":"align on","ko":"~에 대해 의견을 맞추다"},{"t":"own","ko":"(업무를) 담당하다, 책임지다"},{"t":"loop in","ko":"(논의에) 참여시키다"},{"t":"input","ko":"의견, 입력"},{"t":"joint meeting","ko":"합동 회의"}],"drill":[{"ko":"귀 팀의 협조를 요청드리고자 합니다.","en":"We'd like to ask for your team's support."},{"ko":"시험 부분을 귀 팀에서 맡아 주실 수 있을까요?","en":"Could your team handle the testing side?"},{"ko":"일정을 맞출 필요가 있습니다.","en":"We need to align on the timeline."},{"ko":"누가 무엇을 담당할지 명확히 합시다.","en":"Let's clarify who owns what."},{"ko":"합동 회의를 잡읍시다.","en":"Let's set up a joint meeting."}],"tip":"부서 간 협조는 '담당 범위(who owns what)'를 초기에 명확히 하는 것이 성패를 가릅니다. 책임 경계를 분명히 하고 핵심 인원을 'loop in'하는 조율 능력은 임원으로 가는 핵심 역량입니다."},{"n":21,"title":"도면·드로잉 설명하기","scene":"글로벌 OEM 엔지니어에게 인스트루먼트 패널 2D 도면을 화면 공유로 설명하시는 상황입니다.","goal":"도면의 뷰, 단면, 주요 기준을 영어로 명확히 짚어 설명할 수 있습니다.","expressions":[{"en":"Let me walk you through this drawing.","ko":"이 도면을 차근차근 설명드리겠습니다."},{"en":"This is the front view, and section A-A is on the right.","ko":"이것이 정면도이고, A-A 단면은 오른쪽에 있습니다."},{"en":"The datum is set at the centerline of the IP.","ko":"기준은 IP 중심선에 설정되어 있습니다."},{"en":"If you look at the detail callout, you'll see the snap-fit geometry.","ko":"상세 콜아웃을 보시면 스냅핏 형상이 보일 겁니다."},{"en":"The hidden lines indicate the rib structure underneath.","ko":"숨은선은 안쪽의 리브 구조를 나타냅니다."},{"en":"This dimension is referenced from the mounting boss.","ko":"이 치수는 마운팅 보스를 기준으로 잡았습니다."},{"en":"The arrow shows the assembly direction for this part.","ko":"화살표는 이 부품의 조립 방향을 보여줍니다."},{"en":"Please refer to the revision block in the bottom-right corner.","ko":"오른쪽 하단의 개정 블록을 참고해 주십시오."}],"dialogue":[{"sp":"A","en":"Thanks for joining. Let me walk you through the latest IP drawing.","ko":"참석해 주셔서 감사합니다. 최신 IP 도면을 설명드리겠습니다."},{"sp":"B","en":"Great. Can you start with the overall view?","ko":"좋습니다. 전체 뷰부터 시작해 주시겠어요?"},{"sp":"A","en":"Sure. This is the front view, and section A-A on the right shows the cross-section through the cluster opening.","ko":"네. 이것이 정면도이고, 오른쪽 A-A 단면은 클러스터 개구부를 지나는 단면을 보여줍니다."},{"sp":"B","en":"What's the datum reference here?","ko":"여기 기준점은 어디인가요?"},{"sp":"A","en":"The datum is set at the centerline of the IP, and all critical dimensions are referenced from it.","ko":"기준은 IP 중심선에 설정되어 있고, 모든 주요 치수가 거기서부터 참조됩니다."},{"sp":"B","en":"And the snap-fit detail you mentioned?","ko":"그리고 말씀하신 스냅핏 상세는요?"},{"sp":"A","en":"If you look at detail callout C, you'll see the snap-fit geometry with the lead-in chamfer.","ko":"상세 콜아웃 C를 보시면 진입 챔퍼가 있는 스냅핏 형상이 보일 겁니다."},{"sp":"B","en":"Clear. Let's review the revision history next.","ko":"명확하네요. 다음으로 개정 이력을 검토하시죠."}],"vocab":[{"t":"front view","ko":"정면도"},{"t":"section A-A","ko":"A-A 단면도"},{"t":"datum","ko":"기준(데이텀)"},{"t":"detail callout","ko":"상세 콜아웃"},{"t":"hidden line","ko":"숨은선"},{"t":"mounting boss","ko":"마운팅 보스"},{"t":"revision block","ko":"개정 블록"}],"drill":[{"ko":"이 도면을 차근차근 설명드리겠습니다.","en":"Let me walk you through this drawing."},{"ko":"기준은 IP 중심선에 설정되어 있습니다.","en":"The datum is set at the centerline of the IP."},{"ko":"숨은선은 안쪽의 리브 구조를 나타냅니다.","en":"The hidden lines indicate the rib structure underneath."},{"ko":"상세 콜아웃을 보시면 스냅핏 형상이 보입니다.","en":"If you look at the detail callout, you'll see the snap-fit geometry."},{"ko":"오른쪽 하단의 개정 블록을 참고해 주십시오.","en":"Please refer to the revision block in the bottom-right corner."}],"tip":"도면 설명은 '전체 뷰 → 단면 → 상세' 순서로 좁혀 가면 상대가 따라오기 쉽습니다. 'walk you through'는 단계적 설명을 시작할 때 가장 자연스러운 표현입니다."},{"n":22,"title":"치수·공차·재질 표현","scene":"도어 트림 부품의 치수와 공차, 소재를 Tier-1 품질 담당자와 검토하시는 상황입니다.","goal":"치수, 공차, 재질 사양을 정확한 산업 용어로 표현할 수 있습니다.","expressions":[{"en":"The nominal dimension is 12.5 mm with a tolerance of plus or minus 0.2.","ko":"기준 치수는 12.5mm이고 공차는 ±0.2입니다."},{"en":"This is a critical-to-quality dimension, so we tightened the tolerance.","ko":"이건 품질 핵심 치수라 공차를 좁혔습니다."},{"en":"The part is molded in talc-filled PP for stiffness.","ko":"이 부품은 강성을 위해 탤크 강화 PP로 성형됩니다."},{"en":"We're calling out a flatness of 0.5 over this surface.","ko":"이 면에 대해 평면도 0.5를 지정하고 있습니다."},{"en":"The grain texture is VW K30 on the show surface.","ko":"표면 그레인 텍스처는 가시면에 VW K30입니다."},{"en":"Gap and flush to the adjacent panel should be 1.0 mm, plus or minus 0.5.","ko":"인접 패널과의 단차·간극은 1.0mm, ±0.5여야 합니다."},{"en":"This datum scheme uses a 3-2-1 locating system.","ko":"이 기준 체계는 3-2-1 위치결정 방식을 씁니다."},{"en":"The wall thickness is 2.5 mm to avoid sink marks.","ko":"싱크 마크를 피하려고 살두께는 2.5mm로 했습니다."}],"dialogue":[{"sp":"A","en":"Let's go over the dimensions on the door trim upper.","ko":"도어 트림 어퍼의 치수를 함께 보시죠."},{"sp":"B","en":"Which one is the most critical?","ko":"어느 게 가장 중요한가요?"},{"sp":"A","en":"This mounting hole. The nominal is 8.0 mm with a tolerance of plus or minus 0.1, since it's critical-to-quality.","ko":"이 장착 홀입니다. 품질 핵심 치수라 기준이 8.0mm에 공차가 ±0.1입니다."},{"sp":"B","en":"Understood. What material are we running?","ko":"알겠습니다. 소재는 무엇으로 가나요?"},{"sp":"A","en":"The part is molded in talc-filled PP for stiffness, with a VW K30 grain on the show surface.","ko":"강성을 위해 탤크 강화 PP로 성형하고, 가시면에는 VW K30 그레인을 적용합니다."},{"sp":"B","en":"And the fit to the armrest?","ko":"암레스트와의 정합은요?"},{"sp":"A","en":"Gap and flush should be 1.0 mm, plus or minus 0.5, controlled with a 3-2-1 locating scheme.","ko":"단차·간극은 1.0mm ±0.5이고, 3-2-1 위치결정 방식으로 관리합니다."},{"sp":"B","en":"Good. Let's confirm wall thickness to prevent sink marks.","ko":"좋습니다. 싱크 마크 방지를 위해 살두께를 확인하시죠."}],"vocab":[{"t":"nominal dimension","ko":"기준 치수"},{"t":"tolerance","ko":"공차"},{"t":"critical-to-quality (CTQ)","ko":"품질 핵심(특성)"},{"t":"talc-filled PP","ko":"탤크 강화 PP"},{"t":"grain texture","ko":"그레인 텍스처"},{"t":"gap and flush","ko":"간극과 단차"},{"t":"sink mark","ko":"싱크 마크(수축 자국)"}],"drill":[{"ko":"기준 치수는 12.5mm이고 공차는 ±0.2입니다.","en":"The nominal dimension is 12.5 mm with a tolerance of plus or minus 0.2."},{"ko":"이건 품질 핵심 치수라 공차를 좁혔습니다.","en":"This is a critical-to-quality dimension, so we tightened the tolerance."},{"ko":"이 부품은 강성을 위해 탤크 강화 PP로 성형됩니다.","en":"The part is molded in talc-filled PP for stiffness."},{"ko":"인접 패널과의 단차·간극은 1.0mm, ±0.5여야 합니다.","en":"Gap and flush to the adjacent panel should be 1.0 mm, plus or minus 0.5."},{"ko":"싱크 마크를 피하려고 살두께는 2.5mm로 했습니다.","en":"The wall thickness is 2.5 mm to avoid sink marks."}],"tip":"공차는 'plus or minus 0.2'로 읽고, ±0.2 mm처럼 단위를 함께 말하면 오해가 없습니다. CTQ(critical-to-quality)는 글로벌 품질 회의에서 거의 항상 등장하는 약어입니다."},{"n":23,"title":"내장 부품 명칭 (IP·콘솔·도어트림·시트)","scene":"신규 합류한 해외 동료에게 차량 내장 주요 부품의 영어 명칭을 정리해 설명하시는 상황입니다.","goal":"IP, 콘솔, 도어 트림, 시트의 핵심 부품 명칭을 정확히 영어로 말할 수 있습니다.","expressions":[{"en":"The IP carrier holds the cluster, the HVAC ducts, and the airbag chute.","ko":"IP 캐리어는 클러스터, HVAC 덕트, 에어백 슈트를 잡아 줍니다."},{"en":"The center console includes the armrest, the cup holder, and the shifter bezel.","ko":"센터 콘솔에는 암레스트, 컵홀더, 시프터 베젤이 포함됩니다."},{"en":"The door trim consists of the upper, the map pocket, and the armrest.","ko":"도어 트림은 어퍼, 맵 포켓, 암레스트로 구성됩니다."},{"en":"The seat has a backrest, a cushion, a headrest, and the recliner mechanism.","ko":"시트는 등받이, 쿠션, 헤드레스트, 리클라이너 기구로 이뤄집니다."},{"en":"This is the decorative applique on the IP topper.","ko":"이것이 IP 토퍼 위의 데코 어플리케입니다."},{"en":"The switch pack sits in the door pull handle.","ko":"스위치 팩은 도어 풀 핸들에 들어갑니다."},{"en":"The PAB door is integrated into the IP for the passenger airbag.","ko":"동승석 에어백용 PAB 도어가 IP에 일체화되어 있습니다."},{"en":"The seat bolsters provide lateral support.","ko":"시트 볼스터가 측면 지지를 제공합니다."}],"dialogue":[{"sp":"A","en":"Let me give you a quick map of our interior parts.","ko":"내장 부품을 빠르게 정리해 드리겠습니다."},{"sp":"B","en":"Perfect, I'm still learning the terminology.","ko":"좋아요, 아직 용어를 배우는 중이라서요."},{"sp":"A","en":"Start with the IP. The IP carrier holds the cluster, the HVAC ducts, and the airbag chute.","ko":"IP부터요. IP 캐리어가 클러스터, HVAC 덕트, 에어백 슈트를 잡아 줍니다."},{"sp":"B","en":"And the console?","ko":"콘솔은요?"},{"sp":"A","en":"The center console includes the armrest, the cup holder, and the shifter bezel.","ko":"센터 콘솔에는 암레스트, 컵홀더, 시프터 베젤이 포함됩니다."},{"sp":"B","en":"Got it. How about the door?","ko":"알겠습니다. 도어는요?"},{"sp":"A","en":"The door trim consists of the upper, the map pocket, and the armrest, with the switch pack in the pull handle.","ko":"도어 트림은 어퍼, 맵 포켓, 암레스트로 구성되고, 스위치 팩은 풀 핸들에 들어갑니다."},{"sp":"B","en":"This really helps. Let's cover the seat next time.","ko":"정말 도움이 됩니다. 시트는 다음에 다루죠."}],"vocab":[{"t":"IP carrier","ko":"IP 캐리어(골격)"},{"t":"shifter bezel","ko":"시프터 베젤"},{"t":"map pocket","ko":"맵 포켓(도어 수납)"},{"t":"recliner mechanism","ko":"리클라이너 기구"},{"t":"applique","ko":"어플리케(가니쉬)"},{"t":"PAB door","ko":"동승석 에어백 도어"},{"t":"bolster","ko":"볼스터(측면 지지부)"}],"drill":[{"ko":"IP 캐리어는 클러스터, HVAC 덕트, 에어백 슈트를 잡아 줍니다.","en":"The IP carrier holds the cluster, the HVAC ducts, and the airbag chute."},{"ko":"센터 콘솔에는 암레스트, 컵홀더, 시프터 베젤이 포함됩니다.","en":"The center console includes the armrest, the cup holder, and the shifter bezel."},{"ko":"도어 트림은 어퍼, 맵 포켓, 암레스트로 구성됩니다.","en":"The door trim consists of the upper, the map pocket, and the armrest."},{"ko":"동승석 에어백용 PAB 도어가 IP에 일체화되어 있습니다.","en":"The PAB door is integrated into the IP for the passenger airbag."},{"ko":"시트 볼스터가 측면 지지를 제공합니다.","en":"The seat bolsters provide lateral support."}],"tip":"부품을 나열할 때 'consists of / includes / holds'를 구분해 쓰면 자연스럽습니다. PAB(passenger airbag), HVAC 같은 약어는 풀어서 한 번 설명한 뒤 약어로 쓰면 안전합니다."},{"n":24,"title":"설계 변경(ECN/ECR) 설명","scene":"콘솔 부품의 설계 변경 요청(ECR)을 OEM 변경관리 담당자에게 설명하고 승인을 요청하시는 상황입니다.","goal":"변경 사유, 영향, 적용 시점을 ECN/ECR 용어로 명확히 전달할 수 있습니다.","expressions":[{"en":"We're raising an ECR to address the warpage on the console lid.","ko":"콘솔 리드의 휨 문제를 해결하기 위해 ECR을 제기하려고 합니다."},{"en":"The root cause is uneven cooling in the tool.","ko":"근본 원인은 금형 내 불균일한 냉각입니다."},{"en":"The proposed change adds two ribs to improve stiffness.","ko":"제안하는 변경은 강성 향상을 위해 리브 2개를 추가하는 것입니다."},{"en":"This change has no impact on the mating parts.","ko":"이 변경은 짝부품에 영향을 주지 않습니다."},{"en":"We'd like to implement this at the next ECN cut-in.","ko":"다음 ECN 적용 시점에 반영하고 싶습니다."},{"en":"The change is cost-neutral to the program.","ko":"이 변경은 프로그램에 원가 중립적입니다."},{"en":"We'll need a deviation until the ECN is fully released.","ko":"ECN이 완전히 발행될 때까지 디비에이션이 필요합니다."},{"en":"Can you confirm the effectivity date for the cut-in?","ko":"적용 개시일(이펙티비티)을 확인해 주실 수 있을까요?"}],"dialogue":[{"sp":"A","en":"We're raising an ECR to address the warpage on the console lid.","ko":"콘솔 리드의 휨 문제를 해결하기 위해 ECR을 제기하려고 합니다."},{"sp":"B","en":"What's the root cause?","ko":"근본 원인이 뭔가요?"},{"sp":"A","en":"Uneven cooling in the tool. The proposed change adds two ribs to improve stiffness.","ko":"금형 내 불균일한 냉각입니다. 제안 변경은 강성 향상을 위해 리브 2개를 추가하는 것입니다."},{"sp":"B","en":"Does it touch any mating parts?","ko":"짝부품에 영향이 있나요?"},{"sp":"A","en":"No, this change has no impact on the mating parts and it's cost-neutral.","ko":"아니요, 짝부품에 영향이 없고 원가 중립적입니다."},{"sp":"B","en":"When do you want to cut it in?","ko":"언제 적용하길 원하시나요?"},{"sp":"A","en":"At the next ECN cut-in. We'll need a deviation until the ECN is fully released.","ko":"다음 ECN 적용 시점입니다. ECN이 완전히 발행될 때까지 디비에이션이 필요합니다."},{"sp":"B","en":"Send me the ECR package and I'll confirm the effectivity date.","ko":"ECR 패키지를 보내 주시면 적용 개시일을 확인하겠습니다."}],"vocab":[{"t":"ECR (Engineering Change Request)","ko":"설계 변경 요청"},{"t":"ECN (Engineering Change Notice)","ko":"설계 변경 통지"},{"t":"root cause","ko":"근본 원인"},{"t":"cut-in","ko":"변경 적용(투입)"},{"t":"cost-neutral","ko":"원가 중립적인"},{"t":"deviation","ko":"디비에이션(임시 일탈 승인)"},{"t":"effectivity date","ko":"적용 개시일"}],"drill":[{"ko":"콘솔 리드의 휨 문제를 해결하기 위해 ECR을 제기하려고 합니다.","en":"We're raising an ECR to address the warpage on the console lid."},{"ko":"근본 원인은 금형 내 불균일한 냉각입니다.","en":"The root cause is uneven cooling in the tool."},{"ko":"이 변경은 짝부품에 영향을 주지 않습니다.","en":"This change has no impact on the mating parts."},{"ko":"다음 ECN 적용 시점에 반영하고 싶습니다.","en":"We'd like to implement this at the next ECN cut-in."},{"ko":"ECN이 완전히 발행될 때까지 디비에이션이 필요합니다.","en":"We'll need a deviation until the ECN is fully released."}],"tip":"ECR은 '요청', ECN은 '확정 통지'로 구분합니다. 변경 설명은 '원인 → 변경안 → 영향 → 시점' 순서가 표준이며, 'cost-neutral'과 'no impact'는 승인 속도를 높이는 핵심 표현입니다."},{"n":25,"title":"사양서(Spec) 작성·해석","scene":"OEM이 보낸 도어 트림 소재 사양서를 함께 해석하고 충족 가능 여부를 논의하시는 상황입니다.","goal":"사양 요구사항을 정확히 해석하고 충족·미충족 여부를 영어로 설명할 수 있습니다.","expressions":[{"en":"The spec calls out a minimum scratch resistance of 5 Newtons.","ko":"사양서는 최소 내스크래치 5뉴턴을 요구합니다."},{"en":"This requirement is per the OEM material standard.","ko":"이 요구사항은 OEM 소재 규격에 따른 것입니다."},{"en":"We can meet this spec with the current TPO formulation.","ko":"현재 TPO 배합으로 이 사양을 충족할 수 있습니다."},{"en":"The UV aging requirement is 1,000 hours with no visible fading.","ko":"UV 내후성 요구는 1,000시간에 가시적 변색 없음입니다."},{"en":"Section 4.2 specifies the VOC emission limits.","ko":"4.2절은 VOC 방출 한계를 규정합니다."},{"en":"We'd like to clarify the acceptance criteria for clause 6.","ko":"6항의 합격 기준을 명확히 하고 싶습니다."},{"en":"This is a shall requirement, not a should.","ko":"이건 권고가 아니라 필수 요구사항입니다."},{"en":"We request a waiver for the gloss-level requirement.","ko":"광택도 요구사항에 대해 면제를 요청합니다."}],"dialogue":[{"sp":"A","en":"Let's align on the door trim material spec you sent.","ko":"보내 주신 도어 트림 소재 사양서를 맞춰 보시죠."},{"sp":"B","en":"Sure. Any concerns?","ko":"네. 우려 사항이 있나요?"},{"sp":"A","en":"The spec calls out a minimum scratch resistance of 5 Newtons. We can meet this with the current TPO formulation.","ko":"사양서가 최소 내스크래치 5뉴턴을 요구하는데, 현재 TPO 배합으로 충족 가능합니다."},{"sp":"B","en":"Good. And the UV aging clause?","ko":"좋습니다. UV 내후성 항목은요?"},{"sp":"A","en":"1,000 hours with no visible fading. That's confirmed by our supplier data.","ko":"1,000시간에 가시적 변색 없음이고, 공급사 데이터로 확인됩니다."},{"sp":"B","en":"Anything you can't meet?","ko":"충족하지 못하는 항목이 있나요?"},{"sp":"A","en":"Clause 6 on gloss level is borderline, so we'd like to clarify the acceptance criteria and possibly request a waiver.","ko":"광택도에 관한 6항이 경계선이라, 합격 기준을 명확히 하고 경우에 따라 면제를 요청하고 싶습니다."},{"sp":"B","en":"Send your data and we'll review the waiver.","ko":"데이터를 보내 주시면 면제 건을 검토하겠습니다."}],"vocab":[{"t":"spec calls out","ko":"사양서가 ~을 명시하다"},{"t":"material standard","ko":"소재 규격"},{"t":"TPO formulation","ko":"TPO 배합"},{"t":"UV aging","ko":"UV 내후성(노화)"},{"t":"acceptance criteria","ko":"합격 기준"},{"t":"shall requirement","ko":"필수 요구사항"},{"t":"waiver","ko":"면제(승인)"}],"drill":[{"ko":"사양서는 최소 내스크래치 5뉴턴을 요구합니다.","en":"The spec calls out a minimum scratch resistance of 5 Newtons."},{"ko":"현재 TPO 배합으로 이 사양을 충족할 수 있습니다.","en":"We can meet this spec with the current TPO formulation."},{"ko":"6항의 합격 기준을 명확히 하고 싶습니다.","en":"We'd like to clarify the acceptance criteria for clause 6."},{"ko":"이건 권고가 아니라 필수 요구사항입니다.","en":"This is a shall requirement, not a should."},{"ko":"광택도 요구사항에 대해 면제를 요청합니다.","en":"We request a waiver for the gloss-level requirement."}],"tip":"사양서에서 'shall'은 필수, 'should'는 권고로 의미가 다릅니다. 충족 못 하는 항목은 숨기지 말고 'borderline'이라 솔직히 말한 뒤 데이터로 'waiver'를 요청하는 것이 신뢰를 높입니다."},{"n":26,"title":"설계 검토(DR) 회의 영어","scene":"IP 어셈블리의 설계 검토(Design Review) 회의에서 본인 영역을 발표하고 질의에 답하시는 상황입니다.","goal":"DR 회의에서 설계 의도, 리스크, 미해결 이슈를 체계적으로 발표할 수 있습니다.","expressions":[{"en":"I'll present the design intent for the IP cluster region.","ko":"IP 클러스터 영역의 설계 의도를 발표하겠습니다."},{"en":"We closed three open items from the last review.","ko":"지난 검토에서 나온 미결 항목 3건을 마감했습니다."},{"en":"The main risk is thermal deformation near the defroster vent.","ko":"주요 리스크는 디프로스터 벤트 부근의 열변형입니다."},{"en":"We mitigated this by adding a heat shield.","ko":"히트 실드를 추가해 이를 완화했습니다."},{"en":"This is an open item I'd like the team to weigh in on.","ko":"이건 팀의 의견을 듣고 싶은 미결 항목입니다."},{"en":"The FMEA flagged this interface as high-risk.","ko":"FMEA에서 이 인터페이스를 고위험으로 표시했습니다."},{"en":"Let me capture that as an action item.","ko":"그건 액션 아이템으로 기록하겠습니다."},{"en":"Are we aligned to release this to the next gate?","ko":"다음 게이트로 릴리스하는 데 합의가 됐을까요?"}],"dialogue":[{"sp":"A","en":"I'll present the design intent for the IP cluster region.","ko":"IP 클러스터 영역의 설계 의도를 발표하겠습니다."},{"sp":"B","en":"Please start with the open items from last time.","ko":"먼저 지난번 미결 항목부터 시작해 주세요."},{"sp":"A","en":"We closed three of four. The remaining one is thermal deformation near the defroster vent.","ko":"네 건 중 세 건을 마감했고, 남은 하나는 디프로스터 벤트 부근의 열변형입니다."},{"sp":"B","en":"How are you addressing it?","ko":"어떻게 대응하고 계신가요?"},{"sp":"A","en":"We mitigated it by adding a heat shield, but the FMEA still flags this interface as high-risk.","ko":"히트 실드를 추가해 완화했지만, FMEA는 여전히 이 인터페이스를 고위험으로 표시합니다."},{"sp":"B","en":"Then we need a validation test before the next gate.","ko":"그렇다면 다음 게이트 전에 검증 시험이 필요하겠네요."},{"sp":"A","en":"Agreed. Let me capture that as an action item with a due date.","ko":"동의합니다. 마감일과 함께 액션 아이템으로 기록하겠습니다."},{"sp":"B","en":"Good. Otherwise, are we aligned to release to the next gate?","ko":"좋습니다. 그 외에는 다음 게이트로 릴리스하는 데 합의됐나요?"}],"vocab":[{"t":"design intent","ko":"설계 의도"},{"t":"open item","ko":"미결 항목"},{"t":"thermal deformation","ko":"열변형"},{"t":"mitigate","ko":"완화하다"},{"t":"FMEA","ko":"고장 모드 영향 분석"},{"t":"action item","ko":"액션 아이템"},{"t":"gate","ko":"게이트(관문 심사)"}],"drill":[{"ko":"IP 클러스터 영역의 설계 의도를 발표하겠습니다.","en":"I'll present the design intent for the IP cluster region."},{"ko":"지난 검토에서 나온 미결 항목 3건을 마감했습니다.","en":"We closed three open items from the last review."},{"ko":"히트 실드를 추가해 이를 완화했습니다.","en":"We mitigated this by adding a heat shield."},{"ko":"FMEA에서 이 인터페이스를 고위험으로 표시했습니다.","en":"The FMEA flagged this interface as high-risk."},{"ko":"다음 게이트로 릴리스하는 데 합의가 됐을까요?","en":"Are we aligned to release this to the next gate?"}],"tip":"DR 발표는 '설계 의도 → 마감한 항목 → 남은 리스크 → 합의 요청' 흐름이 효과적입니다. 미결 이슈를 솔직히 'open item'으로 올리고 즉시 action item으로 전환하는 모습이 리더십으로 평가됩니다."},{"n":27,"title":"문제점·결함 설명하기","scene":"양산 도어 트림에서 발생한 외관 결함을 OEM 품질팀에 설명하고 대응 계획을 공유하시는 상황입니다.","goal":"결함의 증상, 원인, 봉쇄·시정 조치를 논리적으로 영어로 설명할 수 있습니다.","expressions":[{"en":"We're seeing sink marks on the show surface of the armrest.","ko":"암레스트 가시면에서 싱크 마크가 보이고 있습니다."},{"en":"The defect rate is around 3 percent of the lot.","ko":"불량률은 로트의 약 3퍼센트입니다."},{"en":"Our containment is 100 percent visual inspection.","ko":"봉쇄 조치는 100퍼센트 외관 검사입니다."},{"en":"We traced the root cause to inconsistent packing pressure.","ko":"근본 원인을 불안정한 보압으로 추적했습니다."},{"en":"The corrective action is to optimize the injection profile.","ko":"시정 조치는 사출 프로파일 최적화입니다."},{"en":"We'll verify effectiveness with a 300-shot run.","ko":"300쇼트 양산으로 효과를 검증하겠습니다."},{"en":"No suspect parts have shipped to your line.","ko":"의심 부품은 귀사 라인으로 출하되지 않았습니다."},{"en":"We'll close the 8D once the data confirms the fix.","ko":"데이터가 개선을 확인하면 8D를 종료하겠습니다."}],"dialogue":[{"sp":"A","en":"I want to walk you through a defect we caught on the armrest.","ko":"암레스트에서 발견한 결함을 설명드리고자 합니다."},{"sp":"B","en":"Go ahead. What's the symptom?","ko":"말씀하세요. 증상이 뭔가요?"},{"sp":"A","en":"We're seeing sink marks on the show surface, at about 3 percent of the lot.","ko":"가시면에 싱크 마크가 보이고, 로트의 약 3퍼센트 수준입니다."},{"sp":"B","en":"What's your containment?","ko":"봉쇄 조치는 무엇인가요?"},{"sp":"A","en":"100 percent visual inspection, and no suspect parts have shipped to your line.","ko":"100퍼센트 외관 검사이고, 의심 부품은 귀사 라인으로 출하되지 않았습니다."},{"sp":"B","en":"And the root cause?","ko":"근본 원인은요?"},{"sp":"A","en":"Inconsistent packing pressure. The corrective action is to optimize the injection profile, verified with a 300-shot run.","ko":"불안정한 보압입니다. 시정 조치는 사출 프로파일 최적화이며 300쇼트 양산으로 검증합니다."},{"sp":"B","en":"Good. Update the 8D and we'll review the verification data.","ko":"좋습니다. 8D를 갱신해 주시면 검증 데이터를 검토하겠습니다."}],"vocab":[{"t":"sink mark","ko":"싱크 마크(수축 자국)"},{"t":"defect rate","ko":"불량률"},{"t":"containment","ko":"봉쇄 조치"},{"t":"packing pressure","ko":"보압"},{"t":"corrective action","ko":"시정 조치"},{"t":"suspect parts","ko":"의심 부품"},{"t":"8D","ko":"8D 문제 해결 보고서"}],"drill":[{"ko":"암레스트 가시면에서 싱크 마크가 보이고 있습니다.","en":"We're seeing sink marks on the show surface of the armrest."},{"ko":"봉쇄 조치는 100퍼센트 외관 검사입니다.","en":"Our containment is 100 percent visual inspection."},{"ko":"근본 원인을 불안정한 보압으로 추적했습니다.","en":"We traced the root cause to inconsistent packing pressure."},{"ko":"의심 부품은 귀사 라인으로 출하되지 않았습니다.","en":"No suspect parts have shipped to your line."},{"ko":"데이터가 개선을 확인하면 8D를 종료하겠습니다.","en":"We'll close the 8D once the data confirms the fix."}],"tip":"품질 이슈 설명의 황금 순서는 '증상 → 봉쇄 → 원인 → 시정 → 검증'입니다. 가장 먼저 'containment(봉쇄)'와 'no suspect parts shipped'를 말하면 상대의 불안을 즉시 낮출 수 있습니다."},{"n":28,"title":"시작차·시제품 평가 영어","scene":"시작차(prototype) 빌드에서 IP와 콘솔의 조립성·외관을 OEM 평가팀과 함께 평가하시는 상황입니다.","goal":"시제품 평가 결과를 조립성, 외관, 기능 관점에서 영어로 보고할 수 있습니다.","expressions":[{"en":"We evaluated the IP on the latest mule build.","ko":"최신 뮬(시작차) 빌드에서 IP를 평가했습니다."},{"en":"The gap and flush is within spec across the cowl.","ko":"단차·간극은 카울 전체에서 사양 이내입니다."},{"en":"We noticed a squeak at the console-to-IP interface.","ko":"콘솔-IP 접합부에서 삐걱거림(스퀵)을 발견했습니다."},{"en":"Assembly ergonomics on the lower trim need improvement.","ko":"로어 트림의 조립 작업성 개선이 필요합니다."},{"en":"This is a P1 finding that blocks the next build.","ko":"이건 다음 빌드를 막는 P1 지적사항입니다."},{"en":"We'll incorporate the fix in the next prototype phase.","ko":"다음 시제품 단계에서 개선안을 반영하겠습니다."},{"en":"The fit and finish is significantly better than the previous build.","ko":"조립 품질과 마감이 이전 빌드보다 확연히 좋아졌습니다."},{"en":"Let's log this in the build issue tracker.","ko":"이걸 빌드 이슈 트래커에 기록하시죠."}],"dialogue":[{"sp":"A","en":"We evaluated the IP and console on the latest mule build.","ko":"최신 뮬 빌드에서 IP와 콘솔을 평가했습니다."},{"sp":"B","en": the updated rib pattern?","ko":"업데이트된 리브 패턴으로 모델을 돌려 주실 수 있나요?"},{"en":"The CAE results show high stress at the boss root.","ko":"CAE 결과는 보스 뿌리부에 높은 응력을 보여줍니다."},{"en":"The deflection exceeds the target by 1.2 mm.","ko":"처짐량이 목표를 1.2mm 초과합니다."},{"en":"Let's correlate the simulation with the physical test.","ko":"해석 결과를 실물 시험과 상관시켜 보시죠."},{"en":"I'll thicken the rib and re-release the model.","ko":"리브를 두껍게 하고 모델을 다시 릴리스하겠습니다."},{"en":"Please send me the STEP file along with the load case.","ko":"하중 조건과 함께 STEP 파일을 보내 주세요."},{"en":"We're working off different revisions; let's sync first.","ko":"서로 다른 리비전으로 작업 중이니 먼저 동기화하시죠."}],"dialogue":[{"sp":"A","en":"I've released the latest IP CAD to the shared workspace.","ko":"최신 IP CAD를 공유 작업공간에 릴리스했습니다."},{"sp":"B","en":"Thanks. Should I run the new load case?","ko":"감사합니다. 새 하중 조건으로 돌릴까요?"},{"sp":"A","en":"Yes, please run it with the updated rib pattern.","ko":"네, 업데이트된 리브 패턴으로 돌려 주세요."},{"sp":"B","en":"Done. The CAE results show high stress at the boss root and deflection exceeds the target by 1.2 mm.","ko":"완료했습니다. CAE 결과 보스 뿌리부에 높은 응력이 있고, 처짐량이 목표를 1.2mm 초과합니다."},{"sp":"A","en":"Understood. I'll thicken the rib and re-release the model.","ko":"알겠습니다. 리브를 두껍게 하고 모델을 다시 릴리스하겠습니다."},{"sp":"B","en":"Good. Let's also correlate the simulation with the physical test.","ko":"좋습니다. 해석 결과를 실물 시험과도 상관시켜 보시죠."},{"sp":"A","en":"Agreed. To avoid confusion, let's confirm we're on the same revision first.","ko":"동의합니다. 혼선을 막기 위해 먼저 같은 리비전인지 확인하시죠."},{"sp":"B","en":"Good call. I'm on Rev C; send me the STEP file if you've moved on.","ko":"좋은 지적입니다. 저는 Rev C인데, 더 진행하셨으면 STEP 파일을 보내 주세요."}],"vocab":[{"t":"release (CAD)","ko":"(CAD를) 릴리스하다"},{"t":"load case","ko":"하중 조건"},{"t":"stress / deflection","ko":"응력/처짐량"},{"t":"boss root","ko":"보스 뿌리부"},{"t":"correlate","ko":"상관시키다(시험-해석 일치)"},{"t":"STEP file","ko":"STEP 파일(중립 포맷)"},{"t":"revision","ko":"리비전(개정 차수)"}],"drill":[{"ko":"최신 CAD를 공유 작업공간에 릴리스했습니다.","en":"I've released the latest CAD to the shared workspace."},{"ko":"CAE 결과는 보스 뿌리부에 높은 응력을 보여줍니다.","en":"The CAE results show high stress at the boss root."},{"ko":"처짐량이 목표를 1.2mm 초과합니다.","en":"The deflection exceeds the target by 1.2 mm."},{"ko":"해석 결과를 실물 시험과 상관시켜 보시죠.","en":"Let's correlate the simulation with the physical test."},{"ko":"서로 다른 리비전으로 작업 중이니 먼저 동기화하시죠.","en":"We're working off different revisions; let's sync first."}],"tip":"원격 CAE 협업에서 가장 흔한 사고는 리비전 불일치입니다. 데이터를 주고받기 전 'are we on the same revision?'으로 확인하는 습관이 시간을 크게 절약합니다. STEP은 표준 중립 포맷이라 어디서나 통용됩니다."},{"n":30,"title":"기술 이메일과 기술 보고서","scene":"콘솔 강성 개선 결과를 OEM 담당자에게 기술 이메일과 요약 보고로 정리해 전달하시는 상황입니다.","goal":"기술 이메일과 보고서를 간결하고 전문적인 비즈니스 영어로 작성할 수 있습니다.","expressions":[{"en":"Please find the test summary attached for your review.","ko":"검토하실 수 있도록 시험 요약을 첨부했습니다."},{"en":"The purpose of this report is to summarize the stiffness improvement.","ko":"이 보고서의 목적은 강성 개선을 요약하는 것입니다."},{"en":"In short, the deflection was reduced from 3.2 to 1.8 mm.","ko":"요약하면 처짐량이 3.2에서 1.8mm로 감소했습니다."},{"en":"Below is a brief summary of the key findings.","ko":"아래는 주요 결과의 간략한 요약입니다."},{"en":"We recommend proceeding with the revised design.","ko":"개정 설계로 진행할 것을 권장합니다."},{"en":"Could you confirm by end of week?","ko":"이번 주말까지 확인해 주실 수 있을까요?"},{"en":"Let me know if you need any additional data.","ko":"추가 데이터가 필요하시면 알려 주십시오."},{"en":"I'll follow up with the detailed report next week.","ko":"상세 보고서는 다음 주에 후속으로 보내드리겠습니다."}],"dialogue":[{"sp":"A","en":"I'm sending over the stiffness test summary. Please find it attached for your review.","ko":"강성 시험 요약을 보내드립니다. 검토하실 수 있도록 첨부했습니다."},{"sp":"B","en":"Thanks. Can you give me the headline result?","ko":"감사합니다. 핵심 결과를 알려 주시겠어요?"},{"sp":"A","en":"In short, the deflection was reduced from 3.2 to 1.8 mm, which is within target.","ko":"요약하면 처짐량이 3.2에서 1.8mm로 줄었고, 목표 이내입니다."},{"sp":"B","en":"Strong result. What do you recommend?","ko":"좋은 결과네요. 무엇을 권장하시나요?"},{"sp":"A","en":"We recommend proceeding with the revised design. Could you confirm by end of week?","ko":"개정 설계로 진행할 것을 권장합니다. 이번 주말까지 확인해 주실 수 있을까요?"},{"sp":"B","en":"I'll review and get back to you. Is the full report coming?","ko":"검토 후 회신하겠습니다. 전체 보고서도 오나요?"},{"sp":"A","en":"Yes, I'll follow up with the detailed report next week. Let me know if you need any additional data.","ko":"네, 상세 보고서는 다음 주에 후속으로 보내드리겠습니다. 추가 데이터가 필요하면 알려 주십시오."},{"sp":"B","en":"Perfect, thanks for the clear summary.","ko":"완벽합니다, 명확한 요약 감사합니다."}],"vocab":[{"t":"please find attached","ko":"첨부했습니다"},{"t":"purpose of this report","ko":"이 보고서의 목적"},{"t":"in short","ko":"요약하면"},{"t":"key findings","ko":"주요 결과"},{"t":"we recommend","ko":"권장합니다"},{"t":"follow up","ko":"후속 조치하다"},{"t":"by end of week (EOW)","ko":"이번 주말까지"}],"drill":[{"ko":"검토하실 수 있도록 시험 요약을 첨부했습니다.","en":"Please find the test summary attached for your review."},{"ko":"요약하면 처짐량이 3.2에서 1.8mm로 감소했습니다.","en":"In short, the deflection was reduced from 3.2 to 1.8 mm."},{"ko":"개정 설계로 진행할 것을 권장합니다.","en":"We recommend proceeding with the revised design."},{"ko":"이번 주말까지 확인해 주실 수 있을까요?","en":"Could you confirm by end of week?"},{"ko":"상세 보고서는 다음 주에 후속으로 보내드리겠습니다.","en":"I'll follow up with the detailed report next week."}],"tip":"기술 이메일은 'BLUF(Bottom Line Up Front)' 원칙이 좋습니다. 첫 문장에 결론(핵심 수치)을 두고, 권장사항과 요청(deadline)을 명확히 하면 임원급 커뮤니케이션에 가깝습니다."},{"n":31,"title":"회의 시작하고 안건 소개","scene":"글로벌 협력사와의 주간 설계 협의 회의를 본인이 주재하며 시작하시는 상황입니다.","goal":"회의를 자연스럽게 열고 목적과 안건을 명확히 소개할 수 있습니다.","expressions":[{"en":"Thanks everyone for joining. Let's get started.","ko":"모두 참석해 주셔서 감사합니다. 시작하겠습니다."},{"en":"The purpose of today's meeting is to align on the IP timeline.","ko":"오늘 회의의 목적은 IP 일정을 맞추는 것입니다."},{"en":"We have three items on the agenda.","ko":"안건은 세 가지입니다."},{"en":"We have about 45 minutes, so let's keep it focused.","ko":"45분 정도 있으니 집중해서 진행하겠습니다."},{"en":"First, design status; second, open issues; third, next steps.","ko":"첫째 설계 현황, 둘째 미결 이슈, 셋째 향후 계획입니다."},{"en":"Before we dive in, does anyone have anything to add to the agenda?","ko":"본격적으로 들어가기 전에, 안건에 추가하실 분 계신가요?"},{"en":"Let me quickly introduce who's on the call.","ko":"참석자분들을 간단히 소개하겠습니다."},{"en":"Let's go around and do a quick introduction.","ko":"돌아가며 간단히 인사하시죠."}],"dialogue":[{"sp":"A","en":"Thanks everyone for joining. Let's get started.","ko":"모두 참석해 주셔서 감사합니다. 시작하겠습니다."},{"sp":"B","en":"Sounds good. Should we introduce ourselves first?","ko":"좋습니다. 먼저 자기소개를 할까요?"},{"sp":"A","en":"Good idea. Let's go around and do a quick introduction, then I'll cover the agenda.","ko":"좋은 생각입니다. 돌아가며 간단히 인사한 뒤 안건을 소개하겠습니다."},{"sp":"B","en":"I'm Mark, from the OEM IP team.","ko":"저는 OEM IP팀의 마크입니다."},{"sp":"A","en":"Thanks, Mark. The purpose of today's meeting is to align on the IP timeline. We have three items on the agenda.","ko":"감사합니다, 마크. 오늘 회의의 목적은 IP 일정을 맞추는 것이고, 안건은 세 가지입니다."},{"sp":"B","en":"What are they?","ko":"어떤 것들인가요?"},{"sp":"A","en":"First, design status; second, open issues; third, next steps. We have about 45 minutes.","ko":"첫째 설계 현황, 둘째 미결 이슈, 셋째 향후 계획이고, 45분 정도 있습니다."},{"sp":"B","en":"Works for me. Let's begin.","ko":"좋습니다. 시작하시죠."}],"vocab":[{"t":"get started","ko":"시작하다"},{"t":"purpose of the meeting","ko":"회의 목적"},{"t":"agenda","ko":"안건"},{"t":"align on","ko":"~에 대해 합의를 이루다"},{"t":"dive in","ko":"본격적으로 시작하다"},{"t":"next steps","ko":"향후 계획"},{"t":"go around","ko":"돌아가며 (발언)하다"}],"drill":[{"ko":"모두 참석해 주셔서 감사합니다. 시작하겠습니다.","en":"Thanks everyone for joining. Let's get started."},{"ko":"오늘 회의의 목적은 IP 일정을 맞추는 것입니다.","en":"The purpose of today's meeting is to align on the IP timeline."},{"ko":"안건은 세 가지입니다.","en":"We have three items on the agenda."},{"ko":"45분 정도 있으니 집중해서 진행하겠습니다.","en":"We have about 45 minutes, so let's keep it focused."},{"ko":"본격적으로 들어가기 전에, 안건에 추가하실 분 계신가요?","en":"Before we dive in, does anyone have anything to add to the agenda?"}],"tip":"회의 오프닝의 3요소는 '감사 인사 → 목적 → 안건/시간'입니다. 시작 단계에서 시간(45 minutes)을 명시하면 자연스럽게 시간 관리의 주도권을 잡을 수 있습니다."},{"n":32,"title":"회의 진행과 시간 관리","scene":"안건이 길어지는 회의에서 주재자로서 흐
