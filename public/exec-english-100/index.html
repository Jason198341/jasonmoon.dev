름과 시간을 관리하시는 상황입니다.","goal":"회의 흐름을 유지하고 시간 초과를 정중하게 통제할 수 있습니다.","expressions":[{"en":"Let's move on to the next item.","ko":"다음 안건으로 넘어가겠습니다."},{"en":"In the interest of time, let's keep this brief.","ko":"시간 관계상 간략히 진행하겠습니다."},{"en":"We're running a bit behind, so let me speed us up.","ko":"조금 지연되고 있어서 진행을 좀 서두르겠습니다."},{"en":"That's a great point, but let's park it for now.","ko":"좋은 지적입니다만, 일단 보류해 두겠습니다."},{"en":"Let's take that offline after the meeting.","ko":"그건 회의 후에 따로 논의하시죠."},{"en":"We have ten minutes left, so let's prioritize.","ko":"10분 남았으니 우선순위를 정하겠습니다."},{"en":"Can we come back to this if we have time?","ko":"시간이 되면 이 건으로 다시 돌아와도 될까요?"},{"en":"Let's stick to the agenda for now.","ko":"일단 안건에 집중하시죠."}],"dialogue":[{"sp":"A","en":"We're running a bit behind, so let me speed us up. Let's move on to the next item.","ko":"조금 지연되고 있어서 서두르겠습니다. 다음 안건으로 넘어가겠습니다."},{"sp":"B","en":"Before we do, can I raise a question about the material cost?","ko":"그 전에 소재 원가에 대해 질문해도 될까요?"},{"sp":"A","en":"That's a great point, but let's park it for now and take it offline after the meeting.","ko":"좋은 지적입니다만, 일단 보류하고 회의 후에 따로 논의하시죠."},{"sp":"B","en":"Fair enough.","ko":"알겠습니다."},{"sp":"A","en":"We have ten minutes left, so let's prioritize the open issues.","ko":"10분 남았으니 미결 이슈를 우선으로 다루겠습니다."},{"sp":"B","en":"Agreed. Issue two is the most urgent.","ko":"동의합니다. 두 번째 이슈가 가장 급합니다."},{"sp":"A","en":"Good. Let's focus on that and come back to the rest if we have time.","ko":"좋습니다. 그것에 집중하고 나머지는 시간이 되면 다시 보겠습니다."},{"sp":"B","en":"Sounds like a plan.","ko":"좋은 방안입니다."}],"vocab":[{"t":"move on to","ko":"~로 넘어가다"},{"t":"in the interest of time","ko":"시간 관계상"},{"t":"running behind","ko":"(일정이) 지연되다"},{"t":"park it","ko":"(논의를) 보류하다"},{"t":"take it offline","ko":"따로(회의 밖에서) 논의하다"},{"t":"prioritize","ko":"우선순위를 정하다"},{"t":"stick to the agenda","ko":"안건에 집중하다"}],"drill":[{"ko":"다음 안건으로 넘어가겠습니다.","en":"Let's move on to the next item."},{"ko":"시간 관계상 간략히 진행하겠습니다.","en":"In the interest of time, let's keep this brief."},{"ko":"좋은 지적입니다만, 일단 보류해 두겠습니다.","en":"That's a great point, but let's park it for now."},{"ko":"그건 회의 후에 따로 논의하시죠.","en":"Let's take that offline after the meeting."},{"ko":"10분 남았으니 우선순위를 정하겠습니다.","en":"We have ten minutes left, so let's prioritize."}],"tip":"주제를 벗어나는 발언은 'park it / take it offline'으로 정중히 차단하는 것이 핵심 기술입니다. 상대 의견을 'great point'로 인정한 뒤 보류하면 무례하지 않게 흐름을 지킬 수 있습니다."},{"n":33,"title":"발언권 조율과 정리","scene":"여러 참석자가 동시에 말하려는 회의에서 발언 순서를 조율하고 의견을 정리하시는 상황입니다.","goal":"발언권을 공정하게 배분하고 논의를 요약·정리할 수 있습니다.","expressions":[{"en":"Let's hear from one person at a time.","ko":"한 분씩 말씀해 주시죠."},{"en":"Go ahead, Mark, you were first.","ko":"먼저 말씀하셨으니 마크부터 하시죠."},{"en":"I'd like to bring in Sarah on this point.","ko":"이 부분에 대해 사라의 의견을 들어 보고 싶습니다."},{"en":"Let me make sure I understood you correctly.","ko":"제가 제대로 이해했는지 확인하겠습니다."},{"en":"So what I'm hearing is that we need more test data.","ko":"정리하면, 시험 데이터가 더 필요하다는 말씀이시군요."},{"en":"Let's give everyone a chance to weigh in.","ko":"모두에게 의견을 낼 기회를 드리겠습니다."},{"en":"We haven't heard from the manufacturing side yet.","ko":"아직 생산 측 의견을 듣지 못했습니다."},{"en":"Let me summarize where we are.","ko":"현재까지의 논의를 정리하겠습니다."}],"dialogue":[{"sp":"A","en":"I think a few people want to jump in. Let's hear from one person at a time.","ko":"몇 분이 말씀하고 싶어 하시는데, 한 분씩 말씀해 주시죠."},{"sp":"B","en":"I'll go. I'm worried the lead time is too tight.","ko":"제가 하겠습니다. 리드타임이 너무 빠듯한 것 같아 걱정입니다."},{"sp":"A","en":"Thanks. So what I'm hearing is that the lead time is the main concern. Did I get that right?","ko":"감사합니다. 정리하면 리드타임이 주요 우려라는 말씀이시군요. 맞나요?"},{"sp":"B","en":"Exactly.","ko":"정확합니다."},{"sp":"A","en":"We haven't heard from the manufacturing side yet. I'd like to bring in Jin on this.","ko":"아직 생산 측 의견을 듣지 못했습니다. 이 부분에 대해 진의 의견을 들어 보고 싶습니다."},{"sp":"B","en":"Jin, what's your view on feasibility?","ko":"진, 실현 가능성에 대한 의견은요?"},{"sp":"A","en":"Let me summarize where we are before we go further.","ko":"더 진행하기 전에 현재까지의 논의를 정리하겠습니다."},{"sp":"B","en":"Please do, that would help.","ko":"네, 그러면 도움이 되겠습니다."}],"vocab":[{"t":"one at a time","ko":"한 번에 한 명씩"},{"t":"bring in (someone)","ko":"(누군가의) 의견을 끌어들이다"},{"t":"weigh in","ko":"의견을 내다"},{"t":"what I'm hearing is","ko":"정리하면 ~라는 말씀이군요"},{"t":"jump in","ko":"끼어들어 말하다"},{"t":"summarize","ko":"요약하다"},{"t":"get a chance","ko":"기회를 얻다"}],"drill":[{"ko":"한 분씩 말씀해 주시죠.","en":"Let's hear from one person at a time."},{"ko":"이 부분에 대해 사라의 의견을 들어 보고 싶습니다.","en":"I'd like to bring in Sarah on this point."},{"ko":"정리하면, 시험 데이터가 더 필요하다는 말씀이시군요.","en":"So what I'm hearing is that we need more test data."},{"ko":"아직 생산 측 의견을 듣지 못했습니다.","en":"We haven't heard from the manufacturing side yet."},{"ko":"현재까지의 논의를 정리하겠습니다.","en":"Let me summarize where we are."}],"tip":"조용한 참석자를 'bring in'으로 호명해 끌어내는 것이 좋은 진행자의 표시입니다. 'what I'm hearing is...'로 상대 발언을 되짚어 주면 오해를 줄이고 정리하는 리더십을 보여줄 수 있습니다."},{"n":34,"title":"브레인스토밍 이끌기","scene":"콘솔 수납 공간 개선 아이디어를 모으는 브레인스토밍 세션을 본인이 진행하시는 상황입니다.","goal":"자유로운 아이디어 발산을 유도하고 분위기를 이끌 수 있습니다.","expressions":[{"en":"Let's brainstorm freely — no idea is a bad idea.","ko":"자유롭게 의견을 내 주세요. 나쁜 아이디어는 없습니다."},{"en":"Let's hold off on judging ideas for now.","ko":"지금은 아이디어 평가를 잠시 미루겠습니다."},{"en":"Building on that, what if we add a sliding tray?","ko":"그 아이디어에 더해서, 슬라이딩 트레이를 넣으면 어떨까요?"},{"en":"Let's think outside the box here.","ko":"여기서는 틀을 벗어나 생각해 봅시다."},{"en":"Throw out anything that comes to mind.","ko":"떠오르는 건 뭐든 던져 주세요."},{"en":"Let's group these ideas into themes.","ko":"이 아이디어들을 주제별로 묶어 봅시다."},{"en":"What problem are we really trying to solve?","ko":"우리가 정말 풀려는 문제가 무엇일까요?"},{"en":"Let's pick the top three to take forward.","ko":"발전시킬 상위 세 가지를 골라 봅시다."}],"dialogue":[{"sp":"A","en":"Today let's brainstorm ways to improve console storage. No idea is a bad idea.","ko":"오늘은 콘솔 수납 개선 방안을 자유롭게 내 봅시다. 나쁜 아이디어는 없습니다."},{"sp":"B","en":"How about a wireless charging pad in the tray?","ko":"트레이에 무선 충전 패드를 넣는 건 어떨까요?"},{"sp":"A","en":"Great start. Building on that, what if we add a sliding tray to expose two levels?","ko":"좋은 출발입니다. 거기에 더해, 두 단을 노출하는 슬라이딩 트레이를 넣으면 어떨까요?"},{"sp":"B","en":"I like it. But will it pass the load test?","ko":"좋네요. 그런데 하중 시험을 통과할까요?"},{"sp":"A","en":"Let's hold off on judging for now and just throw out ideas.","ko":"지금은 평가를 잠시 미루고 아이디어만 던져 봅시다."},{"sp":"B","en":"Okay — a modular insert that users can rearrange.","ko":"알겠습니다. 사용자가 재배치할 수 있는 모듈형 인서트요."},{"sp":"A","en":"Nice. Let's group these into themes and pick the top three to take forward.","ko":"좋습니다. 이걸 주제별로 묶고 발전시킬 상위 세 가지를 골라 봅시다."},{"sp":"B","en":"Sounds good, I'll start clustering them.","ko":"좋습니다, 제가 묶기 시작하겠습니다."}],"vocab":[{"t":"brainstorm","ko":"브레인스토밍하다"},{"t":"no idea is a bad idea","ko":"나쁜 아이디어는 없다"},{"t":"build on","ko":"(아이디어를) 발전시키다"},{"t":"think outside the box","ko":"틀을 벗어나 생각하다"},{"t":"hold off on","ko":"~을 잠시 미루다"},{"t":"group into themes","ko":"주제별로 묶다"},{"t":"take forward","ko":"발전시켜 나가다"}],"drill":[{"ko":"자유롭게 의견을 내 주세요. 나쁜 아이디어는 없습니다.","en":"Let's brainstorm freely — no idea is a bad idea."},{"ko":"지금은 아이디어 평가를 잠시 미루겠습니다.","en":"Let's hold off on judging ideas for now."},{"ko":"그 아이디어에 더해서, 슬라이딩 트레이를 넣으면 어떨까요?","en":"Building on that, what if we add a sliding tray?"},{"ko":"이 아이디어들을 주제별로 묶어 봅시다.","en":"Let's group these ideas into themes."},{"ko":"발전시킬 상위 세 가지를 골라 봅시다.","en":"Let's pick the top three to take forward."}],"tip":"브레인스토밍은 '발산(평가 금지) → 수렴(묶기·선별)'의 두 단계를 분리하는 것이 핵심입니다. 'building on that...'은 남의 아이디어를 짓밟지 않고 이어 가는 가장 자연스러운 표현입니다."},{"n":35,"title":"의사결정 도출하기","scene":"두 가지 도어 트림 재질 안 사이에서 회의 참석자들과 최종 결정을 내려야 하는 상황입니다.","goal":"선택지를 정리하고 합의 또는 결정을 명확히 도출할 수 있습니다.","expressions":[{"en":"Let's narrow it down to two options.","ko":"선택지를 두 가지로 좁히겠습니다."},{"en":"What are the pros and cons of each?","ko":"각각의 장단점은 무엇일까요?"},{"en":"Let's weigh cost against durability.","ko":"원가와 내구성을 견주어 보겠습니다."},{"en":"Can we get a show of hands?","ko":"거수로 확인해 볼까요?"},{"en":"It sounds like we're leaning toward option A.","ko":"A안 쪽으로 기우는 것 같습니다."},{"en":"Are we all comfortable with this decision?","ko":"이 결정에 모두 동의하시나요?"},{"en":"Let's make a call so we can move forward.","ko":"진행할 수 있도록 결정을 내리겠습니다."},{"en":"I'll take final responsibility for this decision.","ko":"이 결정에 대한 최종 책임은 제가 지겠습니다."}],"dialogue":[{"sp":"A","en":"We have two material options on the table. Let's narrow it down and decide today.","ko":"재질 안이 두 가지 올라와 있습니다. 좁혀서 오늘 결정하시죠."},{"sp":"B","en":"Option A is cheaper, but A's durability is lower.","ko":"A안이 더 저렴하지만 내구성이 낮습니다."},{"sp":"A","en":"Good summary. Let's weigh cost against durability. What matters most for this program?","ko":"좋은 요약입니다. 원가와 내구성을 견주어 보죠. 이 프로그램에서 무엇이 가장 중요할까요?"},{"sp":"B","en":"Honestly, durability — this is a high-touch surface.","ko":"솔직히 내구성입니다. 손이 많이 닿는 면이니까요."},{"sp":"A","en":"It sounds like we're leaning toward option B. Can we get a show of hands?","ko":"B안 쪽으로 기우는 것 같습니다. 거수로 확인해 볼까요?"},{"sp":"B","en":"Most hands are up for B.","ko":"대부분 B에 손을 들었습니다."},{"sp":"A","en":"Then let's go with B. Are we all comfortable with this decision?","ko":"그럼 B로 가겠습니다. 이 결정에 모두 동의하시나요?"},{"sp":"B","en":"Yes. Good to have a clear call.","ko":"네. 명확한 결정이라 좋습니다."}],"vocab":[{"t":"narrow it down","ko":"(선택지를) 좁히다"},{"t":"pros and cons","ko":"장단점"},{"t":"weigh A against B","ko":"A와 B를 견주다"},{"t":"show of hands","ko":"거수"},{"t":"lean toward","ko":"~쪽으로 기울다"},{"t":"make a call","ko":"결정을 내리다"},{"t":"comfortable with","ko":"~에 동의하는/편안한"}],"drill":[{"ko":"선택지를 두 가지로 좁히겠습니다.","en":"Let's narrow it down to two options."},{"ko":"원가와 내구성을 견주어 보겠습니다.","en":"Let's weigh cost against durability."},{"ko":"A안 쪽으로 기우는 것 같습니다.","en":"It sounds like we're leaning toward option A."},{"ko":"이 결정에 모두 동의하시나요?","en":"Are we all comfortable with this decision?"},{"ko":"진행할 수 있도록 결정을 내리겠습니다.","en":"Let's make a call so we can move forward."}],"tip":"결정을 미루는 회의는 가치가 떨어집니다. 'make a call'로 결단을 내리고, 'are we all comfortable?'로 합의를 확인하는 두 동작이 의사결정의 핵심입니다. 책임 소재를 본인이 진다고 밝히면 신뢰가 커집니다."},{"n":36,"title":"액션 아이템 배정","scene":"회의 막바지에 결정 사항을 실행 과제로 나누고 담당자와 기한을 배정하시는 상황입니다.","goal":"액션 아이템을 담당자와 기한과 함께 명확히 배정할 수 있습니다.","expressions":[{"en":"Let's capture the action items.","ko":"액션 아이템을 정리하겠습니다."},{"en":"Jin, can you own the CAE rerun by Friday?","ko":"진, 금요일까지 CAE 재해석을 맡아 주실 수 있나요?"},{"en":"Who's the owner for this task?","ko":"이 과제의 담당자는 누구인가요?"},{"en":"What's a realistic due date for this?","ko":"이 건의 현실적인 기한은 언제일까요?"},{"en":"I'll take the action to update the drawing.","ko":"도면 업데이트는 제가 맡겠습니다."},{"en":"Let me read back the action items to confirm.","ko":"확인 차 액션 아이템을 다시 읽어 드리겠습니다."},{"en":"Each item has an owner and a deadline.","ko":"각 항목에는 담당자와 기한이 있습니다."},{"en":"Does everyone agree with their assignments?","ko":"모두 본인 배정에 동의하시나요?"}],"dialogue":[{"sp":"A","en":"Before we close, let's capture the action items.","ko":"마무리하기 전에 액션 아이템을 정리하겠습니다."},{"sp":"B","en":"Good. There were a few decisions today.","ko":"좋습니다. 오늘 결정이 몇 가지 있었죠."},{"sp":"A","en":"Right. Jin, can you own the CAE rerun by Friday?","ko":"맞습니다. 진, 금요일까지 CAE 재해석을 맡아 주실 수 있나요?"},{"sp":"B","en":"Friday is tight; can I have until Monday?","ko":"금요일은 빠듯한데, 월요일까지 가능할까요?"},{"sp":"A","en":"Monday works. I'll take the action to update the drawing by Wednesday.","ko":"월요일 좋습니다. 도면 업데이트는 제가 수요일까지 맡겠습니다."},{"sp":"B","en":"And who owns the supplier follow-up?","ko":"공급사 후속은 누가 맡나요?"},{"sp":"A","en":"Sarah will. Let me read back the action items to confirm each owner and deadline.","ko":"사라가 맡습니다. 확인 차 각 담당자와 기한을 다시 읽어 드리겠습니다."},{"sp":"B","en":"Please do — that keeps us accountable.","ko":"네, 그래야 책임이 분명해집니다."}],"vocab":[{"t":"action item","ko":"액션 아이템(실행 과제)"},{"t":"own (a task)","ko":"(과제를) 책임지다"},{"t":"owner","ko":"담당자"},{"t":"due date / deadline","ko":"기한"},{"t":"take the action","ko":"그 과제를 맡다"},{"t":"read back","ko":"다시 읽어 확인하다"},{"t":"accountable","ko":"책임이 분명한"}],"drill":[{"ko":"액션 아이템을 정리하겠습니다.","en":"Let's capture the action items."},{"ko":"진, 금요일까지 CAE 재해석을 맡아 주실 수 있나요?","en":"Jin, can you own the CAE rerun by Friday?"},{"ko":"도면 업데이트는 제가 맡겠습니다.","en":"I'll take the action to update the drawing."},{"ko":"확인 차 액션 아이템을 다시 읽어 드리겠습니다.","en":"Let me read back the action items to confirm."},{"ko":"모두 본인 배정에 동의하시나요?","en":"Does everyone agree with their assignments?"}],"tip":"좋은 액션 아이템에는 반드시 '담당자(owner) + 기한(deadline)'이 붙습니다. 회의 끝에 'read back'으로 한 번 더 읽어 확인하면 누락과 책임 회피를 막을 수 있습니다."},{"n":37,"title":"회의 마무리와 후속 조치","scene":"회의를 마무리하며 핵심 결정과 후속 일정을 정리해 공유하시는 상황입니다.","goal":"회의를 깔끔하게 마무리하고 후속 조치를 명확히 안내할 수 있습니다.","expressions":[{"en":"Let's wrap up. Here's a quick recap.","ko":"마무리하겠습니다. 간단히 정리해 드리겠습니다."},{"en":"To summarize, we agreed on the material and the timeline.","ko":"정리하면, 재질과 일정에 합의했습니다."},{"en":"I'll send out the minutes by end of day.","ko":"회의록은 오늘 중으로 보내드리겠습니다."},{"en":"Our next meeting is scheduled for next Tuesday.","ko":"다음 회의는 다음 주 화요일로 예정되어 있습니다."},{"en":"Please review the action items and flag any concerns.","ko":"액션 아이템을 검토하시고 우려가 있으면 알려 주십시오."},{"en":"Thanks everyone for your time and input.","ko":"시간과 의견 주셔서 모두 감사합니다."},{"en":"If there's nothing else, let's close here.","ko":"다른 사항이 없으면 여기서 마치겠습니다."},{"en":"I'll follow up with you offline on item three.","ko":"세 번째 항목은 따로 후속 연락드리겠습니다."}],"dialogue":[{"sp":"A","en":"We're at time, so let's wrap up. Here's a quick recap.","ko":"시간이 됐으니 마무리하겠습니다. 간단히 정리해 드리겠습니다."},{"sp":"B","en":"Please go ahead.","ko":"네, 말씀하세요."},{"sp":"A","en":"To summarize, we agreed on material B and the revised timeline. Three action items are assigned.","ko":"정리하면, 재질 B와 수정된 일정에 합의했고 액션 아이템 세 건이 배정됐습니다."},{"sp":"B","en":"Great. Will you send the notes?","ko":"좋습니다. 회의록 보내 주실 거죠?"},{"sp":"A","en":"Yes, I'll send out the minutes by end of day. Please review the action items and flag any concerns.","ko":"네, 회의록은 오늘 중으로 보내겠습니다. 액션 아이템을 검토하시고 우려가 있으면 알려 주십시오."},{"sp":"B","en":"When's the next meeting?","ko":"다음 회의는 언제인가요?"},{"sp":"A","en":"Next Tuesday. If there's nothing else, let's close here. Thanks everyone for your time and input.","ko":"다음 주 화요일입니다. 다른 사항이 없으면 여기서 마치겠습니다. 시간과 의견 주셔서 감사합니다."},{"sp":"B","en":"Thank you — productive session.","ko":"감사합니다. 생산적인 회의였습니다."}],"vocab":[{"t":"wrap up","ko":"마무리하다"},{"t":"recap","ko":"요약 정리"},{"t":"to summarize","ko":"정리하면"},{"t":"minutes","ko":"회의록"},{"t":"next meeting","ko":"다음 회의"},{"t":"flag concerns","ko":"우려를 제기하다"},{"t":"close here","ko":"여기서 마치다"}],"drill":[{"ko":"마무리하겠습니다. 간단히 정리해 드리겠습니다.","en":"Let's wrap up. Here's a quick recap."},{"ko":"정리하면, 재질과 일정에 합의했습니다.","en":"To summarize, we agreed on the material and the timeline."},{"ko":"회의록은 오늘 중으로 보내드리겠습니다.","en":"I'll send out the minutes by end of day."},{"ko":"다음 회의는 다음 주 화요일로 예정되어 있습니다.","en":"Our next meeting is scheduled for next Tuesday."},{"ko":"다른 사항이 없으면 여기서 마치겠습니다.","en":"If there's nothing else, let's close here."}],"tip":"회의 마무리의 3요소는 '결정 요약(recap) → 후속(minutes·다음 회의) → 감사 인사'입니다. 'I'll send the minutes by EOD'처럼 후속 약속을 명확히 하면 회의의 결과가 실행으로 이어집니다."},{"n":38,"title":"화상회의 운영 영어","scene":"여러 시간대의 글로벌 팀과 화상회의를 운영하며 연결·화면 공유·발언을 조율하시는 상황입니다.","goal":"화상회의 특유의 기술적·진행적 상황을 영어로 매끄럽게 다룰 수 있습니다.","expressions":[{"en":"Can everyone hear me okay?","ko":"제 목소리 다 들리시나요?"},{"en":"Please mute yourself when you're not speaking.","ko":"발언하지 않으실 때는 음소거해 주십시오."},{"en":"I'm going to share my screen now.","ko":"지금 화면을 공유하겠습니다."},{"en":"Can you see my screen?","ko":"제 화면이 보이시나요?"},{"en":"You're on mute — we can't hear you.","ko":"음소거 상태이십니다. 소리가 안 들립니다."},{"en":"Sorry, you cut out — could you repeat that?","ko":"죄송합니다, 소리가 끊겼는데 다시 말씀해 주시겠어요?"},{"en":"Let's use the chat to drop any questions.","ko":"질문은 채팅으로 남겨 주시죠."},{"en":"I know it's early for our colleagues in Europe, thanks for joining.","ko":"유럽 동료분들께는 이른 시간인데 참석해 주셔서 감사합니다."}],"dialogue":[{"sp":"A","en":"Good morning and good evening, everyone. Can everyone hear me okay?","ko":"여러분 좋은 아침, 좋은 저녁입니다. 제 목소리 다 들리시나요?"},{"sp":"B","en":"Loud and clear.","ko":"잘 들립니다."},{"sp":"A","en":"Great. I know it's early for our colleagues in Europe, thanks for joining. Please mute yourself when you're not speaking.","ko":"좋습니다. 유럽 동료분들께는 이른 시간인데 참석해 주셔서 감사합니다. 발언하지 않으실 때는 음소거해 주십시오."},{"sp":"B","en":"Will you be sharing the deck?","ko":"자료를 공유해 주실 건가요?"},{"sp":"A","en":"Yes, I'm going to share my screen now. Can you see my screen?","ko":"네, 지금 화면을 공유하겠습니다. 제 화면이 보이시나요?"},{"sp":"B","en":"Yes, but Jin seems to be talking — Jin, you're on mute.","ko":"네, 그런데 진이 말씀하시는 것 같아요. 진, 음소거 상태이십니다."},{"sp":"A","en":"Let's use the chat to drop any questions, and I'll address them as we go.","ko":"질문은 채팅으로 남겨 주시면 진행하면서 답하겠습니다."},{"sp":"B","en":"Sounds good, thanks for organizing this across time zones.","ko":"좋습니다, 시간대를 맞춰 운영해 주셔서 감사합니다."}],"vocab":[{"t":"can everyone hear me","ko":"다 들리시나요"},{"t":"mute yourself","ko":"음소거하다"},{"t":"share my screen","ko":"화면을 공유하다"},{"t":"on mute","ko":"음소거 상태인"},{"t":"cut out","ko":"(소리가) 끊기다"},{"t":"drop in the chat","ko":"채팅에 남기다"},{"t":"time zone","ko":"시간대"}],"drill":[{"ko":"제 목소리 다 들리시나요?","en":"Can everyone hear me okay?"},{"ko":"발언하지 않으실 때는 음소거해 주십시오.","en":"Please mute yourself when you're not speaking."},{"ko":"제 화면이 보이시나요?","en":"Can you see my screen?"},{"ko":"죄송합니다, 소리가 끊겼는데 다시 말씀해 주시겠어요?","en":"Sorry, you cut out — could you repeat that?"},{"ko":"질문은 채팅으로 남겨 주시죠.","en":"Let's use the chat to drop any questions."}],"tip":"화상회의는 음소거·화면공유·접속 끊김 같은 정형 표현만 익혀 두면 당황하지 않습니다. 여러 시간대 회의에서는 'I know it's early/late for some of you'로 배려를 표현하면 글로벌 매너로 좋게 평가됩니다."},{"n":39,"title":"이견·갈등 중재","scene":"설계팀과 생산팀이 공차 설정을 두고 의견 충돌하는 회의에서 중재자로 나서시는 상황입니다.","goal":"감정을 가라앉히고 공통점을 찾아 갈등을 건설적으로 중재할 수 있습니다.","expressions":[{"en":"I can see we have different views here.","ko":"여기서 서로 의견이 다른 것 같습니다."},{"en":"Let's take a step back and look at the data.","ko":"한 발 물러서서 데이터를 보시죠."},{"en":"I think we actually agree on the goal.","ko":"사실 우리는 목표에는 동의하고 있다고 봅니다."},{"en":"Let's focus on the problem, not the person.","ko":"사람이 아니라 문제에 집중하시죠."},{"en":"Help me understand your concern.","ko":"어떤 점이 우려되시는지 설명해 주시겠어요?"},{"en":"Is there a middle ground we can explore?","ko":"찾아볼 만한 절충점이 있을까요?"},{"en":"Let's find a solution that works for both sides.","ko":"양측 모두에게 맞는 해법을 찾아봅시다."},{"en":"Can we agree to test both and let the data decide?","ko":"둘 다 시험해서 데이터로 결정하기로 합의할 수 있을까요?"}],"dialogue":[{"sp":"A","en":"I can see we have different views on the tolerance. Let's take a step back.","ko":"공차에 대해 의견이 다른 것 같습니다. 한 발 물러서 보시죠."},{"sp":"B","en":"Manufacturing says the tolerance is too tight to hold.","ko":"생산 측은 공차가 너무 빠듯해서 못 맞춘다고 합니다."},{"sp":"A","en":"Understood. Help me understand the concern — is it the process capability?","ko":"알겠습니다. 어떤 점이 우려되는지 설명해 주세요. 공정 능력 문제인가요?"},{"sp":"B","en":"Exactly. But design says the fit fails if it's looser.","ko":"정확합니다. 그런데 설계는 더 느슨하면 정합이 안 된다고 합니다."},{"sp":"A","en":"I think we actually agree on the goal: a good fit that's producible. Let's focus on the problem, not the person.","ko":"사실 우리는 '생산 가능한 좋은 정합'이라는 목표에는 동의하고 있습니다. 사람이 아니라 문제에 집중하시죠."},{"sp":"B","en":"Fair. So what's the middle ground?","ko":"맞습니다. 그럼 절충점이 뭘까요?"},{"sp":"A","en":"Can we agree to run a capability study on both tolerances and let the data decide?","ko":"두 공차 모두 공정 능력 연구를 돌려서 데이터로 결정하기로 합의할 수 있을까요?"},{"sp":"B","en":"That's reasonable. Both sides can live with that.","ko":"합리적입니다. 양측 다 수용할 수 있겠습니다."}],"vocab":[{"t":"different views","ko":"다른 의견"},{"t":"take a step back","ko":"한 발 물러서다"},{"t":"problem, not the person","ko":"사람이 아닌 문제 (중심)"},{"t":"help me understand","ko":"이해할 수 있게 설명해 주세요"},{"t":"middle ground","ko":"절충점"},{"t":"works for both sides","ko":"양측 모두에게 맞는"},{"t":"let the data decide","ko":"데이터로 결정하다"}],"drill":[{"ko":"한 발 물러서서 데이터를 보시죠.","en":"Let's take a step back and look at the data."},{"ko":"사실 우리는 목표에는 동의하고 있다고 봅니다.","en":"I think we actually agree on the goal."},{"ko":"사람이 아니라 문제에 집중하시죠.","en":"Let's focus on the problem, not the person."},{"ko":"찾아볼 만한 절충점이 있을까요?","en":"Is there a middle ground we can explore?"},{"ko":"둘 다 시험해서 데이터로 결정하기로 합의할 수 있을까요?","en":"Can we agree to test both and let the data decide?"}],"tip":"갈등 중재의 핵심은 '공통 목표 확인 → 사람과 문제 분리 → 데이터로 결정'입니다. 'help me understand'로 상대 입장을 먼저 들으면 방어 자세가 풀리고, 'let the data decide'는 감정 싸움을 객관적 판단으로 전환합니다."},{"n":40,"title":"발표 기본 구조 잡기","scene":"경영층 대상으로 신규 IP 프로그램 현황을 짧게 발표하기 위해 구조를 잡으시는 상황입니다.","goal":"서론·본론·결론의 기본 발표 구조를 영어로 명확히 구성할 수 있습니다.","expressions":[{"en":"Today I'll cover three things: status, risks, and next steps.","ko":"오늘은 세 가지, 현황·리스크·향후 계획을 다루겠습니다."},{"en":"Let me start with the bottom line.","ko":"결론부터 말씀드리겠습니다."},{"en":"First, let's look at where we stand.","ko":"먼저 현재 상황을 보겠습니다."},{"en":"Moving on to the key risks.","ko":"이어서 주요 리스크로 넘어가겠습니다."},{"en":"To put this in perspective, that's a 15 percent improvement.","ko":"맥락을 더하면, 이는 15퍼센트 개선입니다."},{"en":"Let me summarize the key takeaways.","ko":"핵심 요점을 정리하겠습니다."},{"en":"In conclusion, the program is on track.","ko":"결론적으로 프로그램은 정상 궤도에 있습니다."},{"en":"I'm happy to take any questions.","ko":"질문 있으시면 기꺼이 받겠습니다."}],"dialogue":[{"sp":"A","en":"Thank you for your time. Today I'll cover three things: status, risks, and next steps.","ko":"시간 내 주셔서 감사합니다. 오늘은 현황·리스크·향후 계획 세 가지를 다루겠습니다."},{"sp":"B","en":"Please keep it tight; we have ten minutes.","ko":"10분밖에 없으니 간결하게 부탁합니다."},{"sp":"A","en":"Understood. Let me start with the bottom line: the IP program is on track for the next gate.","ko":"알겠습니다. 결론부터 말씀드리면, IP 프로그램은 다음 게이트를 향해 정상 궤도에 있습니다."},{"sp":"B","en":"Good. What's the main risk?","ko":"좋습니다. 주요 리스크는 무엇인가요?"},{"sp":"A","en":"Moving on to the key risks: tooling lead time is tight, but we have a recovery plan.","ko":"주요 리스크로 넘어가면, 금형 리드타임이 빠듯하지만 만회 계획이 있습니다."},{"sp":"B","en":"What do you need from us?","ko":"우리에게 필요한 건 무엇인가요?"},{"sp":"A","en":"To summarize the key takeaways, I need approval to expedite the tool. In conclusion, the program is on track.","ko":"핵심 요점을 정리하면, 금형 가속을 위한 승인이 필요합니다. 결론적으로 프로그램은 정상 궤도에 있습니다."},{"sp":"B","en":"Approved. Clear and to the point.","ko":"승인합니다. 명확하고 핵심적이군요."}],"vocab":[{"t":"cover three things","ko":"세 가지를 다루다"},{"t":"bottom line","ko":"결론, 핵심"},{"t":"where we stand","ko":"현재 상황"},{"t":"moving on to","ko":"~로 넘어가다"},{"t":"put in perspective","ko":"맥락을 더하다"},{"t":"key takeaways","ko":"핵심 요점"},{"t":"in conclusion","ko":"결론적으로"}],"drill":[{"ko":"오늘은 세 가지, 현황·리스크·향후 계획을 다루겠습니다.","en":"Today I'll cover three things: status, risks, and next steps."},{"ko":"결론부터 말씀드리겠습니다.","en":"Let me start with the bottom line."},{"ko":"이어서 주요 리스크로 넘어가겠습니다.","en":"Moving on to the key risks."},{"ko":"핵심 요점을 정리하겠습니다.","en":"Let me summarize the key takeaways."},{"ko":"결론적으로 프로그램은 정상 궤도에 있습니다.","en":"In conclusion, the program is on track."}],"tip":"임원 발표는 'Tell them what you'll say → say it → tell them what you said' 구조가 정석입니다. 경영층 대상이면 'bottom line'을 맨 앞에 두는 것이 시간을 존중하는 프로페셔널한 방식입니다."},{"n":41,"title":"공급사 첫 컨택과 소개","scene":"신규 도어트림 부품 협력사 후보와 처음으로 화상 미팅을 잡고 회사와 본인을 소개하는 자리입니다.","goal":"전문적인 첫인상을 남기고 협업 가능성과 다음 단계를 명확히 제시할 수 있다.","expressions":[{"en":"Thank you for taking the time to meet with us today.","ko":"오늘 시간 내어 만나 주셔서 감사합니다."},{"en":"I'm the lead interior design engineer for our IP and door trim programs.","ko":"저는 저희 IP 및 도어트림 프로그램의 책임 내장설계 엔지니어입니다."},{"en":"We came across your company while sourcing new Tier-1 partners.","ko":"신규 1차 협력사를 발굴하던 중 귀사를 알게 되었습니다."},{"en":"We're exploring potential suppliers for our next platform.","ko":"차기 플랫폼을 위한 잠재 공급사를 검토하고 있습니다."},{"en":"Could you walk us through your capabilities and key customers?","ko":"귀사의 역량과 주요 고객사를 간단히 소개해 주시겠습니까?"},{"en":"We're looking for a partner who can support us from prototype to mass production.","ko":"시제품부터 양산까지 지원해 줄 파트너를 찾고 있습니다."},{"en":"I'd like to understand where you see the best fit with us.","ko":"어느 부분에서 저희와 가장 잘 맞는다고 보시는지 듣고 싶습니다."},{"en":"Let's set up a follow-up once we've reviewed your profile internally.","ko":"내부 검토 후 후속 미팅을 잡도록 하겠습니다."}],"dialogue":[{"sp":"A","en":"Good morning, and thank you for making time on short notice.","ko":"안녕하세요, 갑작스러운 요청에도 시간 내 주셔서 감사합니다."},{"sp":"B","en":"Of course. We're glad to finally connect with your team.","ko":"당연하죠. 드디어 귀사 팀과 연결되어 기쁩니다."},{"sp":"A","en":"I lead interior design for our IP and door trim programs, so I'll be your main technical contact.","ko":"저는 IP와 도어트림 프로그램의 내장설계를 총괄하고 있어, 주요 기술 창구가 될 것입니다."},{"sp":"B","en":"Understood. Would you like us to start with a company overview?","ko":"알겠습니다. 회사 개요부터 시작할까요?"},{"sp":"A","en":"Please. I'm especially interested in your experience with global OEM programs.","ko":"네. 특히 글로벌 OEM 프로그램 경험이 궁금합니다."},{"sp":"B","en":"We currently supply trim components to two European OEMs.","ko":"현재 두 곳의 유럽 OEM에 트림 부품을 공급하고 있습니다."},{"sp":"A","en":"That's encouraging. We may have a strong fit on our upcoming console program.","ko":"고무적이네요. 차기 콘솔 프로그램에서 잘 맞을 수 있겠습니다."},{"sp":"A","en":"Let me review your profile internally and we'll set up a technical deep-dive next week.","ko":"내부적으로 프로필을 검토한 뒤, 다음 주에 기술 심화 미팅을 잡겠습니다."}],"vocab":[{"t":"Tier-1 supplier","ko":"1차 협력사"},{"t":"capabilities","ko":"역량"},{"t":"prototype","ko":"시제품"},{"t":"mass production","ko":"양산"},{"t":"platform","ko":"플랫폼(차량 기반 구조)"},{"t":"good fit","ko":"잘 맞음, 적합"},{"t":"follow-up","ko":"후속 조치"}],"drill":[{"ko":"오늘 시간 내 주셔서 감사합니다.","en":"Thank you for taking the time to meet with us today."},{"ko":"신규 1차 협력사를 검토하고 있습니다.","en":"We're exploring potential Tier-1 suppliers."},{"ko":"귀사의 역량을 소개해 주시겠습니까?","en":"Could you walk us through your capabilities?"},{"ko":"시제품부터 양산까지 지원할 파트너가 필요합니다.","en":"We need a partner who can support us from prototype to mass production."},{"ko":"내부 검토 후 후속 미팅을 잡겠습니다.","en":"Let's set up a follow-up once we've reviewed your profile internally."}],"tip":"첫 컨택에서는 본인의 역할(main technical contact)을 명확히 밝히면 이후 커뮤니케이션 창구가 정리됩니다. 회사 자랑보다 'best fit'을 함께 찾자는 협업 톤이 효과적입니다."},{"n":42,"title":"견적 요청(RFQ)","scene":"선정된 후보 공급사에 콘솔 어셈블리에 대한 정식 견적 요청서(RFQ)를 발송하며 핵심 조건을 설명합니다.","goal":"RFQ의 범위, 사양, 제출 기한과 제출 양식을 명확하고 빠짐없이 전달할 수 있다.","expressions":[{"en":"We'd like to invite you to quote on our center console assembly.","ko":"센터 콘솔 어셈블리에 대한 견적에 참여해 주시기 바랍니다."},{"en":"Please find the RFQ package and 3D data attached.","ko":"첨부된 RFQ 패키지와 3D 데이터를 확인해 주십시오."},{"en":"The quote should cover tooling, piece price, and packaging.","ko":"견적에는 금형비, 단가, 포장비가 포함되어야 합니다."},{"en":"We need a breakdown of material and labor costs.","ko":"재료비와 인건비 내역을 구분해 주셔야 합니다."},{"en":"Please base your pricing on an annual volume of 80,000 units.","ko":"연간 8만 대 물량 기준으로 가격을 산정해 주십시오."},{"en":"The quote is due by close of business next Friday.","ko":"견적 마감은 다음 주 금요일 업무 종료 시점입니다."},{"en":"Let us know if any of the specifications are unclear.","ko":"사양 중 불명확한 부분이 있으면 알려 주십시오."},{"en":"Submissions should follow the cost breakdown template provided.","ko":"제출은 제공된 원가 분석 양식을 따라 주십시오."}],"dialogue":[{"sp":"A","en":"I'm sending over the RFQ for our center console assembly today.","ko":"오늘 센터 콘솔 어셈블리 RFQ를 보내 드리겠습니다."},{"sp":"B","en":"Great. What's included in the package?","ko":"좋습니다. 패키지에 무엇이 포함되어 있나요?"},{"sp":"A","en":"Drawings, 3D data, the technical spec, and our cost breakdown template.","ko":"도면, 3D 데이터, 기술 사양서, 그리고 원가 분석 양식입니다."},{"sp":"B","en":"Understood. What volume should we base our pricing on?","ko":"알겠습니다. 어떤 물량 기준으로 가격을 산정할까요?"},{"sp":"A","en":"Please quote at 80,000 units per year over a four-year program.","ko":"4년 프로그램 기준 연 8만 대로 견적해 주십시오."},{"sp":"B","en":"And do you need tooling quoted separately?","ko":"금형비는 별도로 견적해야 하나요?"},{"sp":"A","en":"Yes, please separate tooling, piece price, and packaging.","ko":"네, 금형비, 단가, 포장비를 구분해 주십시오."},{"sp":"A","en":"The submission is due by close of business next Friday, so reach out early if anything is unclear.","ko":"제출 마감은 다음 주 금요일 업무 종료 시점이니, 불명확한 점은 일찍 문의해 주십시오."}],"vocab":[{"t":"RFQ (request for quote)","ko":"견적 요청서"},{"t":"tooling","ko":"금형비, 공구비"},{"t":"piece price","ko":"단가"},{"t":"cost breakdown","ko":"원가 분석 내역"},{"t":"annual volume","ko":"연간 물량"},{"t":"specification (spec)","ko":"사양"},{"t":"close of business","ko":"업무 종료 시점"}],"drill":[{"ko":"콘솔 어셈블리 견적에 참여해 주시기 바랍니다.","en":"We'd like to invite you to quote on our console assembly."},{"ko":"견적에는 금형비, 단가, 포장비가 포함되어야 합니다.","en":"The quote should cover tooling, piece price, and packaging."},{"ko":"연 8만 대 기준으로 가격을 산정해 주십시오.","en":"Please base your pricing on an annual volume of 80,000 units."},{"ko":"재료비와 인건비 내역을 구분해 주셔야 합니다.","en":"We need a breakdown of material and labor costs."},{"ko":"견적 마감은 다음 주 금요일 업무 종료 시점입니다.","en":"The quote is due by close of business next Friday."}],"tip":"RFQ는 범위(scope)를 처음부터 못 박는 게 핵심입니다. tooling / piece price / packaging을 분리 요청하면 나중에 'apples-to-apples' 비교가 쉬워집니다."},{"n":43,"title":"견적 검토와 질의","scene":"접수된 공급사 견적을 검토한 뒤, 단가 산정 근거와 누락 항목에 대해 질의하는 미팅입니다.","goal":"견적의 모호한 부분을 짚어 합리적 근거를 요구하고 비교 가능한 정보를 확보할 수 있다.","expressions":[{"en":"We've reviewed your quote and have a few questions.","ko":"견적을 검토했고 몇 가지 질문이 있습니다."},{"en":"Could you clarify how you arrived at the piece price?","ko":"단가를 어떻게 산정하셨는지 설명해 주시겠습니까?"},{"en":"The material cost seems higher than the market benchmark.","ko":"재료비가 시장 기준보다 높아 보입니다."},{"en":"It looks like packaging wasn't included in the breakdown.","ko":"원가 내역에 포장비가 빠진 것 같습니다."},{"en":"What assumptions did you use for the labor rate?","ko":"인건비 단가는 어떤 가정으로 잡으셨나요?"},{"en":"Can you justify the tooling amortization schedule?","ko":"금형 상각 스케줄에 대한 근거를 설명해 주시겠습니까?"},{"en":"We'd need an itemized list to compare quotes fairly.","ko":"공정한 비교를 위해 항목별 내역이 필요합니다."},{"en":"Please resubmit with the corrected breakdown by Wednesday.","ko":"수정된 내역으로 수요일까지 재제출해 주십시오."}],"dialogue":[{"sp":"A","en":"Thanks for the quote. Overall it's competitive, but I have a few questions.","ko":"견적 감사합니다. 전반적으로 경쟁력 있지만 몇 가지 질문이 있습니다."},{"sp":"B","en":"Sure, please go ahead.","ko":"네, 말씀하세요."},{"sp":"A","en":"Could you clarify how you arrived at the piece price?","ko":"단가를 어떻게 산정하셨는지 설명해 주시겠습니까?"},{"sp":"B","en":"It's based on resin cost plus a standard processing margin.","ko":"수지 가격에 표준 가공 마진을 더한 값입니다."},{"sp":"A","en":"I see, but the material cost looks higher than our benchmark.","ko":"그렇군요, 다만 재료비가 저희 기준치보다 높아 보입니다."},{"sp":"B","en":"We can revisit the resin grade if you allow an alternative.","ko":"대체재를 허용해 주시면 수지 등급을 재검토할 수 있습니다."},{"sp":"A","en":"Please do, and also add packaging—it seems to be missing from the breakdown.","ko":"그렇게 해 주시고, 포장비도 추가해 주세요. 내역에서 빠진 것 같습니다."},{"sp":"A","en":"An itemized resubmission by Wednesday would let us compare fairly.","ko":"수요일까지 항목별로 재제출해 주시면 공정하게 비교할 수 있겠습니다."}],"vocab":[{"t":"benchmark","ko":"기준치, 비교 기준"},{"t":"breakdown","ko":"내역"},{"t":"labor rate","ko":"인건비 단가"},{"t":"amortization","ko":"상각"},{"t":"itemized","ko":"항목별로 구분된"},{"t":"assumption","ko":"가정"},{"t":"resubmit","ko":"재제출하다"}],"drill":[{"ko":"단가를 어떻게 산정하셨는지 설명해 주시겠습니까?","en":"Could you clarify how you arrived at the piece price?"},{"ko":"재료비가 시장 기준보다 높아 보입니다.","en":"The material cost seems higher than the market benchmark."},{"ko":"원가 내역에 포장비가 빠진 것 같습니다.","en":"It looks like packaging wasn't included in the breakdown."},{"ko":"공정한 비교를 위해 항목별 내역이 필요합니다.","en":"We'd need an itemized list to compare quotes fairly."},{"ko":"수정된 내역으로 수요일까지 재제출해 주십시오.","en":"Please resubmit with the corrected breakdown by Wednesday."}],"tip":"견적 질의는 비난이 아니라 '근거 요청'으로 프레이밍하세요. 'How did you arrive at...?'는 압박을 주면서도 협력적으로 들립니다."},{"n":44,"title":"납기·물량 협의","scene":"양산 일정에 맞춰 공급사와 최소주문수량(MOQ), 리드타임, 분할 납품 일정을 조율하는 협의입니다.","goal":"생산 일정을 보호하면서 현실적인 납기와 물량 조건을 합의할 수 있다.","expressions":[{"en":"We need to align on lead time and delivery schedule.","ko":"리드타임과 납품 일정을 맞춰야 합니다."},{"en":"What's your standard lead time for this part?","ko":"이 부품의 표준 리드타임은 어떻게 되나요?"},{"en":"Our line needs the first lot by the end of March.","ko":"저희 라인은 3월 말까지 초도 물량이 필요합니다."},{"en":"Is the MOQ negotiable for the launch phase?","ko":"출시 초기에는 최소주문수량 조정이 가능한가요?"},{"en":"Can you support a phased delivery rather than one bulk shipment?","ko":"일괄 출하 대신 분할 납품이 가능한가요?"},{"en":"We'd like a buffer stock to cover demand spikes.","ko":"수요 급증에 대비해 완충 재고를 두고 싶습니다."},{"en":"A four-week lead time is tight but workable on our end.","ko":"4주 리드타임은 빠듯하지만 저희 쪽에서는 가능합니다."},{"en":"Let's confirm the delivery milestones in writing.","ko":"납품 마일스톤을 문서로 확정합시다."}],"dialogue":[{"sp":"A","en":"Before we finalize, we need to align on lead time and volumes.","ko":"확정 전에 리드타임과 물량을 맞춰야 합니다."},{"sp":"B","en":"Our standard lead time after PO is six weeks.","ko":"발주 후 표준 리드타임은 6주입니다."},{"sp":"A","en":"That's a problem—our line needs the first lot by the end of March.","ko":"그건 문제입니다. 저희 라인은 3월 말까지 초도 물량이 필요합니다."},{"sp":"B","en":"We could prioritize the first batch if you place the PO early.","ko":"조기 발주해 주시면 초도 배치를 우선 처리할 수 있습니다."},{"sp":"A","en":"Good. Can you also support phased delivery instead of one bulk shipment?","ko":"좋습니다. 일괄 출하 대신 분할 납품도 가능할까요?"},{"sp":"B","en":"Yes, but the MOQ per shipment would apply.","ko":"네, 다만 출하당 최소주문수량은 적용됩니다."},{"sp":"A","en":"Understood. Can the MOQ flex during the launch phase only?","ko":"알겠습니다. 출시 초기에 한해 MOQ 조정이 가능할까요?"},{"sp":"A","en":"Let's lock the delivery milestones in writing so both lines stay protected.","ko":"양측 라인이 보호되도록 납품 마일스톤을 문서로 확정합시다."}],"vocab":[{"t":"lead time","ko":"리드타임, 조달 기간"},{"t":"MOQ (minimum order quantity)","ko":"최소주문수량"},{"t":"phased delivery","ko":"분할 납품"},{"t":"buffer stock","ko":"완충 재고"},{"t":"PO (purchase order)","ko":"발주서"},{"t":"milestone","ko":"마일스톤, 중요 일정"},{"t":"bulk shipment","ko":"일괄 출하"}],"drill":[{"ko":"이 부품의 표준 리드타임은 어떻게 되나요?","en":"What's your standard lead time for this part?"},{"ko":"저희 라인은 3월 말까지 초도 물량이 필요합니다.","en":"Our line needs the first lot by the end of March."},{"ko":"출시 초기에는 MOQ 조정이 가능한가요?","en":"Is the MOQ negotiable for the launch phase?"},{"ko":"일괄 출하 대신 분할 납품이 가능한가요?","en":"Can you support a phased delivery rather than one bulk shipment?"},{"ko":"납품 마일스톤을 문서로 확정합시다.","en":"Let's confirm the delivery milestones in writing."}],"tip":"납기 협의에서 'tight but workable'처럼 어려움을 인정하면서도 협조 의지를 보이면 상대도 우선순위를 조정해 줄 명분이 생깁니다."},{"n":45,"title":"품질 이슈 제기","scene":"입고된 도어트림 부품에서 표면 결함과 치수 불량이 발견되어 공급사에 사실을 알리고 대응을 요청합니다.","goal":"감정을 배제하고 사실에 근거해 품질 문제를 명확히 전달하고 즉각적 봉쇄 조치를 요구할 수 있다.","expressions":[{"en":"We've identified a quality issue with the latest shipment.","ko":"최근 입고분에서 품질 이슈를 발견했습니다."},{"en":"We're seeing surface defects on about 12% of the parts.","ko":"부품의 약 12%에서 표면 결함이 보입니다."},{"en":"The dimensions are out of tolerance on the mounting points.","ko":"체결부 치수가 공차를 벗어났습니다."},{"en":"This is impacting our assembly line.","ko":"이 문제가 저희 조립 라인에 영향을 주고 있습니다."},{"en":"We need immediate containment on the affected lots.","ko":"해당 로트에 대한 즉각적인 봉쇄 조치가 필요합니다."},{"en":"I've attached photos and the inspection report.","ko":"사진과 검사 보고서를 첨부했습니다."},{"en":"Can you confirm whether other lots are affected?","ko":"다른 로트도 영향을 받았는지 확인해 주시겠습니까?"},{"en":"We'll need a formal response within 24 hours.","ko":"24시간 이내에 공식 답변이 필요합니다."}],"dialogue":[{"sp":"A","en":"I'm calling because we've identified a quality issue with the latest shipment.","ko":"최근 입고분에서 품질 이슈가 발견되어 연락드립니다."},{"sp":"B","en":"I'm sorry to hear that. What exactly are you seeing?","ko":"죄송합니다. 정확히 어떤 문제인가요?"},{"sp":"A","en":"Surface defects on about 12% of parts, and dimensions out of tolerance on the mounting points.","ko":"부품의 약 12%에 표면 결함, 그리고 체결부 치수가 공차를 벗어났습니다."},{"sp":"B","en":"Understood. Can you send us the inspection data?","ko":"알겠습니다. 검사 데이터를 보내 주시겠습니까?"},{"sp":"A","en":"I've already attached photos and the report to my email.","ko":"이미 사진과 보고서를 메일에 첨부해 두었습니다."},{"sp":"B","en":"Thank you. We'll start an internal review right away.","ko":"감사합니다. 즉시 내부 검토에 착수하겠습니다."},{"sp":"A","en":"First, we need immediate containment on the affected lots—this is stopping our line.","ko":"우선 해당 로트에 즉각적인 봉쇄 조치가 필요합니다. 라인이 멈추고 있습니다."},{"sp":"A","en":"Please confirm whether other lots are affected and send a formal response within 24 hours.","ko":"다른 로트 영향 여부를 확인하고 24시간 내 공식 답변을 주십시오."}],"vocab":[{"t":"defect","ko":"결함"},{"t":"out of tolerance","ko":"공차를 벗어난"},{"t":"containment","ko":"봉쇄 조치"},{"t":"lot","ko":"로트, 생산 묶음"},{"t":"inspection report","ko":"검사 보고서"},{"t":"shipment","ko":"입고분, 출하분"},{"t":"mounting point","ko":"체결부, 장착점"}],"drill":[{"ko":"최근 입고분에서 품질 이슈를 발견했습니다.","en":"We've identified a quality issue with the latest shipment."},{"ko":"체결부 치수가 공차를 벗어났습니다.","en":"The dimensions are out of tolerance on the mounting points."},{"ko":"해당 로트에 대한 즉각적인 봉쇄 조치가 필요합니다.","en":"We need immediate containment on the affected lots."},{"ko":"다른 로트도 영향을 받았는지 확인해 주시겠습니까?","en":"Can you confirm whether other lots are affected?"},{"ko":"24시간 이내에 공식 답변이 필요합니다.","en":"We'll need a formal response within 24 hours."}],"tip":"품질 이슈 제기는 비난(blame)이 아니라 데이터(data)로 시작하세요. 수치와 사진을 먼저 제시하면 상대가 방어 대신 해결 모드로 전환합니다. 'containment first'가 자동차 품질의 철칙입니다."},{"n":46,"title":"시정조치 요구(CAR·8D)","scene":"반복되는 불량에 대해 공급사에 공식 시정조치 요구서(CAR)와 8D 보고서를 요청하고 일정을 합의합니다.","goal":"근본 원인 분석과 재발 방지를 포함한 체계적 시정조치를 기한과 함께 요구할 수 있다.","expressions":[{"en":"We're issuing a formal corrective action request.","ko":"공식 시정조치 요구서를 발행합니다."},{"en":"We need a full 8D report on this issue.","ko":"이 이슈에 대해 완전한 8D 보고서가 필요합니다."},{"en":"Please identify the root cause, not just the symptom.","ko":"증상이 아니라 근본 원인을 규명해 주십시오."},{"en":"We expect interim containment within 48 hours.","ko":"48시간 내에 임시 봉쇄 조치를 기대합니다."},{"en":"What permanent corrective actions are you proposing?","ko":"어떤 영구 시정조치를 제안하십니까?"},{"en":"How will you verify the effectiveness of the fix?","ko":"조치의 유효성을 어떻게 검증하실 건가요?"},{"en":"We need to prevent recurrence across all lines.","ko":"전 라인에서 재발을 방지해야 합니다."},{"en":"The 8D is due within ten working days.","ko":"8D 보고서는 영업일 기준 10일 내 제출입니다."}],"dialogue":[{"sp":"A","en":"Given the repeat occurrence, we're issuing a formal corrective action request.","ko":"반복 발생을 고려해 공식 시정조치 요구서를 발행합니다."},{"sp":"B","en":"Understood. We take this seriously and will respond.","ko":"알겠습니다. 심각하게 받아들이고 대응하겠습니다."},{"sp":"A","en":"We need a full 8D, with root cause—not just the symptom.","ko":"근본 원인을 포함한 완전한 8D가 필요합니다. 증상만이 아니라요."},{"sp":"B","en":"We'll run a five-why analysis with our process engineers.","ko":"공정 엔지니어와 함께 5-why 분석을 진행하겠습니다."},{"sp":"A","en":"Good. We also expect interim containment within 48 hours.","ko":"좋습니다. 또한 48시간 내 임시 봉쇄 조치를 기대합니다."},{"sp":"B","en":"We can sort and screen current inventory immediately.","ko":"현재 재고를 즉시 선별 검사할 수 있습니다."},{"sp":"A","en":"And how will you verify the permanent fix is effective?","ko":"그리고 영구 조치의 유효성은 어떻게 검증하실 건가요?"},{"sp":"A","en":"Please make sure it prevents recurrence across all lines; the full 8D is due in ten working days.","ko":"전 라인 재발 방지가 되도록 해 주시고, 완전한 8D는 영업일 10일 내 제출입니다."}],"vocab":[{"t":"corrective action request (CAR)","ko":"시정조치 요구서"},{"t":"8D report","ko":"8D 보고서(8단계 문제해결)"},{"t":"root cause","ko":"근본 원인"},{"t":"interim containment","ko":"임시 봉쇄 조치"},{"t":"recurrence","ko":"재발"},{"t":"five-why analysis","ko":"5-why 분석"},{"t":"effectiveness","ko":"유효성"}],"drill":[{"ko":"공식 시정조치 요구서를 발행합니다.","en":"We're issuing a formal corrective action request."},{"ko":"증상이 아니라 근본 원인을 규명해 주십시오.","en":"Please identify the root cause, not just the symptom."},{"ko":"48시간 내에 임시 봉쇄 조치를 기대합니다.","en":"We expect interim containment within 48 hours."},{"ko":"조치의 유효성을 어떻게 검증하실 건가요?","en":"How will you verify the effectiveness of the fix?"},{"ko":"8D 보고서는 영업일 기준 10일 내 제출입니다.","en":"The 8D is due within ten working days."}],"tip":"CAR/8D 요구의 핵심은 'symptom'과 'root cause'를 구분하는 것입니다. 'interim containment(임시)'와 'permanent corrective action(영구)'을 분리해 요구하면 공급사가 단기 미봉책으로 끝내는 걸 막을 수 있습니다."},{"n":47,"title":"공급사 평가·감사(Audit)","scene":"공급사 현장을 방문해 공정 관리, 품질 시스템, 추적성을 점검하는 정기 감사를 진행합니다.","goal":"감사 항목을 체계적으로 점검하고 부적합 사항과 개선 기한을 명확히 합의할 수 있다.","expressions":[{"en":"We're here for the scheduled supplier audit.","ko":"예정된 공급사 감사를 위해 방문했습니다."},{"en":"We'll be assessing your process controls and quality system.","ko":"공정 관리와 품질 시스템을 평가하겠습니다."},{"en":"Could you walk us through your traceability process?","ko":"추적성 프로세스를 설명해 주시겠습니까?"},{"en":"We'd like to review your control plan for this part.","ko":"이 부품의 관리 계획서를 확인하고 싶습니다."},{"en":"How do you handle nonconforming material?","ko":"부적합 자재는 어떻게 처리하시나요?"},{"en":"We've noted a few findings that need to be addressed.","ko":"조치가 필요한 몇 가지 부적합 사항을 기록했습니다."},{"en":"This is a minor finding, but we'll need a closure plan.","ko":"경미한 부적합이지만 시정 계획이 필요합니다."},{"en":"Let's agree on a timeline to close out the findings.","ko":"부적합 사항 종결 일정을 합의합시다."}],"dialogue":[{"sp":"A","en":"Good morning—we're here for the scheduled supplier audit.","ko":"안녕하세요, 예정된 공급사 감사를 위해 방문했습니다."},{"sp":"B","en":"Welcome. We've prepared the documentation you requested.","ko":"환영합니다. 요청하신 문서를 준비해 두었습니다."},{"sp":"A","en":"Thank you. Let's start with your traceability process on the shop floor.","ko":"감사합니다. 현장의 추적성 프로세스부터 시작하겠습니다."},{"sp":"B","en":"Each lot is barcoded and logged at every station.","ko":"각 로트는 바코드로 관리되며 모든 공정에서 기록됩니다."},{"sp":"A","en":"Good. Now, how do you handle nonconforming material?","ko":"좋습니다. 그럼 부적합 자재는 어떻게 처리하시나요?"},{"sp":"B","en":"It's quarantined in a red-tag area pending disposition.","ko":"처분 결정 전까지 적색 태그 구역에 격리합니다."},{"sp":"A","en":"I've noted one minor finding on your calibration records.","ko":"교정 기록에서 경미한 부적합 하나를 기록했습니다."},{"sp":"A","en":"It's not critical, but let's agree on a timeline to close it out.","ko":"심각하진 않지만, 종결 일정을 합의합시다."}],"vocab":[{"t":"audit","ko":"감사"},{"t":"process control","ko":"공정 관리"},{"t":"traceability","ko":"추적성"},{"t":"control plan","ko":"관리 계획서"},{"t":"nonconforming material","ko":"부적합 자재"},{"t":"finding","ko":"부적합 사항, 지적 사항"},{"t":"closure plan","ko":"시정 종결 계획"}],"drill":[{"ko":"공정 관리와 품질 시스템을 평가하겠습니다.","en":"We'll be assessing your process controls and quality system."},{"ko":"추적성 프로세스를 설명해 주시겠습니까?","en":"Could you walk us through your traceability process?"},{"ko":"부적합 자재는 어떻게 처리하시나요?","en":"How do you handle nonconforming material?"},{"ko":"경미한 부적합이지만 시정 계획이 필요합니다.","en":"This is a minor finding, but we'll need a closure plan."},{"ko":"부적합 사항 종결 일정을 합의합시다.","en":"Let's agree on a timeline to close out the findings."}],"tip":"감사에서는 'finding'을 critical / major / minor로 등급화하면 공급사가 우선순위를 정하기 쉽습니다. 적대적 톤보다 'close out together' 협력 톤이 장기 관계에 유리합니다."},{"n":48,"title":"단가·원가 절감(VA·VE) 논의","scene":"양산 진행 부품에 대해 공급사와 함께 가치공학(VE) 아이디어로 원가를 절감하는 워크숍을 엽니다.","goal":"품질을 유지하면서 설계 변경과 공정 개선으로 원가를 절감하는 아이디어를 함께 도출할 수 있다.","expressions":[{"en":"We'd like to run a VA/VE workshop on this component.","ko":"이 부품에 대해 VA/VE 워크숍을 진행하고 싶습니다."},{"en":"Our target is a 7% cost reduction without compromising quality.","ko":"품질을 해치지 않고 7% 원가 절감이 목표입니다."},{"en":"Are there design changes that could simplify the tooling?","ko":"금형을 단순화할 수 있는 설계 변경이 있을까요?"},{"en":"Could we consolidate parts to reduce assembly steps?","ko":"부품을 통합해 조립 공정을 줄일 수 있을까요?"},{"en":"Is there a lower-cost material that meets the same spec?","ko":"동일 사양을 만족하는 더 저렴한 소재가 있나요?"},{"en":"Let's quantify the savings for each idea.","ko":"각 아이디어의 절감액을 정량화합시다."},{"en":"We'd share the savings on a fifty-fifty basis.","ko":"절감액은 50대 50으로 공유하겠습니다."},{"en":"Any change has to keep the part within tolerance.","ko":"어떤 변경이든 부품이 공차 내에 있어야 합니다."}],"dialogue":[{"sp":"A","en":"Thanks for joining—we'd like to run a VA/VE workshop on the door trim panel.","ko":"참석해 주셔서 감사합니다. 도어트림 패널에 대해 VA/VE 워크숍을 진행하고 싶습니다."},{"sp":"B","en":"Happy to. What's the target?","ko":"기꺼이요. 목표가 어떻게 되나요?"},{"sp":"A","en":"A 7% cost reduction without compromising quality.","ko":"품질을 해치지 않고 7% 원가 절감입니다."},{"sp":"B","en":"We could switch to a single-shot molding to cut a step.","ko":"단일 사출로 전환해 공정 하나를 줄일 수 있습니다."},{"sp":"A","en":"Interesting. Would that keep the part within tolerance?","ko":"흥미롭네요. 그래도 부품이 공차 내에 들어올까요?"},{"sp":"B","en":"Yes, our trials show it holds. We could also consolidate the clips.","ko":"네, 시험 결과 유지됩니다. 클립도 통합할 수 있고요."},{"sp":"A","en":"Let's quantify the savings for each idea before we commit.","ko":"확정 전에 각 아이디어의 절감액을 정량화합시다."},{"sp":"A","en":"And to keep you motivated, we'd share the savings fifty-fifty.","ko":"그리고 동기 부여를 위해 절감액은 50대 50으로 나누겠습니다."}],"vocab":[{"t":"VA/VE (value analysis/value engineering)","ko":"가치분석/가치공학"},{"t":"cost reduction","ko":"원가 절감"},{"t":"part consolidation","ko":"부품 통합"},{"t":"tooling","ko":"금형"},{"t":"single-shot molding","ko":"단일 사출 성형"},{"t":"savings","ko":"절감액"},{"t":"within tolerance","ko":"공차 내의"}],"drill":[{"ko":"품질을 해치지 않고 7% 원가 절감이 목표입니다.","en":"Our target is a 7% cost reduction without compromising quality."},{"ko":"금형을 단순화할 수 있는 설계 변경이 있을까요?","en":"Are there design changes that could simplify the tooling?"},{"ko":"동일 사양을 만족하는 더 저렴한 소재가 있나요?","en":"Is there a lower-cost material that meets the same spec?"},{"ko":"각 아이디어의 절감액을 정량화합시다.","en":"Let's quantify the savings for each idea."},{"ko":"어떤 변경이든 부품이 공차 내에 있어야 합니다.","en":"Any change has to keep the part within tolerance."}],"tip":"VA/VE는 공급사를 쥐어짜는 게 아니라 함께 파이를 키우는 협업입니다. 'share the savings'로 인센티브를 주면 공급사가 자발적으로 아이디어를 냅니다. 'without compromising quality'를 반드시 명시하세요."},{"n":49,"title":"공급사 관계 관리","scene":"장기 핵심 공급사와 분기 사업 검토(QBR) 미팅을 갖고 성과를 평가하며 관계를 강화합니다.","goal":"성과 데이터를 공유하고 신뢰를 유지하면서 개선 과제와 향후 협력 방향을 합의할 수 있다.","expressions":[{"en":"Thanks for being a reliable partner this past quarter.","ko":"지난 분기 동안 믿음직한 파트너가 되어 주셔서 감사합니다."},{"en":"Let's review your scorecard for the quarter.","ko":"이번 분기 성과표를 함께 살펴보시죠."},{"en":"Your on-time delivery has been excellent at 99%.","ko":"정시 납품률이 99%로 매우 우수했습니다."},{"en":"There's room for improvement on PPM levels.","ko":"불량률(PPM) 측면에서 개선 여지가 있습니다."},{"en":"We value this relationship and want it to grow.","ko":"이 관계를 소중히 여기며 더 발전시키고 싶습니다."},{"en":"How can we support you in meeting these targets?","ko":"이 목표를 달성하는 데 저희가 어떻게 도울 수 있을까요?"},{"en":"We'd like to give you a larger share on the next program.","ko":"차기 프로그램에서 더 큰 물량을 드리고 싶습니다."},{"en":"Let's set joint goals for the coming quarter.","ko":"다음 분기 공동 목표를 설정합시다."}],"dialogue":[{"sp":"A","en":"Thanks for joining our quarterly business review—you've been a reliable partner.","ko":"분기 사업 검토에 참석해 주셔서 감사합니다. 믿음직한 파트너셨습니다."},{"sp":"B","en":"We appreciate that. How did we do on the scorecard?","ko":"감사합니다. 성과표는 어땠나요?"},{"sp":"A","en":"On-time delivery was excellent at 99%, but PPM ticked up slightly.","ko":"정시 납품은 99%로 우수했지만, PPM이 약간 올랐습니다."},{"sp":"B","en":"We saw that too—it's tied to the new resin batch.","ko":"저희도 확인했습니다. 신규 수지 배치와 관련이 있습니다."},{"sp":"A","en":"How can we support you in bringing that back down?","ko":"그 수치를 다시 낮추는 데 저희가 어떻게 도울 수 있을까요?"},{"sp":"B","en":"Earlier visibility into your forecast would help us plan.","ko":"수요 예측을 더 일찍 공유해 주시면 계획에 도움이 됩니다."},{"sp":"A","en":"Done. And given your overall performance, we'd like to give you a larger share next program.","ko":"그렇게 하겠습니다. 그리고 전반적 성과를 보아 차기 프로그램에서 더 큰 물량을 드리고 싶습니다."},{"sp":"A","en":"Let's set joint goals for the coming quarter and revisit them next QBR.","ko":"다음 분기 공동 목표를 정하고 다음 QBR에서 다시 점검합시다."}],"vocab":[{"t":"scorecard","ko":"성과표"},{"t":"on-time delivery (OTD)","ko":"정시 납품"},{"t":"PPM (parts per million)","ko":"불량률(백만분율)"},{"t":"QBR (quarterly business review)","ko":"분기 사업 검토"},{"t":"forecast","ko":"수요 예측"},{"t":"share (of business)","ko":"물량 배분, 거래 비중"},{"t":"joint goals","ko":"공동 목표"}],"drill":[{"ko":"이번 분기 성과표를 함께 살펴보시죠.","en":"Let's review your scorecard for the quarter."},{"ko":"정시 납품률이 99%로 매우 우수했습니다.","en":"Your on-time delivery has been excellent at 99%."},{"ko":"이 목표를 달성하는 데 저희가 어떻게 도울 수 있을까요?","en":"How can we support you in meeting these targets?"},{"ko":"차기 프로그램에서 더 큰 물량을 드리고 싶습니다.","en":"We'd like to give you a larger share on the next program."},{"ko":"다음 분기 공동 목표를 설정합시다.","en":"Let's set joint goals for the coming quarter."}],"tip":"관계 관리는 칭찬과 개선 요구의 균형입니다. 'How can we support you?'처럼 책임을 양방향으로 두면 공급사가 방어적이지 않게 됩니다. 좋은 성과에는 더 큰 물량이라는 실질적 보상을 연결하세요."},{"n":50,"title":"클레임·분쟁 대응","scene":"공급사 결함으로 라인 정지와 추가 비용이 발생해 손해 배상 청구(클레임)를 제기하고 책임 분담을 논의합니다.","goal":"사실과 계약 근거에 기반해 클레임을 제기하고 감정적 대립 없이 합리적 합의점을 찾을 수 있다.","expressions":[{"en":"We're formally filing a claim for the line-down costs.","ko":"라인 정지 비용에 대해 정식으로 클레임을 제기합니다."},{"en":"The defect caused a four-hour line stoppage.","ko":"그 결함으로 4시간 라인 정지가 발생했습니다."},{"en":"Per our agreement, the supplier bears these costs.","ko":"계약에 따라 이 비용은 공급사가 부담합니다."},{"en":"We've documented all associated costs.","ko":"관련 비용을 모두 문서화했습니다."},{"en":"We're open to discussing how the costs are shared.","ko":"비용 분담 방식에 대해 논의할 의향이 있습니다."},{"en":"Let's focus on a fair resolution, not on blame.","ko":"비난보다 공정한 해결에 집중합시다."},{"en":"We'd like to settle this without escalating further.","ko":"더 확대하지 않고 이 건을 마무리하고 싶습니다."},{"en":"Can we agree on a compensation figure today?","ko":"오늘 배상 금액에 합의할 수 있을까요?"}],"dialogue":[{"sp":"A","en":"We're formally filing a claim for the costs from last week's defect.","ko":"지난주 결함으로 발생한 비용에 대해 정식으로 클레임을 제기합니다."},{"sp":"B","en":"We understand. Can you share the cost details?","ko":"이해합니다. 비용 내역을 공유해 주시겠습니까?"},{"sp":"A","en":"The defect caused a four-hour line stoppage; all costs are documented.","ko":"그 결함으로 4시간 라인 정지가 발생했고, 모든 비용은 문서화되어 있습니다."},{"sp":"B","en":"The figure is significant. Some of the overtime seems indirect.","ko":"금액이 상당하네요. 일부 잔업 비용은 간접적인 것 같습니다."},{"sp":"A","en":"Per our agreement, the supplier bears direct line-down costs, but we're open to discussing the rest.","ko":"계약상 직접 라인 정지 비용은 공급사 부담이지만, 나머지는 논의할 의향이 있습니다."},{"sp":"B","en":"We appreciate that. Could we share the overtime portion?","ko":"감사합니다. 잔업 부분은 분담할 수 있을까요?"},{"sp":"A","en":"That's reasonable. Let's focus on a fair resolution, not on blame.","ko":"합리적입니다. 비난보다 공정한 해결에 집중합시다."},{"sp":"A","en":"If we can agree on a figure today, we'd rather settle without escalating.","ko":"오늘 금액에 합의할 수 있다면, 확대 없이 마무리하고 싶습니다."}],"vocab":[{"t":"claim","ko":"클레임, 배상 청구"},{"t":"line-down cost","ko":"라인 정지 비용"},{"t":"line stoppage","ko":"라인 정지"},{"t":"compensation","ko":"배상, 보상"},{"t":"resolution","ko":"해결, 합의"},{"t":"escalate","ko":"(문제를) 확대하다, 상부로 올리다"},{"t":"settle","ko":"합의하여 마무리하다"}],"drill":[{"ko":"라인 정지 비용에 대해 정식으로 클레임을 제기합니다.","en":"We're formally filing a claim for the line-down costs."},{"ko":"계약에 따라 이 비용은 공급사가 부담합니다.","en":"Per our agreement, the supplier bears these costs."},{"ko":"비용 분담 방식에 대해 논의할 의향이 있습니다.","en":"We're open to discussing how the costs are shared."},{"ko":"비난보다 공정한 해결에 집중합시다.","en":"Let's focus on a fair resolution, not on blame."},{"ko":"더 확대하지 않고 이 건을 마무리하고 싶습니다.","en":"We'd like to settle this without escalating further."}],"tip":"클레임은 강하게 시작하되(계약 근거 제시) 출구를 열어 두세요. 'open to discussing'과 'not on blame'은 상대의 체면을 살려 합의를 끌어냅니다. 장기 공급사라면 관계를 깨지 않는 settle이 소송보다 낫습니다."},{"n":51,"title":"협상 준비와 목표 설정","scene":"Tier-1과의 연간 단가 협상을 앞두고 내부 팀과 목표, 마지노선(BATNA), 전략을 정리하는 사전 회의입니다.","goal":"협상 목표, 양보 가능 범위, 최저 수용선을 명확히 정의하고 팀과 정렬할 수 있다.","expressions":[{"en":"Let's align on our objectives before we go in.","ko":"협상에 들어가기 전에 목표를 정렬합시다."},{"en":"Our target is a 5% reduction; our walk-away is 2%.","ko":"목표는 5% 인하, 마지노선은 2%입니다."},{"en":"What's our best alternative if this falls through?","ko":"이 협상이 결렬되면 우리의 최선의 대안은 무엇입니까?"},{"en":"We need to know where we can give and where we can't.","ko":"어디서 양보하고 어디서 안 되는지 알아야 합니다."},{"en":"Let's anticipate their likely counterarguments.","ko":"상대가 내놓을 만한 반론을 미리 예상해 봅시다."},{"en":"We should open higher than our actual target.","ko":"실제 목표보다 높게 제시하고 시작해야 합니다."},{"en":"Let's agree on who leads which part of the discussion.","ko":"누가 어떤 부분을 주도할지 정합시다."},{"en":"Our priority is volume security over price.","ko":"우리의 우선순위는 가격보다 물량 확보입니다."}],"dialogue":[{"sp":"A","en":"Before tomorrow's negotiation, let's align on our objectives.","ko":"내일 협상 전에 목표를 정렬합시다."},{"sp":"B","en":"Agreed. What's our target on price?","ko":"동의합니다. 가격 목표가 어떻게 되나요?"},{"sp":"A","en":"Our target is a 5% reduction, and our walk-away is 2%.","ko":"목표는 5% 인하, 마지노선은 2%입니다."},{"sp":"B","en":"And if they won't move past 2%?","ko":"상대가 2%를 넘기지 않으려 하면요?"},{"sp":"A","en":"Then we lean on our alternative—we have a second qualified source.","ko":"그러면 우리 대안에 기대야죠. 검증된 2차 공급처가 있습니다."},{"sp":"B","en":"Good leverage. Should we open higher than 5%?","ko":"좋은 협상력이네요. 5%보다 높게 제시할까요?"},{"sp":"A","en":"Yes, let's anchor at 8% so we have room to concede.","ko":"네, 8%로 앵커링해서 양보할 여지를 둡시다."},{"sp":"A","en":"Remember, our real priority is securing volume, so don't trade that away for a small price win.","ko":"다만 우리 진짜 우선순위는 물량 확보이니, 작은 가격 이득으로 그걸 내주지 맙시다."}],"vocab":[{"t":"objective","ko":"목표"},{"t":"walk-away (point)","ko":"마지노선, 협상 결렬점"},{"t":"BATNA (best alternative)","ko":"최선의 대안"},{"t":"leverage","ko":"협상력, 지렛대"},{"t":"anchor","ko":"앵커링, 기준점을 제시하다"},{"t":"concede","ko":"양보하다"},{"t":"priority","ko":"우선순위"}],"drill":[{"ko":"협상에 들어가기 전에 목표를 정렬합시다.","en":"Let's align on our objectives before we go in."},{"ko":"목표는 5% 인하, 마지노선은 2%입니다.","en":"Our target is a 5% reduction; our walk-away is 2%."},{"ko":"이 협상이 결렬되면 우리의 최선의 대안은 무엇입니까?","en":"What's our best alternative if this falls through?"},{"ko":"실제 목표보다 높게 제시하고 시작해야 합니다.","en":"We should open higher than our actual target."},{"ko":"우리의 우선순위는 가격보다 물량 확보입니다.","en":"Our priority is volume security over price."}],"tip":"협상의 90%는 준비에서 결정됩니다. target(목표)·walk-away(마지노선)·BATNA(대안) 세 가지를 숫자로 정하지 않고 협상장에 들어가면 즉흥적으로 양보하게 됩니다. 우선순위가 가격이 아닐 수도 있음을 팀과 합의해 두세요."},{"n":52,"title":"입장 제시와 근거 설명","scene":"단가 협상 본 회의에서 우리 측 인하 요구안을 제시하고 데이터로 그 근거를 설명합니다.","goal":"요구안을 명확히 제시하고 시장 데이터와 논리로 설득력 있게 정당화할 수 있다.","expressions":[{"en":"Let me lay out our position clearly.","ko":"저희 입장을 명확히 말씀드리겠습니다."},{"en":"We're asking for an 8% reduction this cycle.","ko":"이번 사이클에 8% 인하를 요청합니다."},{"en":"This is based on raw material prices dropping 12%.","ko":"이는 원자재 가격이 12% 하락한 데 근거합니다."},{"en":"The market benchmark supports this level.","ko":"시장 기준치가 이 수준을 뒷받침합니다."},{"en":"Our volume has grown, which lowers your per-unit cost.","ko":"물량이 늘어 단위당 원가가 낮아졌습니다."},{"en":"I want to be transparent about how we got to this number.","ko":"이 숫자에 도달한 과정을 투명하게 말씀드리고 싶습니다."},{"en":"Let me walk you through the data.","ko":"데이터를 함께 살펴보겠습니다."},{"en":"We believe this is both fair and sustainable.","ko":"이것이 공정하면서도 지속 가능하다고 봅니다."}],"dialogue":[{"sp":"A","en":"Let me lay out our position clearly before we discuss specifics.","ko":"세부 사항을 논의하기 전에 저희 입장을 명확히 말씀드리겠습니다."},{"sp":"B","en":"Please, go ahead.","ko":"네, 말씀하세요."},{"sp":"A","en":"We're asking for an 8% reduction this cycle, and I'll walk you through why.","ko":"이번 사이클에 8% 인하를 요청드리며, 그 이유를 설명드리겠습니다."},{"sp":"B","en":"Eight percent is steep. What's it based on?","ko":"8%는 과하네요. 무엇에 근거한 건가요?"},{"sp":"A","en":"Primarily, raw material prices have dropped 12% over the past year.","ko":"주로 지난 1년간 원자재 가격이 12% 하락했기 때문입니다."},{"sp":"B","en":"Material is only part of the cost, though.","ko":"하지만 재료비는 원가의 일부일 뿐입니다."},{"sp":"A","en":"Agreed—but our volume has also grown 20%, which lowers your per-unit cost.","ko":"맞습니다. 다만 물량도 20% 늘어 단위당 원가가 낮아졌습니다."},{"sp":"A","en":"I want to be transparent here; we believe 8% is both fair and sustainable for you.","ko":"투명하게 말씀드리면, 8%가 귀사에도 공정하고 지속 가능하다고 봅니다."}],"vocab":[{"t":"position","ko":"입장"},{"t":"raw material","ko":"원자재"},{"t":"benchmark","ko":"기준치"},{"t":"per-unit cost","ko":"단위당 원가"},{"t":"transparent","ko":"투명한"},{"t":"justify","ko":"정당화하다"},{"t":"sustainable","ko":"지속 가능한"}],"drill":[{"ko":"저희 입장을 명확히 말씀드리겠습니다.","en":"Let me lay out our position clearly."},{"ko":"이는 원자재 가격이 12% 하락한 데 근거합니다.","en":"This is based on raw material prices dropping 12%."},{"ko":"시장 기준치가 이 수준을 뒷받침합니다.","en":"The market benchmark supports this level."},{"ko":"물량이 늘어 단위당 원가가 낮아졌습니다.","en":"Our volume has grown, which lowers your per-unit cost."},{"ko":"이것이 공정하면서도 지속 가능하다고 봅니다.","en":"We believe this is both fair and sustainable."}],"tip":"입장은 '요구'와 '근거'를 짝으로 제시하세요. 숫자만 던지면 흥정이 되지만, 데이터로 뒷받침하면 논리 싸움이 됩니다. 'sustainable for you'처럼 상대 입장도 고려한다는 신호를 주면 방어가 줄어듭니다."},{"n":53,"title":"가격 협상","scene":"양측이 제시한 인하율 사이에서 본격적으로 가격을 밀고 당기며 접점을 찾는 단계입니다.","goal":"단호하면서도 유연하게 가격을 협상하고 상호 수용 가능한 지점으로 좁혀 갈 수 있다.","expressions":[{"en":"That figure is still some way from where we need to be.","ko":"그 수치는 저희가 도달해야 할 지점과 아직 거리가 있습니다."},{"en":"Let's see if we can close the gap.","ko":"그 격차를 좁힐 수 있을지 봅시다."},{"en":"We can't justify anything below 6% internally.","ko":"내부적으로 6% 미만은 정당화하기 어렵습니다."},{"en":"What would it take to get you to 7%?","ko":"7%까지 가려면 무엇이 필요할까요?"},{"en":"I can move to 6.5%, but that's a real stretch.","ko":"6.5%까지는 움직일 수 있지만, 정말 빠듯합니다."},{"en":"Let's not get stuck on a half percent.","ko":"0.5%에 발목 잡히지 맙시다."},{"en":"Can we meet in the middle at 7%?","ko":"7%에서 중간 지점으로 합의할 수 있을까요?"},{"en":"If you can do 7%, we have a deal.","ko":"7%만 해 주시면 합의입니다."}],"dialogue":[{"sp":"A","en":"I appreciate you moving to 5%, but that's still some way from where we need to be.","ko":"5%까지 움직여 주신 점 감사하지만, 저희가 가야 할 지점과는 아직 거리가 있습니다."},{"sp":"B","en":"Five percent is already aggressive on our margins.","ko":"5%도 저희 마진엔 이미 공격적입니다."},{"sp":"A","en":"I understand. But we can't justify anything below 8% internally without more movement.","ko":"이해합니다. 다만 더 움직이지 않으면 내부적으로 8% 미만은 정당화하기 어렵습니다."},{"sp":"B","en":"What would it take to land somewhere reasonable?","ko":"합리적인 선에 도달하려면 무엇이 필요할까요?"},{"sp":"A","en":"If you can reach 7%, I think we can make it work.","ko":"7%까지 가 주시면, 성사시킬 수 있을 것 같습니다."},{"sp":"B","en":"Seven is tough. I might get to 6%.","ko":"7%는 어렵습니다. 6%까지는 가능할 수도 있고요."},{"sp":"A","en":"Let's not get stuck on one point—can we meet in the middle at 6.5%?","ko":"1%포인트에 발목 잡히지 말고, 6.5%에서 중간 합의할 수 있을까요?"},{"sp":"A","en":"If you can do 6.5%, we have a deal today.","ko":"6.5%만 해 주시면 오늘 합의입니다."}],"vocab":[{"t":"close the gap","ko":"격차를 좁히다"},{"t":"justify","ko":"정당화하다"},{"t":"stretch","ko":"빠듯한 한계, 무리"},{"t":"meet in the middle","ko":"중간 지점에서 합의하다"},{"t":"margin","ko":"마진, 수익률"},{"t":"movement","ko":"(입장의) 변화, 양보"},{"t":"have a deal","ko":"합의가 이루어지다"}],"drill":[{"ko":"그 수치는 저희가 도달해야 할 지점과 아직 거리가 있습니다.","en":"That figure is still some way from where we need to be."},{"ko":"내부적으로 8% 미만은 정당화하기 어렵습니다.","en":"We can't justify anything below 8% internally."},{"ko":"7%까지 가려면 무엇이 필요할까요?","en":"What would it take to get you to 7%?"},{"ko":"0.5%에 발목 잡히지 맙시다.","en":"Let's not get stuck on a half percent."},{"ko":"7%만 해 주시면 합의입니다.","en":"If you can do 7%, we have a deal."}],"tip":"'What would it take to...?'는 상대에게 공을 넘겨 조건을 끌어내는 강력한 질문입니다. 'internally(내부적으로)'를 핑계로 쓰면 개인적 대립을 피하면서 단호함을 유지할 수 있습니다."},{"n":54,"title":"조건 교환(trade-off)","scene":"가격만으로 합의가 어려워, 결제 조건·물량 보장·계약 기간 등 다른 변수와 묶어 패키지로 거래합니다.","goal":"단일 변수에 갇히지 않고 여러 조건을 교환해 양측 모두 이득인 패키지를 설계할 수 있다.","expressions":[{"en":"Let's not look at price in isolation.","ko":"가격만 따로 떼어 보지 맙시다."},{"en":"If we extend the contract to three years, can you improve the price?","ko":"계약을 3년으로 연장하면 가격을 개선해 주실 수 있나요?"},{"en":"We could offer faster payment terms in exchange.","ko":"그 대가로 더 빠른 결제 조건을 제공할 수 있습니다."},{"en":"What if we guaranteed the volume commitment?","ko":"물량을 보장해 드린다면 어떨까요?"},{"en":"I can give on payment terms if you give on price.","ko":"가격을 양보해 주시면 결제 조건을 양보하겠습니다."},{"en":"That's a fair trade for both sides.","ko":"그건 양측 모두에게 공정한 교환입니다."},{"en":"Let's bundle these into a single package.","ko":"이것들을 하나의 패키지로 묶읍시다."},{"en":"If you can flex on price, we can flex on logistics.","ko":"가격을 유연하게 해 주시면, 물류는 저희가 유연하게 하겠습니다."}],"dialogue":[{"sp":"A","en":"We're close on price, so let's not look at it in isolation.","ko":"가격은 거의 다 왔으니, 가격만 따로 떼어 보지 맙시다."},{"sp":"B","en":"What do you have in mind?","ko":"어떤 생각이신가요?"},{"sp":"A","en":"If we extend the contract to three years, can you improve the price?","ko":"계약을 3년으로 연장하면 가격을 개선해 주실 수 있나요?"},{"sp":"B","en":"A longer term does help us plan capacity, yes.","ko":"장기 계약은 생산 능력 계획에 도움이 됩니다, 네."},{"sp":"A","en":"And we could offer faster payment terms in exchange.","ko":"그리고 그 대가로 더 빠른 결제 조건을 제공할 수 있습니다."},{"sp":"B","en":"Net-30 instead of net-60 would meaningfully help our cash flow.","ko":"네트-60 대신 네트-30이면 현금 흐름에 의미 있게 도움이 됩니다."},{"sp":"A","en":"Then let's bundle three-year term, net-30, and a 7% price into one package.","ko":"그럼 3년 계약, 네트-30, 7% 가격을 하나의 패키지로 묶읍시다."},{"sp":"A","en":"If you can flex on price, we can flex on terms—that's a fair trade for both sides.","ko":"가격을 유연하게 해 주시면 조건은 저희가 유연하게 하겠습니다. 양측 모두 공정한 교환입니다."}],"vocab":[{"t":"trade-off","ko":"조건 교환, 맞교환"},{"t":"in isolation","ko":"따로 떼어, 단독으로"},{"t":"payment terms","ko":"결제 조건"},{"t":"volume commitment","ko":"물량 보장"},{"t":"bundle","ko":"묶다, 패키지화하다"},{"t":"net-30 / net-60","ko":"30일/60일 후 결제 조건"},{"t":"flex","ko":"유연하게 조정하다"}],"drill":[{"ko":"가격만 따로 떼어 보지 맙시다.","en":"Let's not look at price in isolation."},{"ko":"계약을 3년으로 연장하면 가격을 개선해 주실 수 있나요?","en":"If we extend the contract to three years, can you improve the price?"},{"ko":"그 대가로 더 빠른 결제 조건을 제공할 수 있습니다.","en":"We could offer faster payment terms in exchange."},{"ko":"이것들을 하나의 패키지로 묶읍시다.","en":"Let's bundle these into a single package."},{"ko":"가격을 유연하게 해 주시면, 물류는 저희가 유연하게 하겠습니다.","en":"If you can flex on price, we can flex on logistics."}],"tip":"단일 변수(가격)에 갇히면 제로섬이 됩니다. 결제 조건·계약 기간·물량 같은 다른 변수를 끌어오면 '서로 다르게 가치를 매기는 것'을 교환해 win-win을 만들 수 있습니다. 'If you... then we...' 조건부 양보가 핵심 문형입니다."},{"n":55,"title":"양보와 마지노선 표현","scene":"협상이 막바지에 이르러 일부를 양보하면서도 더는 물러설 수 없는 한계선을 분명히 전달합니다.","goal":"전략적으로 양보하되 마지노선을 신뢰감 있게 표현해 추가 압박을 차단할 수 있다.","expressions":[{"en":"I'm prepared to make one final concession.","ko":"마지막 양보를 하나 할 준비가 되어 있습니다."},{"en":"This is as far as I can go.","ko":"이것이 제가 갈 수 있는 한계입니다."},{"en":"I've already stretched well beyond my mandate.","ko":"이미 제 권한을 훨씬 넘어섰습니다."},{"en":"That's my final number, and I mean it.","ko":"이것이 최종 금액이며, 진심입니다."},{"en":"I can give you this, but I'll need something in return.","ko":"이건 드릴 수 있지만, 대가가 필요합니다."},{"en":"Beyond this point, we'd have to walk away.","ko":"이 선을 넘으면 저희는 물러설 수밖에 없습니다."},{"en":"I want to be honest—there's no more room here.","ko":"솔직히 말씀드리면, 더는 여지가 없습니다."},{"en":"Let's lock this in before anything changes.","ko":"상황이 바뀌기 전에 이걸 확정합시다."}],"dialogue":[{"sp":"A","en":"We've come a long way, and I'm prepared to make one final concession.","ko":"여기까지 많이 왔고, 마지막 양보를 하나 할 준비가 되어 있습니다."},{"sp":"B","en":"I'm listening.","ko":"듣고 있습니다."},{"sp":"A","en":"I can move to 6.5%, but I'll need the three-year term in return.","ko":"6.5%까지 움직일 수 있지만, 대가로 3년 계약이 필요합니다."},{"sp":"B","en":"Could you stretch to 6% if we sign today?","ko":"오늘 서명하면 6%까지 가능할까요?"},{"sp":"A","en":"Honestly, 6.5% is as far as I can go—I've already stretched beyond my mandate.","ko":"솔직히 6.5%가 한계입니다. 이미 제 권한을 넘어섰습니다."},{"sp":"B","en":"I appreciate the candor.","ko":"솔직하게 말씀해 주셔서 감사합니다."},{"sp":"A","en":"Beyond this point, we'd genuinely have to walk away, and neither of us wants that.","ko":"이 선을 넘으면 정말로 물러설 수밖에 없고, 둘 다 원치 않는 일이죠."},{"sp":"A","en":"So let's lock this in now before anything changes.","ko":"그러니 상황이 바뀌기 전에 지금 확정합시다."}],"vocab":[{"t":"concession","ko":"양보"},{"t":"mandate","ko":"(위임받은) 권한"},{"t":"final number","ko":"최종 금액"},{"t":"walk away","ko":"협상을 그만두다, 물러서다"},{"t":"candor","ko":"솔직함"},{"t":"lock in","ko":"확정하다, 고정하다"},{"t":"room (to move)","ko":"(양보할) 여지"}],"drill":[{"ko":"마지막 양보를 하나 할 준비가 되어 있습니다.","en":"I'm prepared to make one final concession."},{"ko":"이것이 제가 갈 수 있는 한계입니다.","en":"This is as far as I can go."},{"ko":"이건 드릴 수 있지만, 대가가 필요합니다.","en":"I can give you this, but I'll need something in return."},{"ko":"이 선을 넘으면 저희는 물러설 수밖에 없습니다.","en":"Beyond this point, we'd have to walk away."},{"ko":"상황이 바뀌기 전에 이걸 확정합시다.","en":"Let's lock this in before anything changes."}],"tip":"양보할 때는 반드시 대가를 받으세요('I'll need something in return'). 공짜 양보는 상대에게 '더 짜내면 된다'는 신호를 줍니다. 마지노선은 'as far as I can go' + 'walk away' 조합으로 신뢰감 있게 전달하되, 진짜일 때만 쓰세요."},{"n":56,"title":"거절을 부드럽게 하기","scene":"공급사의 추가 요구(예: 가격 동결, 비용 전가)를 받아들일 수 없어 관계를 해치지 않으면서 거절합니다.","goal":"관계를 유지하면서도 명확하게 거절하고 대안을 제시할 수 있다.","expressions":[{"en":"I understand where you're coming from, but I can't agree to that.","ko":"입장은 이해하지만, 그 조건에는 동의할 수 없습니다."},{"en":"Unfortunately, that's not something we can accommodate.","ko":"안타깝게도 그건 저희가 수용할 수 없는 부분입니다."},{"en":"I wish I could, but it's outside our budget.","ko":"그러고 싶지만, 저희 예산을 벗어납니다."},{"en":"That won't work for us, but let me suggest an alternative.","ko":"그건 저희에겐 안 되지만, 대안을 하나 제안하겠습니다."},{"en":"I have to be straight with you on this.","ko":"이 부분은 솔직하게 말씀드려야겠습니다."},{"en":"We're not in a position to absorb that cost.","ko":"그 비용을 저희가 떠안을 수 있는 상황이 아닙니다."},{"en":"Let's find a middle ground instead.","ko":"대신 절충안을 찾아봅시다."},{"en":"I'd rather say no now than overpromise.","ko":"지나친 약속을 하느니 지금 거절하는 게 낫습니다."}],"dialogue":[{"sp":"A","en":"I understand where you're coming from, but I can't agree to a full price freeze.","ko":"입장은 이해하지만, 전면적인 가격 동결에는 동의할 수 없습니다."},{"sp":"B","en":"Material costs are really squeezing us, though.","ko":"하지만 재료비가 저희를 정말 압박하고 있습니다."},{"sp":"A","en":"I hear you, and I wish I could help more, but a freeze is outside our budget.","ko":"이해합니다. 더 돕고 싶지만, 동결은 저희 예산을 벗어납니다."},{"sp":"B","en":"So there's nothing you can do?","ko":"그럼 해 주실 수 있는 게 없나요?"},{"sp":"A","en":"That specific ask won't work, but let me suggest an alternative.","ko":"그 요구는 안 되지만, 대안을 하나 제안하겠습니다."},{"sp":"B","en":"Go ahead.","ko":"말씀하세요."},{"sp":"A","en":"We could index pricing to the resin market, so you're protected when costs rise.","ko":"가격을 수지 시장에 연동해, 비용이 오를 때 보호받도록 할 수 있습니다."},{"sp":"A","en":"I'd rather be straight and offer that than overpromise on a freeze.","ko":"동결을 무리하게 약속하느니, 솔직하게 이걸 제안하는 게 낫습니다."}],"vocab":[{"t":"accommodate","ko":"수용하다, 들어주다"},{"t":"absorb (a cost)","ko":"(비용을) 떠안다"},{"t":"middle ground","ko":"절충안, 중간 지점"},{"t":"price freeze","ko":"가격 동결"},{"t":"overpromise","ko":"과한 약속을 하다"},{"t":"index (pricing)","ko":"(가격을) 연동시키다"},{"t":"straight (with you)","ko":"솔직한"}],"drill":[{"ko":"입장은 이해하지만, 그 조건에는 동의할 수 없습니다.","en":"I understand where you're coming from, but I can't agree to that."},{"ko":"안타깝게도 그건 저희가 수용할 수 없는 부분입니다.","en":"Unfortunately, that's not something we can accommodate."},{"ko":"그건 저희에겐 안 되지만, 대안을 하나 제안하겠습니다.","en":"That won't work for us, but let me suggest an alternative."},{"ko":"그 비용을 저희가 떠안을 수 있는 상황이 아닙니다.","en":"We're not in a position to absorb that cost."},{"ko":"대신 절충안을 찾아봅시다.","en":"Let's find a middle ground instead."}],"tip":"효과적인 거절 = 공감('I understand') + 명확한 No + 대안('let me suggest'). 대안 없이 거절만 하면 관계가 식고, 어정쩡하게 흐리면 상대가 계속 밀어붙입니다. 'I wish I could'는 부드럽지만 단호한 거절 신호입니다."},{"n":57,"title":"교착 상태 풀기","scene":"핵심 쟁점에서 양측이 한 발도 물러서지 않아 협상이 멈췄을 때 새로운 돌파구를 만듭니다.","goal":"교착을 인정하고 관점을 바꾸거나 의제를 재구성해 협상을 다시 움직일 수 있다.","expressions":[{"en":"It feels like we've hit a deadlock here.","ko":"여기서 교착 상태에 빠진 것 같습니다."},{"en":"Let's step back and look at the bigger picture.","ko":"한 걸음 물러서서 큰 그림을 봅시다."},{"en":"Maybe we're focusing too narrowly on one issue.","ko":"어쩌면 한 가지 쟁점에 너무 좁게 집중하고 있는지도 모릅니다."},{"en":"What's the real concern behind your position?","ko":"그 입장 뒤에 있는 진짜 우려는 무엇입니까?"},{"en":"Let's set this aside and come back to it.","ko":"이건 잠시 미뤄 두고 나중에 다시 다룹시다."},{"en":"Could we try a completely different approach?","ko":"완전히 다른 접근을 시도해 볼 수 있을까요?"},{"en":"What if we brought in a fresh option?","ko":"새로운 선택지를 하나 가져오면 어떨까요?"},{"en":"Let's take a short break and reset.","ko":"잠깐 휴식하고 다시 시작합시다."}],"dialogue":[{"sp":"A","en":"I think we've hit a deadlock on the warranty terms.","ko":"보증 조건에서 교착 상태에 빠진 것 같습니다."},{"sp":"B","en":"Agreed. Neither of us is moving.","ko":"동의합니다. 둘 다 움직이지 않고 있죠."},{"sp":"A","en":"Let's step back—what's the real concern behind your position?","ko":"한 걸음 물러서 보죠. 그 입장 뒤의 진짜 우려가 뭔가요?"},{"sp":"B","en":"Honestly, it's the open-ended liability, not the duration.","ko":"솔직히 기간이 아니라 무한 책임이 문제입니다."},{"sp":"A","en":"That's helpful—maybe we've been arguing the wrong issue.","ko":"도움이 되네요. 우리가 엉뚱한 쟁점으로 다퉜는지도 모릅니다."},{"sp":"B","en":"So if liability were capped, the duration is workable?","ko":"그럼 책임에 상한을 두면 기간은 받아들일 만한가요?"},{"sp":"A","en":"Exactly. What if we cap liability at the annual contract value?","ko":"맞습니다. 책임을 연간 계약 금액으로 상한을 두면 어떨까요?"},{"sp":"A","en":"Let's set the duration aside and build the deal around that instead.","ko":"기간은 잠시 미뤄 두고, 그 안을 중심으로 거래를 짜 봅시다."}],"vocab":[{"t":"deadlock","ko":"교착 상태"},{"t":"step back","ko":"한 걸음 물러서다"},{"t":"bigger picture","ko":"큰 그림"},{"t":"underlying concern","ko":"근저의 우려"},{"t":"set aside","ko":"(잠시) 미뤄 두다"},{"t":"cap (liability)","ko":"(책임에) 상한을 두다"},{"t":"reset","ko":"다시 시작하다, 재정비하다"}],"drill":[{"ko":"여기서 교착 상태에 빠진 것 같습니다.","en":"It feels like we've hit a deadlock here."},{"ko":"한 걸음 물러서서 큰 그림을 봅시다.","en":"Let's step back and look at the bigger picture."},{"ko":"그 입장 뒤에 있는 진짜 우려는 무엇입니까?","en":"What's the real concern behind your position?"},{"ko":"이건 잠시 미뤄 두고 나중에 다시 다룹시다.","en":"Let's set this aside and come back to it."},{"ko":"완전히 다른 접근을 시도해 볼 수 있을까요?","en":"Could we try a completely different approach?"}],"tip":"교착은 보통 '입장(position)'끼리 부딪혀서 생깁니다. 'What's the real concern behind...?'로 입장 뒤의 '이해관계(interest)'를 파면 새로운 해법이 나옵니다. 쉬운 쟁점부터 합의해 모멘텀을 만드는 것도 좋은 방법입니다."},{"n":58,"title":"합의 도출과 확인","scene":"주요 쟁점이 타결되어 최종 합의 내용을 정리하고 양측이 정확히 같은 이해에 있는지 확인합니다.","goal":"합의 사항을 명확히 요약하고 오해의 소지를 없애 문서화 전 상호 확인을 받을 수 있다.","expressions":[{"en":"I think we've reached an agreement.","ko":"합의에 도달한 것 같습니다."},{"en":"Let me summarize what we've agreed.","ko":"합의한 내용을 정리해 보겠습니다."},{"en":"So, to confirm: 6.5%, a three-year term, and net-30 payment.","ko":"확인하자면, 6.5% 인하, 3년 계약, 네트-30 결제입니다."},{"en":"Do we have a shared understanding on this?","ko":"이 부분에 대해 같은 이해를 하고 있는 게 맞나요?"},{"en":"Is there anything we've left open?","ko":"미결로 남은 사항이 있나요?"},{"en":"I'll put this in writing and send it over today.","ko":"오늘 중으로 문서화해서 보내 드리겠습니다."},{"en":"Once you confirm, we'll proceed to contract.","ko":"확인해 주시면 계약 단계로 넘어가겠습니다."},{"en":"Glad we could find common ground.","ko":"공통의 접점을 찾을 수 있어 다행입니다."}],"dialogue":[{"sp":"A","en":"I think we've reached an agreement—let me summarize to make sure.","ko":"합의에 도달한 것 같습니다. 확실히 하려고 정리해 보겠습니다."},{"sp":"B","en":"Please do.","ko":"네, 부탁드립니다."},{"sp":"A","en":"So: a 6.5% price reduction, a three-year term, net-30 payment, and liability capped at annual contract value.","ko":"그러니까 6.5% 인하, 3년 계약, 네트-30 결제, 그리고 책임은 연간 계약 금액으로 상한입니다."},{"sp":"B","en":"Yes, that matches my notes.","ko":"네, 제 메모와 일치합니다."},{"sp":"A","en":"Is there anything we've left open?","ko":"미결로 남은 사항이 있나요?"},{"sp":"B","en":"Just the start date, but we can confirm that by email.","ko":"개시일만 남았는데, 그건 이메일로 확정하면 됩니다."},{"sp":"A","en":"Perfect. I'll put all of this in writing and send it over today.","ko":"좋습니다. 이 내용을 오늘 중 문서화해서 보내 드리겠습니다."},{"sp":"A","en":"Once you confirm, we'll proceed to contract—glad we could find common ground.","ko":"확인해 주시면 계약으로 넘어가겠습니다. 접점을 찾을 수 있어 다행입니다."}],"vocab":[{"t":"reach an agreement","ko":"합의에 도달하다"},{"t":"summarize","ko":"요약하다, 정리하다"},{"t":"to confirm","ko":"확인하자면"},{"t":"shared understanding","ko":"공통의 이해"},{"t":"leave open","ko":"미결로 남기다"},{"t":"put in writing","ko":"문서화하다"},{"t":"common ground","ko":"공통의 접점"}],"drill":[{"ko":"합의한 내용을 정리해 보겠습니다.","en":"Let me summarize what we've agreed."},{"ko":"이 부분에 대해 같은 이해를 하고 있는 게 맞나요?","en":"Do we have a shared understanding on this?"},{"ko":"미결로 남은 사항이 있나요?","en":"Is there anything we've left open?"},{"ko":"오늘 중으로 문서화해서 보내 드리겠습니다.","en":"I'll put this in writing and send it over today."},{"ko":"확인해 주시면 계약 단계로 넘어가겠습니다.","en":"Once you confirm, we'll proceed to contract."}],"tip":"구두 합의는 반드시 그 자리에서 요약·복창하세요. 'To confirm...'으로 핵심 조건을 되짚으면 나중에 'I thought we said...' 분쟁을 예방합니다. 합의 직후 24시간 내 서면 확인이 표준입니다."},{"n":59,"title":"문화 차이 다루기","scene":"독일 OEM, 미국 Tier-1, 일본 공급사와 협상하며 의사소통 스타일과 의사결정 방식의 차이를 조율합니다.","goal":"문화별 소통·의사결정 차이를 인식하고 오해를 줄이며 신뢰를 쌓을 수 있다.","expressions":[{"en":"I want to make sure nothing gets lost in translation.","ko":"전달 과정에서 오해가 없도록 하고 싶습니다."},{"en":"Please let me know if I'm being too direct.","ko":"제가 너무 직설적이면 말씀해 주세요."},{"en":"I understand decisions may need time on your side.","ko":"귀사 쪽에서는 의사결정에 시간이 필요할 수 있다는 걸 이해합니다."},{"en":"Should we confirm this with your headquarters first?","ko":"이 건은 본사와 먼저 확인하는 게 좋을까요?"},{"en":"I don't want to rush you into a decision.","ko":"성급하게 결정을 재촉하고 싶지 않습니다."},{"en":"Let's make sure we're aligned before moving on.","ko":"다음으로 넘어가기 전에 정렬되었는지 확인합시다."},{"en":"I appreciate the importance of consensus in your process.","ko":"귀사의 합의 중심 의사결정 문화를 존중합니다."},{"en":"Please correct me if I've misunderstood.","ko":"제가 잘못 이해했다면 바로잡아 주세요."}],"dialogue":[{"sp":"A","en":"Before we go further, I want to make sure nothing gets lost in translation.","ko":"더 진행하기 전에, 전달 과정에서 오해가 없도록 하고 싶습니다."},{"sp":"B","en":"That's considerate. We do prefer to confirm internally before committing.","ko":"배려 감사합니다. 저희는 확정 전에 내부 확인을 선호합니다."},{"sp":"A","en":"Of course. I understand decisions may need consensus on your side.","ko":"물론이죠. 귀사 쪽은 의사결정에 합의가 필요하다는 걸 이해합니다."},{"sp":"B","en":"Yes, our headquarters will need to review the terms.","ko":"네, 본사가 조건을 검토해야 합니다."},{"sp":"A","en":"Then I won't rush you—let's set a realistic date for your response.","ko":"그럼 재촉하지 않겠습니다. 답변에 현실적인 기한을 정합시다."},{"sp":"B","en":"We'd appreciate two weeks for proper internal alignment.","ko":"내부 정렬을 위해 2주를 주시면 감사하겠습니다."},{"sp":"A","en":"Two weeks works. And please correct me if I've misunderstood anything today.","ko":"2주 좋습니다. 그리고 오늘 제가 오해한 게 있다면 바로잡아 주세요."},{"sp":"A","en":"I'd rather take the time now than create friction later.","ko":"나중에 마찰을 빚느니 지금 시간을 들이는 게 낫습니다."}],"vocab":[{"t":"lost in translation","ko":"전달 과정의 오해, 의미 손실"},{"t":"direct (communication)","ko":"직설적인 (소통)"},{"t":"consensus","ko":"합의"},{"t":"headquarters (HQ)","ko":"본사"},{"t":"aligned","ko":"정렬된, 같은 입장인"},{"t":"rush (someone)","ko":"재촉하다"},{"t":"friction","ko":"마찰, 갈등"}],"drill":[{"ko":"전달 과정에서 오해가 없도록 하고 싶습니다.","en":"I want to make sure nothing gets lost in translation."},{"ko":"제가 너무 직설적이면 말씀해 주세요.","en":"Please let me know if I'm being too direct."},{"ko":"귀사 쪽에서는 의사결정에 시간이 필요할 수 있다는 걸 이해합니다.","en":"I understand decisions may need time on your side."},{"ko":"성급하게 결정을 재촉하고 싶지 않습니다.","en":"I don't want to rush you into a decision."},{"ko":"제가 잘못 이해했다면 바로잡아 주세요.","en":"Please correct me if I've misunderstood."}],"tip":"문화 차이는 '느림 vs 빠름'이 아니라 의사결정 구조의 차이입니다. 일본·독일계는 내부 합의(consensus)에 시간이 걸리니 기한을 강요하지 마세요. 'I don't want to rush you'는 신뢰를 쌓는 강력한 한마디입니다."},{"n":60,"title":"협상 마무리와 후속 조치","scene":"협상이 타결된 후 감사 인사와 함께 계약, 일정, 책임자 등 후속 조치를 명확히 정리하며 마무리합니다.","goal":"긍정적으로 협상을 마무리하고 다음 단계와 책임 소재를 명확히 해 실행으로 연결할 수 있다.","expressions":[{"en":"Thank you for a constructive negotiation.","ko":"건설적인 협상에 감사드립니다."},{"en":"I'm glad we landed on a deal that works for both of us.","ko":"양측 모두에게 맞는 합의에 도달해 기쁩니다."},{"en":"Let's go over the next steps.","ko":"다음 단계를 함께 짚어 보겠습니다."},{"en":"I'll send the draft contract by Thursday.","ko":"목요일까지 계약서 초안을 보내 드리겠습니다."},{"en":"Who should be the main contact on your side?","ko":"귀사 측 주 담당자는 누구로 하면 될까요?"},{"en":"Let's schedule a kickoff once the contract is signed.","ko":"계약 체결 후 착수 회의를 잡읍시다."},{"en":"I'll follow up in writing to confirm everything.","ko":"모든 사항을 확인하는 후속 서면을 보내겠습니다."},{"en":"I look forward to a long and successful partnership.","ko":"길고 성공적인 파트너십을 기대합니다."}],"dialogue":[{"sp":"A","en":"Thank you for a constructive negotiation today—I'm glad we landed on a deal that works for both of us.","ko":"오늘 건설적인 협상에 감사드립니다. 양측 모두에게 맞는 합의에 도달해 기쁩니다."},{"sp":"B","en":"Likewise. It was a fair process.","ko":"저도요. 공정한 과정이었습니다."},{"sp":"A","en":"Let's go over the next steps so nothing slips.","ko":"놓치는 게 없도록 다음 단계를 짚어 보겠습니다."},{"sp":"B","en":"Sounds good. When can we expect the contract?","ko":"좋습니다. 계약서는 언제쯤 받을 수 있을까요?"},{"sp":"A","en":"I'll send the draft by Thursday; please have your legal team review it.","ko":"목요일까지 초안을 보내겠습니다. 법무팀 검토를 부탁드립니다."},{"sp":"B","en":"Will do. I'll be your main contact going forward.","ko":"그렇게 하겠습니다. 앞으로 제가 주 담당자가 되겠습니다."},{"sp":"A","en":"Great. Once it's signed, let's schedule a kickoff with both engineering teams.","ko":"좋습니다. 서명되면 양측 엔지니어링 팀과 착수 회의를 잡읍시다."},{"sp":"A","en":"I'll follow up in writing to confirm everything—looking forward to a long partnership.","ko":"모든 사항을 확인하는 서면을 보내 드리겠습니다. 긴 파트너십을 기대합니다."}],"vocab":[{"t":"constructive","ko":"건설적인"},{"t":"land on a deal","ko":"합의에 도달하다"},{"t":"next steps","ko":"다음 단계"},{"t":"draft contract","ko":"계약서 초안"},{"t":"main contact","ko":"주 담당자"},{"t":"kickoff (meeting)","ko":"착수 회의"},{"t":"follow up","ko":"후속 조치하다"}],"drill":[{"ko":"건설적인 협상에 감사드립니다.","en":"Thank you for a constructive negotiation."},{"ko":"다음 단계를 함께 짚어 보겠습니다.","en":"Let's go over the next steps."},{"ko":"목요일까지 계약서 초안을 보내 드리겠습니다.","en":"I'll send the draft contract by Thursday."},{"ko":"계약 체결 후 착수 회의를 잡읍시다.","en":"Let's schedule a kickoff once the contract is signed."},{"ko":"길고 성공적인 파트너십을 기대합니다.","en":"I look forward to a long and successful partnership."}],"tip":"협상은 합의가 아니라 '실행'이 목적입니다. 마무리에서 next steps·담당자·기한을 못 박지 않으면 합의가 표류합니다. 마지막은 항상 관계 지향 메시지('long partnership')로 닫아 다음 협상의 토대를 만드세요."},{"n":61,"title":"프로젝트 킥오프","scene":"신규 내장 프로그램의 킥오프 미팅을 주관하며 글로벌 OEM과 Tier-1 팀에 목표와 범위를 공유하는 상황입니다.","goal":"프로그램의 목표, 범위, 책임을 명확히 정의하고 팀의 정렬을 이끌어냅니다.","expressions":[{"en":"Thank you all for joining today's kickoff. Let me walk you through the program objectives.","ko":"오늘 킥오프에 참석해 주셔서 감사합니다. 프로그램 목표를 설명드리겠습니다."},{"en":"The scope covers the full instrument panel, center console, and door trim packages.","ko":"범위는 IP 전체, 센터 콘솔, 도어 트림 패키지를 포함합니다."},{"en":"Our overarching goal is to hit Job 1 with zero open design issues.","ko":"최우선 목표는 미해결 설계 이슈 없이 양산 시점을 맞추는 것입니다."},{"en":"Let me clarify roles and responsibilities across the core team.","ko":"핵심 팀의 역할과 책임을 명확히 하겠습니다."},{"en":"We'll use a shared RACI matrix to avoid any ambiguity on ownership.","ko":"오너십의 모호함을 없애기 위해 공유 RACI 매트릭스를 사용하겠습니다."},{"en":"The critical path runs through tooling release, so timing alignment is essential.","ko":"주요 경로가 금형 발주를 관통하므로 일정 정렬이 필수적입니다."},{"en":"I'd like to set our cadence at weekly working sessions and monthly steering reviews.","ko":"주간 실무 회의와 월간 운영위 검토로 주기를 설정하고자 합니다."},{"en":"Are there any concerns about scope or assumptions before we lock the baseline?","ko":"베이스라인을 확정하기 전에 범위나 가정에 대한 우려가 있으신가요?"}],"dialogue":[{"sp":"A","en":"Good morning, everyone. Thank you for joining the kickoff for the next-generation interior program.","ko":"안녕하세요, 여러분. 차세대 내장 프로그램 킥오프에 참석해 주셔서 감사합니다."},{"sp":"B","en":"Glad to be here. Could you start with the high-level objectives?","ko":"참석하게 되어 기쁩니다. 상위 목표부터 시작해 주시겠어요?"},{"sp":"A","en":"Of course. Our mandate is to deliver a fully validated interior package on time, on cost, and meeting all craftsmanship targets.","ko":"물론입니다. 우리 과제는 완전히 검증된 내장 패키지를 일정과 원가에 맞추고 모든 감성품질 목표를 충족하며 인도하는 것입니다."},{"sp":"B","en":"And how is the scope split between our team and the Tier-1 supplier?","ko":"우리 팀과 Tier-1 공급사 간 범위는 어떻게 나뉘나요?"},{"sp":"A","en":"We own design intent and validation; the supplier owns detailed engineering and tooling execution. The RACI matrix captures every interface.","ko":"우리는 설계 의도와 검증을 담당하고, 공급사는 상세 엔지니어링과 금형 실행을 담당합니다. RACI 매트릭스에 모든 인터페이스가 담겨 있습니다."},{"sp":"B","en":"What's the biggest risk you see at this stage?","ko":"현 단계에서 가장 큰 리스크는 무엇이라고 보십니까?"},{"sp":"A","en":"Tooling lead time. If we slip on data release, the critical path moves and Job 1 is at risk. That's why we're locking the gateway dates today.","ko":"금형 리드타임입니다. 데이터 발주가 지연되면 주요 경로가 밀리고 양산 시점이 위태로워집니다. 그래서 오늘 게이트웨이 일정을 확정하는 것입니다."},{"sp":"A","en":"Let's align on the cadence, confirm owners, and close out today with a signed-off baseline. I'll circulate the minutes within the hour.","ko":"주기를 정렬하고 담당자를 확정한 뒤, 승인된 베이스라인으로 오늘을 마무리하겠습니다. 한 시간 내로 회의록을 공유하겠습니다."}],"vocab":[{"t":"kickoff","ko":"착수 회의, 킥오프"},{"t":"scope","ko":"범위"},{"t":"RACI matrix","ko":"역할·책임 매트릭스"},{"t":"critical path","ko":"주요 경로"},{"t":"baseline","ko":"기준선, 베이스라인"},{"t":"cadence","ko":"(회의·보고) 주기"},{"t":"Job 1","ko":"양산 1호차 시점"}],"drill":[{"ko":"오늘 킥오프에 참석해 주셔서 감사합니다.","en":"Thank you all for joining today's kickoff."},{"ko":"범위는 IP, 콘솔, 도어 트림을 포함합니다.","en":"The scope covers the IP, console, and door trim."},{"ko":"오너십의 모호함을 없애기 위해 RACI 매트릭스를 사용하겠습니
