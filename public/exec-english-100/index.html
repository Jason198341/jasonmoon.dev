다.","en":"We'll use a RACI matrix to avoid ambiguity on ownership."},{"ko":"주요 경로가 금형 발주를 관통합니다.","en":"The critical path runs through tooling release."},{"ko":"베이스라인을 확정하기 전에 우려가 있으신가요?","en":"Are there any concerns before we lock the baseline?"}],"tip":"킥오프에서 가장 중요한 건 '무엇을 만드느냐'가 아니라 '누가 무엇을 책임지고, 어떤 일정에 매여 있는가'를 첫날에 못 박는 것입니다. 임원은 범위 모호함을 가장 싫어합니다."},{"n":62,"title":"일정·마일스톤 관리","scene":"프로그램 게이트웨이 일정을 점검하며 마일스톤 진척과 지연 가능성을 매니저들에게 보고하는 상황입니다.","goal":"마일스톤 상태를 명확히 전달하고 일정 리스크에 대한 대응을 정렬합니다.","expressions":[{"en":"We're tracking against the program timeline with three gateways remaining.","ko":"남은 세 개의 게이트웨이를 기준으로 프로그램 일정을 추적하고 있습니다."},{"en":"The design freeze milestone is on track for the end of this month.","ko":"설계 동결 마일스톤은 이번 달 말 일정대로 진행 중입니다."},{"en":"We have a two-week buffer before the tooling release deadline.","ko":"금형 발주 마감까지 2주의 여유 기간이 있습니다."},{"en":"One activity has slipped, but it's not on the critical path.","ko":"한 작업이 지연됐지만 주요 경로상에 있지는 않습니다."},{"en":"Let me highlight the dependencies that could affect downstream milestones.","ko":"하위 마일스톤에 영향을 줄 수 있는 의존성을 강조해 드리겠습니다."},{"en":"If we recover the slip this week, we protect the gateway date.","ko":"이번 주에 지연을 회복하면 게이트웨이 일정을 지킬 수 있습니다."},{"en":"I'd recommend re-sequencing these two tasks to absorb the delay.","ko":"지연을 흡수하기 위해 이 두 작업의 순서를 재조정할 것을 권장합니다."},{"en":"The updated schedule is in the shared tracker with revision history.","ko":"수정된 일정은 변경 이력과 함께 공유 트래커에 있습니다."}],"dialogue":[{"sp":"A","en":"Let me give you a quick status against the program milestones.","ko":"프로그램 마일스톤 대비 현황을 간략히 보고드리겠습니다."},{"sp":"B","en":"Are we still on for the design freeze at month-end?","ko":"월말 설계 동결은 여전히 예정대로인가요?"},{"sp":"A","en":"Yes, the design freeze is on track. We've completed eighty percent of the surface validation already.","ko":"네, 설계 동결은 일정대로입니다. 서피스 검증을 이미 80% 완료했습니다."},{"sp":"B","en":"What about the door trim package? I heard there was a slip.","ko":"도어 트림 패키지는요? 지연이 있었다고 들었습니다."},{"sp":"A","en":"There was a two-day slip on the door trim DFM review, but it sits off the critical path, so the gateway is protected.","ko":"도어 트림 DFM 검토에서 이틀 지연이 있었지만 주요 경로 밖이라 게이트웨이는 보호됩니다."},{"sp":"B","en":"Good. And the tooling release deadline?","ko":"좋습니다. 금형 발주 마감은요?"},{"sp":"A","en":"We're holding a two-week buffer. If any upstream task slips further, I'll re-sequence to absorb it before it touches tooling.","ko":"2주 여유를 유지하고 있습니다. 상위 작업이 더 지연되면 금형에 영향을 주기 전에 순서를 재조정해 흡수하겠습니다."},{"sp":"A","en":"I'll flag any milestone at amber status the moment it appears, not at the review. No surprises.","ko":"어떤 마일스톤이든 황색 상태가 보이는 즉시 보고하겠습니다, 검토 때가 아니라요. 예기치 못한 일은 없도록 하겠습니다."}],"vocab":[{"t":"milestone","ko":"마일스톤"},{"t":"gateway","ko":"관문, 게이트웨이"},{"t":"design freeze","ko":"설계 동결"},{"t":"buffer","ko":"여유 기간, 버퍼"},{"t":"dependency","ko":"의존성"},{"t":"re-sequence","ko":"순서를 재조정하다"},{"t":"amber status","ko":"황색(주의) 상태"}],"drill":[{"ko":"설계 동결 마일스톤은 일정대로 진행 중입니다.","en":"The design freeze milestone is on track."},{"ko":"금형 발주 마감까지 2주의 여유가 있습니다.","en":"We have a two-week buffer before the tooling release deadline."},{"ko":"한 작업이 지연됐지만 주요 경로상에 있지 않습니다.","en":"One activity has slipped, but it's not on the critical path."},{"ko":"이 두 작업의 순서를 재조정할 것을 권장합니다.","en":"I'd recommend re-sequencing these two tasks."},{"ko":"지연을 회복하면 게이트웨이 일정을 지킬 수 있습니다.","en":"If we recover the slip, we protect the gateway date."}],"tip":"임원에게 일정을 보고할 때는 '지연됐다'가 아니라 '지연됐지만 주요 경로 밖이라 영향 없다' 또는 '이렇게 회복한다'까지 한 호흡에 말해야 신뢰를 얻습니다."},{"n":63,"title":"리스크 식별과 보고","scene":"프로그램 리스크 레지스터를 업데이트하고 상위 리스크를 운영위에 보고하는 상황입니다.","goal":"주요 리스크를 발생가능성·영향도와 함께 정량적으로 보고하고 완화 계획을 제시합니다.","expressions":[{"en":"I've updated the risk register; let me walk you through the top three risks.","ko":"리스크 레지스터를 업데이트했습니다. 상위 세 가지 리스크를 설명드리겠습니다."},{"en":"This risk is rated high probability and high impact.","ko":"이 리스크는 발생가능성과 영향도 모두 높음으로 평가됩니다."},{"en":"The exposure here is a potential four-week schedule slip.","ko":"여기서의 노출은 최대 4주 일정 지연 가능성입니다."},{"en":"Our mitigation plan is to qualify a second material supplier in parallel.","ko":"완화 계획은 제2 소재 공급사를 병행 인증하는 것입니다."},{"en":"The contingency, if mitigation fails, is to switch to a proven carryover part.","ko":"완화가 실패할 경우의 컨틴전시는 검증된 캐리오버 부품으로 전환하는 것입니다."},{"en":"We're tracking this as an open risk with a defined trigger point.","ko":"정의된 발동 시점과 함께 미해결 리스크로 추적하고 있습니다."},{"en":"I'd like to escalate this one for steering committee visibility.","ko":"이 건은 운영위의 가시성을 위해 에스컬레이션하고자 합니다."},{"en":"The residual risk after mitigation is acceptable.","ko":"완화 후 잔여 리스크는 수용 가능한 수준입니다."}],"dialogue":[{"sp":"A","en":"I'd like to walk the committee through our updated risk register, starting with the highest exposure.","ko":"가장 높은 노출부터 시작해 업데이트된 리스크 레지스터를 위원회에 설명드리고자 합니다."},{"sp":"B","en":"Go ahead. What's the number one risk?","ko":"진행하세요. 1순위 리스크가 무엇입니까?"},{"sp":"A","en":"The grain texture supplier has a capacity constraint. High probability, high impact, with a potential four-week slip to Job 1.","ko":"그레인 텍스처 공급사에 생산능력 제약이 있습니다. 발생가능성 높음, 영향도 높음이며 양산까지 최대 4주 지연 가능성이 있습니다."},{"sp":"B","en":"That's serious. What are you doing about it?","ko":"심각하군요. 어떤 조치를 하고 있습니까?"},{"sp":"A","en":"Mitigation is to qualify a second supplier in parallel. The contingency is to revert to a proven carryover grain if qualification fails.","ko":"완화책은 제2 공급사를 병행 인증하는 것입니다. 인증이 실패하면 검증된 캐리오버 그레인으로 되돌리는 것이 컨틴전시입니다."},{"sp":"B","en":"When do we know if the mitigation is working?","ko":"완화책이 효과가 있는지 언제 알 수 있나요?"},{"sp":"A","en":"The trigger point is the qualification result in week six. If it's negative, we execute the contingency immediately, no further debate.","ko":"발동 시점은 6주 차의 인증 결과입니다. 부정적이면 추가 논의 없이 즉시 컨틴전시를 실행합니다."},{"sp":"A","en":"I'm asking for steering visibility on this single risk so a fast decision is possible if we hit the trigger.","ko":"발동 시점에 도달했을 때 빠른 의사결정이 가능하도록 이 리스크 하나에 대해 운영위의 가시성을 요청드립니다."}],"vocab":[{"t":"risk register","ko":"리스크 레지스터"},{"t":"probability","ko":"발생가능성"},{"t":"impact","ko":"영향도"},{"t":"exposure","ko":"(리스크) 노출"},{"t":"mitigation","ko":"완화책"},{"t":"contingency","ko":"비상 대안, 컨틴전시"},{"t":"residual risk","ko":"잔여 리스크"}],"drill":[{"ko":"상위 세 가지 리스크를 설명드리겠습니다.","en":"Let me walk you through the top three risks."},{"ko":"이 리스크는 발생가능성과 영향도 모두 높음입니다.","en":"This risk is rated high probability and high impact."},{"ko":"완화 계획은 제2 공급사를 병행 인증하는 것입니다.","en":"Our mitigation plan is to qualify a second supplier in parallel."},{"ko":"이 건은 운영위 가시성을 위해 에스컬레이션하고자 합니다.","en":"I'd like to escalate this one for steering committee visibility."},{"ko":"완화 후 잔여 리스크는 수용 가능합니다.","en":"The residual risk after mitigation is acceptable."}],"tip":"리스크 보고의 핵심은 '발생가능성×영향도'로 정량화하고, 완화책뿐 아니라 컨틴전시와 '발동 시점(trigger)'까지 묶어서 제시하는 것입니다. 임원은 '언제 결정해야 하는가'를 가장 알고 싶어 합니다."},{"n":64,"title":"이슈 에스컬레이션","scene":"현장에서 해결되지 않는 품질 이슈를 상위 의사결정자에게 에스컬레이션해야 하는 상황입니다.","goal":"이슈의 시급성과 필요한 결정을 명확히 전달하고 적시에 상위 개입을 끌어냅니다.","expressions":[{"en":"I'm escalating this because it now exceeds our team's authority to resolve.","ko":"이 건은 이제 우리 팀의 해결 권한을 넘어서므로 에스컬레이션합니다."},{"en":"We've exhausted the options at the working level.","ko":"실무 차원에서 가능한 방안은 모두 소진했습니다."},{"en":"I need a decision by end of day to hold the schedule.","ko":"일정을 지키려면 오늘 중으로 결정이 필요합니다."},{"en":"Here's the issue, the impact, and the specific decision I'm asking for.","ko":"이슈, 영향, 그리고 제가 요청드리는 구체적 결정을 말씀드립니다."},{"en":"Without intervention, we'll miss the tooling release window.","ko":"개입이 없으면 금형 발주 기한을 놓치게 됩니다."},{"en":"I'm not asking you to solve it; I'm asking you to authorize option B.","ko":"해결을 부탁드리는 게 아니라 B안 승인을 요청드리는 것입니다."},{"en":"Let me be clear on what's blocking us and who can unblock it.","ko":"무엇이 막고 있고 누가 풀 수 있는지 명확히 말씀드리겠습니다."},{"en":"I'll take the action once you confirm the direction.","ko":"방향을 확정해 주시면 제가 조치를 실행하겠습니다."}],"dialogue":[{"sp":"A","en":"I need to escalate a blocking issue on the console assembly. I'll keep it to two minutes.","ko":"콘솔 조립의 차단 이슈를 에스컬레이션해야 합니다. 2분 안에 말씀드리겠습니다."},{"sp":"B","en":"Go ahead. What's blocking you?","ko":"말씀하세요. 무엇이 막고 있나요?"},{"sp":"A","en":"The supplier and our quality team disagree on the gap tolerance, and neither side will move. It's stalled for three days.","ko":"공급사와 우리 품질팀이 갭 공차에 대해 이견이 있고 양측 모두 양보하지 않습니다. 3일째 멈춰 있습니다."},{"sp":"B","en":"What's the impact if it stays stalled?","ko":"계속 멈춰 있으면 영향이 어떻게 됩니까?"},{"sp":"A","en":"We miss the tooling release window this Friday, which pushes Job 1 by at least two weeks.","ko":"이번 금요일 금형 발주 기한을 놓치고, 양산이 최소 2주 밀립니다."},{"sp":"B","en":"What do you need from me?","ko":"저에게 무엇이 필요합니까?"},{"sp":"A","en":"A decision on the tolerance by end of day. I recommend accepting option B with a deviation note. I just need your authorization.","ko":"오늘 중으로 공차에 대한 결정입니다. 편차 노트와 함께 B안 수용을 권장드립니다. 승인만 해 주시면 됩니다."},{"sp":"A","en":"Confirm the direction and I'll execute and notify both teams within the hour.","ko":"방향을 확정해 주시면 제가 실행하고 한 시간 내로 양 팀에 통보하겠습니다."}],"vocab":[{"t":"escalate","ko":"에스컬레이션하다, 상위 보고하다"},{"t":"authority","ko":"권한"},{"t":"blocking issue","ko":"차단 이슈"},{"t":"intervention","ko":"개입"},{"t":"unblock","ko":"(장애를) 해소하다"},{"t":"authorize","ko":"승인하다"},{"t":"deviation","ko":"편차, 일탈(승인)"}],"drill":[{"ko":"이 건은 우리 팀의 해결 권한을 넘어서므로 에스컬레이션합니다.","en":"I'm escalating this because it exceeds our team's authority to resolve."},{"ko":"일정을 지키려면 오늘 중으로 결정이 필요합니다.","en":"I need a decision by end of day to hold the schedule."},{"ko":"개입이 없으면 금형 발주 기한을 놓치게 됩니다.","en":"Without intervention, we'll miss the tooling release window."},{"ko":"해결이 아니라 B안 승인을 요청드리는 것입니다.","en":"I'm not asking you to solve it; I'm asking you to authorize option B."},{"ko":"방향을 확정해 주시면 제가 조치를 실행하겠습니다.","en":"I'll take the action once you confirm the direction."}],"tip":"좋은 에스컬레이션은 '도와주세요'가 아니라 '이 결정만 내려주시면 나머지는 제가 합니다'입니다. 이슈·영향·요청 결정 세 가지를 60초 안에 끝내는 사람이 임원의 신뢰를 얻습니다."},{"n":65,"title":"상태 보고(Status Report)","scene":"주간 프로그램 상태를 RAG(적·황·녹) 형식으로 매니저들에게 간결하게 보고하는 상황입니다.","goal":"진척, 리스크, 필요 조치를 구조화된 형식으로 빠르게 전달합니다.","expressions":[{"en":"Overall program status is green this week, with one item at amber.","ko":"이번 주 전체 프로그램 상태는 녹색이며, 한 항목이 황색입니다."},{"en":"Let me cover progress, risks, and asks in that order.","ko":"진척, 리스크, 요청 순으로 말씀드리겠습니다."},{"en":"Against the plan, we're on schedule and on budget.","ko":"계획 대비 일정과 예산을 준수하고 있습니다."},{"en":"The one amber item is the door trim color match.","ko":"유일한 황색 항목은 도어 트림 색상 매칭입니다."},{"en":"Key accomplishments this week include closing five open issues.","ko":"이번 주 주요 성과로는 미해결 이슈 5건 종결이 있습니다."},{"en":"Next week's focus is the surface freeze for the instrument panel.","ko":"다음 주 초점은 IP 서피스 동결입니다."},{"en":"I have one ask: a decision on the supplier sourcing by Wednesday.","ko":"한 가지 요청이 있습니다. 수요일까지 공급사 소싱 결정입니다."},{"en":"No change to the critical path; we remain on track for the gateway.","ko":"주요 경로 변동 없으며, 게이트웨이 일정대로 진행 중입니다."}],"dialogue":[{"sp":"A","en":"Here's the weekly status. Headline: program is green, one item amber, no reds.","ko":"주간 현황입니다. 핵심: 프로그램 녹색, 한 항목 황색, 적색 없음."},{"sp":"B","en":"Good. Walk me through the amber.","ko":"좋습니다. 황색 항목을 설명해 주세요."},{"sp":"A","en":"The door trim color match is off by a small delta against the master. We have a corrective sample arriving Thursday.","ko":"도어 트림 색상 매칭이 마스터 대비 작은 차이가 있습니다. 목요일에 시정 샘플이 도착합니다."},{"sp":"B","en":"Will that pull it back to green?","ko":"그러면 녹색으로 돌아오나요?"},{"sp":"A","en":"Yes, if the sample passes, it's green by Friday. If not, I'll escalate same day. No surprises.","ko":"네, 샘플이 통과하면 금요일에 녹색입니다. 아니면 당일에 에스컬레이션하겠습니다. 예기치 못한 일은 없습니다."},{"sp":"B","en":"What did the team close out this week?","ko":"이번 주에 팀이 종결한 건은 무엇인가요?"},{"sp":"A","en":"Five open issues closed and the IP surface validation completed. Next week we freeze the IP surface.","ko":"미해결 이슈 5건 종결, IP 서피스 검증 완료입니다. 다음 주에 IP 서피스를 동결합니다."},{"sp":"A","en":"One ask: I need a sourcing decision by Wednesday to protect the tooling date. Everything else is on track.","ko":"한 가지 요청: 금형 일정을 지키려면 수요일까지 소싱 결정이 필요합니다. 그 외는 모두 정상입니다."}],"vocab":[{"t":"status report","ko":"상태 보고"},{"t":"RAG (red/amber/green)","ko":"적·황·녹 상태"},{"t":"headline","ko":"핵심 요지"},{"t":"on schedule, on budget","ko":"일정·예산 준수"},{"t":"accomplishment","ko":"성과"},{"t":"ask","ko":"요청 사항"},{"t":"corrective sample","ko":"시정 샘플"}],"drill":[{"ko":"전체 프로그램 상태는 녹색이며 한 항목이 황색입니다.","en":"Overall program status is green, with one item at amber."},{"ko":"진척, 리스크, 요청 순으로 말씀드리겠습니다.","en":"Let me cover progress, risks, and asks in that order."},{"ko":"계획 대비 일정과 예산을 준수하고 있습니다.","en":"Against the plan, we're on schedule and on budget."},{"ko":"한 가지 요청이 있습니다: 수요일까지 소싱 결정입니다.","en":"I have one ask: a sourcing decision by Wednesday."},{"ko":"주요 경로 변동 없으며 게이트웨이 일정대로입니다.","en":"No change to the critical path; we remain on track for the gateway."}],"tip":"상태 보고는 '헤드라인 → 진척 → 리스크 → 요청' 구조가 정석입니다. 적·황·녹으로 시작하고, 황색·적색에는 반드시 '언제 회복되는가'를 붙이세요. 보고는 짧을수록 강합니다."},{"n":66,"title":"자원·예산 협의","scene":"추가 검증 인력과 시제품 예산을 확보하기 위해 리더십과 협의하는 상황입니다.","goal":"필요 자원을 근거와 함께 정당화하고 트레이드오프를 명확히 제시합니다.","expressions":[{"en":"To hold the timeline, we need two additional validation engineers.","ko":"일정을 지키려면 검증 엔지니어 2명이 추가로 필요합니다."},{"en":"The incremental cost is offset by avoiding a four-week delay.","ko":"추가 비용은 4주 지연을 피함으로써 상쇄됩니다."},{"en":"Here's the trade-off: invest now or risk a launch slip.","ko":"트레이드오프는 이렇습니다. 지금 투자하거나 출시 지연을 감수하거나입니다."},{"en":"I've prioritized the budget request against actual program risk.","ko":"실제 프로그램 리스크에 비춰 예산 요청의 우선순위를 정했습니다."},{"en":"Without the additional prototype build, we can't close validation in time.","ko":"추가 시제품 제작 없이는 검증을 제때 종료할 수 없습니다."},{"en":"This is the minimum resourcing needed to stay on the critical path.","ko":"이것이 주요 경로를 유지하는 데 필요한 최소 자원입니다."},{"en":"I can reallocate from a lower-priority workstream if needed.","ko":"필요하다면 우선순위가 낮은 작업에서 재배분할 수 있습니다."},{"en":"The return on this spend is schedule protection and quality assurance.","ko":"이 지출의 효과는 일정 보호와 품질 보증입니다."}],"dialogue":[{"sp":"A","en":"I'd like to discuss the resourcing needed to keep validation on the critical path.","ko":"검증을 주요 경로에 유지하는 데 필요한 자원을 논의드리고자 합니다."},{"sp":"B","en":"How much are we talking about?","ko":"규모가 어느 정도입니까?"},{"sp":"A","en":"Two validation engineers for ten weeks and one additional prototype build. Roughly the cost of a single delayed shipment.","ko":"검증 엔지니어 2명 10주, 그리고 추가 시제품 1대입니다. 대략 출하 1회 지연 비용 수준입니다."},{"sp":"B","en":"That's not trivial. What happens if we don't fund it?","ko":"적지 않군요. 자금을 대지 않으면 어떻게 됩니까?"},{"sp":"A","en":"We can't complete validation before the gateway, which puts a four-week launch slip in play. The spend buys schedule protection.","ko":"게이트웨이 전에 검증을 끝낼 수 없어 4주 출시 지연 가능성이 생깁니다. 이 지출이 일정 보호를 사는 것입니다."},{"sp":"B","en":"Can you find any of it internally?","ko":"일부는 내부에서 조달할 수 있나요?"},{"sp":"A","en":"I can reallocate one engineer from a lower-priority styling study, so the net ask drops to one new hire plus the build.","ko":"우선순위가 낮은 스타일링 연구에서 1명을 재배분할 수 있어, 순 요청은 신규 1명과 시제품으로 줄어듭니다."},{"sp":"A","en":"The trade-off is clear: a contained, justified spend now, or an uncontained schedule risk later. I recommend funding it.","ko":"트레이드오프는 명확합니다. 통제된 정당한 지출을 지금 하거나, 통제 불가능한 일정 리스크를 나중에 감수하거나입니다. 자금 집행을 권장드립니다."}],"vocab":[{"t":"resourcing","ko":"자원 배치"},{"t":"incremental cost","ko":"추가 비용"},{"t":"trade-off","ko":"트레이드오프"},{"t":"reallocate","ko":"재배분하다"},{"t":"prototype build","ko":"시제품 제작"},{"t":"workstream","ko":"작업 흐름, 워크스트림"},{"t":"return on spend","ko":"지출 대비 효과"}],"drill":[{"ko":"일정을 지키려면 검증 엔지니어 2명이 추가로 필요합니다.","en":"To hold the timeline, we need two additional validation engineers."},{"ko":"추가 비용은 4주 지연을 피함으로써 상쇄됩니다.","en":"The incremental cost is offset by avoiding a four-week delay."},{"ko":"트레이드오프는 지금 투자하거나 출시 지연을 감수하거나입니다.","en":"The trade-off is: invest now or risk a launch slip."},{"ko":"필요하다면 우선순위가 낮은 작업에서 재배분할 수 있습니다.","en":"I can reallocate from a lower-priority workstream if needed."},{"ko":"이 지출의 효과는 일정 보호와 품질 보증입니다.","en":"The return on this spend is schedule protection and quality assurance."}],"tip":"예산 협의에서는 '필요하다'가 아니라 '이걸 안 하면 무엇을 잃는가(지연 비용)'로 프레이밍하세요. 그리고 항상 내부 재배분 가능분을 먼저 제시하면, 임원은 당신이 책임감 있게 돈을 쓴다고 신뢰합니다."},{"n":67,"title":"변경 관리(Change Control)","scene":"설계 동결 이후 발생한 설계 변경 요청을 변경관리위원회(CCB)에 상정하는 상황입니다.","goal":"변경의 사유, 영향, 승인 필요성을 통제된 절차에 따라 명확히 제시합니다.","expressions":[{"en":"I'm submitting a change request after design freeze, so it requires CCB approval.","ko":"설계 동결 이후 변경 요청을 제출하므로 변경관리위원회 승인이 필요합니다."},{"en":"The change is driven by a regulatory update on head impact requirements.","ko":"이 변경은 머리 충격 요건에 대한 규제 변경에서 비롯됩니다."},{"en":"Let me quantify the impact on cost, timing, and tooling.","ko":"원가, 일정, 금형에 대한 영향을 정량화하겠습니다."},{"en":"The change adds a small cost but is mandatory for compliance.","ko":"이 변경은 약간의 원가를 추가하지만 규제 준수를 위해 필수적입니다."},{"en":"I've assessed the downstream effect on adjacent components.","ko":"인접 부품에 대한 하위 영향을 평가했습니다."},{"en":"If approved today, we can incorporate it without slipping the gateway.","ko":"오늘 승인되면 게이트웨이 지연 없이 반영할 수 있습니다."},{"en":"I'm not recommending we open the baseline for anything optional.","ko":"선택적 사항으로 베이스라인을 여는 것은 권장하지 않습니다."},{"en":"Here's the change, the rationale, and the requested disposition.","ko":"변경 내용, 사유, 그리고 요청 처리 방향을 말씀드립니다."}],"dialogue":[{"sp":"A","en":"I'm bringing a change request to the board. It's post-freeze, so it needs formal approval.","ko":"위원회에 변경 요청을 상정합니다. 동결 이후 건이라 정식 승인이 필요합니다."},{"sp":"B","en":"Why are we reopening the baseline?","ko":"왜 베이스라인을 다시 여는 겁니까?"},{"sp":"A","en":"A regulatory update on head impact mandates a thicker energy-absorbing structure behind the upper IP. This isn't optional.","ko":"머리 충격 규제 변경으로 상부 IP 뒤쪽에 더 두꺼운 충격 흡수 구조가 의무화됐습니다. 선택 사항이 아닙니다."},{"sp":"B","en":"What's the impact?","ko":"영향은 어떻게 됩니까?"},{"sp":"A","en":"A modest piece-cost increase, one tooling modification, and no impact on the gateway if we approve today.","ko":"소폭의 부품 원가 상승, 금형 1건 수정, 그리고 오늘 승인하면 게이트웨이 영향 없음입니다."},{"sp":"B","en":"Any effect on adjacent parts?","ko":"인접 부품에 영향이 있나요?"},{"sp":"A","en":"I've checked the interfaces. The defroster duct needs a minor clearance adjustment, which is already captured in the request.","ko":"인터페이스를 확인했습니다. 디프로스터 덕트에 약간의 간섭 조정이 필요하며, 이미 요청서에 반영돼 있습니다."},{"sp":"A","en":"My recommended disposition is approve as mandatory. Delay only increases the tooling impact, so I'd ask for sign-off today.","ko":"권장 처리 방향은 필수 사항으로 승인입니다. 지연되면 금형 영향만 커지므로 오늘 승인을 요청드립니다."}],"vocab":[{"t":"change request","ko":"변경 요청"},{"t":"change control board (CCB)","ko":"변경관리위원회"},{"t":"design freeze","ko":"설계 동결"},{"t":"rationale","ko":"사유, 근거"},{"t":"downstream effect","ko":"하위(연쇄) 영향"},{"t":"disposition","ko":"처리 방향, 결정"},{"t":"compliance","ko":"규제 준수"}],"drill":[{"ko":"동결 이후 변경 요청이라 위원회 승인이 필요합니다.","en":"It's a post-freeze change request, so it requires CCB approval."},{"ko":"원가, 일정, 금형에 대한 영향을 정량화하겠습니다.","en":"Let me quantify the impact on cost, timing, and tooling."},{"ko":"이 변경은 규제 준수를 위해 필수적입니다.","en":"This change is mandatory for compliance."},{"ko":"오늘 승인되면 게이트웨이 지연 없이 반영할 수 있습니다.","en":"If approved today, we can incorporate it without slipping the gateway."},{"ko":"변경 내용, 사유, 요청 처리 방향을 말씀드립니다.","en":"Here's the change, the rationale, and the requested disposition."}],"tip":"변경 관리의 핵심은 '왜(필수 vs 선택)'와 '영향(원가·일정·인접부품)'을 분리해 제시하는 것입니다. 임원은 선택적 변경에는 보수적이고 규제·안전 변경에는 빠릅니다. 그 구분을 첫 문장에서 명확히 하세요."},{"n":68,"title":"이해관계자 커뮤니케이션","scene":"OEM 구매, 디자인, 품질, Tier-1 공급사 등 다수 이해관계자의 상충하는 요구를 조율하는 상황입니다.","goal":"이해관계자별 관심사를 파악하고 메시지를 맞춤화하여 정렬을 이끌어냅니다.","expressions":[{"en":"Let me make sure each stakeholder's priorities are reflected.","ko":"각 이해관계자의 우선순위가 반영되도록 하겠습니다."},{"en":"Purchasing cares about cost; design cares about aesthetics; both are valid.","ko":"구매는 원가를, 디자인은 심미성을 중시합니다. 둘 다 타당합니다."},{"en":"I'll tailor the message to what each audience needs to hear.","ko":"각 청중이 들어야 할 내용에 맞춰 메시지를 조정하겠습니다."},{"en":"The common ground here is meeting the launch date.","ko":"여기서 공통의 지점은 출시 일정 준수입니다."},{"en":"Let me align expectations before we proceed.","ko":"진행하기 전에 기대치를 정렬하겠습니다."},{"en":"I've consulted all parties so no one is surprised by the decision.","ko":"어떤 당사자도 결정에 놀라지 않도록 모두와 사전 협의했습니다."},{"en":"I'll keep everyone informed on a single source of truth.","ko":"단일 정보 출처로 모두에게 계속 공유하겠습니다."},{"en":"Can we agree on a shared position before the OEM review?","ko":"OEM 검토 전에 공동 입장에 합의할 수 있을까요?"}],"dialogue":[{"sp":"A","en":"Before the OEM review, I want to align all stakeholders so we present one position.","ko":"OEM 검토 전에 한 목소리로 발표하도록 모든 이해관계자를 정렬하고자 합니다."},{"sp":"B","en":"Purchasing wants the lower-cost material. Design is pushing back hard.","ko":"구매는 더 저렴한 소재를 원하고 디자인은 강하게 반대합니다."},{"sp":"A","en":"Both concerns are legitimate. Purchasing needs the cost target; design needs the perceived quality. Let me find the overlap.","ko":"두 우려 모두 타당합니다. 구매는 원가 목표가, 디자인은 인지 품질이 필요합니다. 겹치는 지점을 찾겠습니다."},{"sp":"B","en":"Is there a material that satisfies both?","ko":"둘 다 만족하는 소재가 있나요?"},{"sp":"A","en":"Yes, a mid-grade soft-touch that hits the cost target while preserving the grain feel design wants. I've validated it with both teams.","ko":"네, 원가 목표를 맞추면서 디자인이 원하는 그레인 감촉을 유지하는 중급 소프트터치가 있습니다. 양 팀과 검증했습니다."},{"sp":"B","en":"Have you told the supplier yet?","ko":"공급사에는 이미 알렸나요?"},{"sp":"A","en":"Yes, I consulted them first so the lead time is confirmed. Everyone hears the same message from one source.","ko":"네, 리드타임을 확정하려고 먼저 협의했습니다. 모두가 하나의 출처에서 같은 메시지를 듣습니다."},{"sp":"A","en":"So we walk into the OEM review aligned, with cost, design, and supply already reconciled. No public disagreement.","ko":"그래서 원가, 디자인, 공급이 이미 조율된 상태로 정렬돼 OEM 검토에 들어갑니다. 공개적 이견은 없습니다."}],"vocab":[{"t":"stakeholder","ko":"이해관계자"},{"t":"tailor the message","ko":"메시지를 맞춤화하다"},{"t":"common ground","ko":"공통의 지점"},{"t":"align expectations","ko":"기대치를 정렬하다"},{"t":"single source of truth","ko":"단일 정보 출처"},{"t":"reconcile","ko":"(이견을) 조율하다"},{"t":"perceived quality","ko":"인지 품질"}],"drill":[{"ko":"각 청중이 들어야 할 내용에 맞춰 메시지를 조정하겠습니다.","en":"I'll tailor the message to what each audience needs to hear."},{"ko":"여기서 공통의 지점은 출시 일정 준수입니다.","en":"The common ground here is meeting the launch date."},{"ko":"어떤 당사자도 결정에 놀라지 않도록 모두와 협의했습니다.","en":"I've consulted all parties so no one is surprised by the decision."},{"ko":"단일 정보 출처로 모두에게 계속 공유하겠습니다.","en":"I'll keep everyone informed on a single source of truth."},{"ko":"OEM 검토 전에 공동 입장에 합의할 수 있을까요?","en":"Can we agree on a shared position before the OEM review?"}],"tip":"이해관계자 관리의 본질은 '사전 정렬'입니다. 회의장에서 이견이 처음 드러나면 이미 실패입니다. 각자를 미리 만나 같은 메시지를 듣게 하고, 공개 석상에서는 한 목소리로 나가세요."},{"n":69,"title":"지연·문제 상황 보고","scene":"출시 일정에 영향을 주는 중대한 지연이 확정되어 리더십에 솔직하게 보고하는 상황입니다.","goal":"지연 사실을 회피 없이 보고하되 원인, 영향, 회복 계획을 함께 제시합니다.","expressions":[{"en":"I want to be direct: we are going to slip the gateway by two weeks.","ko":"솔직하게 말씀드립니다. 게이트웨이를 2주 지연하게 됩니다."},{"en":"Let me give you the root cause, not just the symptom.","ko":"증상이 아니라 근본 원인을 말씀드리겠습니다."},{"en":"Here's what we're doing to recover the lost time.","ko":"잃어버린 시간을 회복하기 위해 하고 있는 일을 말씀드립니다."},{"en":"I own this; the team executed well, but the assumption was wrong.","ko":"이 건은 제 책임입니다. 팀은 잘 수행했으나 가정이 틀렸습니다."},{"en":"The realistic recovery scenario brings us back to within one week.","ko":"현실적인 회복 시나리오는 1주 이내로 되돌립니다."},{"en":"I'd rather report this now than let it surface later.","ko":"나중에 드러나게 두기보다 지금 보고드리는 편이 낫습니다."},{"en":"The downstream impact on launch is contained to a single market.","ko":"출시에 대한 하위 영향은 단일 시장으로 한정됩니다."},{"en":"I'll commit to a firm recovery date by Friday.","ko":"금요일까지 확정된 회복 일정을 약속드리겠습니다."}],"dialogue":[{"sp":"A","en":"I have difficult news and I want to deliver it straight. We're going to miss the design gateway by two weeks.","ko":"어려운 소식이 있고 솔직하게 전하고자 합니다. 설계 게이트웨이를 2주 놓치게 됩니다."},{"sp":"B","en":"That's a real problem. What caused it?","ko":"실제로 문제군요. 무엇 때문입니까?"},{"sp":"A","en":"The root cause is a failed durability test on the console hinge. Our load assumption was too optimistic. I own that call.","ko":"근본 원인은 콘솔 힌지의 내구 시험 실패입니다. 하중 가정이 너무 낙관적이었습니다. 그 판단은 제 책임입니다."},{"sp":"B","en":"What's the impact on launch?","ko":"출시에 미치는 영향은요?"},{"sp":"A","en":"Contained to one market. With a redesign in parallel and expedited tooling, the realistic recovery is within one week of original.","ko":"한 시장으로 한정됩니다. 재설계 병행과 금형 긴급 진행으로, 현실적 회복은 원안 대비 1주 이내입니다."},{"sp":"B","en":"How confident are you in that recovery?","ko":"그 회복에 대한 확신은 어느 정도입니까?"},{"sp":"A","en":"Seventy percent today. I'll lock a firm date by Friday once the redesign passes the first analysis loop. No optimistic spin.","ko":"오늘 기준 70%입니다. 재설계가 첫 해석 루프를 통과하면 금요일까지 확정 일정을 못 박겠습니다. 낙관적 포장은 하지 않습니다."},{"sp":"A","en":"I chose to bring this to you the moment it was certain, not at the review. You'll never hear bad news late from me.","ko":"확실해진 즉시 가져왔습니다, 검토 때가 아니라요. 저에게서 나쁜 소식을 늦게 듣는 일은 없을 것입니다."}],"vocab":[{"t":"slip","ko":"지연되다"},{"t":"root cause","ko":"근본 원인"},{"t":"symptom","ko":"증상"},{"t":"own (a problem)","ko":"(문제를) 책임지다"},{"t":"recovery scenario","ko":"회복 시나리오"},{"t":"contained","ko":"한정된, 통제된"},{"t":"spin","ko":"(유리한) 포장, 왜곡"}],"drill":[{"ko":"솔직하게 말씀드립니다. 게이트웨이를 2주 지연하게 됩니다.","en":"I want to be direct: we are going to slip the gateway by two weeks."},{"ko":"증상이 아니라 근본 원인을 말씀드리겠습니다.","en":"Let me give you the root cause, not just the symptom."},{"ko":"이 건은 제 책임입니다.","en":"I own this."},{"ko":"나중에 드러나게 두기보다 지금 보고드리는 편이 낫습니다.","en":"I'd rather report this now than let it surface later."},{"ko":"금요일까지 확정된 회복 일정을 약속드리겠습니다.","en":"I'll commit to a firm recovery date by Friday."}],"tip":"지연 보고는 타이밍이 전부입니다. 확실해진 즉시, 회피 없이, 근본 원인과 회복 계획을 함께 가져가세요. '제 책임입니다(I own this)'라는 한 마디가 오히려 신뢰를 키웁니다. 늦게 드러난 나쁜 소식이 경력을 끝냅니다."},{"n":70,"title":"프로젝트 종료와 교훈 정리","scene":"프로그램 종료 후 회고(lessons learned) 세션을 주관하며 다음 프로그램으로 전수할 교훈을 정리하는 상황입니다.","goal":"성과와 실패를 객관적으로 회고하고 재사용 가능한 교훈을 도출합니다.","expressions":[{"en":"Let's close out the program with an honest lessons-learned review.","ko":"솔직한 교훈 정리로 프로그램을 마무리하겠습니다."},{"en":"What went well, what didn't, and what we'd do differently.","ko":"잘된 것, 안 된 것, 다르게 할 것을 봅니다."},{"en":"The biggest win was the early supplier integration.","ko":"가장 큰 성과는 초기 공급사 통합이었습니다."},{"en":"The key miss was underestimating the validation lead time.","ko":"가장 큰 실수는 검증 리드타임을 과소평가한 것입니다."},{"en":"Let's capture these as reusable standards, not just notes.","ko":"이것들을 단순 메모가 아니라 재사용 가능한 표준으로 정리합시다."},{"en":"I'd like each lesson to have a clear owner for the next program.","ko":"각 교훈마다 다음 프로그램의 명확한 담당자를 두고자 합니다."},{"en":"This review is blameless; we're after the process, not the person.","ko":"이 회고는 비난 없이 진행합니다. 사람이 아니라 프로세스를 봅니다."},{"en":"Thank you to the team for delivering under real pressure.","ko":"실질적인 압박 속에서도 완수해 준 팀에 감사드립니다."}],"dialogue":[{"sp":"A","en":"We've closed the program, so let's do a blameless lessons-learned. The goal is a better next program, not finger-pointing.","ko":"프로그램을 종료했으니 비난 없는 교훈 정리를 하겠습니다. 목표는 손가락질이 아니라 더 나은 다음 프로그램입니다."},{"sp":"B","en":"Where should we start?","ko":"어디서부터 시작할까요?"},{"sp":"A","en":"Let's start with what went well. The early supplier integration cut our issue resolution time roughly in half.","ko":"잘된 것부터 시작합시다. 초기 공급사 통합으로 이슈 해결 시간이 대략 절반으로 줄었습니다."},{"sp":"B","en":"And the painful part?","ko":"아팠던 부분은요?"},{"sp":"A","en":"We underestimated validation lead time and lost two weeks. The lesson is to add a validation buffer at the planning stage by default.","ko":"검증 리드타임을 과소평가해 2주를 잃었습니다. 교훈은 기획 단계에서 검증 버퍼를 기본값으로 넣는 것입니다."},{"sp":"B","en":"How do we make sure the next program actually uses this?","ko":"다음 프로그램이 이를 실제로 활용하게 하려면요?"},{"sp":"A","en":"Each lesson gets an owner and goes into the program playbook as a standard, not a footnote. I'll assign owners today.","ko":"각 교훈에 담당자를 두고, 각주가 아니라 표준으로 프로그램 플레이북에 넣습니다. 오늘 담당자를 지정하겠습니다."},{"sp":"A","en":"Before we wrap, thank you. This team delivered a complex interior under real pressure, and that deserves recognition.","ko":"마무리 전에 감사드립니다. 이 팀은 실질적 압박 속에서 복잡한 내장을 완수했고, 그것은 인정받아 마땅합니다."}],"vocab":[{"t":"lessons learned","ko":"교훈 정리, 회고"},{"t":"close out","ko":"마무리하다, 종료하다"},{"t":"win","ko":"성과, 잘된 점"},{"t":"miss","ko":"실수, 놓친 점"},{"t":"blameless","ko":"비난 없는"},{"t":"playbook","ko":"플레이북, 실행 지침"},{"t":"recognition","ko":"인정, 치하"}],"drill":[{"ko":"잘된 것, 안 된 것, 다르게 할 것을 봅니다.","en":"What went well, what didn't, and what we'd do differently."},{"ko":"가장 큰 실수는 검증 리드타임을 과소평가한 것입니다.","en":"The key miss was underestimating the validation lead time."},{"ko":"이것들을 재사용 가능한 표준으로 정리합시다.","en":"Let's capture these as reusable standards."},{"ko":"이 회고는 비난 없이 진행합니다.","en":"This review is blameless."},{"ko":"각 교훈마다 명확한 담당자를 두고자 합니다.","en":"I'd like each lesson to have a clear owner."}],"tip":"회고가 형식적으로 끝나는 이유는 교훈에 '담당자'와 '표준화 경로'가 없기 때문입니다. 각 교훈을 플레이북에 표준으로 박고 담당자를 지정해야 다음 프로그램에서 실제로 살아납니다. 그리고 마지막엔 반드시 팀을 치하하세요."},{"n":71,"title":"임원 보고의 구조 (결론 우선)","scene":"경영진 앞에서 5분 안에 프로그램 핵심을 보고해야 하는 상황으로, 결론부터 말하는 BLUF 구조를 적용합니다.","goal":"결론을 먼저 제시하고 근거를 뒤에 배치하여 임원의 시간을 존중합니다.","expressions":[{"en":"Bottom line up front: we recommend approving the second sourcing.","ko":"결론부터 말씀드리면, 제2 소싱 승인을 권고드립니다."},{"en":"The headline is one sentence; the detail follows only if you want it.","ko":"핵심은 한 문장이며, 원하시면 상세는 그 뒤에 드립니다."},{"en":"Let me give you the decision first, then the three reasons.","ko":"결정을 먼저 드리고, 그다음 세 가지 이유를 말씀드립니다."},{"en":"In short, we're on track, on budget, with one decision needed today.","ko":"요컨대 일정·예산 정상이며, 오늘 한 가지 결정이 필요합니다."},{"en":"I'll keep this to the so-what, not the how.","ko":"방법론이 아니라 '그래서 무엇'에 집중하겠습니다."},{"en":"If you take nothing else away, take this point.","ko":"다른 건 다 잊으셔도 이 한 가지는 기억해 주십시오."},{"en":"The recommendation is on the first slide; the rest is backup.","ko":"권고안은 첫 슬라이드에 있고 나머지는 백업입니다."},{"en":"Happy to go deeper on any point, but here's the essence.","ko":"어느 부분이든 더 들어갈 수 있지만, 핵심은 이렇습니다."}],"dialogue":[{"sp":"A","en":"Bottom line up front: I recommend we approve a second material source today. That's the one decision I need.","ko":"결론부터 말씀드립니다. 오늘 제2 소재 소싱 승인을 권고드립니다. 그것이 제가 필요한 단 하나의 결정입니다."},{"sp":"B","en":"Direct. Why?","ko":"직설적이군요. 이유는?"},{"sp":"A","en":"Three reasons: it removes our single biggest schedule risk, costs less than one week of delay, and the supplier is already pre-qualified.","ko":"세 가지입니다. 최대 일정 리스크를 제거하고, 1주 지연 비용보다 저렴하며, 공급사가 이미 사전 인증돼 있습니다."},{"sp":"B","en":"What if we don't approve?","ko":"승인하지 않으면요?"},{"sp":"A","en":"Then we carry a high-probability four-week slip with no fallback. The decision is essentially: pay a little now or risk a lot later.","ko":"그러면 대안 없이 발생가능성 높은 4주 지연을 떠안습니다. 결정은 본질적으로 지금 조금 내거나 나중에 크게 걸거나입니다."},{"sp":"B","en":"Anything else I need to know?","ko":"그 외에 알아야 할 것이 있나요?"},{"sp":"A","en":"Everything else is green and in the backup. I led with the only thing that needs your decision.","ko":"나머지는 모두 녹색이며 백업에 있습니다. 결정이 필요한 단 하나만 먼저 말씀드렸습니다."},{"sp":"A","en":"So, the ask in one line: approve the second source today, and I'll execute by end of week.","ko":"그래서 한 줄 요청입니다. 오늘 제2 소싱을 승인해 주시면 이번 주 안에 실행하겠습니다."}],"vocab":[{"t":"BLUF (bottom line up front)","ko":"결론 우선"},{"t":"headline","ko":"핵심 요지"},{"t":"so-what","ko":"그래서 무엇(시사점)"},{"t":"recommendation","ko":"권고안"},{"t":"backup (slides)","ko":"백업 자료"},{"t":"fallback","ko":"대안, 대비책"},{"t":"essence","ko":"핵심, 본질"}],"drill":[{"ko":"결론부터 말씀드리면, 제2 소싱 승인을 권고드립니다.","en":"Bottom line up front: we recommend approving the second sourcing."},{"ko":"결정을 먼저 드리고, 그다음 세 가지 이유를 말씀드립니다.","en":"Let me give you the decision first, then the three reasons."},{"ko":"방법론이 아니라 '그래서 무엇'에 집중하겠습니다.","en":"I'll keep this to the so-what, not the how."},{"ko":"다른 건 다 잊으셔도 이 한 가지는 기억해 주십시오.","en":"If you take nothing else away, take this point."},{"ko":"권고안은 첫 슬라이드에 있고 나머지는 백업입니다.","en":"The recommendation is on the first slide; the rest is backup."}],"tip":"임원 보고의 제1원칙은 BLUF입니다. 결론·권고·요청을 첫 30초에 끝내고, 근거는 묻거든 드리세요. 한국식 '배경→경과→결론' 순서를 영어 임원 보고에서 쓰면 청중을 잃습니다. 결론을 맨 앞으로."},{"n":72,"title":"데이터·차트로 설명하기","scene":"품질 지표 추세 차트를 임원에게 제시하며 데이터가 말하는 메시지를 해석해 전달하는 상황입니다.","goal":"차트의 숫자가 아니라 그것이 의미하는 시사점을 명확히 전달합니다.","expressions":[{"en":"This chart tells one story: defects are trending down month over month.","ko":"이 차트는 한 가지를 말합니다. 결함이 매월 감소 추세라는 것입니다."},{"en":"Let me draw your attention to the inflection point here.","ko":"여기 변곡점에 주목해 주십시오."},{"en":"The key takeaway is not the absolute number but the trend.","ko":"핵심은 절대 수치가 아니라 추세입니다."},{"en":"Each bar represents a gateway; the dotted line is our target.","ko":"각 막대는 게이트웨이를, 점선은 목표치를 나타냅니다."},{"en":"We crossed the target threshold in the third quarter.","ko":"3분기에 목표 임계선을 넘어섰습니다."},{"en":"I've kept the chart to one message; the rest is in the appendix.","ko":"차트를 한 메시지로 단순화했고 나머지는 부록에 있습니다."},{"en":"The outlier here is explained by a single supplier issue.","ko":"여기 이상치는 단일 공급사 이슈로 설명됩니다."},{"en":"So what this means for us is we can hold the quality gate.","ko":"그래서 이것이 의미하는 바는 품질 게이트를 유지할 수 있다는 것입니다."}],"dialogue":[{"sp":"A","en":"This single chart carries my main point: our defects-per-vehicle are down forty percent over six months.","ko":"이 한 장의 차트가 제 핵심을 담고 있습니다. 차량당 결함이 6개월간 40% 감소했습니다."},{"sp":"B","en":"What's driving the drop?","ko":"감소를 이끈 요인은?"},{"sp":"A","en":"The inflection here, in month three, is when we moved to early supplier validation. That single change explains most of it.","ko":"여기 3개월 차 변곡점이 초기 공급사 검증으로 전환한 시점입니다. 그 한 가지 변화가 대부분을 설명합니다."},{"sp":"B","en":"There's a spike in month five. What happened?","ko":"5개월 차에 급등이 있군요. 무슨 일이 있었나요?"},{"sp":"A","en":"That outlier is a single grain-defect batch from one supplier, already contained. Strip it out and the trend is clean.","ko":"그 이상치는 한 공급사의 그레인 결함 배치 하나이며 이미 통제됐습니다. 제외하면 추세는 깨끗합니다."},{"sp":"B","en":"So where does this leave us against target?","ko":"그래서 목표 대비 어디에 있습니까?"},{"sp":"A","en":"We crossed below the target line last quarter and we're holding. The so-what: we can confidently keep the quality gate as is.","ko":"지난 분기에 목표선 아래로 내려갔고 유지 중입니다. 시사점은 품질 게이트를 현행대로 자신 있게 유지할 수 있다는 것입니다."},{"sp":"A","en":"I deliberately put one message per chart. The detailed breakdowns are in the appendix if you want them.","ko":"의도적으로 차트당 메시지를 하나로 뒀습니다. 상세 분해는 원하시면 부록에 있습니다."}],"vocab":[{"t":"trend","ko":"추세"},{"t":"inflection point","ko":"변곡점"},{"t":"takeaway","ko":"핵심 시사점"},{"t":"threshold","ko":"임계선, 기준점"},{"t":"outlier","ko":"이상치"},{"t":"appendix","ko":"부록"},{"t":"month over month","ko":"전월 대비"}],"drill":[{"ko":"이 차트는 한 가지를 말합니다. 결함이 감소 추세입니다.","en":"This chart tells one story: defects are trending down."},{"ko":"여기 변곡점에 주목해 주십시오.","en":"Let me draw your attention to the inflection point here."},{"ko":"핵심은 절대 수치가 아니라 추세입니다.","en":"The key takeaway is not the absolute number but the trend."},{"ko":"여기 이상치는 단일 공급사 이슈로 설명됩니다.","en":"The outlier here is explained by a single supplier issue."},{"ko":"그래서 이것이 의미하는 바는 품질 게이트를 유지할 수 있다는 것입니다.","en":"So what this means for us is we can hold the quality gate."}],"tip":"임원은 차트를 읽지 않습니다, 당신이 해석해 주길 기다립니다. '차트당 메시지 하나', '그래서 무엇(so-what)'을 항상 붙이세요. 숫자를 나열하지 말고 추세와 시사점을 말하면 데이터가 무기가 됩니다."},{"n":73,"title":"핵심 메시지 전달","scene":"여러 안건이 뒤섞인 회의에서 단 하나의 핵심 메시지로 좁혀 임원에게 각인시켜야 하는 상황입니다.","goal":"메시지를 하나로 압축하고 반복하여 의사결정자에게 명확히 각인시킵니다.","expressions":[{"en":"If you remember one thing today, remember this.","ko":"오늘 한 가지만 기억하신다면, 이것을 기억해 주십시오."},{"en":"My single message is: we need the sourcing decision this week.","ko":"저의 단 하나의 메시지는 이번 주 소싱 결정이 필요하다는 것입니다."},{"en":"Let me strip away the noise and give you the core.","ko":"잡음을 걷어내고 핵심만 드리겠습니다."},{"en":"Everything I'll say supports that one point.","ko":"제가 드릴 모든 말은 그 한 가지를 뒷받침합니다."},{"en":"I'll repeat the headline so it lands.","ko":"각인되도록 핵심을 반복하겠습니다."},{"en":"The takeaway is simple and it's the title of this slide.","ko":"시사점은 단순하며 이 슬라이드의 제목입니다."},{"en":"Let's not lose the forest for the trees.","ko":"나무를 보다가 숲을 놓치지 맙시다."},{"en":"One ask, one owner, one date.","ko":"하나의 요청, 하나의 담당자, 하나의 일정."}],"dialogue":[{"sp":"A","en":"There's a lot on the agenda, so let me anchor us. If you remember one thing today, remember this single ask.","ko":"안건이 많으니 중심을 잡겠습니다. 오늘 한 가지만 기억하신다면 이 단 하나의 요청을 기억해 주십시오."},{"sp":"B","en":"Go on.","ko":"말씀하세요."},{"sp":"A","en":"We need a sourcing decision this week. That's the message. Everything else I present supports just that.","ko":"이번 주에 소싱 결정이 필요합니다. 그것이 메시지입니다. 제가 발표하는 나머지는 오직 그것을 뒷받침합니다."},{"sp":"B","en":"There were several other topics on the deck.","ko":"자료에 다른 주제들도 여럿 있던데요."},{"sp":"A","en":"They're context, not decisions. I deliberately stripped them out of the headline so the one thing that matters lands.","ko":"그것들은 맥락이지 결정 사항이 아닙니다. 의도적으로 핵심에서 덜어내, 중요한 한 가지가 각인되도록 했습니다."},{"sp":"B","en":"Fair. Remind me of the ask once more.","ko":"타당하군요. 요청을 한 번 더 말해 보세요."},{"sp":"A","en":"One ask, one owner, one date: approve the second source, I own execution, decision by Friday.","ko":"하나의 요청, 하나의 담당자, 하나의 일정. 제2 소싱 승인, 실행은 제 책임, 결정은 금요일까지입니다."},{"sp":"A","en":"I'll close the way I opened, so it sticks: the sourcing decision, this week. That's the whole meeting.","ko":"각인되도록 시작한 방식대로 마무리하겠습니다. 소싱 결정, 이번 주. 그것이 이 회의의 전부입니다."}],"vocab":[{"t":"single message","ko":"단일 핵심 메시지"},{"t":"strip away the noise","ko":"잡음을 걷어내다"},{"t":"core","ko":"핵심"},{"t":"land (a message)","ko":"(메시지가) 각인되다"},{"t":"anchor","ko":"중심을 잡다, 기준점"},{"t":"forest for the trees","ko":"나무를 보다 숲을 놓침"},{"t":"stick","ko":"기억에 남다"}],"drill":[{"ko":"오늘 한 가지만 기억하신다면 이것을 기억해 주십시오.","en":"If you remember one thing today, remember this."},{"ko":"잡음을 걷어내고 핵심만 드리겠습니다.","en":"Let me strip away the noise and give you the core."},{"ko":"제가 드릴 모든 말은 그 한 가지를 뒷받침합니다.","en":"Everything I'll say supports that one point."},{"ko":"각인되도록 핵심을 반복하겠습니다.","en":"I'll repeat the headline so it lands."},{"ko":"하나의 요청, 하나의 담당자, 하나의 일정.","en":"One ask, one owner, one date."}],"tip":"한 회의에 메시지가 셋이면 청중은 영(0)을 가져갑니다. 핵심을 하나로 압축하고, 처음과 끝에 같은 문장으로 반복하세요. '하나의 요청, 하나의 담당자, 하나의 일정' 공식은 임원에게 강력하게 작동합니다."},{"n":74,"title":"스토리텔링으로 설득하기","scene":"차세대 내장 콘셉트의 가치를 임원에게 설득할 때 데이터에 사용자 스토리를 결합하는 상황입니다.","goal":"데이터에 인간적 서사를 더해 설득력과 기억성을 높입니다.","expressions":[{"en":"Let me tell you about one customer's first thirty seconds in the cabin.","ko":"한 고객이 실내에서 보낸 첫 30초 이야기를 들려드리겠습니다."},{"en":"The data shows the what; this story shows the why.","ko":"데이터는 '무엇'을, 이 이야기는 '왜'를 보여줍니다."},{"en":"Picture the driver reaching for the console without looking.","ko":"보지 않고 콘솔로 손을 뻗는 운전자를 떠올려 보십시오."},{"en":"That moment of delight is what we're designing for.","ko":"그 즐거움의 순간이 우리가 설계하는 목표입니다."},{"en":"Here's the tension: the old design forced a trade-off we no longer accept.","ko":"여기 갈등이 있습니다. 기존 설계는 우리가 더는 받아들이지 않는 트레이드오프를 강요했습니다."},{"en":"The resolution is this concept, and the numbers back it up.","ko":"그 해결책이 이 콘셉트이며 숫자가 이를 뒷받침합니다."},{"en":"I want you to feel what the customer feels, then see the business case.","ko":"고객이 느끼는 것을 느끼신 뒤 사업적 근거를 보시길 바랍니다."},{"en":"Stories make the data memorable; the data makes the story credible.","ko":"이야기는 데이터를 기억에 남게 하고, 데이터는 이야기를 신뢰하게 합니다."}],"dialogue":[{"sp":"A","en":"Before the numbers, let me set a scene. Imagine a customer sliding into the driver's seat for the very first time.","ko":"숫자에 앞서 장면 하나를 그려보겠습니다. 한 고객이 처음으로 운전석에 미끄러져 앉는 순간을 상상해 보십시오."},{"sp":"B","en":"All right, I'm picturing it.","ko":"좋습니다, 떠올리고 있습니다."},{"sp":"A","en":"Their hand falls naturally onto the console; the soft-touch grain feels premium; everything is exactly where they expect. No friction.","ko":"손이 자연스럽게 콘솔에 닿고, 소프트터치 그레인은 고급스럽게 느껴지며, 모든 것이 예상한 자리에 있습니다. 마찰이 없습니다."},{"sp":"B","en":"And the old design didn't do that?","ko":"기존 설계는 그렇지 못했나요?"},{"sp":"A","en":"That's the tension. The old layout forced customers to look down and hunt. Our clinic data shows that hurt the quality perception score.","ko":"그것이 갈등입니다. 기존 레이아웃은 고객이 아래를 보며 더듬게 했습니다. 클리닉 데이터를 보면 그것이 품질 인지 점수를 떨어뜨렸습니다."},{"sp":"B","en":"So the new concept resolves it. Can you prove it?","ko":"그래서 새 콘셉트가 그것을 해결한다는 거군요. 증명할 수 있나요?"},{"sp":"A","en":"Yes. Quality perception up twelve points, blind reach success up to ninety-five percent. The story you just felt, in numbers.","ko":"네. 품질 인지 12점 상승, 보지 않고 조작 성공률 95%입니다. 방금 느끼신 이야기를 숫자로 옮긴 것입니다."},{"sp":"A","en":"The story makes it memorable; the data makes it credible. Together, they make the case to invest.","ko":"이야기는 이를 기억에 남게 하고 데이터는 신뢰하게 합니다. 둘이 합쳐져 투자할 근거가 됩니다."}],"vocab":[{"t":"set a scene","ko":"장면을 설정하다"},{"t":"tension","ko":"갈등, 긴장"},{"t":"resolution","ko":"해결, 결말"},{"t":"delight","ko":"즐거움, 감동"},{"t":"friction","ko":"마찰, 불편"},{"t":"business case","ko":"사업적 근거"},{"t":"credible","ko":"신뢰할 수 있는"}],"drill":[{"ko":"데이터는 '무엇'을, 이 이야기는 '왜'를 보여줍니다.","en":"The data shows the what; this story shows the why."},{"ko":"보지 않고 콘솔로 손을 뻗는 운전자를 떠올려 보십시오.","en":"Picture the driver reaching for the console without looking."},{"ko":"그 즐거움의 순간이 우리가 설계하는 목표입니다.","en":"That moment of delight is what we're designing for."},{"ko":"그 해결책이 이 콘셉트이며 숫자가 이를 뒷받침합니다.","en":"The resolution is this concept, and the numbers back it up."},{"ko":"이야기는 데이터를 기억에 남게 하고, 데이터는 이야기를 신뢰하게 합니다.","en":"Stories make the data memorable; the data makes the story credible."}],"tip":"스토리텔링은 데이터를 대체하는 게 아니라 데이터에 의미를 입히는 것입니다. '갈등→해결' 구조에 고객의 첫 순간을 넣고, 마지막에 숫자로 닫으세요. 임원은 느낀 뒤에 결정하고, 증명을 본 뒤에 확신합니다."},{"n":75,"title":"질의응답(Q&A) 대응","scene":"임원 보고 후 까다롭고 공격적인 질문을 받아 침착하게 대응해야 하는 상황입니다.","goal":"압박 질문에 방어적이지 않게, 솔직하고 간결하게 대응합니다.","expressions":[{"en":"That's a fair challenge; let me address it directly.","ko":"타당한 지적입니다. 직접 답변드리겠습니다."},{"en":"Let me make sure I understand the question before I answer.","ko":"답변 전에 질문을 정확히 이해했는지 확인하겠습니다."},{"en":"I don't have that figure on hand, but I'll follow up by tomorrow.","ko":"그 수치는 지금 없지만 내일까지 후속 보고드리겠습니다."},{"en":"You're right to push on that; here's where the risk actually sits.","ko":"그 점을 짚어 주신 게 맞습니다. 실제 리스크는 여기에 있습니다."},{"en":"Let me separate what we know from what we're still validating.","ko":"확실한 것과 아직 검증 중인 것을 구분하겠습니다."},{"en":"I'd rather give you an honest 'we don't know yet' than guess.","ko":"추측보다는 솔직하게 '아직 모릅니다'라고 말씀드리겠습니다."},{"en":"Let me reframe the question to the decision at hand.","ko":"질문을 당면한 결정으로 재구성하겠습니다."},{"en":"Short answer: yes. Let me give you the one-line why.","ko":"짧게 답하면 '예'입니다. 한 줄로 이유를 말씀드리겠습니다."}],"dialogue":[{"sp":"A","en":"That concludes the recommendation. I'll take questions now, and I'd rather you push hard on the weak points.","ko":"권고는 여기까지입니다. 이제 질문을 받겠습니다. 취약한 부분을 강하게 짚어 주시면 좋겠습니다."},{"sp":"B","en":"Your cost number looks optimistic. How confident are you in it?","ko":"원가 수치가 낙관적으로 보입니다. 얼마나 확신하십니까?"},{"sp":"A","en":"That's a fair challenge. The number is firm on tooling and material; the soft spot is logistics, which I've flagged as a range.","ko":"타당한 지적입니다. 금형과 소재는 확정이고, 취약한 부분은 물류이며 범위로 표시해 두었습니다."},{"sp":"B","en":"What if logistics comes in at the high end?","ko":"물류가 상한으로 나오면요?"},{"sp":"A","en":"Even at the high end, we stay within the program budget. I stress-tested it against the worst case before presenting.","ko":"상한이어도 프로그램 예산 내에 머뭅니다. 보고 전에 최악의 경우로 부하 검증을 했습니다."},{"sp":"B","en":"And the warranty exposure? You didn't cover it.","ko":"보증 노출은요? 다루지 않으셨는데요."},{"sp":"A","en":"Honestly, I don't have a validated warranty figure yet. I won't guess. I'll bring it to you with the durability results by Thursday.","ko":"솔직히 검증된 보증 수치는 아직 없습니다. 추측하지 않겠습니다. 내구 결과와 함께 목요일까지 가져오겠습니다."},{"sp":"A","en":"Short answer to your core question: yes, the recommendation stands. The one open item is warranty data, and it doesn't change the sourcing decision in front of you today.","ko":"핵심 질문에 짧게 답하면, 권고는 유효합니다. 미해결 항목은 보증 데이터 하나이며, 오늘 앞에 놓인 소싱 결정을 바꾸지 않습니다."}],"vocab":[{"t":"fair challenge","ko":"타당한 지적"},{"t":"on hand","ko":"지금 가진, 즉시 활용 가능한"},{"t":"follow up","ko":"후속 조치하다"},{"t":"soft spot","ko":"취약 지점"},{"t":"stress-test","ko":"부하 검증하다"},{"t":"reframe","ko":"재구성하다"},{"t":"open item","ko":"미해결 항목"}],"drill":[{"ko":"타당한 지적입니다. 직접 답변드리겠습니다.","en":"That's a fair challenge; let me address it directly."},{"ko":"그 수치는 지금 없지만 내일까지 후속 보고드리겠습니다.","en":"I don't have that figure on hand, but I'll follow up by tomorrow."},{"ko":"확실한 것과 아직 검증 중인 것을 구분하겠습니다.","en":"Let me separate what we know from what we're still validating."},{"ko":"추측보다는 솔직하게 '아직 모릅니다'라고 말씀드리겠습니다.","en":"I'd rather give you an honest 'we don't know yet' than guess."},{"ko":"짧게 답하면 '예'입니다. 한 줄로 이유를 말씀드리겠습니다.","en":"Short answer: yes. Let me give you the one-line why."}],"tip":"Q&A에서 가장 큰 실수는 모르는 걸 추측으로 메우는 것입니다. '모릅니다, 언제까지 가져오겠습니다'가 임원에게는 더 강합니다. 공격적 질문엔 'fair challenge'로 인정부터 하고, 핵심 권고가 흔들리지 않음을 마지막에 못 박으세요."},{"n":76,"title":"예산·투자 제안(Proposal)","scene":"차세대 내장 검증 설비에 대한 자본 투자를 경영진에게 정식 제안하는 상황입니다.","goal":"투자 규모, 회수 기간, 리스크를 구조화하여 승인 가능한 제안으로 제시합니다.","expressions":[{"en":"I'm proposing a capital investment with a clear payback period.","ko":"명확한 회수 기간을 갖춘 자본 투자를 제안드립니다."},{"en":"The investment is justified by recurring validation cost savings.","ko":"이 투자는 반복되는 검증 비용 절감으로 정당화됩니다."},{"en":"The payback is under three years on conservative assumptions.","ko":"보수적 가정으로도 회수 기간은 3년 미만입니다."},{"en":"Let me present the base, best, and worst-case scenarios.","ko":"기본, 최선, 최악의 시나리오를 제시하겠습니다."},{"en":"The do-nothing option carries a hidden but real cost.","ko":"아무것도 하지 않는 선택지에는 숨어 있지만 실재하는 비용이 있습니다."},{"en":"I'm asking for staged funding tied to milestones.","ko":"마일스톤에 연동된 단계별 자금 집행을 요청드립니다."},{"en":"The proposal de-risks our largest recurring program expense.","ko":"이 제안은 가장 큰 반복적 프로그램 비용의 리스크를 줄입니다."},{"en":"Here's the ask, the return, and the risk, on one page.","ko":"요청, 회수, 리스크를 한 페이지에 담았습니다."}],"dialogue":[{"sp":"A","en":"I'm proposing we invest in an in-house interior validation rig. Let me give you the ask, the return, and the risk up front.","ko":"사내 내장 검증 설비 투자를 제안드립니다. 요청, 회수, 리스크를 먼저 말씀드리겠습니다."},{"sp":"B","en":"What's the number and the payback?","ko":"금액과 회수 기간은?"},{"sp":"A","en":"A defined capital outlay, with payback under three years even on conservative assumptions, driven by eliminating outsourced test cycles.","ko":"확정된 자본 지출이며, 외주 시험 사이클 제거로 보수적 가정에서도 회수 기간 3년 미만입니다."},{"sp":"B","en":"What if utilization is lower than you assume?","ko":"가동률이 가정보다 낮으면요?"},{"sp":"A","en":"In the worst case, payback stretches to four years, still positive. The base case is three; the best case is two. All three are on the page.","ko":"최악의 경우 회수가 4년으로 늘지만 여전히 양(+)입니다. 기본 3년, 최선 2년입니다. 셋 다 자료에 있습니다."},{"sp":"B","en":"Why not just keep outsourcing?","ko":"그냥 외주를 유지하면 안 됩니까?"},{"sp":"A","en":"The do-nothing cost is real: rising test fees and schedule dependency on a third party. That hidden cost is what this proposal removes.","ko":"아무것도 안 하는 비용은 실재합니다. 상승하는 시험 비용과 제3자에 대한 일정 의존입니다. 이 숨은 비용을 제거하는 것이 본 제안입니다."},{"sp":"A","en":"And I'm asking for staged funding tied to milestones, so the commitment is gated, not all at once.","ko":"그리고 마일스톤에 연동된 단계별 자금을 요청드려, 일괄이 아니라 단계적으로 약정되도록 했습니다."}],"vocab":[{"t":"capital investment","ko":"자본 투자"},{"t":"payback period","ko":"회수 기간"},{"t":"conservative assumptions","ko":"보수적 가정"},{"t":"base/best/worst case","ko":"기본/최선/최악 시나리오"},{"t":"do-nothing option","ko":"현행 유지 선택지"},{"t":"staged funding","ko":"단계별 자금 집행"},{"t":"de-risk","ko":"리스크를 줄이다"}],"drill":[{"ko":"명확한 회수 기간을 갖춘 자본 투자를 제안드립니다.","en":"I'm proposing a capital investment with a clear payback period."},{"ko":"보수적 가정으로도 회수 기간은 3년 미만입니다.","en":"The payback is under three years on conservative assumptions."},{"ko":"기본, 최선, 최악의 시나리오를 제시하겠습니다.","en":"Let me present the base, best, and worst-case scenarios."},{"ko":"아무것도 하지 않는 선택지에도 실재하는 비용이 있습니다.","en":"The do-nothing option carries a real cost."},{"ko":"마일스톤에 연동된 단계별 자금 집행을 요청드립니다.","en":"I'm asking for staged funding tied to milestones."}],"tip":"투자 제안의 승률을 높이는 두 가지: 첫째, '아무것도 안 하는 비용(do-nothing cost)'을 명시해 현상 유지가 공짜가 아님을 보이기. 둘째, '단계별 자금(staged funding)'으로 리스크를 낮춰 임원이 승인하기 쉽게 만들기."},{"n":77,"title":"경영진 설득 논리","scene":"원가 절감과 품질 사이에서 갈등하는 경영진을 설득해 품질 우선 결정을 끌어내야 하는 상황입니다.","goal":"논리적 근거와 사업적 이해관계를 연결해 경영진의 결정을 끌어냅니다.","expressions":[{"en":"Let me connect this decision to what the business actually cares about.","ko":"이 결정을 경영진이 실제로 중시하는 것과 연결하겠습니다."},{"en":"The logic is simple: a cheaper part now costs more in warranty later.","ko":"논리는 단순합니다. 지금 저렴한 부품이 나중에 보증으로 더 비쌉니다."},{"en":"This isn't a cost-versus-quality fight; it's a total-cost decision.","ko":"이것은 원가 대 품질 싸움이 아니라 총원가 결정입니다."},{"en":"I'm aligning my recommendation with the brand strategy you've set.","ko":"제 권고를 경영진이 세운 브랜드 전략에 맞추고 있습니다."},{"en":"The numbers and the strategy point the same direction.","ko":"숫자와 전략이 같은 방향을 가리킵니다."},{"en":"If we win on perceived quality, we protect pricing power.","ko":"인지 품질에서 이기면 가격 결정력을 지킵니다."},{"en":"I'd frame this as protecting margin, not spending money.","ko":"이를 돈을 쓰는 게 아니라 마진을 지키는 것으로 봅니다."},{"en":"The decision that looks cheap today is the expensive one over the lifecycle.","ko":"오늘 싸 보이는 결정이 라이프사이클 전체로는 비싼 결정입니다."}],"dialogue":[{"sp":"A","en":"I'd like to walk you through why I'm recommending we hold the quality grade despite the cheaper option on the table.","ko":"더 저렴한 선택지가 있음에도 품질 등급을 유지하도록 권고드리는 이유를 설명드리고자 합니다."},{"sp":"B","en":"Purchasing wants the cheaper trim. Convince me we shouldn't take the savings.","ko":"구매는 더 저렴한 트림을 원합니다. 절감을 택하지 말아야 할 이유를 설득해 보세요."},{"sp":"A","en":"Let me reframe it. This isn't cost versus quality; it's a total-cost decision over the lifecycle. The cheaper trim saves a little per unit, but warranty and rework data on that grade predict a higher claim rate. Net, we lose money.","ko":"재구성하겠습니다. 이것은 원가 대 품질이 아니라 라이프사이클 전체의 총원가 결정입니다. 저렴한 트림은 대당 소액을 아끼지만, 그 등급의 보증·재작업 데이터는 더 높은 클레임율을 예측합니다. 결국 손해입니다."},{"sp":"B","en":"That's still speculative. Why should the board buy it?","ko":"여전히 추정입니다. 이사회가 왜 받아들여야 합니까?"},{"sp":"A","en":"Because it ties to your own strategy. You set premium perceived quality as the brand differentiator. A visibly cheap interior undercuts pricing power.","ko":"경영진의 전략과 직결되기 때문입니다. 프리미엄 인지 품질을 브랜드 차별점으로 정하셨습니다. 눈에 띄게 저렴한 내장은 가격 결정력을 깎습니다."},{"sp":"B","en":"So your recommendation, in one line?","ko":"그래서 권고를 한 줄로 말하면?"},{"sp":"A","en":"Hold the quality grade. Frame it not as spending more, but as protecting margin and the brand promise you've already committed to.","ko":"품질 등급을 유지하십시오. 더 쓰는 것이 아니라 마진과 이미 약속하신 브랜드 약속을 지키는 것으로 보십시오."},{"sp":"A","en":"And if anyone still hesitates, I'll put the cost curves side by side: the cheap option only wins on the first slide; every slide after, quality wins.","ko":"그래도 누군가 주저하면 원가 곡선을 나란히 놓겠습니다. 저렴한 선택지는 첫 슬라이드에서만 이기고, 그 이후 모든 슬라이드에서는 품질이 이깁니다."}],"vocab":[{"t":"total-cost decision","ko":"총원가 결정"},{"t":"warranty claim","ko":"보증 클레임"},{"t":"pricing power","ko":"가격 결정력"},{"t":"differentiator","ko":"차별 요소"},{"t":"margin","ko":"마진, 이익률"},{"t":"lifecycle","ko":"라이프사이클, 제품 수명주기"},{"t":"undercut","ko":"약화시키다, 깎아내리다"}],"drill":[{"ko":"논리는 단순합니다. 지금 저렴한 부품이 나중에 보증으로 더 비쌉니다.","en":"The logic is simple: a cheaper part now costs more in warranty later."},{"ko":"이것은 원가 대 품질 싸움이 아니라 총원가 결정입니다.","en":"This isn't a cost-versus-quality fight; it's a total-cost decision."},{"ko":"숫자와 전략이 같은 방향을 가리킵니다.","en":"The numbers and the strategy point the same direction."},{"ko":"이를 돈을 쓰는 게 아니라 마진을 지키는 것으로 봅니다.","en":"I'd frame this as protecting margin, not spending money."},{"ko":"오늘 싸 보이는 결정이 라이프사이클 전체로는 비싼 결정입니다.","en":"The decision that looks cheap today is the expensive one over the lifecycle."}],"tip":"경영진 설득의 핵심은 당신의 권고를 '그들이 이미 정한 전략'에 연결하는 것입니다. 새 논리를 강요하기보다 '경영진이 세운 브랜드 약속을 지키는 길'로 프레이밍하면 반박이 어려워집니다. 그리고 항상 총원가로 말하세요."},{"n":78,"title":"나쁜 소식 보고하기","scene":"주요 OEM 고객 차량의 내장 부품에서 필드 품질 문제가 발견되어 경영진에 보고해야 하는 상황입니다.","goal":"나쁜 소식을 은폐 없이 신속·정직하게 전달하되 통제력과 대응책을 함께 보입니다.","expressions":[{"en":"I have bad news and I'm bringing it to you immediately.","ko":"나쁜 소식이 있고 즉시 보고드립니다."},{"en":"Let me state the problem plainly before anything else.","ko":"무엇보다 먼저 문제를 분명히 말씀드리겠습니다."},{"en":"Here's what we know, what we don't, and what we're doing.","ko":"확실한 것, 모르는 것, 하고 있는 일을 말씀드립니다."},{"en":"The issue is contained; it has not spread to other markets.","ko":"이 문제는 통제됐으며 다른 시장으로 번지지 않았습니다."},{"en":"I take responsibility, and I have a containment plan ready.","ko":"제가 책임지며 봉쇄 계획을 준비해 두었습니다."},{"en":"I won't sugarcoat the impact; the customer is affected.","ko":"영향을 미화하지 않겠습니다. 고객이 영향을 받고 있습니다."},{"en":"My priority order is: protect the customer, then the schedule.","ko":"제 우선순위는 고객 보호가 먼저, 그다음이 일정입니다."},{"en":"I'll update you every twenty-four hours until it's closed.","ko":"종결될 때까지 24시간마다 업데이트드리겠습니다."}],"dialogue":[{"sp":"A","en":"I have bad news, and I'm bringing it to you the moment it was confirmed. We have a field quality issue on the door trim.","ko":"나쁜 소식이 있고 확인된 즉시 보고드립니다. 도어 트림에 필드 품질 문제가 발생했습니다."},{"sp":"B","en":"How serious?","ko":"얼마나 심각합니까?"},{"sp":"A","en":"A clip is detaching under thermal cycling. It's a customer-visible defect. No safety risk, but it's real and the OEM knows.","ko":"열 사이클 하에서 클립이 분리되고 있습니다. 고객이 인지하는 결함입니다. 안전 위험은 없지만 실재하고 OEM도 알고 있습니다."},{"sp":"B","en":"How widespread is it?","ko":"얼마나 광범위합니까?"},{"sp":"A","en":"Contained to one production batch in one market. I've already quarantined the suspect stock so it won't spread.","ko":"한 시장의 한 생산 배치로 한정됩니다. 의심 재고를 이미 격리해 확산을 막았습니다."},{"sp":"B","en":"What's the plan?","ko":"계획은?"},{"sp":"A","en":"Containment first: sort and rework affected units. Root cause analysis in parallel. Permanent fix design within two weeks. I own it.","ko":"봉쇄가 먼저입니다. 영향 단위를 선별·재작업합니다. 근본 원인 분석을 병행하고, 2주 내 영구 대책을 설계합니다. 제가 책임집니다."},{"sp":"A","en":"I'll update you every twenty-four hours until closure. Customer protection comes before schedule. No spin, just status.","ko":"종결까지 24시간마다 업데이트드리겠습니다. 일정보다 고객 보호가 먼저입니다. 포장 없이 현황만 드립니다."}],"vocab":[{"t":"field quality issue","ko":"필드 품질 문제"},{"t":"contained","ko":"통제된, 봉쇄된"},{"t":"containment plan","ko":"봉쇄 계획"},{"t":"quarantine","ko":"격리하다"},{"t":"sugarcoat","ko":"미화하다"},{"t":"root cause analysis","ko":"근본 원인 분석"},{"t":"closure","ko":"(문제) 종결"}],"drill":[{"ko":"나쁜 소식이 있고 즉시 보고드립니다.","en":"I have bad news and I'm bringing it to you immediately."},{"ko":"확실한 것, 모르는 것, 하고 있는 일을 말씀드립니다.","en":"Here's what we know, what we don't, and what we're doing."},{"ko":"이 문제는 통제됐으며 다른 시장으로 번지지 않았습니다.","en":"The issue is contained; it has not spread to other markets."},{"ko":"제가 책임지며 봉쇄 계획을 준비해 두었습니다.","en":"I take responsibility, and I have a containment plan ready."},{"ko":"종결될 때까지 24시간마다 업데이트드리겠습니다.","en":"I'll update you every twenty-four hours until it's closed."}],"tip":"나쁜 소식 보고의 정석: 즉시(타이밍) + 정직(미화 금지) + 통제(봉쇄 계획) + 책임(I own it) + 리듬(정기 업데이트). 임원이 가장 두려워하는 건 문제 자체가 아니라 '통제 불능'과 '늦은 보고'입니다. 통제하고 있음을 보이세요."},{"n":79,"title":"비전·전략 발표","scene":"차세대 내장 설계 조직의 3개년 비전과 전략 방향을 경영진과 팀 앞에서 발표하는 상황입니다.","goal":"영감을 주는 비전과 실행 가능한 전략을 균형 있게 제시합니다.","expressions":[{"en":"Our vision is to make the cabin the reason customers choose the brand.","ko":"우리의 비전은 실내가 고객이 브랜드를 선택하는 이유가 되게 하는 것입니다."},{"en":"Let me paint the destination, then the path to get there.","ko":"목적지를 먼저 그리고, 그곳에 이르는 길을 보여드리겠습니다."},{"en":"This strategy rests on three pillars.","ko":"이 전략은 세 가지 축에 기반합니다."},{"en":"We will shift from cost follower to experience leader.","ko":"우리는 원가 추종자에서 경험 선도자로 전환할 것입니다."},{"en":"Where we are today, and where we'll be in three years.","ko":"오늘 우리의 위치와 3년 후의 위치입니다."},{"en":"The vision is ambitious, but each step is concrete and funded.","ko":"비전은 야심차지만 각 단계는 구체적이고 재원이 확보돼 있습니다."},{"en":"I'm asking the team to aim higher than incremental improvement.","ko":"팀에 점진적 개선 이상을 목표로 삼아 달라고 요청합니다."},{"en":"If we execute this, we redefine what an interior can be.","ko":"이를 실행하면 우리는 내장이 무엇일 수 있는지를 재정의합니다."}],"dialogue":[{"sp":"A","en":"Today I want to share where we're taking interior design over the next three years. Let me start with the destination.","ko":"오늘은 향후 3년간 내장 설계를 어디로 끌고 갈지 공유하고자 합니다. 목적지부터 시작하겠습니다."},{"sp":"B","en":"What is the destination, in one sentence?","ko":"목적지를 한 문장으로 말하면?"},{"sp":"A","en":"To make the cabin the single most compelling reason a customer chooses our brand. Not a feature, the reason.","ko":"실내가 고객이 우리 브랜드를 선택하는 가장 강력한 단 하나의 이유가 되게 하는 것입니다. 기능이 아니라 '그 이유'입니다."},{"sp":"B","en":"That's ambitious. How do we actually get there?","ko":"야심차군요. 실제로 어떻게 도달합니까?"},{"sp":"A","en":"Three pillars: human-centered design, early supplier co-development, and measurable craftsmanship standards. Each has owners and funding.","ko":"세 가지 축입니다. 인간 중심 설계, 초기 공급사 공동 개발, 측정 가능한 감성품질 표준. 각각 담당자와 재원이 있습니다."},{"sp":"B","en":"Where are we today versus that vision?","ko":"그 비전 대비 오늘 우리는 어디에 있습니까?"},{"sp":"A","en":"Today we're a competent cost follower. In three years we become the experience leader our competitors benchmark against.","ko":"오늘 우리는 유능한 원가 추종자입니다. 3년 후에는 경쟁사가 벤치마킹하는 경험 선도자가 됩니다."},{"sp":"A","en":"The vision is bold, but it's not a slogan. Each step is concrete, owned, and funded. That's how we make it real.","ko":"비전은 대담하지만 구호가 아닙니다. 각 단계는 구체적이고, 담당자가 있고, 재원이 있습니다. 그렇게 현실로 만듭니다."}],"vocab":[{"t":"vision","ko":"비전"},{"t":"destination","ko":"목적지, 지향점"},{"t":"pillar","ko":"축, 기둥"},{"t":"experience leader","ko":"경험 선도자"},{"t":"ambitious","ko":"야심찬"},{"t":"incremental","ko":"점진적인"},{"t":"craftsmanship","ko":"감성품질, 장인정신"}],"drill":[{"ko":"목적지를 먼저 그리고, 그곳에 이르는 길을 보여드리겠습니다.","en":"Let me paint the destination, then the path to get there."},{"ko":"이 전략은 세 가지 축에 기반합니다.","en":"This strategy rests on three pillars."},{"ko":"우리는 원가 추종자에서 경험 선도자로 전환할 것입니다.","en":"We will shift from cost follower to experience leader."},{"ko":"비전은 야심차지만 각 단계는 구체적이고 재원이 확보돼 있습니다.","en":"The vision is ambitious, but each step is concrete and funded."},{"ko":"이를 실행하면 우리는 내장이 무엇일 수 있는지를 재정의합니다.","en":"If we execute this, we redefine what an interior can be."}],"tip":"비전 발표는 영감과 신뢰의 균형입니다. 목적지(destination)로 가슴을 뛰게 하되, 곧바로 '담당자·재원이 있는 구체적 단계'로 머리를 안심시키세요. 구호로 끝나는 비전은 임원에게 경계심을, 실행 계획이 붙은 비전은 지지를 얻습니다."},{"n":80,"title":"글로벌 컨퍼런스 발표","scene":"국제 자동차 엔지니어링 컨퍼런스에서 다국적 청중을 상대로 내장 설계 혁신 사례를 발표하는 상황입니다.","goal":"다국적 전문가 청중 앞에서 권위 있고 명료하게 기술 성과를 발표합니다.","expressions":[{"en":"Thank you for the introduction; it's a privilege to present here today.","ko":"소개 감사합니다. 오늘 이곳에서 발표하게 되어 영광입니다."},{"en":"Over the next fifteen minutes, I'll share three practical insights.","ko":"앞으로 15분간 세 가지 실용적 통찰을 공유하겠습니다."},{"en":"Let me ground this in a real program, not theory.","ko":"이를 이론이 아니라 실제 프로그램에 근거해 말씀드리겠습니다."},{"en":"What I'll show you is reproducible across vehicle platforms.","ko":"보여드릴 내용은 여러 차량 플랫폼에 재현 가능합니다."},{"en":"I'll keep the jargon light so it travels across disciplines.","ko":"여러 분야를 넘나들도록 전문 용어를 최소화하겠습니다."},{"en":"Let me leave you with one principle you can apply tomorrow.","ko":"내일 바로 적용하실 수 있는 한 가지 원칙을 남기겠습니다."},{"en":"I'm happy to take questions, and I'll be at the booth afterward.","ko":"질문 환영하며, 발표 후 부스에 있겠습니다."},{"en":"Thank you; I look forward to the discussion.","ko":"감사합니다. 이어질 논의를 기대합니다."}],"dialogue":[{"sp":"A","en":"Thank you for that introduction. It's a privilege to speak to this audience about interior design innovation.","ko":"소개 감사합니다. 이 청중께 내장 설계 혁신에 관해 말씀드리게 되어 영광입니다."},{"sp":"B","en":"We're looking forward to it. How will you structure the talk?","ko":"기대하고 있습니다. 발표를 어떻게 구성하실 건가요?"},{"sp":"A","en":"Three practical insights from a real production program, each one reproducible across platforms, not just theory.","ko":"실제 양산 프로그램에서 얻은 세 가지 실용적 통찰이며, 각각 이론이 아니라 여러 플랫폼에 재현 가능합니다."},{"sp":"B","en":"Your audience is multinational and cross-discipline. How do you keep it accessible?","ko":"청중이 다국적이고 분야가 다양합니다. 어떻게 이해하기 쉽게 유지하십니까?"},{"sp":"A","en":"I keep the jargon light and anchor every point in a concrete example, so it travels across languages and specialties.","ko":"전문 용어를 줄이고 모든 요점을 구체적 사례에 묶어, 언어와 전문 분야를 넘어 전달되게 합니다."},{"sp":"B","en":"And how will you close?","ko":"마무리는 어떻게 하실 건가요?"},{"sp":"A","en":"With a single principle they can apply the very next day, then I'll open the floor and stay at the booth for deeper conversations.","ko":"바로 다음 날 적용할 수 있는 단 하나의 원칙으로 닫고, 질문을 받은 뒤 더 깊은 대화를 위해 부스에 머무르겠습니다."},{"sp":"A","en":"If the room leaves with one reusable idea and one new contact, the talk has done its job. Thank you, and I welcome your questions.","ko":"청중이 재사용 가능한 아이디어 하나와 새로운 인맥 하나를 얻고 나간다면 발표는 제 역할을 다한 것입니다. 감사합니다, 질문 환영합니다."}],"vocab":[{"t":"privilege","ko":"영광, 특권"},{"t":"insight","ko":"통찰"},{"t":"ground in (a case)","ko":"(사례에) 근거하다"},{"t":"reproducible","ko":"재현 가능한"},{"t":"jargon","ko":"전문 용어"},{"t":"open the floor","ko":"질의를 받다, 발언권을 열다"},{"t":"cross-discipline","ko":"여러 분야에 걸친"}],"drill":[{"ko":"오늘 이곳에서 발표하게 되어 영광입니다.","en":"It's a privilege to present here today."},{"ko":"앞으로 15분간 세 가지 실용적 통찰을 공유하겠습니다.","en":"Over the next fifteen minutes, I'll share three practical insights."},{"ko":"보여드릴 내용은 여러 차량 플랫폼에 재현 가능합니다.","en":"What I'll show you is reproducible across vehicle platforms."},{"ko":"내일 바로 적용하실 수 있는 한 가지 원칙을 남기겠습니다.","en":"Let me leave you with one principle you can apply tomorrow."},{"ko":"질문 환영하며, 발표 후 부스에 있겠습니다.","en":"I'm happy to take questions, and I'll be at the booth afterward."}],"tip":"글로벌 컨퍼런스 발표는 다국적·비원어민 청중을 전제로 합니다. 전문 용어를 줄이고, 모든 요점을 구체적 사례에 묶고, '내일 적용 가능한 원칙 하나'로 닫으세요. 권위는 화려한 단어가 아니라 명료함과 재현 가능성에서 나옵니다."},{"n":81,"title":"계약서 구조 이해하기","scene":"글로벌 OEM과의 내장 부품 공급 계약서를 처음 검토하시는 상황입니다.","goal":"계약서의 표준 구성 요소와 각 조항의 목적을 영어로 설명하실 수 있습니다.","expressions":[{"en":"This agreement is made and entered into as of the Effective Date by and between the parties.","ko":"본 계약은 발효일 기준으로 양 당사자 간에 체결됩니다."},{"en":"The recitals set out the background and intent of the parties.","ko":"전문(recitals)은 당사자들의 배경과 의도를 명시합니다."},{"en":"Capitalized terms shall have the meanings ascribed to them in the Definitions section.","ko":"대문자로 표기된 용어는 정의 조항에 부여된 의미를 갖습니다."},{"en":"Could you walk me through the structure of this contract before we get into the substance?","ko":"본론으로 들어가기 전에 이 계약서의 구조부터 짚어 주시겠어요?"},{"en":"The operative clauses cover scope, pricing, delivery, and term.","ko":"핵심 조항은 범위, 가격, 납품, 계약 기간을 다룹니다."},{"en":"The boilerplate sits at the end—governing law, notices, and entire agreement.","ko":"일반 표준 조항은 준거법, 통지, 완전합의 등으로 끝부분에 위치합니다."},{"en":"Each schedule and exhibit is incorporated by reference into the main body.","ko":"각 부속서와 별첨은 참조에 의해 본문에 편입됩니다."},{"en":"I'd like to map each obligation back to a specific clause for traceability.","ko":"추적 가능성을 위해 각 의무를 특정 조항에 매핑하고 싶습니다."}],"dialogue":[{"sp":"A","en":"Before we negotiate terms, I want to make sure I understand how this contract is organized.","ko":"조건을 협상하기 전에, 이 계약서가 어떻게 구성되어 있는지 정확히 이해하고 싶습니다."},{"sp":"B","en":"Of course. It follows our standard template—recitals, definitions, operative clauses, then boilerplate.","ko":"물론입니다. 저희 표준 양식을 따릅니다. 전문, 정의, 핵심 조항, 그리고 일반 조항 순입니다."},{"sp":"A","en":"Where are the commercial terms—pricing and delivery commitments—actually captured?","ko":"가격과 납품 약정 같은 상업적 조건은 실제로 어디에 담겨 있나요?"},{"sp":"B","en":"Those live in Schedule A and Schedule B, which are incorporated by reference.","ko":"그것들은 부속서 A와 B에 있으며, 참조에 의해 편입됩니다."},{"sp":"A","en":"Good. I want every obligation traceable to a clause number, so audits stay clean.","ko":"좋습니다. 감사가 깔끔하도록 모든 의무가 조항 번호로 추적되길 원합니다."},{"sp":"B","en":"We can add a cross-reference table as an exhibit if that helps your team.","ko":"팀에 도움이 된다면 상호 참조 표를 별첨으로 추가할 수 있습니다."},{"sp":"A","en":"That would help. And I'll flag any clause where the definitions feel ambiguous.","ko":"그러면 도움이 되겠습니다. 정의가 모호한 조항은 제가 표시해 두겠습니다."},{"sp":"B","en":"Please do—tightening definitions early saves disputes later.","ko":"꼭 그렇게 해 주세요. 정의를 초기에 다듬으면 나중의 분쟁을 줄일 수 있습니다."}],"vocab":[{"t":"recitals","ko":"전문, 계약 배경을 서술하는 도입부"},{"t":"operative clause","ko":"핵심 효력 조항"},{"t":"boilerplate","ko":"일반 표준 조항"},{"t":"incorporated by reference","ko":"참조에 의해 편입된"},{"t":"schedule / exhibit","ko":"부속서 / 별첨"},{"t":"Effective Date","ko":"발효일"},{"t":"entire agreement","ko":"완전합의 (구두 합의 배제) 조항"}],"drill":[{"ko":"본론으로 들어가기 전에 계약서 구조부터 짚어 주시겠어요?","en":"Could you walk me through the structure of the contract before we get into the substance?"},{"ko":"상업적 조건은 실제로 어디에 담겨 있나요?","en":"Where are the commercial terms actually captured?"},{"ko":"각 부속서는 참조에 의해 본문에 편입됩니다.","en":"Each schedule is incorporated by reference into the main body."},{"ko":"모든 의무가 조항 번호로 추적되길 원합니다.","en":"I want every obligation traceable to a clause number."},{"ko":"정의를 초기에 다듬으면 나중의 분쟁을 줄일 수 있습니다.","en":"Tightening definitions early saves disputes later."}],"tip":"계약서는 구조부터 읽으십시오. 임원은 조항을 하나씩 읽기 전에 전체 골격(전문-정의-핵심조항-부속서-일반조항)을 먼저 파악해, 리스크가 어디에 숨어 있는지 빠르게 위치를 잡습니다."},{"n":82,"title":"비밀유지계약(NDA)","scene":"신규 플랫폼 내장 설계 협업을 앞두고 Tier-1 공급사와 NDA를 검토하시는 상황입니다.","goal":"비밀정보의 정의, 사용 제한, 존속 기간을 영어로 협상하실 수 있습니다.","expressions":[{"en":"Confidential Information includes all technical, commercial, and design data disclosed in any form.","ko":"비밀정보에는 어떤 형태로든 공개된 모든 기술적·상업적·설계 데이터가 포함됩니다."},{"en":"The receiving party shall use the information solely for the Permitted Purpose.","ko":"수령 당사자는 정보를 오직 허용된 목적으로만 사용해야 합니다."},{"en":"I'd like to narrow the definition so it doesn't capture information already in the public domain.","ko":"이미 공개된 정보까지 포함되지 않도록 정의를 좁히고 싶습니다."},{"en":"Can we cap the confidentiality term at five years from disclosure?","ko":"비밀유지 기간을 공개 시점부터 5년으로 제한할 수 있을까요?"},{"en":"Residual knowledge retained in the minds of our engineers should be carved out.","ko":"엔지니어의 기억에 남는 잔여 지식은 예외로 두어야 합니다."},{"en":"Disclosure to affiliates and subcontractors should be on a need-to-know basis only.","ko":"계열사와 하도급사에 대한 공개는 오직 알 필요가 있는 경우로 한정되어야 합니다."},{"en":"Upon termination, all materials must be returned or destroyed, with certification.","ko":"계약 종료 시 모든 자료는 인증과 함께 반환되거나 폐기되어야 합니다."},{"en":"This NDA does not grant any license or ownership rights in the disclosed IP.","ko":"본 NDA는 공개된 지식재산권에 대한 어떠한 라이선스나 소유권도 부여하지 않습니다."}],"dialogue":[{"sp":"A","en":"Before we exchange any design data, let's align on the NDA scope.","ko":"설계 데이터를 교환하기 전에 NDA 범위부터 맞춰 봅시다."},{"sp":"B","en":"Our standard NDA covers all disclosed information for ten years.","ko":"저희 표준 NDA는 모든 공개 정보를 10년간 보호합니다."},{"sp":"A","en":"Ten years is long for fast-moving interior platforms. Can we cap it at five?","ko":"변화가 빠른 내장 플랫폼에는 10년이 깁니다. 5년으로 제한할 수 있을까요?"},{"sp":"B","en":"We can consider five, provided trade secrets stay protected indefinitely.","ko":"영업비밀이 무기한 보호된다는 전제라면 5년도 검토할 수 있습니다."},{"sp":"A","en":"Agreed for genuine trade secrets. I also want the standard public-domain carve-out.","ko":"진정한 영업비밀은 동의합니다. 그리고 공개 정보에 대한 표준 예외도 넣고 싶습니다."},{"sp":"B","en":"That's fine. We'll add carve-outs for public, prior, and independently developed information.","ko":"괜찮습니다. 공개된 정보, 기존 보유 정보, 독자 개발 정보에 대한 예외를 추가하겠습니다."},{"sp":"A","en":"And disclosure to subcontractors must be strictly need-to-know.","ko":"그리고 하도급사 공개는 엄격히 알 필요가 있는 경우로 한정되어야 합니다."},{"sp":"B","en":"Understood. We'll bind subcontractors under equivalent confidentiality terms.","ko":"이해했습니다. 하도급사도 동등한 비밀유지 조건으로 구속하겠습니다."}],"vocab":[{"t":"Confidential Information","ko":"비밀정보"},{"t":"Permitted Purpose","ko":"허용된 사용 목적"},{"t":"carve-out","ko":"적용 예외 조항"},{"t":"need-to-know basis","ko":"알 필요가 있는 경우로 한정"},{"t":"residual knowledge","ko":"잔여 지식 (기억에 남는 일반 지식)"},{"t":"trade secret","ko":"영업비밀"},{"t":"return or destroy","ko":"반환 또는 폐기"}],"drill":[{"ko":"수령 당사자는 정보를 오직 허용된 목적으로만 사용해야 합니다.","en":"The receiving party shall use the information solely for the Permitted Purpose."},{"ko":"비밀유지 기간을 공개 시점부터 5년으로 제한할 수 있을까요?","en":"Can we cap the confidentiality term at five years from disclosure?"},{"ko":"이미 공개된 정보까지 포함되지 않도록 정의를 좁히고 싶습니다.","en":"I'd like to narrow the definition so it doesn't capture information already in the public domain."},{"ko":"하도급사에 대한 공개는 오직 알 필요가 있는 경우로 한정되어야 합니다.","en":"Disclosure to subcontractors should be on a need-to-know basis only."},{"ko":"본 NDA는 어떠한 라이선스나 소유권도 부여하지 않습니다.","en":"This NDA does not grant any license or ownership rights."}],"tip":"NDA에서 임원이 가장 먼저 보는 것은 기간과 예외(carve-out)입니다. 무기한 비밀유지는 영업비밀에만 적용하고, 나머지는 합리적 기간으로 제한해 회사의 미래 활동을 묶지 않도록 협상하십시오."},{"n":83,"title":"공급계약(Supply Agreement)","scene":"양산 도어트림 부품의 장기 공급계약 조건을 OEM 구매팀과 확정하시는 상황입니다.","goal":"물량, 가격, 납기, 변경 관리 조건을 영어로 협상하실 수 있습니다.","expressions":[{"en":"The supplier shall deliver in accordance with the rolling forecast and firm orders.","ko":"공급사는 롤링 예측과 확정 주문에 따라 납품해야 합니다."},{"en":"Pricing is fixed for the first model year, subject to annual productivity reductions.","ko":"가격은 첫 모델 연도 동안 고정되며, 연간 생산성 절감을 적용받습니다."},{"en":"We need a clear mechanism for raw-material pass-through on resin and steel.","ko":"수지와 강재에 대한 원자재 가격 연동 메커니즘이 명확해야 합니다."},{"en":"Volumes in the forecast are non-binding estimates, not purchase commitments.","ko":"예측 물량은 구속력 없는 추정치이며, 구매 약정이 아닙니다."},{"en":"Any engineering change must follow the agreed change-control process.","ko":"모든 설계 변경은 합의된 변경 관리 절차를 따라야 합니다."},{"en":"The supplier shall maintain capacity to meet peak demand of plus twenty percent.","ko":"공급사는 최대 수요 대비 20% 추가 물량을 충족할 생산능력을 유지해야 합니다."},{"en":"Late delivery beyond the grace period triggers liquidated damages.","ko":"유예기간을 넘긴 지연 납품은 손해배상 예정액을 발생시킵니다."},{"en":"Either party may renegotiate pricing upon a material change in input costs.","ko":"투입 비용의 중대한 변동이 있을 경우, 양 당사자는 가격을 재협상할 수 있습니다."}],"dialogue":[{"sp":"A","en":"On this supply agreement, our main concern is raw-material volatility on resin.","ko":"이 공급계약에서 저희의 주된 우려는 수지의 원자재 가격 변동성입니다."},{"sp":"B","en":"We typically expect fixed pricing for the program life.","ko":"저희는 보통 프로그램 전 기간 고정 가격을 기대합니다."},{"sp":"A","en":"Fixed pricing without a pass-through clause shifts all commodity risk to us.","ko":"연동 조항 없는 고정 가격은 모든 원자재 리스크를 저희에게 전가합니다."},{"sp":"B","en":"What mechanism do you have in mind?","ko":"어떤 메커니즘을 생각하고 계신가요?"},{"sp":"A","en":"A quarterly index adjustment, with a five-percent deadband to avoid noise.","ko":"분기별 지수 연동 조정에, 잡음을 피하기 위한 5% 무변동 구간을 두는 방식입니다."},{"sp":"B","en":"A deadband is reasonable. We'd also need volume commitments in return.","ko":"무변동 구간은 합리적입니다. 대신 저희는 물량 약정이 필요합니다."},{"sp":"A","en":"The forecast stays non-binding, but we'll commit to firm orders ninety days out.","ko":"예측은 비구속으로 두되, 90일 전 확정 주문은 약정하겠습니다."},{"sp":"B","en":"That works. Let's draft the change-control process alongside it.","ko":"좋습니다. 그와 함께 변경 관리 절차도 같이 작성합시다."}],"vocab":[{"t":"rolling forecast","ko":"롤링 예측 (지속 갱신 수요 전망)"},{"t":"firm order","ko":"확정 주문"},{"t":"pass-through","ko":"원자재 가격 연동(전가)"},{"t":"productivity reduction","ko":"생산성 절감 (연간 단가 인하)"},{"t":"liquidated damages","ko":"손해배상 예정액"},{"t":"change-control process","ko":"변경 관리 절차"},{"t":"deadband","ko":"무변동 구간"}],"drill":[{"ko":"예측 물량은 구속력 없는 추정치이며, 구매 약정이 아닙니다.","en":"Volumes in the forecast are non-binding estimates, not purchase commitments."},{"ko":"수지에 대한 명확한 원자재 가격 연동 메커니즘이 필요합니다.","en":"We need a clear mechanism for raw-material pass-through on resin."},{"ko":"연동 조항 없는 고정 가격은 모든 원자재 리스크를 저희에게 전가합니다.","en":"Fixed pricing without a pass-through clause shifts all commodity risk to us."},{"ko":"모든 설계 변경은 합의된 변경 관리 절차를 따라야 합니다.","en":"Any engineering change must follow the agreed change-control process."},{"ko":"유예기간을 넘긴 지연 납품은 손해배상 예정액을 발생시킵니다.","en":"Late delivery beyond the grace period triggers liquidated damages."}],"tip":"공급계약의 핵심은 리스크 배분입니다. 물량 비구속 vs 가격 고정, 원자재 연동 vs 생산성 절감처럼 서로 맞교환되는 조건을 한 묶음으로 협상해야 한쪽에 일방적으로 리스크가 쏠리지 않습니다."},{"n":84,"title":"작업기술서(SOW)","scene":"콘솔 설계 개발 용역의 SOW 범위와 인도물을 발주처와 정의하시는 상황입니다.","goal":"작업 범위, 인도물, 수용 기준, 마일스톤을 영어로 명확히 규정하실 수 있습니다.","expressions":[{"en":"This Statement of Work defines the scope, deliverables, and acceptance criteria.","ko":"본 작업기술서는 범위, 인도물, 수용 기준을 정의합니다."},{"en":"Each deliverable is tied to a milestone and a corresponding payment.","ko":"각 인도물은 마일스톤과 그에 상응하는 대금 지급에 연결됩니다."},{"en":"Work outside this scope is subject to a formal change request.","ko":"이 범위를 벗어난 작업은 공식 변경 요청 대상입니다."},{"en":"Acceptance is deemed complete when the deliverable passes the defined test gates.","ko":"인도물이 정의된 검증 게이트를 통과하면 수용이 완료된 것으로 간주됩니다."},{"en":"We need to spell out assumptions and dependencies to avoid scope creep.","ko":"범위 확산을 막기 위해 가정과 의존 사항을 명시해야 합니다."},{"en":"The client shall provide design inputs and CAE data by the agreed dates.","ko":"발주처는 합의된 일정에 설계 입력과 CAE 데이터를 제공해야 합니다."},{"en":"Any delay in client inputs shifts the milestone dates accordingly.","ko":"발주처 입력 지연은 마일스톤 일정을 그에 맞춰 이동시킵니다."},{"en":"Let's add a clear definition of done for each engineering phase.","ko":"각 설계 단계마다 명확한 완료 정의를 추가합시다."}],"dialogue":[{"sp":"A","en":"I want this SOW to be unambiguous on what counts as a completed deliverable.","ko":"이 SOW에서 무엇이 완료된 인도물인지 명확하게 하고 싶습니다."},{"sp":"B","en":"We usually mark a phase complete when the CAD model is released.","ko":"저희는 보통 CAD 모델이 릴리스되면 단계 완료로 표시합니다."},{"sp":"A","en":"Release alone isn't enough. It should pass the agreed test gates first.","ko":"릴리스만으로는 부족합니다. 먼저 합의된 검증 게이트를 통과해야 합니다."},{"sp":"B","en":"Fair. We'll define acceptance as passing the defined gates, not just submission.","ko":"맞습니다. 단순 제출이 아니라 정의된 게이트 통과를 수용 기준으로 정의하겠습니다."},{"sp":"A","en":"Also, our timelines assume you deliver design inputs on schedule.","ko":"또한 저희 일정은 귀사가 설계 입력을 제때 제공한다는 가정에 기반합니다."},{"sp":"B","en":"Understood. Late inputs will shift the milestones accordingly.","ko":"이해했습니다. 입력이 늦어지면 마일스톤도 그에 맞춰 이동합니다."},{"sp":"A","en":"And anything beyond this scope goes through a formal change request.","ko":"그리고 이 범위를 벗어나는 것은 모두 공식 변경 요청을 거칩니다."},{"sp":"B","en":"Agreed. That protects both sides from uncontrolled scope creep.","ko":"동의합니다. 그래야 양측 모두 통제되지 않는 범위 확산에서 보호받습니다."}],"vocab":[{"t":"Statement of Work (SOW)","ko":"작업기술서"},{"t":"deliverable","ko":"인도물, 산출물"},{"t":"acceptance criteria","ko":"수용 기준"},{"t":"milestone","ko":"마일스톤, 단계 목표"},{"t":"scope creep","ko":"범위 확산"},{"t":"change request","ko":"변경 요청"},{"t":"definition of done","ko":"완료 정의"}],"drill":[{"ko":"각 인도물은 마일스톤과 그에 상응하는 대금 지급에 연결됩니다.","en":"Each deliverable is tied to a milestone and a corresponding payment."},{"ko":"이 범위를 벗어난 작업은 공식 변경 요청 대상입니다.","en":"Work outside this scope is subject to a formal change request."},{"ko":"인도물이 정의된 검증 게이트를 통과하면 수용이 완료된 것으로 간주됩니다.","en":"Acceptance is deemed complete when the deliverable passes the defined test gates."},{"ko":"범위 확산을 막기 위해 가정과 의존 사항을 명시해야 합니다.","en":"We need to spell out assumptions and dependencies to avoid scope creep."},{"ko":"발주처 입력 지연은 마일스톤 일정을 그에 맞춰 이동시킵니다.","en":"Any delay in client inputs shifts the milestone dates accordingly."}],"tip":"SOW에서 분쟁의 90%는 '완료가 무엇인가'에서 나옵니다. 수용 기준을 검증 게이트 통과로 객관화하고, 발주처 의존 사항과 변경 절차를 명문화하면 일정과 비용 책임이 분명해집니다."},{"n":85,"title":"책임·배상 조항(Liability·Indemnity)","scene":"시트 부품 결함으로 인한 잠재적 손해에 대비해 책임 한도와 면책 조건을 협상하시는 상황입니다.","goal":"책임 제한, 면책, 손해배상 범위를 영어로 협상하실 수 있습니다.","expressions":[{"en":"Each party's aggregate liability shall be capped at the fees paid under this agreement.","ko":"각 당사자의 총 책임은 본 계약에 따라 지급된 대금으로 제한됩니다."},{"en":"Neither party shall be liable for indirect, incidental, or consequential damages.","ko":"어느 당사자도 간접적·부수적·결과적 손해에 대해 책임지지 않습니다."},{"en":"The supplier shall indemnify the buyer against third-party claims arising from defects.","ko":"공급사는 결함에서 비롯된 제3자 청구에 대해 매수인을 면책해야 합니다."},{"en":"The liability cap should not apply to gross negligence, fraud, or IP infringement.","ko":"책임 한도는 중과실, 사기, 지식재산권 침해에는 적용되지 않아야 합니다."},{"en":"I'd like the indemnity to cover product recall costs explicitly.","ko":"면책에 제품 리콜 비용을 명시적으로 포함하고 싶습니다."},{"en":"Liability for personal injury and death must remain uncapped.","ko":"신체 상해와 사망에 대한 책임은 무제한으로 남아야 합니다."},{"en":"The indemnifying party controls the defense, with the right to settle reasonably.","ko":"면책 당사자가 방어를 주도하되, 합리적으로 화해할 권리를 갖습니다."},{"en":"We should align the liability cap with our insurance coverage.","ko":"책임 한도를 저희 보험 보장 범위와 일치시켜야 합니다."}],"dialogue":[{"sp":"A","en":"On liability, we can accept a cap, but it has to have the right carve-outs.","ko":"책임에 관해, 한도는 받아들일 수 있지만 적절한 예외가 있어야 합니다."},{"sp":"B","en":"We propose a cap at the total contract value.","ko":"저희는 총 계약 금액으로 한도를 제안합니다."},{"sp":"A","en":"Acceptable for general claims, but recall costs from your defect must be carved out.","ko":"일반 청구에는 수용 가능하지만, 귀사 결함으로 인한 리콜 비용은 예외로 빼야 합니다."},{"sp":"B","en":"Recall exposure is significant for us. Can we share those costs proportionally?","ko":"리콜 노출은 저희에게 큽니다. 그 비용을 비례하여 분담할 수 있을까요?"},{"sp":"A","en":"Proportional to root cause, yes. If the defect is yours, you bear it.","ko":"근본 원인에 비례한다면 좋습니다. 결함이 귀사 것이면 귀사가 부담합니다."},{"sp":"B","en":"Agreed. And gross negligence and IP infringement stay outside the cap?","ko":"동의합니다. 그리고 중과실과 지식재산권 침해는 한도 밖으로 두는 건가요?"},{"sp":"A","en":"Correct, along with personal injury. Those must remain uncapped.","ko":"맞습니다, 신체 상해도 함께입니다. 그것들은 무제한으로 남아야 합니다."},{"sp":"B","en":"Understood. We'll align the cap with our liability insurance coverage.","ko":"이해했습니다. 한도를 저희 책임보험 보장 범위에 맞추겠습니다."}],"vocab":[{"t":"aggregate liability","ko":"총 책임"},{"t":"liability cap","ko":"책임 한도"},{"t":"consequential damages","ko":"결과적 손해"},{"t":"indemnify","ko":"면책하다, 손해를 배상하다"},{"t":"gross negligence","ko":"중과실"},{"t":"carve-out","ko":"예외 조항"},{"t":"uncapped","ko":"한도 없는, 무제한의"}],"drill":[{"ko":"각 당사자의 총 책임은 본 계약에 따라 지급된 대금으로 제한됩니다.","en":"Each party's aggregate liability shall be capped at the fees paid under this agreement."},{"ko":"어느 당사자도 간접적·결과적 손해에 대해 책임지지 않습니다.","en":"Neither party shall be liable for indirect or consequential damages."},{"ko":"공급사는 결함에서 비롯된 제3자 청구에 대해 매수인을 면책해야 합니다.","en":"The supplier shall indemnify the buyer against third-party claims arising from defects."},{"ko":"책임 한도는 중과실, 사기, 지식재산권 침해에는 적용되지 않아야 합니다.","en":"The liability cap should not apply to gross negligence, fraud, or IP infringement."},{"ko":"신체 상해와 사망에 대한 책임은 무제한으로 남아야 합니다.","en":"Liability for personal injury and death must remain uncapped."}],"tip":"책임 조항에서 결정적인 것은 한도 자체가 아니라 예외(carve-out)입니다. 중과실·IP침해·인명피해·리콜은 반드시 한도 밖으로 빼고, 한도는 보험 보장 범위와 정렬해 실제 회수 가능성을 확보하십시오."},{"n":86,"title":"지식재산권(IP) 조항","scene":"공동 개발한 내장 트림 신기술의 IP 소유권 귀속을 협상하시는 상황입니다.","goal":"배경 IP, 개발 IP의 소유권과 라이선스 조건을 영어로 협상하실 수 있습니다.","expressions":[{"en":"Each party retains ownership of its background IP brought into the project.","ko":"각 당사자는 프로젝트에 가져온 배경 IP의 소유권을 유지합니다."},{"en":"Foreground IP developed under this agreement shall be jointly owned.","ko":"본 계약에 따라 개발된 개발 IP는 공동 소유됩니다."},{"en":"We need a perpetual, royalty-free license to use the results in our products.","ko":"결과물을 저희 제품에 사용할 영구적·무상 라이선스가 필요합니다."},{"en":"Ownership of inventions should follow the inventor, not the funding party.","ko":"발명의 소유권은 자금 제공자가 아닌 발명자에게 귀속되어야 합니다."},{"en":"The license should extend to our affiliates and authorized subcontractors.","ko":"라이선스는 저희 계열사와 승인된 하도급사까지 확장되어야 합니다."},{"en":"Any improvements made by the supplier shall be licensed back to us.","ko":"공급사가 만든 개선 사항은 저희에게 다시 라이선스되어야 합니다."},{"en":"We want freedom to operate without future royalty demands.","ko":"향후 로열티 요구 없이 자유롭게 사업할 권리를 원합니다."},{"en":"Joint ownership requires a clear exploitation and accounting mechanism.","ko":"공동 소유에는 명확한 활용 및 정산 메커니즘이 필요합니다."}],"dialogue":[{"sp":"A","en":"Let's settle IP ownership before development starts—it gets messy afterward.","ko":"개발 시작 전에 IP 소유권을 정리합시다. 나중에는 복잡해집니다."},{"sp":"B","en":"We'd prefer to own all IP developed during the program.","ko":"저희는 프로그램 중 개발된 모든 IP를 소유하고 싶습니다."},{"sp":"A","en":"We're funding the development, so sole ownership for you is hard to justify.","ko":"저희가 개발 자금을 대고 있으니, 귀사 단독 소유는 정당화하기 어렵습니다."},{"sp":"B","en":"What structure do you have in mind?","ko":"어떤 구조를 생각하고 계신가요?"},{"sp":"A","en":"Background IP stays with each owner; foreground IP is jointly owned.","ko":"배경 IP는 각 소유자에게 남고, 개발 IP는 공동 소유로 합시다."},{"sp":"B","en":"Joint ownership complicates licensing to our other customers.","ko":"공동 소유는 저희의 다른 고객에 대한 라이선스를 복잡하게 만듭니다."},{"sp":"A","en":"Then grant us a perpetual, royalty-free license with field-of-use limits for you.","ko":"그렇다면 저희에게 영구·무상 라이선스를 주고, 귀사는 사용 분야 제한을 두는 방식은 어떨까요."},{"sp":"B","en":"That's workable. Let's define the field of use precisely.","ko":"그건 실현 가능합니다. 사용 분야를 정확히 정의합시다."}],"vocab":[{"t":"background IP","ko":"배경 IP (기존 보유 지식재산)"},{"t":"foreground IP","ko":"개발 IP (본 계약에서 생성된 지식재산)"},{"
