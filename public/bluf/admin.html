<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUF · 코퍼스 관리자</title>
<style>
  :root{
    --bg:#0b0d12; --surface:#13161f; --surface-2:#1b1f2b; --line:#262b38;
    --ink:#e8eaf0; --ink-dim:#9aa0b0; --ink-faint:#5e6478;
    --gold:#c9a24b; --gold-dim:#8a6f33; --blue:#5b8def; --red:#e0604f; --green:#4caa7a; --amber:#d9a441;
    --serif:"Georgia",ui-serif,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(120% 80% at 50% -10%,#161b29 0%,var(--bg) 55%);
    color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif; min-height:100vh}
  .wrap{max-width:1180px; margin:0 auto; padding:36px 22px 80px}
  .brand{display:flex; align-items:baseline; gap:12px; margin-bottom:4px}
  .brand h1{font-family:var(--serif); font-size:27px}
  .brand .tag{color:var(--gold); font-size:11px; letter-spacing:3px; text-transform:uppercase}
  .sub{color:var(--ink-dim); font-size:13px; margin-bottom:26px}

  /* gate */
  .gate{max-width:380px; margin:60px auto; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:32px; text-align:center}
  .gate h2{font-family:var(--serif); font-size:20px; margin-bottom:6px}
  .gate p{color:var(--ink-faint); font-size:12.5px; margin-bottom:20px}
  input[type=password]{width:100%; background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; color:var(--ink); padding:13px 15px; font-size:16px; text-align:center; letter-spacing:6px}
  input:focus{outline:none; border-color:var(--gold)}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:9px; font-weight:600; transition:.18s}
  .btn-primary{background:var(--gold); color:#1a1305; padding:12px 20px; font-size:14px; width:100%; margin-top:12px}
  .btn-primary:hover{background:#dcb45c}
  .err{color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px}

  /* stats */
  .stats{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:22px}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:14px 16px}
  .stat .n{font-family:var(--serif); font-size:26px; line-height:1}
  .stat .l{color:var(--ink-faint); font-size:11px; letter-spacing:1px; text-transform:uppercase; margin-top:5px}
  .stat.approved .n{color:var(--green)} .stat.rejected .n{color:var(--red)}
  .stat.hold .n{color:var(--amber)} .stat.pending .n{color:var(--ink-dim)}

  /* layout */
  .grid{display:grid; grid-template-columns:1fr 1.15fr; gap:18px; align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,1fr)}}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:13px; overflow:hidden}
  .panel-h{padding:13px 18px; border-bottom:1px solid var(--line); font-size:12px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--ink-faint); display:flex; justify-content:space-between}

  table{width:100%; border-collapse:collapse}
  th,td{text-align:left; padding:11px 14px; font-size:12.5px; border-bottom:1px solid var(--line)}
  th{color:var(--ink-faint); font-weight:600; font-size:10.5px; letter-spacing:1px; text-transform:uppercase}
  tr.row{cursor:pointer; transition:.12s}
  tr.row:hover{background:var(--surface-2)}
  tr.row.sel{background:#1e2030; box-shadow:inset 3px 0 0 var(--gold)}
  td .dec{color:var(--ink); display:block; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  td .meta{color:var(--ink-faint); font-size:11px}
  .badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:600}
  .badge.approved{background:#173024;color:var(--green)} .badge.rejected{background:#2e1714;color:var(--red)}
  .badge.hold{background:#2c2410;color:var(--amber)} .badge.pending{background:#1d2230;color:var(--ink-dim)}
  .fw{font-family:var(--serif); color:var(--gold); font-size:12px}

  /* detail */
  .detail{padding:20px}
  .detail .empty{color:var(--ink-faint); text-align:center; padding:60px 20px; font-size:13px}
  .kv{margin-bottom:14px}
  .kv .k{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px}
  .kv .v{font-size:13.5px; line-height:1.6; white-space:pre-wrap}
  .doc{background:#0e1017; border:1px solid var(--line); border-radius:10px; padding:18px;
    font-family:var(--serif); white-space:pre-wrap; line-height:1.8; font-size:13.5px; max-height:380px; overflow:auto; margin-top:5px}
  .doc.review{border-color:var(--blue)}
  .sec-h{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-faint);
    margin:20px 0 8px; border-bottom:1px solid var(--line); padding-bottom:5px}
  .row-actions{display:flex; gap:8px; margin-top:18px}
  .btn-ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line); padding:8px 14px; font-size:12.5px}
  .btn-ghost:hover{color:var(--ink); border-color:var(--ink-faint)}
  .btn-ghost.danger:hover{color:var(--red); border-color:var(--red)}
  a.back{color:var(--ink-faint); font-size:12px; text-decoration:none}
  a.back:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>BLUF</h1><span class="tag">Corpus Admin</span></div>
  <p class="sub">의사결정 코퍼스 — 무엇이 언제 저장됐고, 결과가 어땠는지. <a class="back" id="toolLink" href="/">← 메인 서비스로</a></p>

  <!-- 비번 게이트 -->
  <div id="gate" class="gate">
    <h2>관리자 인증</h2>
    <p>코퍼스 데이터는 이 PC의 로컬 백엔드(localhost:8790)에만 있습니다.</p>
    <input type="password" id="pw" placeholder="••••" autofocus>
    <button class="btn-primary" onclick="auth()">열기</button>
    <div class="err" id="err"></div>
  </div>

  <!-- 대시보드 -->
  <div id="dash" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="grid">
      <div class="panel">
        <div class="panel-h"><span>저장된 보고서</span><span id="count" class="fw"></span></div>
        <div style="max-height:620px; overflow:auto">
          <table>
            <thead><tr><th>#</th><th>일시</th><th>대상</th><th>의도결정 / 구조</th><th>결과</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-h"><span>상세</span><span id="detail-id" class="fw"></span></div>
        <div class="detail" id="detail"><div class="empty">왼쪽에서 보고서를 선택하세요</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = ["localhost","127.0.0.1"].includes(location.hostname) ? "" : "http://localhost:8790";
document.getElementById("toolLink").href = API_BASE === "" ? "/" : "/bluf/";
let PW = "";
const AUD = {CEO:"CEO/대표",CFO:"CFO/재무",VP:"사업부임원",LEAD:"팀장",CLIENT:"외부",BOARD:"이사회"};
const OUT = {approved:"승인",rejected:"기각",hold:"보류"};

function fmtDate(iso){
  if(!iso) return "-";
  const d = new Date(iso);
  const p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function badge(o){ const k=o||"pending"; const t=OUT[o]||"미정"; return `<span class="badge ${k}">${t}</span>`; }

async function auth(){
  PW = document.getElementById("pw").value.trim();
  try{
    const r = await fetch(`${API_BASE}/api/admin/reports?pw=${encodeURIComponent(PW)}`);
    if(r.status===403){ document.getElementById("err").textContent="비밀번호가 틀렸습니다."; return; }
    const j = await r.json();
    document.getElementById("gate").style.display="none";
    document.getElementById("dash").style.display="block";
    render(j);
  }catch(e){
    document.getElementById("err").textContent = "로컬 백엔드 연결 실패 — node server.mjs 실행 여부 확인";
  }
}
function render(j){
  const s = j.stat || {};
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${s.total||0}</div><div class="l">총 보고서</div></div>
    <div class="stat approved"><div class="n">${s.approved||0}</div><div class="l">승인</div></div>
    <div class="stat rejected"><div class="n">${s.rejected||0}</div><div class="l">기각</div></div>
    <div class="stat hold"><div class="n">${s.hold||0}</div><div class="l">보류</div></div>
    <div class="stat pending"><div class="n">${s.pending||0}</div><div class="l">미정</div></div>`;
  document.getElementById("count").textContent = `${(j.reports||[]).length}건`;
  document.getElementById("rows").innerHTML = (j.reports||[]).map(r=>`
    <tr class="row" data-id="${r.id}" onclick="openDetail(${r.id})">
      <td class="meta">#${r.id}</td>
      <td class="meta">${fmtDate(r.created_at)}</td>
      <td>${AUD[r.audience]||r.audience||"-"}</td>
      <td><span class="dec">${(r.decision||"-").replace(/</g,"&lt;")}</span><span class="fw">${r.framework||""}</span>${r.reviewed?' · <span class="meta">검수✓</span>':''}</td>
      <td>${badge(r.outcome)}</td>
    </tr>`).join("") || `<tr><td colspan="5" class="meta" style="padding:30px;text-align:center">아직 저장된 보고서가 없습니다</td></tr>`;
}
async function openDetail(id){
  document.querySelectorAll("tr.row").forEach(t=>t.classList.toggle("sel", t.dataset.id==id));
  document.getElementById("detail-id").textContent = `#${id}`;
  const d = document.getElementById("detail");
  d.innerHTML = `<div class="empty">불러오는 중…</div>`;
  const r = await fetch(`${API_BASE}/api/admin/report?pw=${encodeURIComponent(PW)}&id=${id}`);
  const j = await r.json();
  const x = j.report; if(!x){ d.innerHTML=`<div class="empty">없음</div>`; return; }
  const kv = (k,v)=> v ? `<div class="kv"><div class="k">${k}</div><div class="v">${String(v).replace(/</g,"&lt;")}</div></div>` : "";
  d.innerHTML = `
    <div class="kv"><div class="k">저장 일시 · 결과</div><div class="v">${fmtDate(x.created_at)} ${badge(x.outcome)} ${x.outcome_note?('· '+x.outcome_note):''}</div></div>
    ${kv("보고 대상", AUD[x.audience]||x.audience)}
    ${kv("의도하는 의사결정", x.decision)}
    ${kv("추천 구조", x.framework)}
    ${kv("현재/목표/Gap", x.gap)}
    ${kv("제약", x.constraint_text)}
    ${kv("예상 반론·리스크", x.risks)}
    ${kv("참고 톤", x.reference_text)}
    <div class="sec-h">생성된 초안</div>
    <div class="doc">${(x.draft||"(없음)").replace(/</g,"&lt;")}</div>
    ${x.review ? `<div class="sec-h">검수 결과</div><div class="doc review">${x.review.replace(/</g,"&lt;")}</div>` : ""}
    <div class="row-actions">
      <button class="btn-ghost" onclick="copyText(${id})">📋 초안 복사</button>
      <button class="btn-ghost danger" onclick="del(${id})">🗑 삭제</button>
    </div>`;
  window._cur = x;
}
function copyText(id){ if(window._cur) navigator.clipboard.writeText(window._cur.draft||""); }
async function del(id){
  if(!confirm(`#${id} 보고서를 코퍼스에서 삭제할까요? (되돌릴 수 없음)`)) return;
  await fetch(`${API_BASE}/api/admin/delete`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pw:PW,id})});
  document.getElementById("detail").innerHTML = `<div class="empty">삭제됨. 목록 새로고침 중…</div>`;
  const r = await fetch(`${API_BASE}/api/admin/reports?pw=${encodeURIComponent(PW)}`);
  render(await r.json());
}
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") auth(); });
</script>
</body>
</html>
