<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUF — 보고서의 신</title>
<style>
  :root{
    --bg:#0b0d12; --surface:#13161f; --surface-2:#1b1f2b; --line:#262b38;
    --ink:#e8eaf0; --ink-dim:#9aa0b0; --ink-faint:#5e6478;
    --gold:#c9a24b; --gold-dim:#8a6f33; --blue:#5b8def; --red:#e0604f; --green:#4caa7a;
    --r:14px; --ease:cubic-bezier(.16,1,.3,1);
    --serif:"Georgia",ui-serif,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #161b29 0%, var(--bg) 55%);
    color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    min-height:100vh; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px; margin:0 auto; padding:48px 24px 120px}

  /* header */
  .brand{display:flex; align-items:baseline; gap:14px; margin-bottom:6px}
  .brand h1{font-family:var(--serif); font-size:34px; letter-spacing:-.5px; font-weight:600}
  .brand .tag{color:var(--gold); font-size:12px; letter-spacing:3px; text-transform:uppercase}
  .sub{color:var(--ink-dim); font-size:15px; margin-bottom:36px; border-left:2px solid var(--gold-dim); padding-left:12px}

  /* progress */
  .steps{display:flex; gap:6px; margin-bottom:32px}
  .steps .dot{flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden; position:relative}
  .steps .dot.done{background:var(--gold)}
  .steps .dot.active::after{content:""; position:absolute; inset:0; background:var(--gold);
    animation:fill 1.2s var(--ease) forwards}
  @keyframes fill{from{transform:translateX(-100%)}to{transform:translateX(0)}}

  /* card */
  .card{background:linear-gradient(180deg,var(--surface),#10131b); border:1px solid var(--line);
    border-radius:var(--r); padding:32px; box-shadow:0 24px 60px -30px rgba(0,0,0,.8);
    animation:rise .5s var(--ease)}
  @keyframes rise{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}

  .q-no{color:var(--gold); font-size:12px; letter-spacing:2px; font-weight:700; text-transform:uppercase}
  .q-title{font-family:var(--serif); font-size:23px; margin:8px 0 6px; line-height:1.3}
  .q-help{color:var(--ink-dim); font-size:14px; margin-bottom:22px}

  label.opt{display:block; padding:14px 16px; border:1px solid var(--line); border-radius:10px;
    margin-bottom:9px; cursor:pointer; transition:.18s var(--ease); background:var(--surface-2)}
  label.opt:hover{border-color:var(--gold-dim); transform:translateX(3px)}
  label.opt.sel{border-color:var(--gold); background:#1e2030; box-shadow:inset 3px 0 0 var(--gold)}
  label.opt input{display:none}
  label.opt .t{font-weight:600; font-size:15px}
  label.opt .d{color:var(--ink-faint); font-size:12.5px; margin-top:2px}

  textarea,input[type=text]{width:100%; background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; color:var(--ink); padding:14px 16px; font-size:15px; font-family:inherit;
    resize:vertical; transition:.18s}
  textarea:focus,input:focus{outline:none; border-color:var(--gold)}
  textarea{min-height:96px}

  .nudge{background:#231d12; border:1px solid var(--gold-dim); border-radius:10px; padding:13px 15px;
    margin-top:14px; font-size:13.5px; color:#e8d4a0; display:none}
  .nudge.show{display:block; animation:rise .4s var(--ease)}
  .nudge b{color:var(--gold)}

  .row{display:flex; gap:12px; margin-top:26px; justify-content:space-between; align-items:center}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; font-size:14px;
    font-weight:600; padding:12px 22px; transition:.18s var(--ease)}
  .btn-primary{background:var(--gold); color:#1a1305}
  .btn-primary:hover{background:#dcb45c; transform:translateY(-1px)}
  .btn-primary:disabled{background:var(--line); color:var(--ink-faint); cursor:not-allowed; transform:none}
  .btn-ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line)}
  .btn-ghost:hover{color:var(--ink); border-color:var(--ink-faint)}

  /* result */
  .result h2{font-family:var(--serif); font-size:26px; margin-bottom:4px}
  .reco{background:var(--surface-2); border:1px solid var(--gold-dim); border-radius:12px;
    padding:22px; margin:20px 0}
  .reco .fw{font-family:var(--serif); font-size:22px; color:var(--gold)}
  .reco .why{color:var(--ink-dim); font-size:13.5px; margin-top:6px}
  .pill{display:inline-block; background:#222633; border:1px solid var(--line); border-radius:20px;
    padding:4px 12px; font-size:12px; color:var(--ink-dim); margin:4px 4px 0 0}
  .skel{background:#0e1017; border:1px solid var(--line); border-radius:12px; padding:22px;
    margin:16px 0; font-family:var(--serif); white-space:pre-wrap; line-height:1.8; font-size:14.5px}
  .skel .sec{color:var(--gold); font-weight:700}
  .check{list-style:none; margin-top:10px}
  .check li{padding:10px 14px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:9px; margin-bottom:8px; font-size:13.5px; display:flex; gap:10px}
  .check li .c{color:var(--green); font-weight:700}
  .sec-h{font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-faint);
    margin:26px 0 10px; border-bottom:1px solid var(--line); padding-bottom:6px}
  .draft-out{background:#0e1017; border:1px solid var(--line); border-radius:12px; padding:24px;
    white-space:pre-wrap; line-height:1.85; font-size:14.5px; max-height:520px; overflow:auto; margin-bottom:14px}
  .loading{color:var(--gold); font-size:14px; padding:34px; text-align:center;
    border:1px dashed var(--gold-dim); border-radius:12px; animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .review-out{background:#0e1017; border:1px solid var(--blue); border-radius:12px; padding:20px;
    white-space:pre-wrap; font-size:13.5px; line-height:1.7; margin-top:12px; max-height:440px; overflow:auto}
  .fb-ok{color:var(--green); font-size:13px; margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>BLUF</h1><span class="tag">Bottom Line Up Front</span>
    <a id="adminLink" href="/admin" style="margin-left:auto; align-self:center; color:var(--ink-faint); font-size:12px; text-decoration:none; border:1px solid var(--line); padding:6px 12px; border-radius:8px; transition:.18s" onmouseover="this.style.color='var(--gold)';this.style.borderColor='var(--gold-dim)'" onmouseout="this.style.color='var(--ink-faint)';this.style.borderColor='var(--line)'">⚙ 코퍼스 관리자 →</a></div>
  <p class="sub">상황·목표가 아니라 <b>누가 읽고 무엇을 결정하는가</b>부터 설계하는 보고서 엔진.</p>

  <div class="steps" id="steps"></div>
  <div id="stage"></div>
</div>

<script>
// ── 룰셋 (report-engine-ruleset.md 의 런타임 구현) ──────────────
const AUDIENCES = [
  {k:"CEO",   t:"CEO / 대표",      d:"전략·리스크·ROI · 1p · 손실회피+성장 프레임", fw:"BLUF",  len:"1페이지"},
  {k:"CFO",   t:"CFO / 재무",      d:"비용·현금흐름·근거 · 정량/보수적",          fw:"Minto", len:"1~2페이지"},
  {k:"VP",    t:"사업부 임원",     d:"실행·일정·KPI · 성과/경쟁 프레임",           fw:"BLUF",  len:"1페이지"},
  {k:"LEAD",  t:"팀장 / 실무 리더",d:"업무·자원·우선순위 · 구체/실용",            fw:"STAR",  len:"1페이지"},
  {k:"CLIENT",t:"외부 클라이언트", d:"가치·차별화·신뢰 · 호감+권위+사회적증거",   fw:"SCQA",  len:"2~3페이지"},
  {k:"BOARD", t:"이사회",          d:"거버넌스·중대결정 · 권위+리스크",            fw:"6PAGER",len:"내러티브"},
];
const FW = {
  BLUF:  {name:"BLUF",            struct:["결론 / 의사결정 요청","핵심 근거 3","리스크 · 대안","상세 부록"]},
  Minto: {name:"Minto Pyramid",  struct:["핵심 메시지","근거 그룹 3 (MECE)","그룹별 하위 근거","데이터 부록"]},
  SCQA:  {name:"SCQA",           struct:["Situation 합의된 상황","Complication 문제 발생","Question 그래서?","Answer 우리 제안"]},
  STAR:  {name:"STAR",           struct:["Situation 상황","Task 과제","Action 실행","Result 정량 결과"]},
  "6PAGER":{name:"Amazon 6-Pager",struct:["도입","원칙","현황 데이터","제안","반론과 답변","결정 요청"]},
  PREP:  {name:"PREP",           struct:["주장","이유","사례","주장 재확인"]},
};
// 의사결정 트리: 승인요청 + 시간없음 → BLUF, 승인+복잡 → Minto ... 대상 기본값 우선, 의도로 보정
function recommend(state){
  const aud = AUDIENCES.find(a=>a.k===state.audience) || AUDIENCES[0];
  let fw = aud.fw; // 대상 기본값
  const intent = (state.decision||"").toLowerCase();
  const urgent   = /빠른|급한|급히|즉시|5분|바로|짧게|당장/.test(intent);
  const approve  = /승인|결재|투자|예산|채택|선택|의사결정|배정|할당|집행|결정해/.test(intent);
  const perf     = /성과보고|실적|회고|완료보고|진척|결산/.test(intent);
  const persuade = /설득|제안|도입검토|전환|변화|동의|설명/.test(intent);
  const complex  = /복잡|다양|여러|다수|분석|비교|다층|트레이드오프/.test(intent);

  // 의사결정 우선 원칙(§0): 승인 요청이면 그것이 최상위. persuade/perf보다 먼저.
  if(approve){
    if(aud.k==="BOARD") fw="6PAGER";
    else if(aud.k==="CFO" || complex) fw="Minto";
    else fw="BLUF";
    if(urgent && aud.k!=="BOARD") fw="BLUF"; // 승인+긴급은 속도 우선
  } else if(perf){
    fw="STAR";
  } else if(persuade && aud.k!=="CEO"){
    fw="SCQA";
  }
  return {aud, fw, fwData:FW[fw]};
}
// 인지/설득 검수 체크리스트 (룰셋 §2,§5)
function reviewChecklist(state, reco){
  const c = [
    "C2 초두/최신: 결론을 첫 3문장과 마지막에 배치했는가",
    "C1 인지부하: 한 단락 핵심 주장 3개 이하인가",
    "C6 구체성: '개선됨' 같은 정성표현을 수치로 바꿨는가",
    "C10 결정피로: 선택지 3개 이하 + 추천안 명시했는가",
    "C7 유창성: 60자 초과 문장·수동태를 제거했는가",
  ];
  if(state.risks?.trim()) c.push("C9 반론선점: 적은 예상 반론에 본문에서 답했는가");
  else c.push("C9 반론선점: ⚠ 예상 반론 미입력 — 대상이 던질 질문을 본문에 선점하라");
  if(reco.aud.k==="CFO") c.push("C3 앵커링: 원하는 방향의 기준 숫자를 먼저 제시했는가");
  if(["CLIENT","CEO","BOARD"].includes(reco.aud.k)) c.push("C4 손실회피: '안 하면 생길 손실/현상유지 비용'을 제시했는가");
  if(reco.aud.k==="CLIENT") c.push("Cialdini: 사회적 증거(동종업계 사례)·권위(출처)를 넣었는가");
  return c;
}

// ── 질문 정의 (Intake 6축) ─────────────────────────────────────
const Q = [
  {id:"audience", no:"AXIS 1", title:"이 보고서를 누가 읽습니까?",
   help:"읽는 사람이 구조·길이·심리 프레임을 결정합니다.", type:"opts", options:AUDIENCES},
  {id:"decision", no:"AXIS 2", title:"읽고 나서 무엇을 결정·승인하게 만들 것입니까?",
   help:"가장 중요한 축. 모호하면 엔진이 되묻습니다.", type:"text",
   ph:"예: '신규 사출 설비 3억 투자 건을 이번 분기 내 승인'"},
  {id:"gap", no:"AXIS 3", title:"현재 상태 → 목표 → 그 사이의 Gap은?",
   help:"문제의 크기와 방향.", type:"text",
   ph:"현재: ... / 목표: ... / 격차: ..."},
  {id:"constraint", no:"AXIS 4", title:"제약 조건은? (예산·일정·정치적 민감도)",
   help:"보고서가 현실에서 부딪힐 벽.", type:"text", ph:"예: 예산 상한 3억, 양산 D-90, 구매팀 반대 기류", optional:true},
  {id:"risks", no:"AXIS 5", title:"대상이 던질 예상 반론·리스크는?",
   help:"비우면 엔진이 예측해 제안합니다.", type:"text", ph:"예: ROI 회수기간, 기존 설비 활용 대안", optional:true},
  {id:"reference", no:"AXIS 6", title:"참고할 과거 보고서 톤/포맷이 있다면 붙여넣기",
   help:"톤·용어·포맷을 학습합니다. (MVP: 텍스트 힌트)", type:"text", ph:"과거 보고서 일부를 붙여넣으세요", optional:true},
];

// ── 상태 & 렌더 ────────────────────────────────────────────────
let step = 0;
const state = JSON.parse(localStorage.getItem("bluf_state")||"{}");
const stepsEl = document.getElementById("steps");
const stageEl = document.getElementById("stage");

function save(){localStorage.setItem("bluf_state", JSON.stringify(state));}
function renderSteps(){
  stepsEl.innerHTML = Q.map((_,i)=>{
    const cls = i<step?"done":(i===step?"active":"");
    return `<div class="dot ${cls}"></div>`;
  }).join("") + `<div class="dot ${step>=Q.length?'done':''}"></div>`;
}

// 의사결정 축 모호성 판정 (룰셋: 의사결정 우선)
function decisionIsVague(v){
  if(!v || v.trim().length<10) return "결정 내용이 너무 짧습니다. <b>누가·무엇을·언제까지</b> 결정하게 할지 한 문장으로.";
  if(!/(승인|결재|투자|예산|채택|선택|결정|중단|진행|도입|전환|할당)/.test(v))
    return "결정을 유발하는 <b>동사</b>가 안 보입니다. '검토 바람'이 아니라 '<b>X를 승인</b>'처럼 구체적 행동을 요구하세요.";
  if(!/(분기|월|주|일|까지|D-|내|전|asap|즉시|\d)/.test(v))
    return "<b>기한</b>이 없습니다. 임원은 마감 없는 안건을 미룹니다. 언제까지 결정이 필요한가요?";
  return null;
}

function renderQuestion(){
  renderSteps();
  const q = Q[step];
  let body = "";
  if(q.type==="opts"){
    body = q.options.map(o=>{
      const sel = state[q.id]===o.k ? "sel":"";
      return `<label class="opt ${sel}"><input type="radio" name="${q.id}" value="${o.k}">
        <div class="t">${o.t}</div><div class="d">${o.d}</div></label>`;
    }).join("");
  } else {
    const val = state[q.id]||"";
    body = `<textarea id="inp" placeholder="${q.ph||''}">${val}</textarea>
      <div class="nudge" id="nudge"></div>`;
  }
  stageEl.innerHTML = `<div class="card">
    <div class="q-no">${q.no}${q.optional?' · 선택':''}</div>
    <div class="q-title">${q.title}</div>
    <div class="q-help">${q.help}</div>
    ${body}
    <div class="row">
      <button class="btn-ghost" onclick="prev()" ${step===0?'style=visibility:hidden':''}>← 이전</button>
      <button class="btn-primary" id="next" onclick="next()">${step===Q.length-1?'보고서 설계 생성 →':'다음 →'}</button>
    </div>
  </div>`;

  if(q.type==="opts"){
    stageEl.querySelectorAll(".opt").forEach(l=>{
      l.addEventListener("click",()=>{
        stageEl.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
        l.classList.add("sel");
        state[q.id]=l.querySelector("input").value; save();
        validateNext();
      });
    });
  } else {
    const inp = document.getElementById("inp");
    inp.addEventListener("input",()=>{
      state[q.id]=inp.value; save();
      if(q.id==="decision"){
        const msg = decisionIsVague(inp.value);
        const n = document.getElementById("nudge");
        if(msg && inp.value.trim()){ n.innerHTML = "🎯 <b>되묻기:</b> "+msg; n.classList.add("show"); }
        else n.classList.remove("show");
      }
      validateNext();
    });
  }
  validateNext();
}
function validateNext(){
  const q = Q[step]; const btn = document.getElementById("next");
  if(!btn) return;
  let ok = true;
  if(!q.optional){
    const v = state[q.id];
    ok = !!(v && (q.type==="opts" || v.trim().length>0));
    // 의사결정 축은 모호하지 않아야 통과
    if(q.id==="decision" && v) ok = ok && !decisionIsVague(v);
  }
  btn.disabled = !ok;
}
function next(){ if(step<Q.length-1){step++; renderQuestion();} else renderResult(); }
function prev(){ if(step>0){step--; renderQuestion();} }

function renderResult(){
  step = Q.length; renderSteps();
  const reco = recommend(state);
  const checks = reviewChecklist(state, reco);
  const skeleton = reco.fwData.struct.map((s,i)=>
    `<span class="sec">${i+1}. ${s}</span>\n   └ ${draftHint(s, state, reco)}`).join("\n\n");

  stageEl.innerHTML = `<div class="card result">
    <h2>보고서 설계가 완성됐습니다</h2>
    <p style="color:var(--ink-dim);font-size:14px">대상과 의도를 역설계해 구조·골격·검수 항목을 생성했습니다.</p>

    <div class="reco">
      <div class="fw">추천 구조 · ${reco.fwData.name}</div>
      <div class="why">대상 <b>${reco.aud.t.split(' /')[0]}</b> · 길이 ${reco.aud.len} · ${reco.aud.d.split('·')[1]||''}</div>
      <div style="margin-top:10px">
        ${reco.fwData.struct.map(s=>`<span class="pill">${s}</span>`).join("")}
      </div>
    </div>

    <div class="sec-h">보고서 골격 (초안 스캐폴드)</div>
    <div class="skel">${skeleton}</div>

    <div class="sec-h">검수 패스 — 발행 전 체크리스트</div>
    <ul class="check">
      ${checks.map(c=>`<li><span class="c">✓</span><span>${c}</span></li>`).join("")}
    </ul>

    <div class="row">
      <button class="btn-ghost" onclick="restart()">↺ 다시 설계</button>
      <button class="btn-primary" id="genBtn" onclick="generateDraft()">초안 본문 생성 (Claude) →</button>
    </div>
    <div id="draftArea"></div>
  </div>`;
}
// 골격 칸별 작성 힌트 (룰셋 적용 가이드)
function draftHint(sec, state, reco){
  const map = {
    "결론 / 의사결정 요청": `"${(state.decision||'의사결정').slice(0,40)}..." — 첫 문장에 박아라 (C2)`,
    "핵심 근거 3": "Gap 데이터를 수치 3개로 (C6 구체성)",
    "리스크 · 대안": state.risks?.trim()? `입력한 반론에 선제 답변 (C9)` : "⚠ 예상 반론을 본문에서 선점하라 (C9)",
    "Result 정량 결과": "반드시 숫자로 (C6)",
    "결정 요청": `명확한 추천안 1개 + 선택지 ≤3 (C10)`,
  };
  return map[sec] || "대상 관심사에 맞춰 1청크 = 1메시지 (C1)";
}
function restart(){ step=0; document.getElementById("steps").style.display="flex"; renderQuestion(); }

// ── 백엔드 연동: 생성 → 검수 → 피드백 누적 → 결과 추적 ──────────
let lastDraft = "";
let lastReportId = null;
// 백엔드 위치: 로컬에서 열면 same-origin, 웹(jasonmoon.dev)에서 열면 각자 로컬 백엔드(localhost:8790)
const API_BASE = ["localhost","127.0.0.1"].includes(location.hostname) ? "" : "http://localhost:8790";
document.getElementById("adminLink").href = API_BASE === "" ? "/admin" : "/bluf/admin.html";
function backendOffHTML(){
  return `<div class="sec-h">로컬 백엔드가 꺼져 있습니다</div>
    <div class="draft-out" style="border-color:var(--gold-dim)">
이 페이지는 <b style="color:var(--gold)">각자 PC의 로컬 백엔드(Claude CLI)</b>에 연결해 동작합니다.
일반 방문자에겐 위의 <b>되묻기 · 구조추천 · 골격 · 검수 체크리스트</b>까지가 데모입니다.

<b style="color:var(--gold)">실제 AI 초안 생성·검수·피드백·코퍼스 저장</b>을 쓰려면:
  1. report-oracle 프로젝트에서  <b>node server.mjs</b>  실행
  2. 이 버튼을 다시 누르면 localhost:8790 백엔드로 실제 생성

설계상 의도 — API 키·결제 없이(0원) 개인 도구로 운영하기 위함입니다.</div>`;
}
async function api(path, payload){
  let r;
  try{
    r = await fetch(API_BASE + path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
  }catch(e){ const err = new Error("backend-off"); err.backendOff = true; throw err; }
  const j = await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}
async function generateDraft(){
  const reco = recommend(state);
  const area = document.getElementById("draftArea");
  const btn = document.getElementById("genBtn");
  btn.disabled = true; btn.textContent = "생성 중… (claude 호출, 최대 1~2분)";
  area.innerHTML = `<div class="sec-h">초안 생성</div><div class="loading">Claude가 룰셋 + 내 스타일로 작성 중…</div>`;
  try{
    const j = await api("/api/generate", {intake:state, framework:reco.fwData.name});
    lastDraft = j.draft;
    lastReportId = j.reportId;
    area.innerHTML = `
      <div class="sec-h">생성된 초안 <span style="color:var(--ink-faint);text-transform:none;letter-spacing:0">· #${j.reportId} 코퍼스 저장됨</span></div>
      <div class="draft-out" id="draftOut"></div>
      <div class="row">
        <button class="btn-ghost" onclick="runReview()">🔍 검수 패스 돌리기</button>
        <button class="btn-ghost" onclick="copyDraft()">📋 복사</button>
      </div>
      <div class="sec-h">이 보고서 결과 추적 — 1년 뒤 팔 수 있는 유일한 자산</div>
      <div class="row" style="justify-content:flex-start; gap:8px; flex-wrap:wrap">
        <button class="btn-ghost" onclick="setOutcome('approved')">✅ 승인됨</button>
        <button class="btn-ghost" onclick="setOutcome('rejected')">❌ 기각됨</button>
        <button class="btn-ghost" onclick="setOutcome('hold')">⏸ 보류</button>
        <span id="outcomeNote" class="fb-ok"></span>
      </div>
      <div class="sec-h">이 초안 피드백 → 내 스타일에 누적</div>
      <textarea id="fb" placeholder="예: 너무 딱딱하다 / 결론을 더 강하게 / 숫자를 표 대신 문장으로 / 우리 회사는 'ROI'보다 '회수기간'이라고 쓴다"></textarea>
      <div class="row"><span></span><button class="btn-primary" onclick="saveFeedback()">스타일에 반영 →</button></div>
      <div id="reviewArea"></div>`;
    document.getElementById("draftOut").textContent = j.draft;
  }catch(e){ area.innerHTML = e.backendOff ? backendOffHTML() : `<div class="nudge show">생성 실패: ${e.message}</div>`; }
  finally{ btn.disabled=false; btn.textContent="초안 다시 생성 →"; }
}
async function runReview(){
  const reco = recommend(state);
  const ra = document.getElementById("reviewArea");
  ra.innerHTML = `<div class="loading">검수 중… (인지·설득 룰 위반 스캔)</div>`;
  try{
    const j = await api("/api/review", {draft:lastDraft, intake:state, framework:reco.fwData.name, reportId:lastReportId});
    ra.innerHTML = `<div class="sec-h">검수 결과 — 발행 전 교정</div><div class="review-out" id="revOut"></div>`;
    document.getElementById("revOut").textContent = j.findings;
  }catch(e){ ra.innerHTML = `<div class="nudge show">검수 실패: ${e.message}</div>`; }
}
async function saveFeedback(){
  const fb = document.getElementById("fb"); const v = fb.value.trim(); if(!v) return;
  try{
    const j = await api("/api/feedback", {feedback:v});
    fb.value = "";
    const note = document.createElement("div");
    note.className = "fb-ok";
    note.textContent = "✓ 스타일에 반영됨. 다음 생성부터 적용: " + j.entry;
    fb.after(note);
  }catch(e){ alert("실패: " + e.message); }
}
async function setOutcome(o){
  if(!lastReportId) return;
  const label = {approved:"승인됨 ✅", rejected:"기각됨 ❌", hold:"보류 ⏸"}[o] || o;
  try{
    await api("/api/outcome", {reportId:lastReportId, outcome:o});
    document.getElementById("outcomeNote").textContent = `✓ #${lastReportId} 결과 기록: ${label} — 코퍼스에 저장됨`;
  }catch(e){ alert("실패: " + e.message); }
}
function copyDraft(){ navigator.clipboard.writeText(lastDraft); }

// boot
renderQuestion();
</script>
</body>
</html>
